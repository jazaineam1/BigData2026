<tspan x="532.0" dy="0">VS Code · terminal · hito/s02-blueprint</tspan>
</text>
<rect x="60" y="198" width="944" height="568" rx="10" fill="#101A22" stroke="#101A22" stroke-width="0" opacity="1"/>
<text x="88" y="238" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git branch --show-current</tspan>
</text>
<text x="88" y="270" fill="#EAF1F6" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">hito/s02-blueprint</tspan>
</text>
<text x="88" y="318" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git status --short</tspan>
</text>
<text x="88" y="350" fill="#FFD166" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"> M docs/01_proceso_as_is.md</tspan>
</text>
<text x="88" y="380" fill="#FFD166" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"> M resultados/perfil_secop.md</tspan>
</text>
<text x="88" y="428" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git diff -- docs/01_proceso_as_is.md</tspan>
</text>
<text x="88" y="460" fill="#B7C6D2" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">@@ Proceso AS-IS @@</tspan>
</text>
<text x="88" y="492" fill="#FF8178" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">- COMPLETAR: cuello de botella</tspan>
</text>
<text x="88" y="524" fill="#63E6A0" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">+ Consolidación manual: 3 días promedio</tspan>
</text>
<text x="88" y="554" fill="#63E6A0" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">+ y 18 % de registros incompletos.</tspan>
</text>
<text x="88" y="602" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git diff --check</tspan>
</text>
<text x="88" y="634" fill="#B7C6D2" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"># Sin salida: no hay errores de espacios</tspan>
</text>
