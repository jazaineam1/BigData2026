<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Lectura de git status y git diff</title>
<desc id="desc">Terminal con archivos modificados y panel explicativo de estados antes de staging.</desc>
<defs>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity=".12"/>
              </filter>
              <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#2F6FB0"/>
              </marker>
              <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#C93F34"/>
              </marker>
              <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#24855A"/>
              </marker>
              <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#6C5AA7"/>
              </marker>
            </defs>
<rect width="1600" height="900" fill="#F3F7FA"/>
<rect x="0" y="0" width="1600" height="112" rx="0" fill="#12395B" stroke="#12395B" stroke-width="0" opacity="1"/>
<rect x="1376" y="24" width="176" height="38" rx="19" fill="#2A5878" stroke="#2A5878" stroke-width="1" opacity="1"/>
<text x="1464.0" y="49" fill="#D9EFFB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" style="">
<tspan x="1464.0" dy="0">GUÍA GIT 2 DE 4</tspan>
</text>
<text x="48" y="50" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">Observar antes de seleccionar: status y diff</tspan>
</text>
<text x="48" y="82" fill="#CFE4F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">El objetivo no es memorizar colores: es comprobar qué archivo cambió y qué evidencia contiene</tspan>
</text>
<rect x="42" y="142" width="980" height="650" rx="16" fill="#FFFFFF" stroke="#B8C8D6" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="42" y="142" width="980" height="46" rx="16" fill="#EFF3F6" stroke="#B8C8D6" stroke-width="1" opacity="1"/>
<rect x="42" y="174" width="980" height="14" rx="0" fill="#EFF3F6" stroke="#EFF3F6" stroke-width="0" opacity="1"/>
<circle cx="66" cy="165" r="6" fill="#FF625A" stroke="#FF625A" stroke-width="0"/>
<circle cx="90" cy="165" r="6" fill="#FFC04A" stroke="#FFC04A" stroke-width="0"/>
<circle cx="114" cy="165" r="6" fill="#2BCB4B" stroke="#2BCB4B" stroke-width="0"/>
<text x="532.0" y="171" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" style="">
<tspan x="532.0" dy="0">VS Code · terminal · entrega/sesion2</tspan>
</text>
<rect x="60" y="198" width="944" height="568" rx="10" fill="#101A22" stroke="#101A22" stroke-width="0" opacity="1"/>
<text x="88" y="238" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git branch --show-current</tspan>
</text>
<text x="88" y="270" fill="#EAF1F6" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">entrega/sesion2</tspan>
</text>
<text x="88" y="318" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git status --short</tspan>
</text>
<text x="88" y="350" fill="#FFD166" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"> M docs/01_proceso_as_is.md</tspan>
</text>
<text x="88" y="380" fill="#FFD166" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"> M resultados/perfil_secop.md</tspan>
</text>
<text x="88" y="428" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git diff -- docs/01_proceso_as_is.md</tspan>
</text>
<text x="88" y="460" fill="#B7C6D2" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">@@ Proceso AS-IS @@</tspan>
</text>
<text x="88" y="492" fill="#FF8178" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">- COMPLETAR: cuello de botella</tspan>
</text>
<text x="88" y="524" fill="#63E6A0" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">+ Consolidación manual: 3 días promedio</tspan>
</text>
<text x="88" y="554" fill="#63E6A0" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">+ y 18 % de registros incompletos.</tspan>
</text>
<text x="88" y="602" fill="#75C7FF" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0">$ git diff --check</tspan>
</text>
<text x="88" y="634" fill="#B7C6D2" font-family="Consolas, Cascadia Mono, monospace" font-size="17" font-weight="500" text-anchor="start" style="">
<tspan x="88" dy="0"># Sin salida: no hay errores de espacios</tspan>
</text>
<rect x="82" y="690" width="220" height="38" rx="19" fill="#213746" stroke="#213746" stroke-width="1" opacity="1"/>
<text x="192.0" y="715" fill="#9EDAFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="">
<tspan x="192.0" dy="0">working tree · MODIFICADO</tspan>
</text>
<rect x="1050" y="142" width="508" height="650" rx="18" fill="#FFFFFF" stroke="#12395B" stroke-width="1.5" opacity="1"/>
<text x="1080" y="186" fill="#12395B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="start" style="">
<tspan x="1080" dy="0">¿QUÉ SABE GIT AHORA?</tspan>
</text>
<rect x="1080" y="222" width="448" height="84" rx="13" fill="#E8F2FB" stroke="#2F6FB0" stroke-width="2" opacity="1"/>
<circle cx="1112" cy="254" r="18" fill="#2F6FB0" stroke="#2F6FB0" stroke-width="1"/>
<text x="1112" y="262" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="1112" dy="0">1</tspan>
</text>
<text x="1142" y="253" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="1142" dy="0">Working tree</tspan>
</text>
<text x="1142" y="282" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="1142" dy="0">2 archivos cambiaron</tspan>
</text>
<rect x="1375" y="245" width="125" height="38" rx="19" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1" opacity="1"/>
<text x="1437.5" y="270" fill="#2F6FB0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" style="">
<tspan x="1437.5" dy="0">ESTADO ACTUAL</tspan>
</text>
<rect x="1080" y="332" width="448" height="84" rx="13" fill="#F6F8FA" stroke="#B8C8D6" stroke-width="1" opacity="1"/>
<circle cx="1112" cy="364" r="18" fill="#52697C" stroke="#52697C" stroke-width="1"/>
<text x="1112" y="372" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="1112" dy="0">2</tspan>
</text>
<text x="1142" y="363" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="1142" dy="0">Staging</tspan>
</text>
<text x="1142" y="392" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="1142" dy="0">todavía vacío</tspan>
</text>
<rect x="1080" y="442" width="448" height="84" rx="13" fill="#F6F8FA" stroke="#B8C8D6" stroke-width="1" opacity="1"/>
<circle cx="1112" cy="474" r="18" fill="#52697C" stroke="#52697C" stroke-width="1"/>
<text x="1112" y="482" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="1112" dy="0">3</tspan>
</text>
<text x="1142" y="473" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="1142" dy="0">Commit</tspan>
</text>
<text x="1142" y="502" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="1142" dy="0">todavía no existe</tspan>
</text>
<rect x="1080" y="552" width="448" height="84" rx="13" fill="#F6F8FA" stroke="#B8C8D6" stroke-width="1" opacity="1"/>
<circle cx="1112" cy="584" r="18" fill="#52697C" stroke="#52697C" stroke-width="1"/>
<text x="1112" y="592" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="1112" dy="0">4</tspan>
</text>
<text x="1142" y="583" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="1142" dy="0">Remoto</tspan>
</text>
<text x="1142" y="612" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="1142" dy="0">todavía no cambió</tspan>
</text>
<rect x="1080" y="666" width="448" height="96" rx="13" fill="#E7F5ED" stroke="#24855A" stroke-width="1.5" opacity="1"/>
<text x="1104" y="697" fill="#24855A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="start" style="">
<tspan x="1104" dy="0">DECISIÓN ANTES DE git add</tspan>
</text>
<text x="1104" y="728" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" style="">
<tspan x="1104" dy="0">¿Los dos archivos pertenecen al mismo propósito?</tspan>
<tspan x="1104" dy="18.75">¿La cifra está explicada y limitada?</tspan>
</text>
<rect x="48" y="838" width="1504" height="42" rx="13" fill="#E7EFF5" stroke="#E7EFF5" stroke-width="0" opacity="1"/>
<text x="70" y="865" fill="#12395B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" style="">
<tspan x="70" dy="0">LECTURA DEL DIFF</tspan>
</text>
<text x="256.0" y="865" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" style="">
<tspan x="256.0" dy="0">Rojo retira una plantilla; verde propone evidencia. Todavía no hay commit, push ni PR.</tspan>
</text>
</svg>