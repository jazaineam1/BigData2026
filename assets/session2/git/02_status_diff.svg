<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Lectura de git status y git diff</title>
<desc id="desc">Terminal con archivos modificados y panel explicativo de estados antes de staging.</desc>
<defs>
              <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0D273E"/>
                <stop offset="100%" stop-color="#1D4F73"/>
              </linearGradient>
              <linearGradient id="navy-card-grad" x1="0" y1="0" x2="0" y2="1">
