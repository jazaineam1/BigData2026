<tspan x="48" dy="0">Observar antes de seleccionar: status y diff</tspan>
</text>
<text x="48" y="80" fill="#D1E6F5" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">El objetivo no es memorizar colores: es comprobar qué archivo cambió y qué evidencia contiene</tspan>
</text>
