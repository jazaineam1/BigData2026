<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">Del universo de noticias a la bandeja de revisión</title>
  <desc id="d2">Cinco etapas encadenadas. Se parte de 57.848 artículos listados en los sitemaps
    de El Tiempo; filtrando la dirección por 21 palabras de contratación quedan 995 candidatos; se
    descargan y deduplican 987 noticias; al cruzarlas con SECOP aparecen 142 entidades contratantes
    nombradas en prensa; y combinando cuatro señales se llega a 200 procesos priorizados para
    revisión. Debajo, una advertencia: la palabra procuraduria estaba entre las 21 del filtro y
    metió 265 de esas 987 noticias.</desc>
  <style>
    .bg  { fill:#ffffff; }
    .h   { font:700 18px "Segoe UI",Arial,sans-serif; fill:#1a2027; }
    .n   { font:700 27px "Consolas","SF Mono",monospace; }
    .lb  { font:600 13px "Segoe UI",Arial,sans-serif; fill:#263238; }
    .sm  { font:400 12px "Segoe UI",Arial,sans-serif; fill:#546e7a; }
    .warn{ font:400 13px "Segoe UI",Arial,sans-serif; fill:#7f4a00; }
    .wb  { font:700 13px "Segoe UI",Arial,sans-serif; fill:#7f4a00; }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="400"/>
  <text class="h" x="34" y="38">De 57.848 artículos a 200 procesos que alguien puede revisar el lunes</text>

  <!-- etapas -->
  <g>
    <rect x="34"  y="62" width="168" height="112" rx="9" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.6"/>
    <text class="n"  x="52" y="104" fill="#283593">57 848</text>
    <text class="lb" x="52" y="128">artículos listados</text>
    <text class="sm" x="52" y="148">ene–ago 2026</text>
    <text class="sm" x="52" y="164">8 peticiones HTTP</text>

    <rect x="234" y="62" width="168" height="112" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.6"/>
    <text class="n"  x="252" y="104" fill="#0d47a1">995</text>
    <text class="lb" x="252" y="128">candidatos</text>
    <text class="sm" x="252" y="148">filtrando la URL</text>
    <text class="sm" x="252" y="164">por 21 palabras</text>

    <rect x="434" y="62" width="168" height="112" rx="9" fill="#e0f7fa" stroke="#00838f" stroke-width="1.6"/>
    <text class="n"  x="452" y="104" fill="#006064">987</text>
    <text class="lb" x="452" y="128">noticias</text>
    <text class="sm" x="452" y="148">descargadas y</text>
    <text class="sm" x="452" y="164">deduplicadas</text>

    <rect x="634" y="62" width="150" height="112" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
    <text class="n"  x="652" y="104" fill="#1b5e20">142</text>
    <text class="lb" x="652" y="128">entidades</text>
    <text class="sm" x="652" y="148">de 9 111, cruzadas</text>
    <text class="sm" x="652" y="164">contra SECOP</text>

    <rect x="816" y="62" width="130" height="112" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.6"/>
    <text class="n"  x="834" y="104" fill="#e65100">200</text>
    <text class="lb" x="834" y="128">procesos</text>
    <text class="sm" x="834" y="148">priorizados</text>
    <text class="sm" x="834" y="164">para revisar</text>
  </g>

  <!-- flechas -->
  <g fill="#90a4ae">
    <path d="M206 118 l20 0 l0 -6 l14 8 l-14 8 l0 -6 l-20 0 z"/>
    <path d="M406 118 l20 0 l0 -6 l14 8 l-14 8 l0 -6 l-20 0 z"/>
    <path d="M606 118 l20 0 l0 -6 l14 8 l-14 8 l0 -6 l-20 0 z"/>
    <path d="M788 118 l16 0 l0 -6 l14 8 l-14 8 l0 -6 l-16 0 z"/>
  </g>

  <!-- advertencia -->
  <g>
    <rect x="34" y="212" width="912" height="90" rx="9" fill="#fff8e1" stroke="#ffb300" stroke-width="1.6"/>
    <text class="wb"   x="56" y="242">El filtro de la segunda caja decide el resultado de la cuarta.</text>
    <text class="warn" x="56" y="266">Entre esas 21 palabras estaba «procuraduria», y 265 de las 987 noticias entraron precisamente por ella.</text>
    <text class="warn" x="56" y="288">Por eso la Procuraduría encabeza el cruce: la buscamos nosotros. Contar un término en un corpus construido con ese término mide el filtro, no la realidad.</text>
  </g>

  <text class="sm" x="34" y="338">Cada caja conserva lo que la anterior seleccionó. Ninguna decisión de filtrado es neutral: todas viajan hasta el final.</text>
  <text class="sm" x="34" y="362" fill="#37474f">Fuentes: sitemaps y feeds públicos de El Tiempo · muestra de 300 000 procesos de SECOP II.</text>
</svg>
