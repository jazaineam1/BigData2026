<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     role="img" aria-labelledby="ti di">
  <title id="ti">Qué hace insert_many con una lista de documentos</title>
  <desc id="di">En Python hay una lista con 987 diccionarios, que vive en la memoria del Colab y
    desaparece si el entorno se reinicia. insert_many recorre esa lista y guarda cada diccionario como
    un documento dentro de la coleccion, en el disco del servidor mongod. Devuelve la lista de los 987
    identificadores que quedaron guardados. Con insert_one habria que hacer 987 viajes al servidor en
    lugar de uno.</desc>
  <style>
    .h  { font:700 16px "Segoe UI",Arial,sans-serif; fill:#1a2027; }
    .cap{ font:600 12.5px "Segoe UI",Arial,sans-serif; fill:#37474f; }
    .s  { font:400 12px "Segoe UI",Arial,sans-serif; fill:#546e7a; }
    .m  { font:400 11.5px "Consolas","SF Mono",monospace; fill:#37474f; }
    .st { font:700 15px "Consolas",monospace; }
    .n  { font:700 19px "Consolas",monospace; }
  </style>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <text class="h" x="28" y="32">insert_many(lista): recorre la lista de Python y guarda cada diccionario como un documento</text>

  <!-- LADO PYTHON -->
  <rect x="28" y="56" width="368" height="292" rx="9" fill="#fff8e1" stroke="#ffb300" stroke-width="2"/>
  <text class="cap" x="46" y="80" fill="#8d6e00">EN PYTHON — la variable noticias</text>
  <text class="s"   x="46" y="98">una lista con 987 diccionarios</text>

  <rect x="46" y="112" width="332" height="34" rx="5" fill="#ffffff" stroke="#ffca28"/>
  <text class="m" x="58" y="134">{ "_id": 7443, "titulo": "La Gran Via…", … }</text>
  <rect x="46" y="152" width="332" height="34" rx="5" fill="#ffffff" stroke="#ffca28"/>
  <text class="m" x="58" y="174">{ "_id": 7451, "titulo": "Metro de Bogota…", … }</text>
  <rect x="46" y="192" width="332" height="34" rx="5" fill="#ffffff" stroke="#ffca28"/>
  <text class="m" x="58" y="214">{ "_id": 7460, "titulo": "Nueva EPS…", … }</text>
  <text class="s" x="46" y="248">…y otros 984 diccionarios</text>

  <text class="s" x="46" y="286" fill="#8d6e00">Vive en la memoria del Colab.</text>
  <text class="s" x="46" y="304" fill="#8d6e00">Si el entorno se reinicia, se pierde:</text>
  <text class="s" x="46" y="322" fill="#8d6e00">por eso hay que guardarla.</text>

  <!-- LA OPERACION -->
  <path d="M406 196 l52 0 l0 -12 l30 20 l-30 20 l0 -12 l-52 0 z" fill="#1976d2"/>
  <rect x="400" y="126" width="182" height="50" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text class="st" x="491" y="157" text-anchor="middle" fill="#0d47a1">insert_many</text>
  <text class="s"  x="491" y="252" text-anchor="middle">un solo viaje</text>
  <text class="s"  x="491" y="270" text-anchor="middle">al servidor</text>

  <!-- LADO MONGO -->
  <rect x="592" y="56" width="360" height="292" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text class="cap" x="610" y="80" fill="#1b5e20">EN MONGODB — coleccion "noticias"</text>
  <text class="s"   x="610" y="98">987 documentos, en el disco del servidor</text>

  <rect x="610" y="112" width="324" height="34" rx="5" fill="#ffffff" stroke="#81c784"/>
  <text class="m" x="622" y="134">documento _id 7443</text>
  <rect x="610" y="152" width="324" height="34" rx="5" fill="#ffffff" stroke="#81c784"/>
  <text class="m" x="622" y="174">documento _id 7451</text>
  <rect x="610" y="192" width="324" height="34" rx="5" fill="#ffffff" stroke="#81c784"/>
  <text class="m" x="622" y="214">documento _id 7460</text>
  <text class="s" x="610" y="248">…y otros 984 documentos</text>

  <text class="s" x="610" y="286" fill="#1b5e20">Sobrevive al reinicio del entorno</text>
  <text class="s" x="610" y="304" fill="#1b5e20">mientras el servidor siga vivo. Y ahora</text>
  <text class="s" x="610" y="322" fill="#1b5e20">se puede consultar con find y aggregate.</text>

  <!-- DEVUELVE -->
  <rect x="28" y="372" width="452" height="74" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.8"/>
  <text class="cap" x="46" y="396">Qué te devuelve</text>
  <text class="m"   x="46" y="418">resultado.inserted_ids  →  [7443, 7451, 7460, …]</text>
  <text class="s"   x="46" y="436">Si len(...) da 987, entró todo. Es la forma de confirmarlo.</text>

  <rect x="500" y="372" width="452" height="74" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.8"/>
  <text class="cap" x="518" y="396" fill="#880e4f">Por qué no insert_one en un bucle</text>
  <text class="s"   x="518" y="418">Serían 987 viajes al servidor en vez de uno. Hoy solo es lento;</text>
  <text class="s"   x="518" y="436">en la sesión 4, con Atlas gratuito, te frena a 100 por segundo.</text>
</svg>
