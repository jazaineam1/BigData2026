<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Git y GitHub como conversación entre roles</title>
<desc id="desc">Propuesta, objeciones profesionales, corrección, CI y decisión humana conservadas en un Pull Request.</desc>
