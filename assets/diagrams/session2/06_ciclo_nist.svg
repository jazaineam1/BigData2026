</text>
<text x="718" y="230" fill="#2F6FB0" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="900" text-anchor="start" style="">
<tspan x="718" dy="0">CAPTURA</tspan>
</text>
<text x="670" y="268" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="550" text-anchor="start" style="">
<tspan x="670" dy="0">Entrada: API o muestra local</tspan>
<tspan x="670" dy="18.225">Artefacto: snapshot + metadatos</tspan>
<tspan x="670" dy="18.225">Rol: ingeniero de datos + data owner</tspan>
</text>
