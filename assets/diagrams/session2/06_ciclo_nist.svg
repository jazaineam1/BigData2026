<text x="1464.0" y="47" fill="#D9EFFB" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" style="">
<tspan x="1464.0" dy="0">SESIÓN 2 · CICLO NIST</tspan>
</text>
<text x="48" y="48" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">Ciclo analítico: la evidencia debe volver al proceso</tspan>
</text>
<text x="48" y="80" fill="#D1E6F5" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">Captura → preparación → análisis → visualización → acción; después aparecen nuevas preguntas</tspan>
</text>
<rect x="450" y="126" width="700" height="46" rx="16" fill="#FFFFFF" stroke="#B8C8D6" stroke-width="1.5" opacity="1"/>
<text x="800" y="155" fill="#12395B" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="900" text-anchor="middle" style="">
<tspan x="800" dy="0">GOBIERNO · SEGURIDAD · PRIVACIDAD · CALIDAD · TRAZABILIDAD</tspan>
</text>
