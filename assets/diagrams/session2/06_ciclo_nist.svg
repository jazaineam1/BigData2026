<tspan x="1046" dy="0">3</tspan>
</text>
<text x="1078" y="648" fill="#6C5AA7" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="900" text-anchor="start" style="">
<tspan x="1078" dy="0">ANÁLISIS</tspan>
</text>
<text x="1030" y="686" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="550" text-anchor="start" style="">
<tspan x="1030" dy="0">Perfil descriptivo + reglas</tspan>
<tspan x="1030" dy="18.225">Artefacto: cola priorizada con motivos</tspan>
<tspan x="1030" dy="18.225">Roles: BI/datos + experto de dominio</tspan>
</text>
<rect x="290" y="600" width="310" height="168" rx="18" fill="#FFFFFF" stroke="#167C80" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<circle cx="326" cy="642" r="20" fill="#167C80" stroke="#167C80" stroke-width="1"/>
<text x="326" y="648" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="326" dy="0">4</tspan>
</text>
<text x="358" y="648" fill="#167C80" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="900" text-anchor="start" style="">
<tspan x="358" dy="0">VISUALIZACIÓN</tspan>
</text>
<text x="310" y="686" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="550" text-anchor="start" style="">
