<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Ciclo analítico NIST aplicado a SECOP</title>
<desc id="desc">Cinco etapas conectadas alrededor de una decisión humana con artefactos, responsables y controles.</desc>
<defs>
              <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0D273E"/>
                <stop offset="100%" stop-color="#1D4F73"/>
              </linearGradient>
