<tspan x="216" dy="0">5</tspan>
</text>
<text x="248" y="336" fill="#E95C3A" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="900" text-anchor="start" style="">
<tspan x="248" dy="0">ACCIÓN</tspan>
</text>
<text x="200" y="374" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="550" text-anchor="start" style="">
<tspan x="200" dy="0">Revisar contexto · corregir · escalar</tspan>
<tspan x="200" dy="18.225">Artefacto: registro de decisión auditable</tspan>
<tspan x="200" dy="18.225">Roles: usuario + dueño del proceso</tspan>
</text>
<circle cx="800" cy="492" r="138" fill="url(#hub-grad)" stroke="#2F6FB0" stroke-width="3" filter="url(#shadow)"/>
<text x="800" y="450" fill="#BFE4F6" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="900" text-anchor="middle" style="">
<tspan x="800" dy="0">DECISIÓN SOPORTADA</tspan>
</text>
<text x="800" y="492" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle" style="">
<tspan x="800" dy="0">¿qué contrato revisar</tspan>
<tspan x="800" dy="24.779999999999998">primero y por qué?</tspan>
</text>
