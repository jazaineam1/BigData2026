<tspan x="310" dy="18.225">Artefacto: reporte / tablero analítico</tspan>
<tspan x="310" dy="18.225">Roles: analista BI + usuario</tspan>
</text>
<rect x="180" y="288" width="310" height="168" rx="18" fill="#FFFFFF" stroke="#E95C3A" stroke-width="2" opacity="1" filter="url(#shadow)"/>
