<tspan x="171.5" dy="0">DISTINCIÓN ESENCIAL</tspan>
</text>
<text x="306" y="863" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" style="">
<tspan x="306" dy="0">Visualizar muestra evidencia; actuar exige autoridad, criterio, registro y retroalimentación.</tspan>
