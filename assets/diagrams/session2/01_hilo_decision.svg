</text>
<text x="464" y="192" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="464" dy="0">Proceso AS-IS</tspan>
</text>
<rect x="428" y="212" width="180" height="36" rx="18" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.5" opacity="1"/>
<text x="518.0" y="235" fill="#2F6FB0" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="518.0" dy="0">¿DÓNDE SE DEMORA?</tspan>
</text>
<text x="430" y="274" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
