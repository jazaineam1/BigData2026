</text>
<text x="842" y="540" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="842" dy="0">Acción humana</tspan>
</text>
<rect x="806" y="560" width="180" height="36" rx="18" fill="#FFFFFF" stroke="#E95C3A" stroke-width="1.5" opacity="1"/>
<text x="896.0" y="583" fill="#E95C3A" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="896.0" dy="0">¿QUIÉN DECIDE?</tspan>
</text>
<text x="808" y="622" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="808" dy="0">Revisar contexto contractual</tspan>
<tspan x="808" dy="20.25">Corregir · escalar · descartar</tspan>
<tspan x="808" dy="20.25">Registrar motivo y resultado</tspan>
</text>
