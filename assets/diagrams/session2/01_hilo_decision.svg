<tspan x="1464.0" dy="0">MAPA 1 DE 6</tspan>
</text>
<text x="48" y="50" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">La historia completa: de la decisión a la mejora</tspan>
</text>
<text x="48" y="82" fill="#CFE4F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">Cada componente existe porque responde una pregunta anterior del negocio</tspan>
</text>
<rect x="42" y="142" width="320" height="660" rx="24" fill="#12395B" stroke="#12395B" stroke-width="0" opacity="1" filter="url(#shadow)"/>
<rect x="70" y="172" width="145" height="38" rx="19" fill="#2A5878" stroke="#2A5878" stroke-width="1" opacity="1"/>
