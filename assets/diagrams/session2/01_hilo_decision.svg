<tspan x="934.0" dy="0">¿QUÉ EVIDENCIA NACE?</tspan>
</text>
<text x="816" y="282" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" style="">
<tspan x="816" dy="0">Contrato · entidad · estado</tspan>
<tspan x="816" dy="24.3">Fechas · duración · calidad</tspan>
<tspan x="816" dy="24.3">Responsable y regla por campo</tspan>
</text>
