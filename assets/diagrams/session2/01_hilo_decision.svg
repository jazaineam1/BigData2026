<tspan x="1464.0" dy="0">MAPA 1 DE 6</tspan>
</text>
<text x="48" y="48" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">La historia completa: de la decisión a la mejora</tspan>
</text>
<text x="48" y="80" fill="#D1E6F5" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">Cada componente existe porque responde una pregunta anterior del negocio</tspan>
</text>
<rect x="42" y="140" width="324" height="664" rx="22" fill="url(#navy-card-grad)" stroke="#2A5878" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
