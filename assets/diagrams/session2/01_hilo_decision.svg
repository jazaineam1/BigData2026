<tspan x="430" dy="20.25">Actores + tareas + decisiones</tspan>
<tspan x="430" dy="20.25">Cuello: consolidación manual</tspan>
</text>
<rect x="784" y="150" width="334" height="232" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
