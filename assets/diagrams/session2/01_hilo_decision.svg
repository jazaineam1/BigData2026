<tspan x="86" dy="0">Regla de diseño</tspan>
</text>
<text x="86" y="694" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" style="">
<tspan x="86" dy="0">primero propósito;</tspan>
<tspan x="86" dy="22.1">después herramienta</tspan>
</text>
