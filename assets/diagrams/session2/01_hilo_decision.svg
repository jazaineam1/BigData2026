<tspan x="142.5" dy="0">PUNTO DE PARTIDA</tspan>
</text>
<text x="70" y="240" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" style="">
<tspan x="70" dy="0">Laura</tspan>
<tspan x="70" dy="28.749999999999996">Analista de</tspan>
<tspan x="70" dy="28.749999999999996">seguimiento</tspan>
</text>
<text x="70" y="325" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" style="">
<tspan x="70" dy="0">Necesita decidir:</tspan>
<tspan x="70" dy="30.68">¿qué contratos</tspan>
<tspan x="70" dy="30.68">revisar primero?</tspan>
</text>
<rect x="70" y="458" width="264" height="145" rx="16" fill="#214E6D" stroke="#4E7B99" stroke-width="1" opacity="1"/>
<text x="92" y="493" fill="#BFE4F6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="92" dy="0">Criterio de éxito</tspan>
</text>
<text x="92" y="532" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" style="">
<tspan x="92" dy="0">menos tiempo para priorizar</tspan>
<tspan x="92" dy="24.3">sin acusar ni automatizar</tspan>
<tspan x="92" dy="24.3">la decisión humana</tspan>
</text>
<rect x="70" y="637" width="264" height="112" rx="16" fill="#153149" stroke="#4E7B99" stroke-width="1" opacity="1"/>
