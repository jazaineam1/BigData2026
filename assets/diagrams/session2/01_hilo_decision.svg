</text>
<text x="1239" y="195" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" style="">
<tspan x="1239" dy="0">Capacidades y herramientas</tspan>
</text>
