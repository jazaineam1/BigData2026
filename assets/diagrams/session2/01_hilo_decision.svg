</text>
<text x="861" y="543" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" style="">
<tspan x="861" dy="0">Acción humana</tspan>
</text>
<rect x="814" y="567" width="240" height="38" rx="19" fill="#FFFFFF" stroke="#E95C3A" stroke-width="1" opacity="1"/>
<text x="934.0" y="592" fill="#E95C3A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" style="">
<tspan x="934.0" dy="0">¿QUIÉN DECIDE?</tspan>
</text>
<text x="816" y="630" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" style="">
<tspan x="816" dy="0">Revisar contexto</tspan>
<tspan x="816" dy="24.3">Corregir · escalar · descartar</tspan>
<tspan x="816" dy="24.3">Registrar motivo y resultado</tspan>
</text>
<rect x="408" y="500" width="330" height="230" rx="18" fill="#FFFFFF" stroke="#C93F34" stroke-width="2" opacity="1" filter="url(#shadow)"/>
