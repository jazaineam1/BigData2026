<tspan x="1312.0" dy="0">¿QUÉ DEBE HACER EL SISTEMA?</tspan>
</text>
<text x="1194" y="282" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" style="">
<tspan x="1194" dy="0">Ingerir → validar → integrar</tspan>
<tspan x="1194" dy="24.3">analizar → explicar → alertar</tspan>
<tspan x="1194" dy="24.3">Productos solo como candidatos</tspan>
</text>
