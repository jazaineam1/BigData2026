<tspan x="438" dy="0">Atajo que debemos evitar</tspan>
</text>
<text x="438" y="592" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" style="font-style:italic;">
<tspan x="438" dy="0">“Instalemos una herramienta</tspan>
<tspan x="438" dy="27.0">y luego busquemos el problema”</tspan>
</text>
