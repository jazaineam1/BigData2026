<tspan x="152.5" dy="0">PUNTO DE PARTIDA</tspan>
</text>
<text x="70" y="236" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" style="">
<tspan x="70" dy="0">Laura</tspan>
<tspan x="70" dy="29.5">Analista de</tspan>
<tspan x="70" dy="29.5">seguimiento</tspan>
</text>
<text x="70" y="322" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" style="">
<tspan x="70" dy="0">Necesita decidir:</tspan>
<tspan x="70" dy="27.599999999999998">¿qué contratos</tspan>
<tspan x="70" dy="27.599999999999998">revisar primero?</tspan>
</text>
<rect x="66" y="452" width="276" height="150" rx="14" fill="#153650" stroke="#3F6B8A" stroke-width="1" opacity="1"/>
<text x="86" y="484" fill="#BFE4F6" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" style="">
<tspan x="86" dy="0">Criterio de éxito</tspan>
</text>
<text x="86" y="520" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="86" dy="0">menos tiempo para priorizar</tspan>
<tspan x="86" dy="20.25">sin acusar ni automatizar</tspan>
<tspan x="86" dy="20.25">la decisión humana</tspan>
</text>
<rect x="66" y="626" width="276" height="126" rx="14" fill="#10263A" stroke="#3F6B8A" stroke-width="1" opacity="1"/>
