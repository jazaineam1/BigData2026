<tspan x="556.0" dy="0">¿DÓNDE SE DEMORA?</tspan>
</text>
<text x="438" y="282" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" style="">
<tspan x="438" dy="0">Seguimiento contractual</tspan>
<tspan x="438" dy="24.3">Actores + tareas + decisiones</tspan>
<tspan x="438" dy="24.3">Cuello: consolidación manual</tspan>
</text>
