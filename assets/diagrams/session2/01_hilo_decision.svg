</text>
<text x="1186" y="622" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="1186" dy="0">Tiempo para priorizar</tspan>
<tspan x="1186" dy="20.25">% de registros completos</tspan>
<tspan x="1186" dy="20.25">% de casos atendidos en SLA</tspan>
</text>
