</text>
<text x="92" y="706" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" style="">
<tspan x="92" dy="0">primero propósito;</tspan>
<tspan x="92" dy="24.7">después herramienta</tspan>
</text>
