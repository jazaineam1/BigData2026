<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hilo conductor de Compras Claras</title>
<desc id="desc">Trazabilidad desde una decisión empresarial hasta la acción humana y la mejora del proceso.</desc>
