<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hilo conductor de Compras Claras</title>
<desc id="desc">Secuencia de la Sesión 2 desde una decisión empresarial hasta la mejora verificable del proceso.</desc>
<defs>
              <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0D273E"/>
                <stop offset="100%" stop-color="#1D4F73"/>
              </linearGradient>
              <linearGradient id="navy-card-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#184368"/>
                <stop offset="100%" stop-color="#0F2B48"/>
              </linearGradient>
              <linearGradient id="hub-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1C4B72"/>
                <stop offset="100%" stop-color="#0A2238"/>
              </linearGradient>
              <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2B48" flood-opacity="0.09"/>
              </filter>
              <filter id="shadow-lg" x="-15%" y="-15%" width="135%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2B48" flood-opacity="0.14"/>
              </filter>
              <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#2F6FB0"/>
              </marker>
              <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#C93F34"/>
              </marker>
              <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#24855A"/>
              </marker>
              <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#6C5AA7"/>
              </marker>
              <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#E95C3A"/>
              </marker>
              <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#C98500"/>
              </marker>
              <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#167C80"/>
              </marker>
              <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                <path d="M0,0 L0,6 L9,3 z" fill="#17324D"/>
              </marker>
            </defs>
<rect width="1600" height="900" fill="#F3F7FA"/>
<rect x="0" y="0" width="1600" height="114" rx="0" fill="url(#header-grad)" stroke="#0D273E" stroke-width="0" opacity="1"/>
<line x1="0" y1="114" x2="1600" y2="114" stroke="#2F6FB0" stroke-width="2" fill="none" stroke-linecap="round"/>
<rect x="1376" y="24" width="176" height="36" rx="18" fill="#214E6D" stroke="#3F769C" stroke-width="1.5" opacity="1"/>
<text x="1464.0" y="47" fill="#D9EFFB" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" style="">
<tspan x="1464.0" dy="0">SESIÓN 2 · MAPA DE LA CLASE</tspan>
</text>
<text x="48" y="48" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">De una decisión empresarial a una mejora verificable</tspan>
</text>
<text x="48" y="80" fill="#D1E6F5" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">Primero entendemos las preguntas; los nombres formales y las herramientas aparecerán cuando corresponda.</tspan>
</text>
<rect x="48" y="132" width="1504" height="68" rx="15" fill="#E8F2FB" stroke="#2F6FB0" stroke-width="1.2" opacity="1"/>
<rect x="66" y="147" width="300" height="36" rx="18" fill="#2F6FB0" stroke="#2F6FB0" stroke-width="1.5" opacity="1"/>
<text x="216.0" y="170" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" style="">
<tspan x="216.0" dy="0">PERSONAS EN TODO EL RECORRIDO</tspan>
</text>
<text x="395" y="173" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" style="">
<tspan x="395" dy="0">quien define el problema · quien conoce el trabajo · quien cuida los datos · quien construye la evidencia · quien decide</tspan>
</text>
<rect x="50" y="226" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="50" y="226" width="8" height="192" rx="4" fill="#E95C3A" stroke="#E95C3A" stroke-width="0" opacity="1"/>
<circle cx="80" cy="262" r="17" fill="#E95C3A" stroke="#E95C3A" stroke-width="1"/>
<text x="80" y="268" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="80" dy="0">1</tspan>
</text>
<text x="108" y="268" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="108" dy="0">Definir la decisión</tspan>
</text>
<rect x="72" y="288" width="192" height="36" rx="18" fill="#FFFFFF" stroke="#E95C3A" stroke-width="1.5" opacity="1"/>
<text x="168.0" y="311" fill="#E95C3A" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="168.0" dy="0">¿QUÉ DEBEMOS MEJORAR?</tspan>
</text>
<text x="74" y="350" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="74" dy="0">Laura pregunta qué revisar primero</tspan>
<tspan x="74" dy="20.25">Medida: tiempo hasta primera revisión</tspan>
<tspan x="74" dy="20.25">Produce: propósito y criterio de éxito</tspan>
</text>
<rect x="580" y="226" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="580" y="226" width="8" height="192" rx="4" fill="#2F6FB0" stroke="#2F6FB0" stroke-width="0" opacity="1"/>
<circle cx="610" cy="262" r="17" fill="#2F6FB0" stroke="#2F6FB0" stroke-width="1"/>
<text x="610" y="268" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="610" dy="0">2</tspan>
</text>
<text x="638" y="268" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" style="">
<tspan x="638" dy="0">Comprender el trabajo actual</tspan>
</text>
<rect x="602" y="288" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.5" opacity="1"/>
<text x="702.0" y="311" fill="#2F6FB0" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="702.0" dy="0">¿DÓNDE NACE LA DEMORA?</tspan>
</text>
<text x="604" y="350" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="604" dy="0">Actividades + personas + decisiones</tspan>
<tspan x="604" dy="20.25">Demora: consolidación manual</tspan>
<tspan x="604" dy="20.25">Produce: mapa del trabajo actual</tspan>
</text>
<rect x="1110" y="226" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="1110" y="226" width="8" height="192" rx="4" fill="#6C5AA7" stroke="#6C5AA7" stroke-width="0" opacity="1"/>
<circle cx="1140" cy="262" r="17" fill="#6C5AA7" stroke="#6C5AA7" stroke-width="1"/>
<text x="1140" y="268" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="1140" dy="0">3</tspan>
</text>
<text x="1168" y="268" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="1168" dy="0">Identificar los datos</tspan>
</text>
<rect x="1132" y="288" width="208" height="36" rx="18" fill="#FFFFFF" stroke="#6C5AA7" stroke-width="1.5" opacity="1"/>
<text x="1236.0" y="311" fill="#6C5AA7" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="1236.0" dy="0">¿QUÉ NECESITAMOS SABER?</tspan>
</text>
<text x="1134" y="350" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="1134" dy="0">Origen + significado + calidad</tspan>
<tspan x="1134" dy="20.25">SECOP + reglas + responsables</tspan>
<tspan x="1134" dy="20.25">Produce: datos interpretables</tspan>
</text>
<rect x="1110" y="492" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="1110" y="492" width="8" height="192" rx="4" fill="#24855A" stroke="#24855A" stroke-width="0" opacity="1"/>
<circle cx="1140" cy="528" r="17" fill="#24855A" stroke="#24855A" stroke-width="1"/>
<text x="1140" y="534" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="1140" dy="0">4</tspan>
</text>
<text x="1168" y="534" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="1168" dy="0">Crear evidencia</tspan>
</text>
<rect x="1132" y="554" width="264" height="36" rx="18" fill="#FFFFFF" stroke="#24855A" stroke-width="1.5" opacity="1"/>
<text x="1264.0" y="577" fill="#24855A" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="1264.0" dy="0">¿CÓMO RESPONDEMOS LA PREGUNTA?</tspan>
</text>
<text x="1134" y="616" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="1134" dy="0">Obtener · ordenar · examinar</tspan>
<tspan x="1134" dy="20.25">Presentar resultados con contexto</tspan>
<tspan x="1134" dy="20.25">Produce: prioridad con motivos</tspan>
</text>
<rect x="580" y="492" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="580" y="492" width="8" height="192" rx="4" fill="#E95C3A" stroke="#E95C3A" stroke-width="0" opacity="1"/>
<circle cx="610" cy="528" r="17" fill="#E95C3A" stroke="#E95C3A" stroke-width="1"/>
<text x="610" y="534" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="610" dy="0">5</tspan>
</text>
<text x="638" y="534" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="638" dy="0">Usar la evidencia</tspan>
</text>
<rect x="602" y="554" width="224" height="36" rx="18" fill="#FFFFFF" stroke="#E95C3A" stroke-width="1.5" opacity="1"/>
<text x="714.0" y="577" fill="#E95C3A" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="714.0" dy="0">¿QUIÉN DECIDE Y QUÉ HACE?</tspan>
</text>
<text x="604" y="616" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="604" dy="0">Revisar el contexto contractual</tspan>
<tspan x="604" dy="20.25">Corregir · escalar · descartar</tspan>
<tspan x="604" dy="20.25">Produce: decisión y motivo registrados</tspan>
</text>
<rect x="50" y="492" width="440" height="192" rx="16" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" opacity="1" filter="url(#shadow)"/>
<rect x="50" y="492" width="8" height="192" rx="4" fill="#167C80" stroke="#167C80" stroke-width="0" opacity="1"/>
<circle cx="80" cy="528" r="17" fill="#167C80" stroke="#167C80" stroke-width="1"/>
<text x="80" y="534" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" style="">
<tspan x="80" dy="0">6</tspan>
</text>
<text x="108" y="534" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" style="">
<tspan x="108" dy="0">Comprobar y mejorar</tspan>
</text>
<rect x="72" y="554" width="208" height="36" rx="18" fill="#FFFFFF" stroke="#167C80" stroke-width="1.5" opacity="1"/>
<text x="176.0" y="577" fill="#167C80" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="176.0" dy="0">¿FUNCIONÓ Y QUÉ CAMBIA?</tspan>
</text>
<text x="74" y="616" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="74" dy="0">Comparar el resultado con el inicio</tspan>
<tspan x="74" dy="20.25">Ajustar trabajo y controles</tspan>
<tspan x="74" dy="20.25">Produce: aprendizaje + nueva pregunta</tspan>
</text>
<line x1="490" y1="322" x2="580" y2="322" stroke="#2F6FB0" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
