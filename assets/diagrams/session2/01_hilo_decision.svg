<text x="434" y="588" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" style="font-style:italic;">
<tspan x="434" dy="0">“Instalemos una herramienta</tspan>
<tspan x="434" dy="22.950000000000003">y luego busquemos el problema”</tspan>
