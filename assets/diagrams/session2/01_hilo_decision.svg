</text>
<text x="808" y="274" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="808" dy="0">Contrato · entidad · estado</tspan>
<tspan x="808" dy="20.25">Fechas · duración · calidad</tspan>
<tspan x="808" dy="20.25">Responsable y regla por campo</tspan>
</text>
