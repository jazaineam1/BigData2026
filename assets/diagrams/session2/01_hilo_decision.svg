</text>
<text x="1186" y="274" fill="#52697C" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" style="">
<tspan x="1186" dy="0">Ingerir → validar → integrar</tspan>
<tspan x="1186" dy="20.25">analizar → explicar → alertar</tspan>
<tspan x="1186" dy="20.25">Productos solo como candidatos</tspan>
</text>
