</text>
<text x="861" y="195" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" style="">
<tspan x="861" dy="0">Datos necesarios</tspan>
</text>
