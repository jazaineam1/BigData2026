<line x1="580" y1="588" x2="490" y2="588" stroke="#E95C3A" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<path d="M170 492 C170 458 170 452 170 418" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" stroke-dasharray="7 5"/>
<rect x="198" y="434" width="244" height="36" rx="18" fill="#E3F5F5" stroke="#167C80" stroke-width="1.5" opacity="1"/>
<text x="320.0" y="457" fill="#167C80" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" style="">
<tspan x="320.0" dy="0">RESULTADO → NUEVO CICLO</tspan>
</text>
<rect x="48" y="720" width="1504" height="92" rx="17" fill="url(#navy-card-grad)" stroke="#2A5878" stroke-width="1.4" opacity="1" filter="url(#shadow)"/>
<rect x="70" y="742" width="390" height="36" rx="18" fill="#214E6D" stroke="#4E7B99" stroke-width="1.5" opacity="1"/>
<text x="265.0" y="765" fill="#D9EFFB" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" style="">
<tspan x="265.0" dy="0">CONSERVAR LA CONVERSACIÓN EN 1–6</tspan>
</text>
<text x="490" y="761" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" style="">
<tspan x="490" dy="0">Guardar versión + pregunta + corrección + comprobación</tspan>
</text>
<text x="490" y="790" fill="#D9EFFB" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500" text-anchor="start" style="">
<tspan x="490" dy="0">Más adelante conoceremos una herramienta que ayuda a reconstruir por qué cambió una propuesta.</tspan>
</text>
<rect x="48" y="836" width="1504" height="44" rx="14" fill="#E7EFF5" stroke="#D0DFEA" stroke-width="1.5" opacity="1"/>
<rect x="52" y="840" width="173" height="36" rx="11" fill="#12395B" stroke="#12395B" stroke-width="0" opacity="1"/>
<text x="138.5" y="863" fill="#FFFFFF" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" style="">
<tspan x="138.5" dy="0">LECTURA CLAVE</tspan>
</text>
<text x="240" y="863" fill="#17324D" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" style="">
<tspan x="240" dy="0">Primero comprendemos la historia; después aprendemos el nombre formal de cada método y herramienta.</tspan>
</text>
</svg>