<tspan x="1034" dy="19.8">Artefacto: métricas + cola</tspan>
<tspan x="1034" dy="19.8">Responsable: analista</tspan>
</text>
<rect x="290" y="600" width="300" height="165" rx="18" fill="#FFFFFF" stroke="#167C80" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<circle cx="328" cy="642" r="23" fill="#167C80" stroke="#167C80" stroke-width="1"/>
