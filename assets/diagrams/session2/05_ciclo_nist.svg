<tspan x="1158" dy="0">2</tspan>
</text>
<text x="1195" y="339" fill="#C98500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" style="">
<tspan x="1195" dy="0">PREPARACIÓN</tspan>
</text>
<text x="1144" y="378" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
