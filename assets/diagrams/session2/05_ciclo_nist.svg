<tspan x="1144" dy="19.8">Artefacto: tabla + excepciones</tspan>
<tspan x="1144" dy="19.8">Responsable: datos</tspan>
</text>
<rect x="1010" y="600" width="300" height="165" rx="18" fill="#FFFFFF" stroke="#6C5AA7" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<circle cx="1048" cy="642" r="23" fill="#6C5AA7" stroke="#6C5AA7" stroke-width="1"/>
<text x="1048" y="650" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="1048" dy="0">3</tspan>
</text>
<text x="1085" y="649" fill="#6C5AA7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" style="">
<tspan x="1085" dy="0">ANÁLISIS</tspan>
</text>
<text x="1034" y="688" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
