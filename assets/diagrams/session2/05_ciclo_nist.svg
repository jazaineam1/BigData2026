<text x="1464.0" y="49" fill="#D9EFFB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" style="">
<tspan x="1464.0" dy="0">MAPA 5 DE 6</tspan>
</text>
<text x="48" y="50" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start" style="">
<tspan x="48" dy="0">Ciclo analítico: la evidencia debe volver al proceso</tspan>
</text>
<text x="48" y="82" fill="#CFE4F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" style="">
<tspan x="48" dy="0">Captura → preparación → análisis → visualización → acción; después aparecen nuevas preguntas</tspan>
</text>
<rect x="450" y="128" width="700" height="48" rx="18" fill="#FFFFFF" stroke="#B8C8D6" stroke-width="1" opacity="1"/>
<text x="800" y="159" fill="#12395B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle" style="">
<tspan x="800" dy="0">GOBIERNO · SEGURIDAD · PRIVACIDAD · CALIDAD · TRAZABILIDAD</tspan>
</text>
<rect x="650" y="185" width="300" height="165" rx="18" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<circle cx="688" cy="227" r="23" fill="#2F6FB0" stroke="#2F6FB0" stroke-width="1"/>
<text x="688" y="235" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="688" dy="0">1</tspan>
</text>
<text x="725" y="234" fill="#2F6FB0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" style="">
<tspan x="725" dy="0">CAPTURA</tspan>
</text>
<text x="674" y="273" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="674" dy="0">Entrada: API o muestra</tspan>
<tspan x="674" dy="19.8">Artefacto: snapshot + fuente</tspan>
<tspan x="674" dy="19.8">Responsable: ingeniería</tspan>
</text>
<rect x="1120" y="290" width="300" height="165" rx="18" fill="#FFFFFF" stroke="#C98500" stroke-width="2" opacity="1" filter="url(#shadow)"/>
