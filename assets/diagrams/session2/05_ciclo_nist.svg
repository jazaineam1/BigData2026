<tspan x="70" dy="0">DISTINCIÓN ESENCIAL</tspan>
</text>
<text x="284.5" y="865" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" style="">
