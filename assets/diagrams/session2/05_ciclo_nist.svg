<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Ciclo analítico NIST aplicado a SECOP</title>
<desc id="desc">Cinco etapas conectadas alrededor de una decisión humana con artefactos, responsables y controles.</desc>
<defs>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
