<tspan x="328" dy="0">4</tspan>
</text>
<text x="365" y="649" fill="#167C80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" style="">
<tspan x="365" dy="0">VISUALIZACIÓN</tspan>
</text>
<text x="314" y="688" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="314" dy="0">Razón de prioridad + contexto</tspan>
<tspan x="314" dy="19.8">Artefacto: reporte / tablero</tspan>
<tspan x="314" dy="19.8">Responsable: BI</tspan>
</text>
<rect x="180" y="290" width="300" height="165" rx="18" fill="#FFFFFF" stroke="#E95C3A" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<circle cx="218" cy="332" r="23" fill="#E95C3A" stroke="#E95C3A" stroke-width="1"/>
<text x="218" y="340" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" style="">
<tspan x="218" dy="0">5</tspan>
</text>
<text x="255" y="339" fill="#E95C3A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" style="">
<tspan x="255" dy="0">ACCIÓN</tspan>
</text>
<text x="204" y="378" fill="#52697C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" style="">
<tspan x="204" dy="0">Revisar · corregir · escalar</tspan>
<tspan x="204" dy="19.8">Artefacto: decisión registrada</tspan>
<tspan x="204" dy="19.8">Responsable: negocio</tspan>
</text>
<circle cx="800" cy="492" r="135" fill="#12395B" stroke="#0D2B43" stroke-width="3" filter="url(#shadow)"/>
<text x="800" y="452" fill="#BFE4F6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle" style="">
<tspan x="800" dy="0">DECISIÓN SOPORTADA</tspan>
</text>
<text x="800" y="494" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle" style="">
<tspan x="800" dy="0">¿qué contrato revisar</tspan>
<tspan x="800" dy="26.45">primero y por qué?</tspan>
</text>
<rect x="682" y="562" width="236" height="38" rx="19" fill="#2A5878" stroke="#2A5878" stroke-width="1" opacity="1"/>
