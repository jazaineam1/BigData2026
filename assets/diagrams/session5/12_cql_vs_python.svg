<svg viewBox="0 0 560 146" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación CQL Console y Python"><style>.s5cqlpy-h{fill:#175c3c;}.s5cqlpy-hd{font:700 12px system-ui,sans-serif;fill:#fff;}.s5cqlpy-c{fill:#f4faf6;stroke:#175c3c;stroke-width:1;}.s5cqlpy-t{font:12px "IBM Plex Mono",monospace;fill:#123f2b;}</style><rect x="10" y="10" width="270.0" height="30" rx="6" class="s5cqlpy-h"/><text x="145.0" y="30" text-anchor="middle" class="s5cqlpy-hd">CQL Console</text><rect x="282.0" y="10" width="268.0" height="30" rx="6" class="s5cqlpy-h"/><text x="417.0" y="30" text-anchor="middle" class="s5cqlpy-hd">Python</text><rect x="10" y="44" width="270.0" height="30" class="s5cqlpy-c"/><text x="20" y="63" class="s5cqlpy-t">CREATE / INSERT / SELECT</text><rect x="282.0" y="44" width="268.0" height="30" class="s5cqlpy-c"/><text x="292.0" y="63" class="s5cqlpy-t">session.execute(...)</text><rect x="10" y="78" width="270.0" height="30" class="s5cqlpy-c"/><text x="20" y="97" class="s5cqlpy-t">misma tabla</text><rect x="282.0" y="78" width="268.0" height="30" class="s5cqlpy-c"/><text x="292.0" y="97" class="s5cqlpy-t">misma pregunta</text><rect x="10" y="112" width="270.0" height="30" class="s5cqlpy-c"/><text x="20" y="131" class="s5cqlpy-t">misma partition key</text><rect x="282.0" y="112" width="268.0" height="30" class="s5cqlpy-c"/><text x="292.0" y="131" class="s5cqlpy-t">mismo resultado esperado</text></svg>