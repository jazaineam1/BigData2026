<svg viewBox="0 0 520 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de flujo"><defs><marker id="s5hip-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#175c3c"/></marker></defs><style>.s5hip-b{fill:#f4faf6;stroke:#175c3c;stroke-width:2;}.s5hip-t{font:700 14px system-ui,sans-serif;fill:#123f2b;}.s5hip-s{font:12px system-ui,sans-serif;fill:#3a4a41;}</style><rect x="20" y="14" width="480" height="50" rx="10" class="s5hip-b"/><text x="260.0" y="36" text-anchor="middle" class="s5hip-t">Afirmación vaga</text><text x="260.0" y="54" text-anchor="middle" class="s5hip-s">“la prensa habla de estos contratos”</text><line x1="260.0" y1="64" x2="260.0" y2="94" stroke="#175c3c" stroke-width="2" marker-end="url(#s5hip-a)"/><rect x="20" y="94" width="480" height="50" rx="10" class="s5hip-b"/><text x="260.0" y="116" text-anchor="middle" class="s5hip-t">Hipótesis observable</text><text x="260.0" y="134" text-anchor="middle" class="s5hip-s">“aparece al menos un ID exacto”</text><line x1="260.0" y1="144" x2="260.0" y2="174" stroke="#175c3c" stroke-width="2" marker-end="url(#s5hip-a)"/><rect x="20" y="174" width="480" height="50" rx="10" class="s5hip-b"/><text x="260.0" y="196" text-anchor="middle" class="s5hip-t">Regla de comprobación</text><text x="260.0" y="214" text-anchor="middle" class="s5hip-s">buscar los 77 IDs en título + subtítulo</text></svg>