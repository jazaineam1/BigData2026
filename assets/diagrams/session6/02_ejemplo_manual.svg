<text x="130" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0b241c">Proceso 2024-001</text>
<text x="130" y="173" text-anchor="middle" font-size="12" fill="#3f4a44">nodo Proceso</text>

<rect x="440" y="130" width="220" height="56" rx="9" fill="#eef4ff" stroke="#3b5bab" stroke-width="2"/>
<text x="550" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0b241c">Proceso 2023-045</text>
<text x="550" y="173" text-anchor="middle" font-size="12" fill="#3f4a44">nodo Proceso</text>

<rect x="230" y="240" width="220" height="62" rx="9" fill="#f7ecc9" stroke="#c9a227" stroke-width="2.5"/>
<text x="340" y="266" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b241c">Constructora Ejemplo</text>
<text x="340" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b241c">S.A.S.</text>

