<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
<title id="t2">Ejemplo manual: un proveedor conecta dos entidades</title>
<desc id="d2">La Alcaldía de Ejemplo publica el Proceso 2024-001, adjudicado a Constructora Ejemplo S.A.S. La Gobernación de Prueba publica el Proceso 2023-045, también adjudicado a Constructora Ejemplo S.A.S. El mismo proveedor conecta a las dos entidades, aunque nunca tienen una relación directa entre sí.</desc>
<rect width="680" height="320" fill="#faf7f0"/>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#175c3c"/>
</marker>
</defs>

<rect x="20" y="20" width="220" height="56" rx="9" fill="#e3efe6" stroke="#175c3c" stroke-width="2"/>
<text x="130" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#0b241c">Alcaldía de Ejemplo</text>

<rect x="440" y="20" width="220" height="56" rx="9" fill="#e3efe6" stroke="#175c3c" stroke-width="2"/>
<text x="550" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#0b241c">Gobernación de Prueba</text>

