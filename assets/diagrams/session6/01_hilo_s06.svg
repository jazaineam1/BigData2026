<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
<title id="t1">Hilo del evaluador: de S3 a S6</title>
<desc id="d1">Cadena de cuatro sesiones. S3: evidencia documental. S4: persistencia compartida en Atlas. S5: bandeja priorizada, con la hipótesis H1 de prensa refutada 0 de 77. S6: contexto relacional, con la nueva hipótesis H2-R.</desc>
<rect width="640" height="470" fill="#faf7f0"/>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#175c3c"/>
</marker>
</defs>

<rect x="40" y="20" width="560" height="60" rx="10" fill="#e3efe6" stroke="#175c3c" stroke-width="2"/>
<text x="320" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#0b241c">S3 · Evidencia documental</text>

<line x1="320" y1="80" x2="320" y2="108" stroke="#175c3c" stroke-width="2.5" marker-end="url(#arrowhead)"/>

<rect x="40" y="110" width="560" height="60" rx="10" fill="#e3efe6" stroke="#175c3c" stroke-width="2"/>
<text x="320" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#0b241c">S4 · Persistencia compartida en Atlas</text>

<line x1="320" y1="170" x2="320" y2="198" stroke="#175c3c" stroke-width="2.5" marker-end="url(#arrowhead)"/>

<rect x="40" y="200" width="560" height="86" rx="10" fill="#e3efe6" stroke="#175c3c" stroke-width="2"/>
<text x="320" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#0b241c">S5 · Bandeja priorizada</text>
<text x="320" y="256" text-anchor="middle" font-size="14.5" fill="#3f4a44">H1 (prensa): 0/77 → refutada literalmente</text>
<text x="320" y="276" text-anchor="middle" font-size="14.5" fill="#3f4a44">produce el ancla que elige cada estudiante</text>

<line x1="320" y1="286" x2="320" y2="314" stroke="#175c3c" stroke-width="2.5" marker-end="url(#arrowhead)"/>

<rect x="40" y="316" width="560" height="130" rx="10" fill="#f7ecc9" stroke="#c9a227" stroke-width="2.5"/>
<text x="320" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#0b241c">S6 · Contexto relacional (Neo4j)</text>
<text x="320" y="374" text-anchor="middle" font-size="14.5" fill="#3f4a44">H2-R: ¿el proveedor más conectado del ancla</text>
<text x="320" y="394" text-anchor="middle" font-size="14.5" fill="#3f4a44">supera la mediana de sus pares (candidatas de S5)?</text>
<text x="320" y="422" text-anchor="middle" font-size="13" fill="#6b5100">Producto: ficha relacional + s06_contexto_procesos.jsonl → S7</text>
</svg>
