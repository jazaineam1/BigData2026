<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4" font-family="Arial, Helvetica, sans-serif">
<title id="t4">Representación del vecindario dibujado en Aura</title>
<desc id="d4">Representación conceptual, no una captura de Aura. La entidad ancla llega al proveedor a través de un proceso. Otras entidades llegan al mismo proveedor por sus propios procesos, hasta un máximo de ocho, mostrando que el proveedor conecta a varias entidades distintas.</desc>
<rect width="640" height="400" fill="#faf7f0"/>
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#175c3c"/>
</marker>
</defs>

<rect x="240" y="165" width="160" height="70" rx="10" fill="#f7ecc9" stroke="#c9a227" stroke-width="2.6"/>
<text x="320" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#0b241c">PROVEEDOR</text>

<rect x="20" y="165" width="160" height="70" rx="9" fill="#e3efe6" stroke="#175c3c" stroke-width="2.2"/>
<text x="100" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#0b241c">Entidad ancla</text>
<text x="100" y="214" text-anchor="middle" font-size="11.5" fill="#3f4a44">(tu proceso de S5)</text>
<line x1="182" y1="200" x2="236" y2="200" stroke="#175c3c" stroke-width="2.2" marker-end="url(#arrow4)"/>
<text x="209" y="192" text-anchor="middle" font-size="10.5" fill="#175c3c">proceso</text>

<rect x="460" y="30" width="160" height="60" rx="9" fill="#eef4ff" stroke="#3b5bab" stroke-width="2"/>
<text x="540" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b241c">Otra entidad 1</text>
<line x1="458" y1="80" x2="405" y2="170" stroke="#3b5bab" stroke-width="2" marker-end="url(#arrow4)"/>

<rect x="460" y="170" width="160" height="60" rx="9" fill="#eef4ff" stroke="#3b5bab" stroke-width="2"/>
<text x="540" y="205" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b241c">Otra entidad 2</text>
<line x1="458" y1="200" x2="404" y2="200" stroke="#3b5bab" stroke-width="2" marker-end="url(#arrow4)"/>

<rect x="460" y="310" width="160" height="60" rx="9" fill="#eef4ff" stroke="#3b5bab" stroke-width="2"/>
<text x="540" y="345" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b241c">Otra entidad 3</text>
<line x1="458" y1="320" x2="405" y2="232" stroke="#3b5bab" stroke-width="2" marker-end="url(#arrow4)"/>

<text x="540" y="285" text-anchor="middle" font-size="13" fill="#6b5100">… hasta 8 entidades</text>
<text x="320" y="285" text-anchor="middle" font-size="12.5" fill="#5c6b63">(cada flecha pasa por su propio nodo Proceso, omitido aquí por espacio)</text>
</svg>
