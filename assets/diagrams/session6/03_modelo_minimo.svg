<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3" font-family="Arial, Helvetica, sans-serif">
<title id="t3">Modelo mínimo de S6</title>
<desc id="d3">Una Entidad publica un Proceso mediante la relación PUBLICA; ese Proceso es adjudicado a un Proveedor mediante la relación ADJUDICADO_A.</desc>
<rect width="640" height="160" fill="#faf7f0"/>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#175c3c"/>
</marker>
</defs>

<rect x="20" y="45" width="160" height="66" rx="9" fill="#e3efe6" stroke="#175c3c" stroke-width="2.2"/>
<text x="100" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#0b241c">Entidad</text>

<line x1="182" y1="78" x2="236" y2="78" stroke="#175c3c" stroke-width="2.4" marker-end="url(#arrow3)"/>
<text x="209" y="66" text-anchor="middle" font-size="12.5" fill="#175c3c">PUBLICA</text>

<rect x="240" y="45" width="160" height="66" rx="9" fill="#eef4ff" stroke="#3b5bab" stroke-width="2.2"/>
<text x="320" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#0b241c">Proceso</text>

<line x1="402" y1="78" x2="456" y2="78" stroke="#a53828" stroke-width="2.4" marker-end="url(#arrow3)"/>
<text x="429" y="66" text-anchor="middle" font-size="11.5" fill="#a53828">ADJUDICADO_A</text>

<rect x="460" y="45" width="160" height="66" rx="9" fill="#f7ecc9" stroke="#c9a227" stroke-width="2.4"/>
<text x="540" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#0b241c">Proveedor</text>
</svg>
