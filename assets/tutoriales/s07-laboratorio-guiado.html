<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S07 · Checklist integral</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#faf7ef;color:#172019;margin:0}.wrap{max-width:980px;margin:auto;padding:28px}h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,56px);line-height:1}.lead{font-size:18px;line-height:1.45}.meter{height:10px;background:#e6e0d4;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#ffd600}.step{background:#fff;border:1px solid #e5dece;border-left:7px solid #146c43;border-radius:16px;padding:16px 18px;margin:12px 0}.step label{display:flex;gap:10px;align-items:flex-start;font-weight:800}.why{margin-left:28px;color:#5c6b63}.ev{margin:10px 0 0 28px;background:#eef5f0;border-radius:10px;padding:10px}.links{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.links a{background:#123f2b;color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:800}.warn{background:#fff6c9;border-left-color:#ffd600}@media(max-width:760px){.wrap{padding:18px}.step{padding:14px}.ev,.why{margin-left:0}}</style></head><body><div class="wrap"><h1>S07 · Checklist integral</h1><p class="lead">Usa esta lista durante la sesión. Marca solo lo que realmente completaste. El progreso queda guardado en este navegador.</p><div class="links"><a href="s07-recursos.html">Recursos</a><a href="../../Presentaciones/s07-del-vecindario-al-texto.html">Presentación</a><a target="_blank" href="https://colab.research.google.com/github/jazaineam1/BigData2026/blob/main/Cuadernos/7_Elasticsearch_BM25_Compras_Claras.ipynb">Cuaderno</a><a target="_blank" href="https://colab.research.google.com/github/jazaineam1/BigData2026/blob/main/Cuadernos/7B_Despliegue_Elastic_Cloud.ipynb">Despliegue</a></div><div class="meter"><i id="bar"></i></div><p><b id="done">0</b> de <span id="total"></span> pasos</p><div id="steps"></div></div><script>const data=[['Entiendo la pregunta de Laura','Diferencio relación, filtro y búsqueda textual.','Puedo explicar por qué S7 no repite S6.'],['Abrí el cuaderno principal','El notebook debe acompañar la presentación.','Tengo Colab abierto.'],['Cargué corpus','Usé JSONL de S6 o respaldo declarado.','Se ve origen y número de procesos.'],['Ejecuté contains','Vi coincidencias literales.','Puedo explicar por qué no ordena relevancia.'],['Revisé analyzer/tokens','Probé una frase propia.','Veo términos buscables.'],['Leí índice invertido','Término → documentos.','Identifico candidatos antes del score.'],['Ejecuté BM25 local','Consulta A produce ranking.','Hay top 5 con score.'],['Expliqué el top 1','Descompuse términos y aporte.','No acepté el score a ciegas.'],['Leí mapping','Distinguí text y keyword.','Sé por qué id_proceso es keyword.'],['Leí JSON de consulta','Entendí match y multi_match.','Puedo traducir la consulta a lenguaje natural.'],['Abrí guía de despliegue','Revisé endpoint/API key/índice/bulk.','Sé qué datos necesito para Elastic.'],['Conecté Elastic o declaré fallback','No inventé ejecución cloud.','Motor usado queda declarado.'],['Creé índice en Elastic','Solo si tengo conexión real.','Índice creado sin error.'],['Cargué documentos con bulk','Solo si tengo conexión real.','Documentos cargados reportados.'],['Ejecuté búsqueda Elastic','Solo si tengo conexión real.','Top 5 con _score/highlight.'],['Hice experimento A/B','Cambié una sola cosa.','Comparé ranking A vs B.'],['Identifiqué resultado dudoso','No todo resultado relevante es útil.','Escribí falso positivo o duda.'],['Declaré límite','Score no demuestra irregularidad.','Límite aparece en hito.'],['Generé CSV','Exporté resultados.','Archivo s07_resultados_busqueda.csv o s07_elastic_resultados.csv.'],['Generé hito','Defendí decisión, alternativa y límite.','Archivo Markdown creado.']];const root=document.getElementById('steps');root.innerHTML=data.map((x,i)=>`<div class="step ${i>=10?'warn':''}"><label><input type="checkbox" data-id="${i}"> ${i+1}. ${x[0]}</label><div class="why">${x[1]}</div><div class="ev"><b>Evidencia:</b> ${x[2]}</div></div>`).join('');const key='s07-checklist-integral-v1',boxes=[...document.querySelectorAll('input[type=checkbox]')],saved=JSON.parse(localStorage.getItem(key)||'{}');total.textContent=boxes.length;boxes.forEach(b=>{b.checked=!!saved[b.dataset.id];b.onchange=()=>{saved[b.dataset.id]=b.checked;localStorage.setItem(key,JSON.stringify(saved));upd()}});function upd(){const n=boxes.filter(b=>b.checked).length;done.textContent=n;bar.style.width=(100*n/boxes.length)+'%'}upd();</script></body></html>
