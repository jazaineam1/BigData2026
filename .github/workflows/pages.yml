name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - css/**
      - js/**
      - assets/**
      - Presentaciones/**
      - lms/**
      - Cuadernos/Taller_Control_1.ipynb
      - Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb
      - Cuadernos/10_ETL_Multimedia.ipynb
      - utils/validate_static_links.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node para SDK fijado
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Preparar Python para validación de enlaces
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar sitio estático
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/supabase-sdk
          mkdir -p /tmp/supabase-sdk
          npm pack @supabase/supabase-js@2.117.1 --pack-destination /tmp/supabase-sdk >/tmp/supabase-pack-name.txt
          tar -xzf "$(find /tmp/supabase-sdk -maxdepth 1 -name '*.tgz' -print -quit)" -C /tmp/supabase-sdk
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          cp -R Presentaciones _site/
          cp -R lms _site/
          mkdir -p _site/lms/assets/vendor
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/lms/assets/vendor/supabase.js
          test -s _site/lms/assets/vendor/supabase.js
          mkdir -p _site/Cuadernos
          cp Cuadernos/Taller_Control_1.ipynb _site/Cuadernos/
          cp Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb _site/Cuadernos/
          cp Cuadernos/10_ETL_Multimedia.ipynb _site/Cuadernos/
          test -f _site/lms/portal.html
          test -f _site/lms/account.html
          test -f _site/lms/session-08.html
          test -f _site/assets/tutoriales/s08-secoppipeline.html
          test -f _site/lms/teacher-wall.html
          test -f _site/lms/admin-users.html
          test -f _site/lms/teacher-course.html
          test -f _site/lms/assignments.html
          test -f _site/lms/gradebook.html
          test -f _site/lms/competencies.html
          test -f _site/lms/teacher-competencies.html
          test -f _site/lms/progress.html
          test -f _site/lms/teacher-analytics.html
          test -f _site/lms/collaboration.html
          test -f _site/lms/teacher-collaboration.html
          test -f _site/lms/quizzes.html
          test -f _site/lms/teacher-quizzes.html
          test -f _site/lms/teacher-interoperability.html
          test -f _site/lms/admin-operations.html
          test -f _site/lms/session.html
          test -f _site/lms/wall.html
          test -f _site/lms/session-09.html
          test -f _site/lms/progress-09.html
          test -f _site/lms/teacher-wall-09.html
          test -f _site/Presentaciones/s09-de-palabras-a-significado.html
          test -f _site/assets/tutoriales/s09-laboratorio-guiado.html
          test -f _site/Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb
          test -f _site/Presentaciones/s10-etl-multimedia.html
          test -f _site/Cuadernos/10_ETL_Multimedia.ipynb
          touch _site/.nojekyll

      - name: Validar enlaces locales del artefacto
        run: python utils/validate_static_links.py --root _site

      - name: Cargar artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test del sitio publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..20}; do
            html="$(curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}?v=${GITHUB_SHA}" || true)"
            module="$(curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}lms/session.html?s=9&v=${GITHUB_SHA}" || true)"
            account="$(curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}lms/account.html?v=${GITHUB_SHA}" || true)"
            client="$(curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}lms/assets/bigdata-lms.js?v=${GITHUB_SHA}" || true)"
            realtime_sdk="$(curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}lms/assets/vendor/supabase.js?v=${GITHUB_SHA}" || true)"
            if grep -q 'assets/img/bg-masthead.jpg' <<<"$html" \
              && ! grep -q 'Aprender haciendo, con evidencia' <<<"$html" \
              && ! grep -q 'Marcar revisada' <<<"$html" \
              && grep -q 'Material de la sesión' <<<"$module" \
              && grep -q 'Cambiar contraseña' <<<"$account" \
              && grep -q "bigdata-auth" <<<"$client" \
              && grep -q "bigdata-access-request" <<<"$client" \
              && grep -q "bigdata-access-review" <<<"$client" \
              && ! grep -q "learning-auth" <<<"$client" \
              && [ -n "$realtime_sdk" ]; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "El sitio publicado no coincide con el artefacto esperado después del despliegue."
            exit 1
          fi
          legacy="$(curl -fsS "${PAGE_URL}lms/session-09.html?v=${GITHUB_SHA}")"
          grep -q "session.html?" <<<"$legacy"

