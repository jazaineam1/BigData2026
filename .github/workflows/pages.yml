name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - css/**
      - js/**
      - assets/**
      - Presentaciones/**
      - lms/**
      - Cuadernos/Taller_Control_1.ipynb
      - Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar sitio estático
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          cp -R Presentaciones _site/
          cp -R lms _site/
          mkdir -p _site/Cuadernos
          cp Cuadernos/Taller_Control_1.ipynb _site/Cuadernos/
          cp Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb _site/Cuadernos/
          test -f _site/lms/portal.html
          test -f _site/lms/session-08.html
          test -f _site/assets/tutoriales/s08-secoppipeline.html
          test -f _site/lms/teacher-wall.html
          test -f _site/lms/admin-users.html
          test -f _site/lms/teacher-course.html
          test -f _site/lms/assignments.html
          test -f _site/lms/gradebook.html
          test -f _site/lms/competencies.html
          test -f _site/lms/teacher-competencies.html
          test -f _site/lms/progress.html
          test -f _site/lms/teacher-analytics.html
          test -f _site/lms/collaboration.html
          test -f _site/lms/teacher-collaboration.html
          test -f _site/lms/quizzes.html
          test -f _site/lms/teacher-quizzes.html
          test -f _site/lms/teacher-interoperability.html
          test -f _site/lms/admin-operations.html
          test -f _site/lms/session-09.html
          test -f _site/lms/teacher-wall-09.html
          test -f _site/Presentaciones/s09-de-palabras-a-significado.html
          test -f _site/assets/tutoriales/s09-laboratorio-guiado.html
          test -f _site/Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb
          touch _site/.nojekyll

      - name: Cargar artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
