name: Construir sesión 6

on:
  push:
    branches:
      - main
    paths:
      - utils/build_session6_graph_data.py
      - utils/build_session6_notebook.py
      - utils/validate_session6.py
      - utils/check_session6_execution.py
      - utils/build_session6_notebook_aprender_haciendo.py
      - utils/validate_session6_aprender_haciendo.py
      - utils/notebook_checks.py
      - utils/apply_session6_graphlab.py
      - utils/validate_session6_graphlab.py
      - utils/s06_graphlab_payload/**
      - assets/diagrams/session6/**
      - assets/tutoriales/s06-laboratorio-guiado.html
      - assets/tutoriales/neo4j-aura-s06-paso-a-paso.html
      - .github/workflows/build-session6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias de construcción
        run: python -m pip install -q pandas ipython nbformat

      - name: Comprobar sintaxis de generadores y Graph Lab
        run: |
          python -m py_compile \
            utils/build_session6_graph_data.py \
            utils/build_session6_notebook.py \
            utils/validate_session6.py \
            utils/apply_session6_graphlab.py \
            utils/validate_session6_graphlab.py

      - name: Construir extracto relacional desde S5 y SECOP
        run: python utils/build_session6_graph_data.py

      - name: Generar notebooks base S6
        run: |
          python utils/build_session6_notebook.py
          python utils/build_session6_notebook_aprender_haciendo.py

      - name: Validar regresiones de la sesión base
        run: |
          python utils/validate_session6.py
          python utils/validate_session6_aprender_haciendo.py
          python utils/check_session6_execution.py

      - name: Aplicar mejora visual Graph Lab
        run: python utils/apply_session6_graphlab.py

      - name: Validar edición final Graph Lab
        run: python utils/validate_session6_graphlab.py

      - name: Publicar artefactos generados
        shell: bash
        run: |
          CAMBIOS="$(git status --porcelain -- Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Cuadernos/6_Neo4j_Contexto_Relacional_AprenderHaciendo.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json assets/tutoriales/s06-laboratorio-guiado.html assets/tutoriales/neo4j-aura-s06-paso-a-paso.html)"
          if [ -z "$CAMBIOS" ]; then
            echo 'S6 ya estaba sincronizada.'
            exit 0
          fi
          printf '%s\n' "$CAMBIOS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Cuadernos/6_Neo4j_Contexto_Relacional_AprenderHaciendo.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json assets/tutoriales/s06-laboratorio-guiado.html assets/tutoriales/neo4j-aura-s06-paso-a-paso.html
          git commit -m 'Regenera S06 con Graph Lab visual'
          git push
