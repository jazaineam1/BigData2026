name: Construir sesión 6

on:
  push:
    branches:
      - main
    paths:
      - utils/build_session6_graph_data.py
      - utils/build_session6_notebook.py
      - utils/validate_session6.py
      - utils/validate_session6_graphlab_runtime.py
      - utils/check_session6_execution.py
      - utils/build_session6_notebook_aprender_haciendo.py
      - utils/validate_session6_aprender_haciendo.py
      - utils/notebook_checks.py
      - utils/apply_session6_graphlab_upgrade.py
      - utils/session6_graphlab_enhancements.py
      - assets/diagrams/session6/**
      - assets/tutoriales/s06-laboratorio-guiado.html
      - assets/tutoriales/neo4j-aura-s06-paso-a-paso.html
      - assets/tutoriales/neo4j-graph-lab-s06.html
      - .github/workflows/build-session6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias de construcción
        run: python -m pip install -q pandas ipython nbformat

      - name: Aplicar mejora Graph Lab al generador
        shell: bash
        run: |
          python utils/apply_session6_graphlab_upgrade.py
          python - <<'PY'
          from pathlib import Path
          path = Path("utils/session6_graphlab_enhancements.py")
          text = path.read_text(encoding="utf-8")
          old_alias = 'put(c,s(c).replace("p.valor AS precio_base","p.precio_base AS precio_base"))'
          new_alias = 'put(c,s(c).replace("p.valor AS precio_base","p.precio_base AS precio_base").replace("ORDER BY entidad, valor DESC","ORDER BY entidad, precio_base DESC"))'
          if old_alias in text:
              text = text.replace(old_alias, new_alias)
              print("[OK] Corregido alias de ordenamiento del vecindario Graph Lab")
          elif "ORDER BY entidad, precio_base DESC" in text:
              print("[OK] Alias Graph Lab ya estaba corregido")
          else:
              raise SystemExit("No se encontró el punto de parche del alias Graph Lab")
          old_checklist = 'html=p.read_text(encoding="utf-8"); data=json.loads(html.split("const DATA = ",1)[1].split(";\\nconst DATA2",1)[0]); pasos=data[0]["pasos"]\n    ids={"ancla","graph","grado","wow","wow2","entrega"}'
          checklist_lines = ['html=p.read_text(encoding="utf-8"); data=json.loads(html.split("const DATA = ",1)[1].split(";\\nconst DATA2",1)[0]); pasos=data[0]["pasos"]', '    for paso in pasos:', '        if paso.get("id")=="patron":', '            paso["tipo"]="decide"', '            paso["titulo"]="Completa el patrón contractual"', '            paso["explicacion"]="El ID del proceso identifica un nodo; el tipo de relación identifica la flecha."', '            paso["instruccion"]="Completa el hueco con ADJUDICADO_A y ejecuta la validación antes de continuar."', '            paso["evidencia"]="Patrón correcto: ADJUDICADO_A expresa una adjudicación observada."', '    ids={"ancla","graph","grado","wow","wow2","entrega"}']
          new_checklist = "\n".join(checklist_lines)
          if old_checklist in text:
              text = text.replace(old_checklist, new_checklist)
              print("[OK] Checklist alineado con el ejercicio editable ADJUDICADO_A")
          elif 'paso["titulo"]="Completa el patrón contractual"' in text:
              print("[OK] Checklist del patrón ya estaba alineado")
          else:
              raise SystemExit("No se encontró el punto de parche del checklist Graph Lab")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Comprobar sintaxis de generadores
        run: |
          python -m py_compile \
            utils/build_session6_graph_data.py \
            utils/build_session6_notebook.py \
            utils/validate_session6.py \
            utils/validate_session6_graphlab_runtime.py \
            utils/session6_graphlab_enhancements.py \
            utils/apply_session6_graphlab_upgrade.py

      - name: Construir extracto relacional desde S5 y SECOP
        run: python utils/build_session6_graph_data.py

      - name: Generar notebook S6
        run: |
          python utils/build_session6_notebook.py
          python utils/build_session6_notebook_aprender_haciendo.py

      - name: Validar datos, notebook y tutorial
        run: |
          python utils/validate_session6.py
          python utils/validate_session6_graphlab_runtime.py
          python utils/validate_session6_aprender_haciendo.py
          python utils/check_session6_execution.py

      - name: Publicar artefactos generados
        shell: bash
        run: |
          CAMBIOS="$(git status --porcelain -- utils/build_session6_notebook.py utils/session6_graphlab_enhancements.py Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Cuadernos/6_Neo4j_Contexto_Relacional_AprenderHaciendo.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json assets/tutoriales/s06-laboratorio-guiado.html assets/tutoriales/neo4j-graph-lab-s06.html)"
          if [ -z "$CAMBIOS" ]; then
            echo 'S6 ya estaba sincronizada.'
            exit 0
          fi
          printf '%s\n' "$CAMBIOS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/build_session6_notebook.py utils/session6_graphlab_enhancements.py Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Cuadernos/6_Neo4j_Contexto_Relacional_AprenderHaciendo.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json assets/tutoriales/s06-laboratorio-guiado.html assets/tutoriales/neo4j-graph-lab-s06.html
          git commit -m 'Mejora sesión 6 con Graph Lab y visualización Aura'
          git push
