name: Construir sesión 6

on:
  push:
    branches:
      - main
    paths:
      - utils/build_session6_graph_data.py
      - utils/build_session6_notebook.py
      - utils/validate_session6.py
      - assets/tutoriales/neo4j-aura-s06-paso-a-paso.html
      - .github/workflows/build-session6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias de construcción
        run: python -m pip install -q pandas

      - name: Comprobar sintaxis de generadores
        run: python -m py_compile utils/build_session6_graph_data.py utils/build_session6_notebook.py utils/validate_session6.py

      - name: Construir extracto relacional desde S5 y SECOP
        run: python utils/build_session6_graph_data.py

      - name: Generar notebook S6
        run: python utils/build_session6_notebook.py

      - name: Validar datos, notebook y tutorial
        run: python utils/validate_session6.py

      - name: Publicar artefactos generados
        shell: bash
        run: |
          CAMBIOS="$(git status --porcelain -- Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json)"
          if [ -z "$CAMBIOS" ]; then
            echo 'S6 ya estaba sincronizada.'
            exit 0
          fi
          printf '%s\n' "$CAMBIOS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json
          git commit -m 'Regenera sesión 6 desde la bandeja de Laura'
          git push
