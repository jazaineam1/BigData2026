name: Construir sesión 6

on:
  push:
    branches:
      - main
      - s06-novatos-v3
      - s06-zero-to-hero-cypher-v5
    paths:
      - utils/build_session6_graph_data.py
      - utils/build_session6_notebook.py
      - utils/build_session6_novice.py
      - utils/session6_graphlab_enhancements.py
      - utils/session6_novice_finalize.py
      - utils/session6_zero_to_hero.py
      - utils/session6_zero_to_hero_order.py
      - utils/session6_advanced_ecosystem.py
      - utils/validate_session6.py
      - utils/validate_session6_beginner.py
      - utils/validate_session6_graphlab_runtime.py
      - utils/validate_session6_degree_visual.py
      - utils/check_session6_execution.py
      - utils/notebook_checks.py
      - assets/diagrams/session6/**
      - assets/tutoriales/s06-laboratorio-guiado.html
      - assets/tutoriales/neo4j-aura-s06-paso-a-paso.html
      - assets/tutoriales/neo4j-graph-lab-s06.html
      - .github/workflows/build-session6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias de construcción
        run: python -m pip install -q pandas ipython nbformat

      - name: Comprobar sintaxis editorial
        run: |
          python -m py_compile \
            utils/build_session6_graph_data.py \
            utils/build_session6_notebook.py \
            utils/build_session6_novice.py \
            utils/session6_graphlab_enhancements.py \
            utils/session6_novice_finalize.py \
            utils/session6_zero_to_hero.py \
            utils/session6_zero_to_hero_order.py \
            utils/session6_advanced_ecosystem.py \
            utils/validate_session6.py \
            utils/validate_session6_beginner.py \
            utils/validate_session6_graphlab_runtime.py \
            utils/validate_session6_degree_visual.py \
            utils/check_session6_execution.py

      - name: Construir extracto relacional
        run: python utils/build_session6_graph_data.py

      - name: Generar notebook S6 zero-to-hero
        run: python utils/build_session6_novice.py

      - name: Validar S6
        run: |
          python utils/validate_session6.py
          python utils/validate_session6_beginner.py
          python utils/validate_session6_graphlab_runtime.py
          python utils/validate_session6_degree_visual.py
          python utils/check_session6_execution.py

      - name: Publicar artefactos generados
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          CAMBIOS="$(git status --porcelain -- Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json)"
          if [ -z "$CAMBIOS" ]; then
            echo 'S6 ya estaba sincronizada.'
            exit 0
          fi
          printf '%s\n' "$CAMBIOS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/6_Neo4j_Contexto_Relacional.ipynb Datos/s06_contexto_relacional.csv Datos/s06_contexto_relacional_manifest.json
          git commit -m 'Regenera sesión 6 zero-to-hero de Neo4j y Cypher'

          # main puede avanzar mientras corre CI (por ejemplo, cambios en otro taller).
          # Rebasamos el commit generado sobre el tip remoto para no pisar trabajo paralelo.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
