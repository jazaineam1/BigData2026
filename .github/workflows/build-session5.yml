name: Construir sesión 5

on:
  push:
    branches:
      - main
    paths:
      - utils/build_session5_notebook.py
      - utils/normalize_session5_for_improve.py
      - utils/improve_session5_v2.py
      - utils/improve_session5_v3.py
      - utils/fix_session5_assets.py
      - utils/validate_session5_v2.py
      - utils/validate_session5_v3.py
      - assets/tutoriales/atlas-s05-pipelines-vistas-v2.html
      - assets/tutoriales/astra-cassandra-paso-a-paso-v2.html
      - evaluaciones/quiz_sesiones_1_a_4_borrador.md
      - .github/workflows/build-session5.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir base del notebook S5
        run: python utils/build_session5_notebook.py

      - name: Normalizar marcadores para la auditoría
        run: python utils/normalize_session5_for_improve.py

      - name: Aplicar auditoría integral S5
        run: python utils/improve_session5_v2.py

      - name: Alinear S5 con el hilo S3 a S6
        run: python utils/improve_session5_v3.py

      - name: Ajustar assets deterministas
        run: python utils/fix_session5_assets.py

      - name: Validar sesión 5
        run: |
          python utils/validate_session5_v2.py
          python utils/validate_session5_v3.py

      - name: Publicar artefactos regenerados
        shell: bash
        run: |
          if git diff --quiet -- Cuadernos/5_Atlas_Cassandra_Query_First.ipynb assets/tutoriales/astra-cassandra-paso-a-paso-v2.html; then
            echo 'S5 y sus assets ya estaban sincronizados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/5_Atlas_Cassandra_Query_First.ipynb assets/tutoriales/astra-cassandra-paso-a-paso-v2.html
          git commit -m 'Regenera S5 con puente explícito a Neo4j'
          git push
