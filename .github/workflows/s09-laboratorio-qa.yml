name: S09 - Laboratorio reproducible
on:
  pull_request:
    paths:
      - "utils/build_session9_notebook.py"
      - "Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb"
      - "utils/qa_s09_notebook.py"
      - "utils/qa_s09_deck.cjs"
      - "utils/s09_current_contract.py"
      - "utils/test_s09_current_contract.py"
      - "Presentaciones/s09-de-palabras-a-significado.html"
      - ".github/workflows/s09-laboratorio-qa.yml"
      - "tests/s09-p0.visual.spec.js"
      - "tests/s09-implementation.visual.spec.js"
      - "playwright.s09.config.cjs"
      - "assets/tutoriales/s09-laboratorio-guiado.html"
  workflow_dispatch:

concurrency:
  group: qa-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebook:
    name: Esquema, busqueda, evaluacion y transferencia
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependencias de prueba (sin descargar E5)
        run: python -m pip install numpy pandas ipython
      - name: Validar contrato actual y rechazos negativos
        run: python utils/test_s09_current_contract.py
      - name: Validar cuaderno Atlas, ruta local e indice de UI simulado
        run: python utils/qa_s09_notebook.py
      - name: Validar las 35 diapositivas y la secuencia Atlas UI
        run: node utils/qa_s09_deck.cjs

  visual:
    name: Legibilidad, navegación y tutorial S09
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verificar presentación y tutorial en portátil y móvil
        run: npx playwright test --config=playwright.s09.config.cjs
