name: MatchLab - auditoria jugadores y escudos
on:
  push:
    branches: [main]
    paths:
      - matchlab/design_probe.py
      - .github/workflows/matchlab-design-probe.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python matchlab/design_probe.py
