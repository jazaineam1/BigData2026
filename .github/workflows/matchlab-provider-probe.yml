name: MatchLab · prueba controlada de proveedor
on:
  push:
    branches: [main]
    paths:
      - matchlab/provider_probe.py
      - .github/workflows/matchlab-provider-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar esquema y cobertura
        run: python matchlab/provider_probe.py
