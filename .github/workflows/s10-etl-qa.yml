name: S10 ETL de imágenes
on:
  pull_request:
    paths:
      - 'Presentaciones/s10-etl-multimedia.html'
      - 'Cuadernos/10_ETL_Multimedia.ipynb'
      - 'assets/tutoriales/s10*'
      - 'laboratorios/s10_etl_imagenes/**'
      - 'utils/*s10*'
      - 'utils/*session10*'
      - 'tests/s10-presentation.visual.spec.js'
      - 'playwright.s10.config.cjs'
      - 'infraestructura/lms/s10-multimedia-seed.sql'
      - 'infraestructura/lms/functions/bigdata-session/index.ts'
      - '.github/workflows/s10-etl-qa.yml'
      - 'index.html'
      - 'lms/data/course.json'
permissions:
  contents: read
jobs:
  material-y-lms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python utils/validate_session10.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.s10.config.cjs
      - run: npm install --prefix /tmp/s10-db-qa --no-audit --no-fund @electric-sql/pglite@0.3.14 typescript@5.9.3
      - run: S10_QA_MODULES=/tmp/s10-db-qa/node_modules node utils/test_s10_lms.cjs
      # Ejecución E/T/L real del cuaderno completo en Python limpio.
      # Entradas file:// del checkout PR: no dependen del main publicado
      # ni solicitan de nuevo fotos a sitios de noticias. Sin Drive ni Atlas.
      - name: Instalar dependencias del cuaderno para ejecución real
        run: python -m pip install "pillow==12.2.0" "pandas==2.2.3" "pyarrow==26.0.0" "ipython>=8.20,<10"
      - name: E/T/L completo con ocho imágenes reales + restauración
        run: python utils/validate_s10_notebook_runtime.py --origen "file://${{ github.workspace }}/" --salida /tmp/qa-s10-8 --cantidad 8
      - name: E/T/L completo con 32 imágenes reales y relectura
        run: python utils/validate_s10_notebook_runtime.py --origen "file://${{ github.workspace }}/" --salida /tmp/qa-s10-32 --cantidad 32
      - name: Comprobar salidas, fila propia y prueba de integridad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for n in (8, 32):
              r = json.loads(Path(f'/tmp/qa-s10-{n}/report.json').read_text(encoding='utf-8'))
              assert r['ok'] and r['images']==n and r['rows']==2*n
              assert r['load_repeated'] and r['closed_decision_validated']
              assert r['restore_verified'] and r['corrupted_derived_detected']
              assert r['corrupted_derived_recovered']
              print('S10 REAL VALIDADO',n,'imágenes,',r['rows'],'filas',r['seconds'],'segundos')
          PY
