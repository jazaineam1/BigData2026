name: Datos S10 El Tiempo · RAW y derivados
on:
  pull_request:
    paths:
      - 'Datos/S10_Eltiempo_fotos/**'
      - 'utils/validate_s10_eltiempo_layout.py'
      - '.github/workflows/s10-eltiempo-layout-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=10,<13"
      - run: python utils/validate_s10_eltiempo_layout.py
