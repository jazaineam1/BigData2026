name: Reparar JSON de la sesión 5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-s5-notebook-json.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Diagnosticar y reparar JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          p = Path('Cuadernos/5_Atlas_Cassandra_Query_First.ipynb')
          raw = p.read_text(encoding='utf-8')

          print('Longitud original:', len(raw))
          print('Contexto original 6100:6260:', repr(raw[6100:6260]))

          # En JSON solo son válidos estos escapes: \" \\ \/ \b \f \n \r \t \uXXXX.
          invalid = list(re.finditer(r'\\([^"\\/bfnrtu])', raw))
          print('Escapes JSON inválidos detectados:', len(invalid))
          for m in invalid[:20]:
              pos = m.start()
              print(' - pos', pos, '=>', repr(raw[max(0,pos-45):pos+70]))

          # Eliminar únicamente la barra invertida de escapes que JSON no reconoce.
          repaired = re.sub(r'\\([^"\\/bfnrtu])', r'\1', raw)

          try:
              data = json.loads(repaired)
          except json.JSONDecodeError as e:
              print('ERROR tras reparar escapes:', e)
              print('Contexto del error:', repr(repaired[max(0,e.pos-100):e.pos+140]))
              raise

          assert data.get('nbformat') == 4
          assert len(data.get('cells', [])) >= 35

          p.write_text(
              json.dumps(data, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )
          print('JSON válido. Celdas:', len(data['cells']))
          PY

      - name: Ejecutar validador de la sesión 5
        run: python utils/validate_session5_notebook.py

      - name: Publicar reparación
        shell: bash
        run: |
          if git diff --quiet -- Cuadernos/5_Atlas_Cassandra_Query_First.ipynb; then
            echo 'No hubo cambios.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/5_Atlas_Cassandra_Query_First.ipynb
          git commit -m 'Repara JSON del cuaderno de la sesión 5'
          git push
