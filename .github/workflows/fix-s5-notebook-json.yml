name: Reparar JSON de la sesión 5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-s5-notebook-json.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Reparar las dos celdas dañadas y validar JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          p = Path('Cuadernos/5_Atlas_Cassandra_Query_First.ipynb')
          raw = p.read_text(encoding='utf-8')

          mongo_source = '''!pip install -q pymongo dnspython

          from getpass import getpass
          from urllib.parse import quote_plus
          from pymongo import MongoClient

          uri_pegada = input("Pega tu URI de Atlas (Connect/Drivers): ").strip()
          usuario = input("Usuario de base de datos: ").strip()
          contrasena = quote_plus(getpass("Contraseña (no se muestra): "))

          uri = uri_pegada
          if "<db_username>" in uri:
              uri = uri.replace("<db_username>", quote_plus(usuario))
          if "<db_password>" in uri:
              uri = uri.replace("<db_password>", contrasena)

          try:
              client = MongoClient(uri, serverSelectionTimeoutMS=7000)
              client.admin.command("ping")
              db = client["compras_claras"]
              motor_atlas = "Atlas real"
              print("Conectado.")
              print("noticias:", db["noticias"].count_documents({}))
              print("entidades_noticias:", db["entidades_noticias"].count_documents({}))
          except Exception as error:
              db = None
              motor_atlas = "respaldo por archivos"
              print("No se pudo conectar:", type(error).__name__)
              print("La clase puede continuar con el respaldo; esto NO reemplaza la evidencia de haber creado la vista en Atlas.")

          print("Modo:", motor_atlas)'''
          mongo_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in mongo_source.splitlines())

          pat_mongo = re.compile(
              r'"source":"!pip install -q pymongo dnspython.*?print\(\\"Modo:\\", motor_atlas\)"'
          )
          raw, n_mongo = pat_mongo.subn(
              lambda _: '"source":' + json.dumps(mongo_source, ensure_ascii=False),
              raw,
              count=1,
          )
          print('Celda Mongo reparada:', n_mongo)

          astra_source = '''from getpass import getpass
          from datetime import date
          from cassandra.cluster import Cluster
          from cassandra.auth import PlainTextAuthProvider

          try:
              from google.colab import files
              print("Sube el Secure Connect Bundle (.zip) de ESTA base:")
              subidos = files.upload()
              scb = list(subidos.keys())[0]
          except ImportError:
              scb = input("Ruta al Secure Connect Bundle (.zip): ").strip()

          token_astra = getpass("Application token de Astra (no se muestra): ")

          cluster = Cluster(
              cloud={"secure_connect_bundle": scb},
              auth_provider=PlainTextAuthProvider("token", token_astra),
          )
          session = cluster.connect()

          row = session.execute("SELECT release_version FROM system.local").one()
          print("Conectado. Cassandra:", row[0] if row else "versión no disponible")'''
          astra_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in astra_source.splitlines())

          pat_astra = re.compile(
              r'"source":"from getpass import getpass\\nfrom datetime import date\\nfrom cassandra\.cluster import Cluster.*?print\(\\"Conectado\. Cassandra:\\", row\[0\] if row else \\"versión no disponible\\"\)"'
          )
          raw, n_astra = pat_astra.subn(
              lambda _: '"source":' + json.dumps(astra_source, ensure_ascii=False),
              raw,
              count=1,
          )
          print('Celda Astra reparada:', n_astra)

          if n_mongo != 1 or n_astra != 1:
              raise SystemExit('No se localizaron exactamente las dos celdas dañadas.')

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print('ERROR JSON:', e)
              print('Contexto:', repr(raw[max(0, e.pos-120):e.pos+180]))
              raise

          assert data.get('nbformat') == 4
          assert len(data.get('cells', [])) >= 35

          p.write_text(
              json.dumps(data, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )
          print('JSON válido. Celdas:', len(data['cells']))
          PY

      - name: Ejecutar validador de la sesión 5
        run: python utils/validate_session5_notebook.py

      - name: Publicar reparación
        shell: bash
        run: |
          if git diff --quiet -- Cuadernos/5_Atlas_Cassandra_Query_First.ipynb; then
            echo 'No hubo cambios.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cuadernos/5_Atlas_Cassandra_Query_First.ipynb
          git commit -m 'Repara JSON del cuaderno de la sesión 5'
          git push
