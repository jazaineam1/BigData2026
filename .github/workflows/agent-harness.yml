name: Validar Agent Harness

on:
  pull_request:
    paths:
      - '.harness/**'
      - 'utils/harness/**'
      - 'tests/harness/**'
      - 'docs/AGENT_HARNESS.md'
      - '.github/workflows/agent-harness.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - '.harness/**'
      - 'utils/harness/**'
      - 'tests/harness/**'
      - 'docs/AGENT_HARNESS.md'
      - '.github/workflows/agent-harness.yml'
      - '.gitignore'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compilar harness
        run: python -m py_compile utils/harness/*.py
      - name: Validar contratos y DAG
        run: python -m utils.harness.cli validate
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests/harness -p 'test_*.py' -v
      - name: Simular plan multiagente
        run: python -m utils.harness.cli plan session-improvement.yaml --goal "CI smoke test"
      - name: Ejecutar pipeline E2E sin modelos
        run: |
          python -m utils.harness.cli run session-improvement.yaml \
            --goal "Prueba E2E del harness: validar orquestación sin cambios reales" \
            --provider dry_run \
            --approval L2 \
            --run-id ci-e2e \
            --cleanup
          cat .agent-runs/ci-e2e/final.json
