name: S11 · ETL integral de imágenes y audio (QA)

on:
  pull_request:
    paths:
      - 'Cuadernos/11_ETL_Audio_Imagenes.ipynb'
      - 'Presentaciones/s11-etl-audio-imagenes.html'
      - 'utils/s11_etl_core.py'
      - 'utils/s11_noticia_imagen.py'
      - 'utils/s11_audio_noticia.py'
      - 'tests/test_s11_etl_audio_noticia.py'
      - 'tests/test_s11_etl_noticia.py'
      - 'tests/test_s11_etl_live.py'
      - 'assets/s11/etl-live.html'
      - 'utils/s11_live_dashboard.py'
      - 'utils/s11_etl_live.py'
      - 'utils/s11_lesson_cells.json'
      - 'utils/build_session11_etl_audio_imagenes.py'
      - 'utils/validate_session11_etl.py'
      - 'tests/test_s11_etl.py'
      - 'tests/test_s11_etl_motor_cache.py'
      - 'tests/s11-etl.visual.spec.js'
      - 'playwright.s11.config.cjs'
      - 'lms/data/course.json'
      - 'index.html'
      - '.github/workflows/s11-etl-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Cuadernos/11_ETL_Audio_Imagenes.ipynb'
      - 'Presentaciones/s11-etl-audio-imagenes.html'
      - 'utils/s11_etl_core.py'
      - 'utils/s11_noticia_imagen.py'
      - 'utils/s11_audio_noticia.py'
      - 'tests/test_s11_etl_audio_noticia.py'
      - 'tests/test_s11_etl_noticia.py'
      - 'tests/test_s11_etl_live.py'
      - 'assets/s11/etl-live.html'
      - 'utils/s11_live_dashboard.py'
      - 'utils/s11_etl_live.py'
      - 'utils/s11_lesson_cells.json'
      - 'utils/build_session11_etl_audio_imagenes.py'
      - 'utils/validate_session11_etl.py'
      - 'tests/test_s11_etl.py'
      - 'tests/test_s11_etl_motor_cache.py'
      - 'tests/s11-etl.visual.spec.js'
      - 'playwright.s11.config.cjs'
permissions:
  contents: read

jobs:
  contrato-y-unidades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas necesarias
        run: python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "pandas>=2.2,<3" "pyarrow>=17,<24" "soundfile>=0.12,<1" "scipy>=1.13,<2" "matplotlib>=3.8,<4" "ipython>=8" "ipywidgets>=8,<9" "scikit-learn>=1.5,<2"
      - name: Generador, estructura y sintaxis del cuaderno
        run: python utils/validate_session11_etl.py
      - name: Lote sintético integral sin red, idempotencia, ZIP y controles negativos
        run: python -m unittest discover -s tests -p 'test_s11_etl*.py' -v
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.s11.config.cjs
