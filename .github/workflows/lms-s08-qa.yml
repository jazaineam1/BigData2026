name: Validar LMS Big Data

on:
  push:
    branches:
      - main
      - feat/bigdata-lms-s08
    paths:
      - index.html
      - lms/**
      - infraestructura/lms/**
      - utils/validate_lms_s08.py
      - utils/validate_lms_admin.py
      - utils/validate_lms_core.py
      - utils/validate_lms_gradebook.py
      - utils/validate_lms_competencies.py
      - utils/validate_lms_analytics.py
      - utils/validate_lms_collaboration.py
      - utils/validate_tc1_v4.py
      - utils/tc1_validator.py
      - utils/build_taller_control_1.py
      - Cuadernos/Taller_Control_1.ipynb
      - Talleres/Taller_Control_1.md
      - assets/tutoriales/s08-secoppipeline.html
      - Presentaciones/s07-del-vecindario-al-texto.html
      - .github/workflows/lms-s08-qa.yml
  pull_request:
    paths:
      - index.html
      - lms/**
      - infraestructura/lms/**
      - utils/validate_lms_s08.py
      - utils/validate_lms_admin.py
      - utils/validate_lms_core.py
      - utils/validate_lms_gradebook.py
      - utils/validate_lms_competencies.py
      - utils/validate_lms_analytics.py
      - utils/validate_lms_collaboration.py
      - Presentaciones/s07-del-vecindario-al-texto.html
      - .github/workflows/lms-s08-qa.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis de validadores
        run: python -m py_compile utils/validate_lms_s08.py utils/validate_lms_admin.py utils/validate_lms_core.py utils/validate_lms_gradebook.py utils/validate_lms_competencies.py utils/validate_lms_analytics.py utils/validate_lms_collaboration.py utils/validate_tc1_v4.py utils/tc1_validator.py utils/build_taller_control_1.py
      - name: Validar LMS S08 y guardia S07
        run: python utils/validate_lms_s08.py
      - name: Validar administrador docente
        run: python utils/validate_lms_admin.py
      - name: Validar columna vertebral LMS
        run: python utils/validate_lms_core.py
      - name: Validar Gradebook
        run: python utils/validate_lms_gradebook.py
      - name: Validar competencias
        run: python utils/validate_lms_competencies.py
      - name: Validar analítica
        run: python utils/validate_lms_analytics.py
      - name: Validar colaboración
        run: python utils/validate_lms_collaboration.py
      - name: Verificar notebook reproducible
        run: |
          cp Cuadernos/Taller_Control_1.ipynb /tmp/Taller_Control_1.ipynb
          python utils/build_taller_control_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("/tmp/Taller_Control_1.ipynb").read_text(encoding="utf-8"))
          rebuilt=json.loads(Path("Cuadernos/Taller_Control_1.ipynb").read_text(encoding="utf-8"))
          assert original==rebuilt, "El notebook generado no coincide semánticamente con el versionado"
          print("Notebook reproducible: OK")
          PY
      - name: Validar TC1 V4
        run: python utils/validate_tc1_v4.py
