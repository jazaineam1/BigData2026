permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Comprobar sintaxis de validadores
        run: python -m py_compile utils/validate_lms_s08.py utils/validate_lms_admin.py utils/validate_lms_core.py utils/validate_lms_gradebook.py utils/validate_lms_competencies.py utils/validate_lms_analytics.py utils/validate_lms_collaboration.py utils/validate_lms_assessment.py utils/validate_lms_interop.py utils/validate_lms_ops.py utils/validate_tc1_v4.py utils/test_tc1_v4_synthetic.py utils/tc1_validator.py utils/build_taller_control_1.py utils/build_session9_notebook.py utils/validate_session9.py utils/validate_s09_authentic_evidence.py utils/validate_s09_competency_evidence.py utils/validate_s09_transfer_evidence.py utils/validate_s09_distractors.py utils/validate_lms_v3.py utils/validate_lms_evidence_v4.py utils/validate_lms_contract_v5.py utils/validate_lms_security_v51.py utils/validate_lms_auth_expiry.py utils/validate_auth_rate_limit.py utils/validate_lms_v6.py utils/validate_realtime_scale.py utils/validate_lms_v7.py utils/validate_lms_v8.py utils/validate_lms_auto_snapshot.py utils/validate_access_review_safety.py utils/validate_student_ux_simple.py utils/validate_october_schedule.py utils/validate_index_calendar.py utils/validate_no_open_student.py utils/validate_static_links.py utils/validate_production_release.py
      - name: Validar LMS S08 y guardia S07
        run: python utils/validate_lms_s08.py
      - name: Instalar dependencias QA TC1
        run: pip install -q pandas networkx
      - name: Probar TC1 con caso sintético 100/100
        run: python utils/test_tc1_v4_synthetic.py
      - name: Verificar notebook reproducible
        run: |
          cp Cuadernos/Taller_Control_1.ipynb /tmp/Taller_Control_1.ipynb
          python utils/build_taller_control_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("/tmp/Taller_Control_1.ipynb").read_text(encoding="utf-8"))
          rebuilt=json.loads(Path("Cuadernos/Taller_Control_1.ipynb").read_text(encoding="utf-8"))
          assert original==rebuilt, "El notebook generado no coincide semánticamente con el versionado"
          print("Notebook reproducible: OK")
          PY
      - name: Validar recurso TC1
        run: python utils/validate_tc1_v4.py
      - name: Verificar notebook S09 reproducible
        run: |
          cp Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb /tmp/S09.ipynb
          python utils/build_session9_notebook.py
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("/tmp/S09.ipynb").read_text(encoding="utf-8"))
          rebuilt=json.loads(Path("Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb").read_text(encoding="utf-8"))
          assert original==rebuilt, "El notebook S09 generado no coincide semánticamente con el versionado"
          print("Notebook S09 reproducible: OK")
          PY
      - name: Validar administrador docente
        run: python utils/validate_lms_admin.py
      - name: Validar columna vertebral LMS
        run: python utils/validate_lms_core.py
      - name: Validar Gradebook
        run: python utils/validate_lms_gradebook.py
      - name: Validar competencias
        run: python utils/validate_lms_competencies.py
      - name: Validar analítica
        run: python utils/validate_lms_analytics.py
      - name: Validar colaboración
        run: python utils/validate_lms_collaboration.py
      - name: Validar evaluación avanzada
        run: python utils/validate_lms_assessment.py
      - name: Validar interoperabilidad
        run: python utils/validate_lms_interop.py
      - name: Validar operaciones y resiliencia
        run: python utils/validate_lms_ops.py
      - name: Validar Sesión 09
        run: python utils/validate_session9.py
      - name: Validar evidencia auténtica S09
        run: python utils/validate_s09_authentic_evidence.py
      - name: Validar competencias desde evidencia S09
        run: python utils/validate_s09_competency_evidence.py
      - name: Validar S09 sin respuestas abiertas
        run: python utils/validate_s09_transfer_evidence.py
      - name: Validar distractores S09
        run: python utils/validate_s09_distractors.py
      - name: Validar LMS V3
        run: python utils/validate_lms_v3.py
      - name: Validar LMS Evidence V4
        run: python utils/validate_lms_evidence_v4.py
      - name: Validar contrato LMS V5
        run: python utils/validate_lms_contract_v5.py
      - name: Validar seguridad LMS V5.1
        run: python utils/validate_lms_security_v51.py
      - name: Validar expiración uniforme de sesiones
        run: python utils/validate_lms_auth_expiry.py
      - name: Validar rate limit progresivo
        run: python utils/validate_auth_rate_limit.py
      - name: Validar LMS V6
        run: python utils/validate_lms_v6.py
      - name: Validar Realtime a escala
        run: python utils/validate_realtime_scale.py
      - name: Validar LMS V7 portafolio
        run: python utils/validate_lms_v7.py
      - name: Validar LMS V8 operaciones y accesibilidad
        run: python utils/validate_lms_v8.py
      - name: Validar snapshot académico automático
        run: python utils/validate_lms_auto_snapshot.py
      - name: Validar aprobación segura de cuentas existentes
        run: python utils/validate_access_review_safety.py
      - name: Validar UX estudiante simple
        run: python utils/validate_student_ux_simple.py
      - name: Validar calendario octubre
        run: python utils/validate_october_schedule.py
      - name: Validar portada contra course.json
        run: python utils/validate_index_calendar.py
      - name: Validar cero respuestas abiertas del estudiante
        run: python utils/validate_no_open_student.py
      - name: Validar enlaces locales del repositorio
        run: python utils/validate_static_links.py --root .
      - name: Validar contrato de release de producción
        run: python utils/validate_production_release.py
      - name: Exigir bump de release si cambia una Edge Function crítica
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          if grep -Eq '^infraestructura/lms/functions/(bigdata-session|bigdata-session9|bigdata-lms-core|bigdata-lms-assess|bigdata-lms-interop)/index[.]ts
        run: node --test utils/test_lms_kit.mjs
      - name: Smoke endpoints BigData
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1"
          ORIGIN="https://jazaineam1.github.io"
          for fn in bigdata-auth bigdata-access-request bigdata-access-review; do
            code="$(curl -sS -o /tmp/${fn}-options.txt -w '%{http_code}' -X OPTIONS "${BASE}/${fn}" -H "Origin: ${ORIGIN}" -H 'Access-Control-Request-Method: POST')"
            test "$code" = "200"
          done
          code="$(curl -sS -o /tmp/bigdata-auth.json -w '%{http_code}' -X POST "${BASE}/bigdata-auth" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"me"}')"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/bigdata-request.json -w '%{http_code}' -X POST "${BASE}/bigdata-access-request" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"full_name":"A","email":"bad","website":""}')"
          test "$code" = "400"
          code="$(curl -sS -o /tmp/bigdata-review.json -w '%{http_code}' -X POST "${BASE}/bigdata-access-review" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"approve","request_id":"00000000-0000-0000-0000-000000000000"}')"
          test "$code" = "401"

 <<<"$changed"; then
            grep -qx 'infraestructura/lms/production-release.json' <<<"$changed" || { echo "Cambió una función crítica sin production-release.json"; exit 1; }
            old="$(git show origin/main:infraestructura/lms/production-release.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["release"])' 2>/dev/null || echo '__missing__')"
            new="$(python -c 'import json; print(json.load(open("infraestructura/lms/production-release.json"))["release"])')"
            test "$old" != "$new" || { echo "El release debe cambiar: $new"; exit 1; }
          fi
      - name: Probar runtime LMS V5
        run: node --test utils/test_lms_kit.mjs
      - name: Smoke endpoints BigData
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1"
          ORIGIN="https://jazaineam1.github.io"
          for fn in bigdata-auth bigdata-access-request bigdata-access-review; do
            code="$(curl -sS -o /tmp/${fn}-options.txt -w '%{http_code}' -X OPTIONS "${BASE}/${fn}" -H "Origin: ${ORIGIN}" -H 'Access-Control-Request-Method: POST')"
            test "$code" = "200"
          done
          code="$(curl -sS -o /tmp/bigdata-auth.json -w '%{http_code}' -X POST "${BASE}/bigdata-auth" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"me"}')"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/bigdata-request.json -w '%{http_code}' -X POST "${BASE}/bigdata-access-request" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"full_name":"A","email":"bad","website":""}')"
          test "$code" = "400"
          code="$(curl -sS -o /tmp/bigdata-review.json -w '%{http_code}' -X POST "${BASE}/bigdata-access-review" -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"approve","request_id":"00000000-0000-0000-0000-000000000000"}')"
          test "$code" = "401"


      - name: Comprobar drift real de Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1"
          ORIGIN="https://jazaineam1.github.io"
          EXPECTED="$(python -c 'import json; print(json.load(open("infraestructura/lms/production-release.json"))["release"])')"
          for fn in bigdata-session bigdata-session9 bigdata-lms-core bigdata-lms-assess bigdata-lms-interop; do
            headers="$(mktemp)"
            curl -fsS -o /dev/null -D "$headers" -X OPTIONS "${BASE}/${fn}" -H "Origin: ${ORIGIN}" -H 'Access-Control-Request-Method: POST'
            actual="$(awk -F': ' 'tolower($1)=="x-bigdata-release"{gsub("\r","",$2);print $2}' "$headers" | tail -1)"
            test "$actual" = "$EXPECTED" || { echo "DRIFT: $fn=$actual esperado=$EXPECTED"; exit 1; }
          done
          status="$(curl -fsS "${BASE}/bigdata-session?action=deployment_status" -H "Origin: ${ORIGIN}")"
          STATUS_JSON="$status" EXPECTED="$EXPECTED" python - <<'PY'
          import json,os
          x=json.loads(os.environ["STATUS_JSON"])
          expected=os.environ["EXPECTED"]
          assert x.get("ok") is True, x
          assert x.get("release")==expected, x
          assert x.get("schema_release")==expected, x
          print("Supabase production drift: OK",expected)
          PY
