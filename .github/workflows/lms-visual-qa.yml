name: QA visual LMS

on:
  pull_request:
    paths:
      - index.html
      - lms/**
      - Presentaciones/s09-de-palabras-a-significado.html
      - assets/s09/**
      - Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb
      - utils/build_session9_notebook.py
      - Presentaciones/s10-etl-multimedia.html
      - Presentaciones/s13-de-una-maquina-a-un-cluster.html
      - Cuadernos/10_ETL_Multimedia.ipynb
      - utils/build_session10_multimedia.py
      - utils/validate_session10.py
      - tests/**
      - package.json
      - package-lock.json
      - playwright.config.js
      - .github/workflows/lms-visual-qa.yml

concurrency:
  group: qa-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar Playwright fijado
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Determinar si solo cambió la sesión S13
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only FETCH_HEAD HEAD > /tmp/pr_files_s13.txt
          only_s13=1
          found_s13=0
          while IFS= read -r file; do
            case "$file" in
              Presentaciones/s13-de-una-maquina-a-un-cluster.html|Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb|Laboratorios/S13_Codespaces/*|utils/validate_s13_distribuido.py|tests/s13-presentacion.spec.js|.devcontainer/s13-distribuido/*|.github/workflows/s13-codespaces-qa.yml)
                found_s13=1 ;;
              index.html|.github/workflows/lms-visual-qa.yml)
                : ;;
              *) only_s13=0 ;;
            esac
          done < /tmp/pr_files_s13.txt
          if [[ "$only_s13" == 1 && "$found_s13" == 1 ]]; then
            echo "only_s13=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_s13=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar SDK Realtime local
        if: steps.scope.outputs.only_s13 != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/supabase-sdk
          mkdir -p /tmp/supabase-sdk lms/assets/vendor
          npm pack @supabase/supabase-js@2.117.1 --pack-destination /tmp/supabase-sdk >/tmp/supabase-pack-name.txt
          tar -xzf "$(find /tmp/supabase-sdk -maxdepth 1 -name '*.tgz' -print -quit)" -C /tmp/supabase-sdk
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js lms/assets/vendor/supabase.js
          test -s lms/assets/vendor/supabase.js
          ! grep -q "esm.sh" lms/assets/lms-realtime.js
      - name: Servir sitio
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lms-http.log 2>&1 &
          echo $! > /tmp/lms-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lms-http.log
          exit 1
      - name: Ejecutar QA visual acorde al alcance
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.only_s13 }}" == "true" ]]; then
            npx playwright test tests/s13-presentacion.spec.js
          else
            npm run test:visual
          fi
      - name: Subir evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-lms-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
