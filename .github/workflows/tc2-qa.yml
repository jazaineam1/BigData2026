name: TC2 · nuevo aprendizaje S07–S10 (QA)
on:
  pull_request:
    paths:
      - 'Cuadernos/Taller_Control_2.ipynb'
      - 'utils/tc2_core.py'
      - 'utils/validate_taller_control_2.py'
      - 'Datos/tc2_*.json'
      - 'assets/tutoriales/tc2-paso-a-paso.html'
      - '.github/workflows/tc2-qa.yml'
      - 'utils/test_tc2_e2e_real.py'
      - 'utils/calificar_tc2_zip.py'
      - 'tests/tc2-guide.visual.spec.js'
      - 'playwright.tc2.config.cjs'
      - 'index.html'
      - 'lms/data/course.json'
      - 'lms/session-12.html'
      - 'docs/PLAN_TALLER_CONTROL_2_HASTA_S10_2026-2S.md'
      - 'utils/scan_secrets_pii.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'pillow>=10' 'soundfile>=0.12' 'pyarrow>=17'
      - run: python utils/validate_taller_control_2.py
      - run: python utils/calificar_tc2_zip.py --self-test
  audio-real:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'pyarrow>=17' 'soundfile>=0.12'
      - name: Verificar 10 WAV reales de MINDS14 CC BY 4.0 desde la fuente
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'utils')
          import tc2_core as c
          with tempfile.TemporaryDirectory() as temp:
              audios=c.obtener_voces(Path(temp)/'audios')
              assert len(audios)==10 and len({a['source_record_id'] for a in audios})==10
              assert all(a['source_dataset_sha256']==c.SHA_VOCES for a in audios)
              assert all(a['medidas']['duracion_s']>0 for a in audios)
              print('TC2 AUDIO REAL OK · 10 voces verificadas, SHA, CC BY 4.0')
          PY
  e2e-modelo-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar entorno de Colab equivalente (CPU)
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'pyarrow>=17' 'pillow>=10' 'soundfile>=0.12' 'sentence-transformers>=3,<6' 'pymongo>=4.8' 'matplotlib>=3.8' 'ipython>=8' 'requests>=2.31'
      - name: Ejecutar cuaderno completo, sin Atlas remoto ni autenticación Drive
        env:
          MPLBACKEND: Agg
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python utils/test_tc2_e2e_real.py
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.tc2.config.cjs
