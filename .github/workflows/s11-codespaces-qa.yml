name: S11 Codespaces OCR/ASR/embeddings - smoke
on:
  pull_request:
    paths:
      - "Laboratorios/S11_Codespaces/**"
      - ".devcontainer/s11-multimedia/**"
      - "utils/s11_lesson_cells.json"
      - "Cuadernos/11_ETL_Audio_Imagenes.ipynb"
      - ".github/workflows/s11-codespaces-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-s11:
    name: Sintaxis ligera sin instalar OCR, Whisper ni Ollama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar Python, cuaderno y JSON sin instalar paquetes
        run: |
          python3 -m compileall -q Laboratorios/S11_Codespaces utils/s11_audio_noticia.py utils/s11_etl_core.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path("Cuadernos/11_ETL_Audio_Imagenes.ipynb").read_text(encoding="utf-8"))
          assert nb["cells"]
          for i,cell in enumerate(nb["cells"]):
              if cell["cell_type"]=="code":
                  source="".join(cell["source"]) if isinstance(cell["source"],list) else cell["source"]
                  compile(source,f"cell-{i}","exec")
          print("Notebook syntax OK; modelos no ejecutados")
          PY
  static-and-ocr:
    if: github.event_name == 'workflow_dispatch'
    name: Código, cuaderno y OCR real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tesseract (español) y motor de voz sintética
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa espeak-ng ffmpeg poppler-utils fonts-dejavu-core
      - name: Instalar dependencias del laboratorio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Laboratorios/S11_Codespaces/requirements.txt
      - name: Comprobar sintaxis y sincronización del cuaderno original
        run: |
          bash -n Laboratorios/S11_Codespaces/probar_todo.sh
          python -m py_compile Laboratorios/S11_Codespaces/lab.py Laboratorios/S11_Codespaces/test_lab.py Laboratorios/S11_Codespaces/proyecto.py Laboratorios/S11_Codespaces/test_proyecto.py Laboratorios/S11_Codespaces/app.py Laboratorios/S11_Codespaces/test_app.py Laboratorios/S11_Codespaces/verificar_independiente.py Laboratorios/S11_Codespaces/test_verificar_independiente.py Laboratorios/S11_Codespaces/test_recursos.py
          python utils/build_session11_etl_audio_imagenes.py --check
      - name: Comprobar generación local + OCR español con prueba reproducible
        run: |
          cd Laboratorios/S11_Codespaces
          python -m unittest -v test_lab test_proyecto test_app test_verificar_independiente test_recursos
      - name: Explicar alcance de la prueba
        run: |
          echo "Verificado: sintaxis, notebook sincronizado, archivo/hash, OCR imagen/PDF, transferencia y simulaciones"
          echo "En este job, ASR solo usa doble de prueba. El job siguiente realiza inferencia Whisper/Ollama real."

  real-inference-cpu:
    if: github.event_name == 'workflow_dispatch'
    name: Inferencia REAL · Whisper tiny + EmbeddingGemma 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa ffmpeg espeak-ng poppler-utils fonts-dejavu-core
      - name: Dependencias de inferencia
        run: python -m pip install -r Laboratorios/S11_Codespaces/requirements.txt
      - name: OCR + Whisper + Ollama con modelos reales y fuentes sintéticas
        run: |
          cd Laboratorios/S11_Codespaces
          bash probar_todo.sh --completo
      - name: Verificar artefactos de motores verdaderos
        run: |
          cd Laboratorios/S11_Codespaces
          python -c 'import json,pathlib; p=pathlib.Path("salidas"); a=json.loads((p/"asr.json").read_text()); i=json.loads((p/"indice.json").read_text()); o=json.loads((p/"ocr.json").read_text()); assert a["modelo"].startswith("faster-whisper") and a["transcripcion"].strip() and a["segmentos"]; assert "CONTRATOS" in o["texto_extraido"].upper(); assert i["modelo"]=="embeddinggemma-2:270m" and i["dimension"]==768 and i["documentos"]; print("ASR:",len(a["segmentos"]),"segmentos; embeddings:",len(i["documentos"]),"x",i["dimension"])'
      - name: Transferencia real de dos modalidades y extracción rastreable
        run: |
          cd Laboratorios/S11_Codespaces
          python proyecto.py iniciar --destino proyectos/qa_multimedia
          cp salidas/afiche_simulado.png proyectos/qa_multimedia/entradas/imagenes/
          cp salidas/voz_simulada.wav proyectos/qa_multimedia/entradas/audios/
          python proyecto.py plan --config proyectos/qa_multimedia/config.json
          python proyecto.py procesar --config proyectos/qa_multimedia/config.json
          python proyecto.py indexar --config proyectos/qa_multimedia/config.json
          python proyecto.py buscar --config proyectos/qa_multimedia/config.json --consulta "¿Cuántos contratos?"
          python proyecto.py auditar --config proyectos/qa_multimedia/config.json
          python verificar_independiente.py --proyecto proyectos/qa_multimedia
          python - <<'PY'
          import json
          from pathlib import Path
          s = Path("proyectos/qa_multimedia/salidas")
          filas = [json.loads(x) for x in (s/"catalogo.jsonl").read_text().splitlines()]
          cs = [json.loads(x) for x in (s/"candidatos.jsonl").read_text().splitlines()]
          assert len(filas) == 2 and {f["tipo"] for f in filas} == {"imagen", "audio"}
          assert cs and all(c["path"] in {f["path"] for f in filas} for c in cs)
          print("Transferencia real verificada:",len(filas),"fuentes y",len(cs),"candidatos")
          PY
      - name: Alcance
        run: |
          echo "Motores reales probados en GitHub Actions + 2 modalidades transferidas. La apertura gráfica del Codespace necesita comprobación interactiva."

  codespaces-container-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Contenedor Codespaces · build + Streamlit HTTP (solo manual)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Construir el Dockerfile exacto del perfil S11
        run: docker build --tag s11-codespace-smoke -f .devcontainer/s11-multimedia/Dockerfile .devcontainer/s11-multimedia
      - name: Arrancar el panel con las mismas dependencias del Codespace
        run: |
          docker run -d --name s11-ui-test -p 127.0.0.1:8501:8501 \
            -v "$PWD:/workspaces/BigData2026" -w /workspaces/BigData2026/Laboratorios/S11_Codespaces \
            s11-codespace-smoke bash -lc \
            'python -m pip install -r requirements.txt && streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true'
          for intento in $(seq 1 150); do
            if curl -fsS --max-time 2 http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Panel Streamlit responde desde el contenedor Codespaces"; exit 0
            fi
            sleep 3
          done
          docker logs --tail 120 s11-ui-test
          exit 1
      - name: Comprobar Tesseract, español y dependencias desde el contenedor
        run: |
          docker exec s11-ui-test tesseract --list-langs | grep -x spa
          docker exec s11-ui-test python -c "import streamlit,pytesseract,faster_whisper,pyarrow; print('Dependencias de Codespaces: OK')"
          curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: Diagnóstico de arranque
        if: always()
        run: docker logs --tail 90 s11-ui-test 2>/dev/null || true
