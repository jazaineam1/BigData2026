name: S11 Codespaces OCR/ASR/embeddings - smoke
on:
  pull_request:
    paths:
      - "Laboratorios/S11_Codespaces/**"
      - ".devcontainer/s11-multimedia/**"
      - "utils/s11_lesson_cells.json"
      - "Cuadernos/11_ETL_Audio_Imagenes.ipynb"
      - ".github/workflows/s11-codespaces-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-ocr:
    name: Código, cuaderno y OCR real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tesseract (español) y motor de voz sintética
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa espeak-ng ffmpeg poppler-utils fonts-dejavu-core
      - name: Instalar dependencias del laboratorio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Laboratorios/S11_Codespaces/requirements.txt
      - name: Comprobar sintaxis y sincronización del cuaderno original
        run: |
          bash -n Laboratorios/S11_Codespaces/probar_todo.sh
          python -m py_compile Laboratorios/S11_Codespaces/lab.py Laboratorios/S11_Codespaces/test_lab.py Laboratorios/S11_Codespaces/proyecto.py Laboratorios/S11_Codespaces/test_proyecto.py Laboratorios/S11_Codespaces/app.py Laboratorios/S11_Codespaces/test_app.py
          python utils/build_session11_etl_audio_imagenes.py --check
      - name: Comprobar generación local + OCR español con prueba reproducible
        run: |
          cd Laboratorios/S11_Codespaces
          python -m unittest -v test_lab test_proyecto test_app
      - name: Explicar alcance de la prueba
        run: |
          echo "Verificado: sintaxis, notebook sincronizado, archivo/hash, OCR imagen/PDF, transferencia y simulaciones"
          echo "Pendiente de ejecución en Codespaces: inferencia Whisper y Ollama reales. ASR aquí usa doble de prueba."

  real-inference-cpu:
    name: Inferencia REAL · Whisper tiny + EmbeddingGemma 2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa ffmpeg espeak-ng poppler-utils fonts-dejavu-core
      - name: Dependencias de inferencia
        run: python -m pip install -r Laboratorios/S11_Codespaces/requirements.txt
      - name: OCR + Whisper + Ollama con modelos reales y fuentes sintéticas
        run: |
          cd Laboratorios/S11_Codespaces
          bash probar_todo.sh --completo
      - name: Verificar artefactos de motores verdaderos
        run: |
          cd Laboratorios/S11_Codespaces
          python -c 'import json,pathlib; p=pathlib.Path("salidas"); a=json.loads((p/"asr.json").read_text()); i=json.loads((p/"indice.json").read_text()); o=json.loads((p/"ocr.json").read_text()); assert a["modelo"].startswith("faster-whisper") and a["transcripcion"].strip() and a["segmentos"]; assert "CONTRATOS" in o["texto_extraido"].upper(); assert i["modelo"]=="embeddinggemma-2:270m" and i["dimension"]==768 and i["documentos"]; print("ASR:",len(a["segmentos"]),"segmentos; embeddings:",len(i["documentos"]),"x",i["dimension"])'
      - name: Alcance
        run: |
          echo "Motores reales probados en Linux GitHub Actions. La apertura gráfica del Codespace necesita comprobación interactiva."

  codespaces-container-smoke:
    name: Contenedor Codespaces · build + Streamlit HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Construir el Dockerfile exacto del perfil S11
        run: docker build --tag s11-codespace-smoke -f .devcontainer/s11-multimedia/Dockerfile .devcontainer/s11-multimedia
      - name: Arrancar el panel con las mismas dependencias del Codespace
        run: |
          docker run -d --name s11-ui-test -p 127.0.0.1:8501:8501 \
            -v "$PWD:/workspaces/BigData2026" -w /workspaces/BigData2026/Laboratorios/S11_Codespaces \
            s11-codespace-smoke bash -lc \
            'python -m pip install -r requirements.txt && streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true'
          for intento in $(seq 1 150); do
            if curl -fsS --max-time 2 http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Panel Streamlit responde desde el contenedor Codespaces"; exit 0
            fi
            sleep 3
          done
          docker logs --tail 120 s11-ui-test
          exit 1
      - name: Comprobar Tesseract, español y dependencias desde el contenedor
        run: |
          docker exec s11-ui-test tesseract --list-langs | grep -x spa
          docker exec s11-ui-test python -c "import streamlit,pytesseract,faster_whisper,pyarrow; print('Dependencias de Codespaces: OK')"
          curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: Diagnóstico de arranque
        if: always()
        run: docker logs --tail 90 s11-ui-test 2>/dev/null || true
