name: S13 · Validación estática con Dask real sólo manual
on:
  pull_request:
    paths:
      - Presentaciones/s13-de-una-maquina-a-un-cluster.html
      - Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb
      - Laboratorios/S13_Codespaces/**
      - utils/validate_s13_distribuido.py
      - tests/s13-presentacion.spec.js
      - .devcontainer/s13-distribuido/**
      - .github/workflows/s13-codespaces-qa.yml
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Autorizar creación real de workers y 4 lotes pequeños (manual)"
        type: boolean
        default: false
        required: false
      run_heavy:
        description: "Autorizar Run All del cuaderno (manual; no usa 50.000)"
        type: boolean
        default: false
        required: false
concurrency:
  group: s13-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  s13-estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contratos, Python, JS, cuaderno y unit tests sin librerías externas
        run: |
          python utils/validate_s13_distribuido.py
          python -m py_compile Laboratorios/S13_Codespaces/verificar_entorno.py
          python -m py_compile Laboratorios/S13_Codespaces/dask_cuando_si.py
          python -m py_compile Laboratorios/S13_Codespaces/app_tfidf_unspsc.py
          python -m unittest discover -s Laboratorios/S13_Codespaces -p 'test_dask_cuando_si.py' -v
  s13-smoke-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Laboratorios/S13_Codespaces/requirements.txt
      - name: Instalar dependencias de clase (nunca modelos grandes)
        run: python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
      - name: Crear, comprobar y cerrar un worker de proceso
        run: python Laboratorios/S13_Codespaces/verificar_entorno.py
      - name: Ejecutar dos trabajos Dask pequeños y reales
        run: |
          python Laboratorios/S13_Codespaces/dask_cuando_si.py --modo datos --workers 2 --tareas 4
          python Laboratorios/S13_Codespaces/dask_cuando_si.py --modo espera --workers 2 --tareas 4 --espera 0.1
      - name: Comprobar panel Streamlit sin entrenar modelos opcionales
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("Laboratorios/S13_Codespaces/app_tfidf_unspsc.py").run(timeout=90)
          assert not app.exception,[str(x) for x in app.exception]
          assert len(app.tabs)==7
          print("Streamlit S13: OK")
          PY
  s13-run-all-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heavy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias y Jupyter
        run: |
          python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
          python -m pip install nbclient nbformat
      - name: Run All con datos pequeños y ampliación opcional desactivada
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path
          ruta=Path("Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb")
          notebook=nbformat.read(ruta,as_version=4)
          NotebookClient(notebook,timeout=240,kernel_name="python3",
                         resources={"metadata":{"path":"Cuadernos"}}).execute()
          print("Run All S13: OK")
          PY
