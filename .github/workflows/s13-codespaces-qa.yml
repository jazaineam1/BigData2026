name: S13 · QA ligero y demostración Dask pequeña
on:
  pull_request:
    paths:
      - Presentaciones/s13-de-una-maquina-a-un-cluster.html
      - Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb
      - Laboratorios/S13_Codespaces/**
      - utils/validate_s13_distribuido.py
      - tests/s13-presentacion.spec.js
      - .devcontainer/s13-distribuido/**
      - .github/workflows/s13-codespaces-qa.yml
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Ejecutar integración ampliada solo si el docente lo autoriza"
        type: boolean
        default: false
        required: false
concurrency:
  group: s13-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  s13-ligero:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Laboratorios/S13_Codespaces/requirements.txt
      - name: Estructura, sintaxis y pruebas unitarias sin modelos
        run: |
          python utils/validate_s13_distribuido.py
          python -m py_compile Laboratorios/S13_Codespaces/verificar_entorno.py
          python -m py_compile Laboratorios/S13_Codespaces/dask_cuando_si.py
          python -m py_compile Laboratorios/S13_Codespaces/app_tfidf_unspsc.py
          python -m unittest discover -s Laboratorios/S13_Codespaces -p 'test_dask_cuando_si.py' -v
      - name: Instalar solo dependencias básicas de la clase
        run: python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
      - name: Levantar, probar y cerrar un worker real de proceso
        run: python Laboratorios/S13_Codespaces/verificar_entorno.py
      - name: Dos casos pequeños Dask (sin benchmark masivo)
        run: |
          python Laboratorios/S13_Codespaces/dask_cuando_si.py --modo datos --workers 2 --tareas 4
          python Laboratorios/S13_Codespaces/dask_cuando_si.py --modo espera --workers 2 --tareas 4 --espera 0.1
      - name: Verificar Streamlit sin ejecutar el clasificador opcional
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          a=AppTest.from_file("Laboratorios/S13_Codespaces/app_tfidf_unspsc.py").run(timeout=90)
          assert not a.exception, [str(x) for x in a.exception]
          assert len(a.tabs)==7
          print("7 estaciones S13 verificadas; clasificación opcional desactivada")
          PY
  s13-integracion-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heavy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar bibliotecas y utilidades Jupyter
        run: |
          python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
          python -m pip install nbclient nbformat
      - name: Run All de la muestra pequeña; ampliación opcional desactivada
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path
          p=Path("Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb")
          nb=nbformat.read(p,as_version=4)
          NotebookClient(nb,timeout=240,kernel_name="python3",
                         resources={"metadata":{"path":"Cuadernos"}}).execute()
          print("Run All S13: OK")
          PY
