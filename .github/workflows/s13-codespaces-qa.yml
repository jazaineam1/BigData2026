name: S13 Codespaces Dask y modelos - QA
# PR: solo validación ligera. Ejecución integral: manual y aprobación explícita.
on:
  pull_request:
    paths:
      - 'Presentaciones/s13-de-una-maquina-a-un-cluster.html'
      - 'Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb'
      - 'Laboratorios/S13_Codespaces/**'
      - 'utils/validate_s13_distribuido.py'
      - '.devcontainer/s13-distribuido/**'
      - '.github/workflows/s13-codespaces-qa.yml'
  workflow_dispatch:
    inputs:
      run_heavy:
        description: 'Ejecutar integración completa (consume runner; NO 50k/Ollama)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  s13-ligero:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Estructura del cuaderno, diapositivas, LMS y Codespaces (sin instalar dependencias)
        run: |
          python utils/validate_s13_distribuido.py
          python -m py_compile Laboratorios/S13_Codespaces/dask_cuando_si.py
          python -m py_compile Laboratorios/S13_Codespaces/verificar_entorno.py
          python -m unittest discover -s Laboratorios/S13_Codespaces -p 'test_dask_cuando_si.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb').read_text())
          assert 51<=len(n['cells'])<=55
          for c in n['cells']:
              if c['cell_type']=='code':
                  compile(''.join(c['source']),'celda_s13','exec')
          t='\n'.join(''.join(c['source']) for c in n['cells'])
          assert 'OPCIONES_ARQUITECTURA' in t and 'OPCIONES_LIMITE' in t
          assert 'KMeansDask' in t and 'MuestraRSS' in t and 'make_blobs' in t
          print('QA ligero: cuaderno único, K-means clásico, decisiones y sintaxis Python OK')
          PY
  s13-reproducible:
    # Prueba de integración de un cuaderno únicamente mediante workflow_dispatch
    # NUNCA se ejecuta en PR. Sin 50k, benchmarks ni modelos neuronales.
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar lo mismo que en Codespaces
        run: |
          python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
          python -m pip install nbclient nbformat
      - name: Validar perfil y smoke ligero de Dask
        run: |
          python utils/validate_s13_distribuido.py
          python Laboratorios/S13_Codespaces/verificar_entorno.py
      - name: Ejecutar solo el cuaderno S13, 1.000×2 por defecto
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path
          ruta=Path("Cuadernos/13_Dask_MapReduce_Compras_Claras.ipynb")
          nb=nbformat.read(ruta,as_version=4)
          NotebookClient(
              nb,timeout=240,kernel_name="python3",
              resources={"metadata":{"path":"Cuadernos"}}
          ).execute()
          print("S13 Run All, clúster Dask y memoria RSS: OK")
          PY

