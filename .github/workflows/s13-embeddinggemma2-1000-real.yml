name: S13 EmbeddingGemma2 1000 SECOP REAL vs TFIDF
on:
  pull_request:
    paths:
      - "Laboratorios/S13_Codespaces/comparar_1000_tfidf_embeddinggemma2.py"
      - ".github/workflows/s13-embeddinggemma2-1000-real.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparacion-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_NUM_PARALLEL: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar paquetes del proyecto
        run: python -m pip install -r Laboratorios/S13_Codespaces/requirements.txt
      - name: Instalar Ollama (misma versión para ambas evaluaciones)
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/s13-ollama-install.sh
          sh /tmp/s13-ollama-install.sh
          ollama --version
          nohup ollama serve >/tmp/s13-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/s13-ollama.log
          exit 1
      - name: Descargar versión real EmbeddingGemma 2 texto
        run: |
          ollama pull embeddinggemma-2:270m
          ollama list
      - name: Clasificar 1000 documentos reales con ambos encoders y MISMO LinearSVC
        run: |
          python Laboratorios/S13_Codespaces/comparar_1000_tfidf_embeddinggemma2.py --model embeddinggemma-2:270m --batch 4
      - name: Validación incondicional de 1000 embeddings auténticos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path("Laboratorios/S13_Codespaces/salidas/benchmark_unspsc/tfidf_vs_embeddinggemma2_1000_REAL.json")
          r=json.loads(path.read_text())
          assert r["train"]==800 and r["test"]==200
          assert r["embeddinggemma2"]["estadisticas_ollama"]["nuevos"]>0
          assert r["embeddinggemma2"]["estadisticas_ollama"]["solicitados"]==1000
          assert r["embeddinggemma2"]["dimensiones"]==768
          for k in ("tfidf","embeddinggemma2"):
              f=r[k]["metricas"]["f1_macro"]
              assert 0<=f<=1
          print("1000 EmbeddingGemma+TFIDF auténticos OK")
          PY
      - name: Exportar métricas, no publicar caché de textos
        uses: actions/upload-artifact@v6
        with:
          name: s13-embgemma2-tfidf-1000-real-f1
          path: Laboratorios/S13_Codespaces/salidas/benchmark_unspsc/tfidf_vs_embeddinggemma2_1000_REAL.json
          retention-days: 14
          if-no-files-found: error
