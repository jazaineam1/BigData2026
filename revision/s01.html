})(typeof globalThis!=="undefined"?globalThis:this);
</script><script>const slides=[[4,"01 · La misión","Laura tiene que revisar contratación pública sin leer cada expediente","El producto de hoy no es un tablero vacío: será una adquisición reproducible. Recibimos una fuente, comprobamos identidad, exploramos contenido, dividimos lotes y entregamos RAW. En la siguiente sesión diseñaremos la arquitectura que lo recibe.","Identifica qué pregunta podrías responder con objeto contractual y entidad, y cuál exige otras variables.","Un registro representa un proceso en este corpus; no contiene valor contractual. No confundir con la API de contratos.","flow",["Fuente SECOP","Validar y adquirir","RAW versionado","S02: arquitectura"],["Antes de utilizar una herramienta, definimos qué problema queremos resolver. SECOP publica información sobre compras públicas. Una persona que analiza contrataciones puede comenzar por localizar procesos de una entidad y leer sus objetos, pero necesita distinguir esa exploración de una investigación sobre recursos adjudicados. En nuestro corpus de procesos aparecen identificadores, entidades, nombres y descripciones; todavía no tenemos los valores de los contratos. La unidad de observación, también llamada grano, es aquello que representa cada registro. En este caso es un proceso, no un proveedor, un pago ni una factura. Si contamos registros únicos, contamos procesos de nuestra muestra. Si después descargamos una tabla de contratos, un proceso podría tener más de un contrato. Esta diferencia determina cómo podremos combinar ambas fuentes. Big Data empieza con esta pregunta y no con la instalación de un clúster.","Ejemplo resuelto: una entidad tiene tres procesos, uno de ellos con dos contratos. En la tabla de procesos hay tres filas; en una tabla que registra los contratos puede haber cuatro si cada uno de los otros procesos tiene uno. Contar las cuatro filas como procesos sería incorrecto. Hoy conservaremos el identificador y la procedencia para poder reconocer esa diferencia.","Abre el visor de datos en la pantalla 6. Selecciona una entidad y escribe dos preguntas: cuántos procesos aparecen en la muestra y cuánto dinero contrató esa entidad. Identifica cuál podemos contestar con los campos presentes y cuál necesita otra fuente. Al final de la sesión volveremos a comprobar la respuesta.","Explica la diferencia entre una pregunta descriptiva y una decisión. Para una entidad que recibe muchas consultas, recuperar sus procesos permite identificar temas y distribuir trabajo de lectura; no permite deducir automáticamente el gasto si falta valor contractual. Antes de procesar, anota qué salida utilizaría Laura, en qué momento y qué dato faltaría para una decisión distinta. Un objetivo verificable es que otra persona pueda recuperar las mismas identidades del corpus y comprobar el conteo. Este criterio no depende de una marca de almacenamiento."],"A0"],[5,"02 · Escala y decisión","Big Data no es un número mágico","El problema comienza cuando volumen, tasa de llegada, estructuras o necesidades de respuesta exceden el método disponible. Una tabla pequeña puede exigir respuesta rápida; una grande puede procesarse por lotes. Escalar tiene costos de memoria, almacenamiento, red y coordinación.","Compara un proceso que recibe 3 millones de eventos/min con otro que recibe 1 millón. Decide qué métrica monitorear.","Distingue capacidad y demanda; el tamaño de archivo por sí solo no decide tecnología.","queue",null,["La expresión Big Data se refiere a situaciones en las que la escala, complejidad o ritmo de los datos requiere métodos adecuados para procesarlos y obtener información útil. No existe un límite universal de filas que obligue a distribuir el cálculo. Un millón de registros de dos columnas numéricas no ocupa lo mismo que un millón de grabaciones. Tampoco tarda lo mismo contar registros que entrenar un modelo sobre cada uno. Conviene separar almacenamiento, memoria de trabajo, capacidad de procesamiento y tiempo máximo de respuesta. El almacenamiento permite conservar datos; la memoria mantiene los datos y estados que el programa utiliza durante su ejecución; el procesador realiza operaciones; la red mueve información entre componentes. Si uno de estos recursos es insuficiente, debemos identificar el cuello de botella. Aumentar un recurso que no limita el sistema puede no producir ninguna mejora.","Supongamos que llegan 3.000 registros por segundo y solo se procesan 1.000. En sesenta segundos llegan 180.000, se procesan 60.000 y quedan 120.000 pendientes, suponiendo cola inicial vacía y tasas constantes. Aunque tengamos almacenamiento suficiente, la diferencia de tasas hace que la cola siga creciendo. Un tablero nuevo no aumenta la capacidad de procesamiento.","En el simulador conserva el tiempo en 60 segundos. Prueba llegadas de 3.000 y capacidades de 1.000, 3.000 y 4.000. Antes de cada cambio predice el atraso. Identifica el escenario en que la capacidad supera la llegada y explica por qué aquí no aparece una cola negativa.","El tiempo tiene dos sentidos diferentes: cuánto tarda una tarea individual y cuántas tareas se terminan por unidad de tiempo. Un sistema puede procesar muchas filas por minuto y tardar demasiado en responder una consulta particular. La cola del modelo supone llegadas y capacidad constantes y estado inicial vacío; si ambos varían, el cálculo por intervalo debe acumular llegadas y servicio, sin permitir pendientes negativos. Un pico temporal puede requerir capacidad de reserva aunque el promedio diario sea bajo. Describe cuál métrica necesitas para una extracción nocturna y para una búsqueda interactiva."],"A1"],[5,"03 · Diagnóstico","Las cinco V se pueden medir","Volumen: bytes y filas. Velocidad: registros por segundo y latencia. Variedad: tipos y estructuras. Veracidad: duplicados, faltantes y procedencia. Valor: utilidad para una decisión. Las cinco V interactúan: más datos duplicados pueden añadir volumen sin valor.","Asocia cada caso con la V dominante, luego explica qué medirías. No memorices solo nombres.","Identifica la restricción concreta antes de elegir tecnología.","quiz",[["Llegan 3000 eventos/s, se procesan 1000","Velocidad"],["El 15% de identificadores son duplicados","Veracidad"],["Hay tablas, audio y fotos","Variedad"],["Una matriz requiere 40 GiB","Volumen"],["El indicador no cambia ninguna decisión","Valor"]],["Las cinco V son una forma de diagnosticar las exigencias de un sistema. Volumen responde cuánto contenido debe conservarse y procesarse; por ejemplo, filas, imágenes o bytes. Velocidad describe la tasa con que llegan datos y el tiempo en que necesitamos una respuesta. Variedad describe diferencias de estructura y formato: una tabla, un documento o una señal sonora requieren tratamientos distintos. Veracidad se refiere a calidad, origen y confiabilidad para el uso previsto: identificadores duplicados, valores faltantes o mediciones inconsistentes. Valor significa que el resultado permite una decisión relevante. Una V puede dominar y las demás seguir presentes. La dimensión que identificamos no determina automáticamente una tecnología, sino que orienta las pruebas necesarias. Si faltan identificadores fiables, repartir esos registros entre veinte máquinas no corrige su significado.","En una fuente de compras públicas recibimos archivos diariamente. Si el archivo tarda demasiado en descargarse, observamos tamaño y rendimiento de red; si llegan cambios más rápido de lo que podemos procesarlos, observamos atraso; si se mezclan actas PDF y registros CSV, observamos variedad; si se repiten identificadores, verificamos veracidad. Finalmente preguntamos si el análisis ayuda a localizar expedientes que merecen revisión.","Resuelve los cinco diagnósticos de la derecha. Después cambia cada caso proponiendo una medición concreta: cantidad de bytes, registros por segundo, modalidades, proporción de duplicados o una decisión. Compara tu respuesta con otra persona; una situación puede tener más de una V, pero debes justificar la dominante.","Las cinco V no son cinco requisitos que deban ser grandes simultáneamente. Un corpus pequeño de documentos escaneados puede ser difícil por variedad y veracidad; un flujo de eventos homogéneos puede ser difícil por velocidad. Distingue el síntoma, la métrica y la decisión. Por ejemplo: tasa de entrada supera servicio, diferencia en eventos por segundo, necesidad de aumentar servicio o desacoplar. El valor depende de una pregunta concreta, no del número de registros. Identifica qué observación invalidaría el diagnóstico inicial; evita seleccionar una V por el nombre del software."],"A1"],[6,"04 · Infraestructura","Local, nube y distribución son decisiones diferentes","Local indica dónde se ejecuta; nube indica acceso a servicios administrados o recursos remotos. Distribución divide cómputo entre unidades coordinadas. Escalamiento vertical aumenta recursos de una máquina, horizontal agrega unidades. La nube no garantiza paralelismo ni menor costo.","Modifica presupuesto y capacidad para una matriz float64. Si no cabe, ¿fragmentación, otra representación o distribución?","El resultado es memoria mínima de la matriz, no RSS de Python.","memory",null,["Una máquina local tiene recursos finitos: memoria RAM, almacenamiento, CPU y capacidad de red. La nube permite utilizar infraestructura remota o servicios gestionados por un proveedor, pero sigue teniendo límites, cuotas y costos. Escalar verticalmente consiste en aumentar recursos de una máquina, por ejemplo añadir RAM. Escalar horizontalmente significa añadir unidades de cómputo y repartir el trabajo. Esto introduce coordinación, comunicación, posibles fallos y redistribución de datos. Un servicio en la nube puede ejecutar todo en una única máquina, y un conjunto local de máquinas puede formar un sistema distribuido. Por tanto, nube y distribución no son sinónimos. Para escoger, primero calculamos el tamaño mínimo de los datos, luego observamos las operaciones y recursos disponibles y finalmente medimos. Una matriz de números float64 almacena ocho bytes por número; su tamaño mínimo es filas multiplicadas por columnas y por ocho. Python y pandas añaden estructuras internas y algunas operaciones producen copias.","Una matriz de un millón de filas y 128 columnas requiere 1.024.000.000 bytes de valores, aproximadamente 0,954 GiB. GiB usa potencias de 1024, mientras GB decimal usa mil millones de bytes. Si duplicamos filas, duplicamos ese mínimo. Una representación float32 reduce a cuatro bytes por número, pero puede cambiar precisión y debe validarse.","Prueba un millón y diez millones de filas, con 128 columnas. Compara presupuestos de 1, 4 y 16 GiB. Anota cuándo la matriz mínima supera el presupuesto y cuándo, aun cabiendo, sería prudente medir el máximo real. Decide si probar primero fragmentación o distribución para una suma.","Memoria, disco y CPU tienen funciones diferentes. El SSD conserva archivos, la RAM permite acceder a estados activos y la CPU ejecuta instrucciones. La red añade transferencia y latencia. Una matriz de cien millones de valores float64 necesita al menos ochocientos millones de bytes para representar números; pandas puede añadir índices, objetos y copias temporales. El límite inferior no es una medición del proceso. Distribuir datos puede reducir el estado por máquina, pero una operación global puede exigir intercambio. Antes de elegir arquitectura, determina qué operación requiere realmente todo el estado simultáneo."],"A1"],[5,"05 · Estructuras","Una fila no representa siempre la misma cosa","Un CSV modela registros con columnas; JSON representa campos anidados y listas; XML usa etiquetas y jerarquías. El texto libre conserva significado pero requiere transformación para consultas. Un mismo proceso puede tener varios documentos, y una unión puede multiplicar filas.","Cambia representación de dos registros reales y examina la identidad, tipos y longitud de serialización.","Conserva el grano proceso al convertir. XML de ejemplo se escapa correctamente.","formats",null,["Un dato estructurado sigue un esquema tabular con columnas y tipos conocidos. Un dato semiestructurado tiene organización explícita, pero admite jerarquías, listas o campos variables. JSON y XML son ejemplos de formatos que pueden representar estructuras anidadas. Los datos no estructurados, como una fotografía o una descripción libre, también tienen una representación digital, pero su contenido de interés no aparece necesariamente en columnas listas para consultar. CSV es un formato textual para valores separados por delimitadores: necesita reglas de comillas y escape para que una coma dentro de un nombre no cree una columna nueva. JSON distingue objetos, listas, números y cadenas; XML organiza elementos mediante etiquetas y atributos. El formato no garantiza calidad, ni determina por sí solo la base de datos que debemos utilizar. Podemos convertir un JSON sencillo en una tabla; si contiene una lista de documentos por proceso debemos decidir si conservar la lista o crear una tabla relacionada.","Ejemplo: un proceso P1 tiene dos actas y P2 tiene una. Una tabla de procesos tiene dos filas; una tabla de actas tiene tres. Si expandimos la lista de actas de JSON sin conservar el identificador P1, perdemos la relación. Si contamos las tres filas como procesos, cambiamos el grano. La serialización textual XML puede usar más bytes por sus etiquetas; eso no demuestra que su procesamiento sea necesariamente más lento.","Selecciona CSV, JSON, XML y texto en el convertidor. Identifica el campo ID en cada representación, las etiquetas, los separadores y las comillas. Compara los bytes UTF-8 mostrados. Explica qué campos se pierden en la representación de solo texto y cuál conservarías como dato de origen para nuestro ejercicio.","CSV es una serialización tabular; JSON representa listas y objetos; XML representa elementos y atributos; ninguno garantiza calidad del dato. Un objeto con una lista de dos activos tiene una entidad padre y dos hijos; llevarlo a una tabla plana puede duplicar campos del padre. Para preservar significado, define una clave del padre y otra del hijo o mantiene el objeto anidado. La representación se elige según consultas, intercambio y validación. Un texto libre no carece de estructura en sentido lingüístico: simplemente no tiene columnas explícitas como una tabla."],"A2"],[4,"05B · Identidad y grano","Una relación uno a muchos cambia la cantidad de filas","El identificador de proceso agrupa contratos. Cada fila contractual es una observación diferente. Contar filas tras una unión no cuenta procesos.","Aumenta los contratos de P1 y predice qué conteo cambia.","Ejemplo relacional ficticio: el corpus SECOP no contiene los contratos de cada proceso.","grain",null,["El grano no es un tipo de columna, sino una afirmación sobre aquello que representa una fila. En un sistema de compras pueden coexistir una tabla de procesos, otra de contratos, otra de pagos y otra de entidades. Cada una exige una identidad propia. Una clave de proceso puede repetirse en contratos sin que estos sean duplicados. Un join, o unión entre tablas, multiplica filas cuando hay varias correspondencias. Antes de unir es indispensable saber qué resultado se quiere conservar: procesos únicos, contratos o valor contractual. El hecho de que la columna tenga valores únicos en una muestra no demuestra que sea una clave global; hay que revisar su definición y el contrato de la fuente. En S01 el corpus real contiene procesos y no contiene una variable de valor contractual; no agregaremos valores ficticios a estos registros.","Ejemplo resuelto: los procesos P1, P2 y P3 existen en la tabla de procesos. P1 tiene dos contratos, P2 uno y P3 ninguno. Una unión izquierda genera cuatro filas: dos para P1, una para P2 y una sin contrato para P3. El resultado tiene tres procesos distintos y tres contratos observados, no cuatro contratos. Si P1 recibe un contrato adicional, el resultado tiene cinco filas, tres procesos y cuatro contratos. El conteo de procesos se obtiene de la clave del proceso, el de contratos mediante identificadores contractuales no nulos. Si una segunda tabla contiene duplicados por clave contractual, se debe verificar esa identidad antes de sumar valores; usar distinct sobre el valor monetario tampoco es correcto porque dos contratos pueden valer lo mismo.","Práctica: ajusta el número de contratos y la estrategia de unión. Identifica qué procesos permanecen en el resultado y cuáles desaparecen al seleccionar inner. En el cuaderno A2 reproduce los conteos, modifica una condición y explica qué evidencia permitiría sumar valores. Escribe en el manifiesto grano=proceso y comprueba que el identificador sea único. Si el objetivo exige contratos, crea otra fuente con otra identidad y otro manifiesto; no transformes silenciosamente un corpus de procesos en una tabla contractual.","El objetivo no es memorizar los tres nombres de tablas, sino predecir la multiplicidad. Una unión izquierda mantiene un proceso sin contrato en una fila con null. Una unión interna lo elimina. Una agregación por identidad de proceso después de la unión puede restablecer una fila por proceso, pero no deshace automáticamente una suma contractual duplicada. Si una clave que debería ser única se repite en la dimensión, primero audita la calidad de la dimensión."],"A2"],[5,"06 · Fuente real","Abre el corpus SECOP antes de escribir código","Tenemos una instantánea docente versionada de 200 procesos derivados de Datos/bandeja_revision_2026.json. Incluye ID, objeto, descripción, entidad y URL original. No es una muestra aleatoria; no contiene monto, fecha de adjudicación ni proveedor en este esquema.","Filtra por texto o entidad, abre un expediente original y cambia de página.","Distingue evidencia disponible de campos que tendrías que adquirir.","browse",null,["Una instantánea es una copia de datos conservada para reproducir análisis sin depender de cambios posteriores del servicio original. El curso dispone de 200 procesos en un JSON docente derivado de la bandeja de revisión. Cada objeto contiene el identificador id_proceso, el nombre del proceso, su descripción, la entidad que publica, una URL de SECOP y metadatos de procedencia. La URL permite consultar la fuente, pero el contenido del portal podría haber cambiado desde que se construyó la copia. Un corpus es una colección de documentos utilizada para analizar o recuperar información. Este corpus se seleccionó con fines docentes, no como una muestra estadística aleatoria. Por eso una entidad muy frecuente podría deber su posición al criterio de selección. Podemos describir qué hay en el archivo, pero no afirmar que su distribución coincide con todo SECOP.","El identificador CO1.REQ.10017413 corresponde en la instantánea a un proceso de fortalecimiento de atención primaria en salud del Distrito de Barranquilla. El objeto y la descripción permiten localizar el tema. No contienen necesariamente el valor adjudicado, el contratista definitivo ni la ejecución presupuestal. Una consulta responsable debe separar lo observado de aquello que requiere verificación adicional.","Busca el identificador en el visor y abre su enlace de fuente. Después busca Barranquilla y compara el número de coincidencias con el universo de 200. Cambia de página. Registra el filtro, las coincidencias y un ID encontrado. Usa esos datos para explicar a otra persona qué parte de la consulta puede reproducir.","Inspecciona tres registros y busca el mismo identificador en el enlace de procedencia cuando exista. La descripción puede ser más larga que el objeto y la entidad puede usar nombres variables. El snapshot se conserva como evidencia de lo que había en el repositorio, no como certificación de todo el portal. Registra su referencia de versión. Un conteo de doscientas filas no autoriza estimar porcentajes nacionales sin diseño muestral. Si encuentras descripciones duplicadas con IDs diferentes, conserva ambas mientras la identidad de proceso sea distinta."],"A3"],[5,"07 · Calidad","Veracidad: identidad y valores ausentes","Antes de sumar, comprueba que cada ID sea único y que los campos necesarios existan. La ausencia no equivale a cero. Un duplicado exacto no es un nuevo proceso. La calidad se mide en relación con la tarea.","Introduce duplicados y faltantes en COPIAS del corpus. Compara filas, identidades y registros incompletos.","El RAW de origen no cambia. Un registro incompleto puede requerir cuarentena o enriquecimiento.","quality",null,["La veracidad se traduce en controles. Un identificador único permite reconocer si dos filas representan la misma entidad del modelo; su repetición puede ser correcta en una tabla de eventos, pero en una tabla definida como un registro por proceso debemos investigarla. Un dato faltante indica que no conocemos un valor o que no se registró. No debe convertirse en cero o en una categoría real sin una regla explícita. La calidad depende de la finalidad: un proceso sin entidad puede servir para buscar por texto, pero no para un conteo fiable por entidad. El RAW debe mantenerse intacto para que podamos revisar las decisiones. Podemos construir una copia con errores controlados y comparar antes y después. En un sistema de producción, un registro inválido puede enviarse a cuarentena, acompañarlo de un motivo y recuperarlo después; borrarlo silenciosamente impide reconciliar cantidades.","Si tenemos 200 identificadores y duplicamos cinco filas, obtenemos 205 filas pero solo 200 identificadores únicos. Si tres registros originales pierden su entidad antes de ser copiados, algunas copias también pueden quedar sin entidad. Por eso el número de filas con campos ausentes no necesariamente coincide con la cantidad de identidades afectadas. Ambas métricas responden preguntas distintas.","Introduce cinco duplicados y tres entidades faltantes; observa los cuatro indicadores. Luego cambia a cero duplicados sin modificar los faltantes. Comprueba que los datos originales no cambiaron. Decide cuál usarías para controlar identidad y cuál para decidir si un registro puede entrar en el resumen por entidad.","Calidad incluye integridad de esquema, unicidad, completitud, validez y coherencia. Una fila ausente en entidad no debe rellenarse con un nombre imaginado. Los duplicados exactos pueden ser resultado de reintentos; un ID repetido con campos distintos requiere resolver versión o conflicto. Reporta cantidad de registros afectados por cada condición; las condiciones pueden solaparse. Por ejemplo, una copia duplicada con entidad vacía cuenta en ambos controles. No sumes porcentajes como si las categorías fueran excluyentes."],"A3"],[5,"08 · Primera transformación","Filtrar no es agrupar","Filtrar selecciona filas, proyectar selecciona campos y agrupar cambia el grano. Contar procesos por entidad responde cuántos registros de la muestra pertenecen a cada entidad; no cuánto gastó ni si existe irregularidad.","Elige una entidad y calcula su número de procesos. Cambia el universo 40/80/120/200 y observa los conteos.","Conserva denominador y muestra. No extrapoles concentración al universo SECOP.","groups",null,["Una consulta tabular tiene operaciones con efectos diferentes. Filtrar es seleccionar filas que cumplen una condición; proyectar es elegir un subconjunto de columnas; agrupar reúne observaciones con una clave común; agregar calcula una medida para cada grupo. Si agrupamos por entidad y contamos, cada fila del resultado representa una entidad, no un proceso individual. El conteo de cada grupo depende del universo elegido y de cómo tratamos campos faltantes. Ordenar por conteo ayuda a identificar qué entidades aparecen más en la muestra; no introduce por sí mismo una interpretación de riesgo. Al combinar resultados de diferentes tamaños debemos usar el mismo filtro o declarar que los universos cambian. En particular, contar los primeros 40 procesos y los primeros 120 no es un experimento de representatividad, sino un análisis de sensibilidad a la cantidad seleccionada.","Supón que P1 y P2 pertenecen a A y P3 a B. Si agrupamos por entidad, A tiene dos y B tiene uno. El resultado tiene dos filas y la suma de los conteos es tres. Si filtramos A primero, el universo se reduce a dos. Contar filas del resultado agrupado devuelve dos entidades, no tres procesos.","Selecciona 40, 80, 120 y 200 en el explorador. Para cada selección registra el total y el número de entidades distintas. Identifica si la entidad más frecuente cambia de posición. En el cuaderno S01-A reproduce el conteo por entidad; verifica que la suma de todos los conteos coincide con la cantidad de procesos seleccionados.","Filtrar reduce filas según una condición; seleccionar columnas reduce atributos, y agrupar cambia el grano a una fila por clave. Las operaciones no son intercambiables. Si primero agrupas por entidad y después filtras un conteo, seleccionas entidades; si filtras procesos antes de agrupar, alteras el universo de cada entidad. Comprueba la suma de conteos de todos los grupos y los nulos antes de interpretar un top. Un ranking por cantidad no equivale a ranking por valor o riesgo."],"A3"],[5,"09 · Pandas","De la tabla a una pregunta reproducible","El DataFrame organiza filas y columnas. head permite inspección; shape describe dimensiones; nunique controla identidad; groupby().size() agrega sin inventar montos. Usa el cuaderno para ejecutar el mismo ejercicio en Python.","Abre Colab, ejecuta la preparación y el bloque puente S01-A. Cambia el límite de muestra y compara grupos.","El resultado depende del mismo corpus y selección ordenada.","code","import pandas as pd\n# corpus es el JSON versionado cargado en el puente S01-A\ndf = pd.DataFrame(corpus[\"documentos\"])\nmuestra = df.iloc[:80].copy()\nassert muestra.id_proceso.is_unique\nprint(muestra.shape)\nprint(muestra.groupby(\"entidad\").size().sort_values(ascending=False).head())",["Pandas es una biblioteca de Python para manipular datos tabulares. Un DataFrame contiene columnas que pueden tener tipos diferentes y un índice de filas. DataFrame recibe una lista de objetos JSON y organiza sus claves en columnas. head muestra una pequeña parte, no valida por sí solo el contenido completo. shape devuelve una pareja con el número de filas y columnas. La propiedad is_unique comprueba si los valores de una serie son distintos. Una serie es una estructura unidimensional, como una columna. groupby separa filas según una clave y size cuenta registros de cada grupo. sort_values ordena los resultados. Estas operaciones permiten construir una consulta reproducible, porque otra persona puede ejecutar la misma selección sobre la misma instantánea. Pandas normalmente trabaja en memoria; más adelante estudiaremos cómo combinar fragmentos y distribuir tareas cuando el problema lo requiera.","El código de la derecha crea una tabla desde el corpus cargado, selecciona las primeras ochenta filas con iloc, y usa copy para trabajar con una copia. La aserción detiene el programa si existen identificadores repetidos. Después imprime las dimensiones y los grupos con mayor conteo. Si la aserción falla, no debemos ignorarla: hay que revisar el grano y los registros.","Abre Colab y ejecuta el bloque S01-A. Si no conoces una celda, sitúa el cursor en ella y usa el botón de ejecución; lee la salida debajo. Cambia N a 40 y después a 120, ejecuta de nuevo el bloque y compara con la pantalla anterior. Conserva un ID y el conteo de su entidad.","Un DataFrame es una estructura tabular con columnas y tipos. Un booleano por fila permite seleccionar observaciones; groupby define particiones lógicas y size cuenta filas, mientras count puede excluir nulos del atributo elegido. En el cuaderno A3 compara esos resultados y observa cómo una copia con entidad ausente requiere una política explícita. No confundas una tabla bonita con una comprobación: los asserts contrastan una expectativa con el resultado y detienen el proceso si no se satisface."],"A3"],[6,"10 · Texto","Transformar descripción en una señal cuantificable","Tokenizar divide texto en unidades; contar palabras produce una representación simple. Frecuencia no implica relevancia, causalidad ni riesgo. Títulos y descripciones pueden repetir información, por eso aquí contamos solo descripción.","Escribe un término, observa cuántos documentos lo contienen y examina las palabras frecuentes.","Se distinguen ocurrencias totales de frecuencia documental; anticipa BM25 de S07.","words",null,["El texto libre no se convierte en conocimiento simplemente por almacenarlo. Para analizarlo podemos aplicar una representación elemental: separar palabras, normalizar mayúsculas y acentos cuando el objetivo lo permita, y contar unidades. Un token es una unidad resultante de esa separación. La frecuencia de ocurrencias indica cuántas veces aparece una unidad en todo el corpus. La frecuencia documental indica cuántos documentos contienen esa unidad al menos una vez. Si la palabra salud aparece tres veces en un documento y una vez en otro, tenemos cuatro ocurrencias pero solo dos documentos. Esta diferencia será fundamental para construir índices invertidos y calcular BM25 más adelante. Eliminar palabras frecuentes sin significado discriminante puede ser útil, pero debe justificarse: algunos términos tienen significado en una consulta específica. La tokenización aquí es sencilla y no comprende sinónimos ni relaciones semánticas.","En las descripciones de nuestro corpus, las palabras para y servicios aparecen con frecuencia. Eso no significa que sean las más útiles para distinguir objetos contractuales. Un término específico puede aparecer en pocos procesos y aun así ser relevante para una investigación. El explorador cuenta descripciones, no títulos, para no contar dos veces una misma frase por incluir ambos campos.","Escribe salud, contrato y una palabra que no aparezca. Predice cuál tendrá más documentos antes de ejecutar cada búsqueda. Compara ocurrencias frente a frecuencia documental. Si el resultado es cero, no concluyas automáticamente que no existe un proceso relacionado: puede utilizar otros términos. Esta limitación motiva las sesiones de recuperación de información.","Tokenizar divide una cadena en unidades según reglas. Normalizar mayúsculas y acentos ayuda a comparar variantes, pero puede eliminar distinciones. Un término repetido tres veces en un documento y una vez en otro tiene frecuencia total cuatro y frecuencia documental dos. Ambas cantidades responden preguntas diferentes. Una búsqueda literal puede omitir paráfrasis y encontrar negaciones; no es todavía búsqueda semántica. En A3 conserva el texto original junto con el conteo de tokens y describe la regla aplicada."],"A3"],[10,"Pausa","10 minutos de descanso","Al volver, pasaremos de observar los datos a diseñar una adquisición por páginas, comparar procesamiento completo y fragmentado, y producir el archivo que utilizará S02.","Conserva tu cuaderno abierto.","No se requiere ejecutar nada durante la pausa.","flow",["Fuente validada","Pausa","Adquisición","Entrega"],["","",""],null],[5,"11 · API","Qué ocurre cuando llamamos una API","Una API define una interfaz; HTTP transporta la solicitud. En Socrata, $select escoge columnas, $where filtra, $limit acota filas y $order fija un orden. HTTP 200 no prueba cobertura; es necesario validar grano e identidad.","Ejecuta las celdas de API SECOP del cuaderno. Cambia 500 a 50, observa esquema y respuesta. Este servicio devuelve registros contractuales: no unir por ID de proceso sin contrato de datos.","Conserva fecha, parámetros y conteo real. Si falla la red, registra el bloqueo y usa la instantánea de procesos para el resto.","code","import requests\nurl = \"https://www.datos.gov.co/resource/rpmr-utcd.json\"\nparams = {\"$limit\":50,\"$select\":\"nombre_de_la_entidad,departamento_entidad,valor_contrato\"}\nr = requests.get(url, params=params, timeout=30)\nr.raise_for_status()\nprint(r.status_code, len(r.json()))",["Una API es una interfaz de programación que establece cómo pedir datos o servicios. HTTP es el protocolo utilizado para transmitir la solicitud y recibir una respuesta. Un cliente envía una URL, parámetros y, cuando se requiere, credenciales; el servidor devuelve un estado, encabezados y contenido. Un estado 200 indica que la solicitud se atendió correctamente; un 429 suele indicar un límite de solicitudes y un 4xx o 5xx requiere diagnóstico. El método GET pide información. La API Socrata admite parámetros de consulta como select, where, limit y order, escritos en la URL con el prefijo de dólar. Una consulta debe acotar las columnas y filas para no transferir información innecesaria. El cuaderno usa el recurso SECOP Integrado de Datos Abiertos Colombia para registros contractuales. Es una fuente diferente de nuestro corpus de procesos; el identificador, la cobertura y el grano deben validarse antes de cualquier unión.","Una consulta con límite 50 solicita hasta cincuenta registros. Si devuelve cincuenta y responde 200, solo sabemos que recibimos esa página; no sabemos cuántos registros hay en el universo ni si es una muestra representativa. Si recibimos menos, debemos considerar los filtros, el final de la fuente o posibles cambios. La función raise_for_status evita continuar como si una respuesta de error fuera una lista válida.","Ejecuta el ejemplo del cuaderno con 50 y 500 como límites, de manera secuencial, sin repetir llamadas innecesarias. Observa el estado, la forma de la tabla y los campos. Si no funciona la conexión, registra el error sin inventar filas y continúa con la instantánea. No compares tiempos de una API cambiante como un benchmark controlado.","Una API separa interfaz y almacenamiento. El cliente conoce un contrato de respuesta, no necesariamente el motor interno. El parámetro select reduce campos devueltos; where restringe filas; limit acota resultado. Especificar estos parámetros reduce transferencia y ayuda a formular una muestra, pero una respuesta exitosa no certifica cobertura. En A4 la ruta principal no requiere red. La consulta viva es una actividad optativa de contraste con un recurso contractual de grano distinto y no se mezcla con el snapshot."],"A4"],[5,"11B · Estado de adquisición","HTTP no es una validación de calidad","Una respuesta exitosa puede ser incompleta. Un fallo transitorio puede justificar reintento limitado; un error de acceso requiere diagnóstico.","Selecciona una respuesta y observa estado, acción y evidencia.","Simulación del protocolo; no envía solicitudes al servidor.","http",null,["HTTP (protocolo de transferencia de hipertexto) permite que un cliente solicite recursos a un servidor. En una API de consulta, la URL identifica un recurso y los parámetros delimitan campos, filtros, orden y tamaño. El código de estado describe el resultado del intercambio, no la veracidad ni la cobertura semántica del contenido. Una respuesta 200 puede incluir una lista vacía, una página parcial, campos ausentes o valores inesperados. Por ello la adquisición tiene dos controles separados: transporte y contrato del dato. Si una consulta falla no se debe sustituir automáticamente el resultado por una lista vacía y avanzar el offset, porque los datos omitidos serían invisibles. Un timeout indica que la operación no respondió dentro del tiempo permitido y tampoco permite afirmar que el universo estaba vacío.","Una petición con estado 429 indica que se alcanzó alguna limitación de solicitudes; si el servidor proporciona Retry-After se debe respetar su política. Un 503 puede ser transitorio; un 401/403 indica un problema de autenticación o autorización y no se corrige repitiendo indefinidamente la misma petición. Un cliente responsable fija un tiempo de espera, número máximo de reintentos y registro de errores. Imagina que la página cero devuelve 50 registros, la página uno devuelve 429 y la dos devuelve 50. Sumar 100 filas y afirmar que el lote quedó completo omite la página que falló. La salida válida debe declarar pendiente esa página y conservar lo ya recibido. No se deben imprimir tokens ni credenciales.","Práctica: selecciona 200 con lista vacía, 200 con datos, 429, 403 y timeout. Decide cuándo finalizar y cuándo reintentar. En el cuaderno A4 se prueba una máquina de estados de peticiones con respuestas controladas; A5 trabaja con datos congelados. La consulta viva opcional tiene límite pequeño y registra la fuente. Compara sus campos con el corpus, pero no declares cobertura del universo SECOP. En un trabajo profesional, conserva los parámetros y la fecha de extracción para explicar qué se pidió.","Clasifica cada fallo antes de recuperar. Una petición que no llegó a responder se registra como desconocida, no como lista vacía. Si un estado permanente impide el acceso, cambiar offset no resuelve autorización. Un reintento acotado sobre la misma petición puede repetir filas si ya había persistido el resultado; se verifica identidad. La política de reintentos depende del servicio y se mantiene dentro de su cuota."],"A4"],[5,"12 · Paginación","LIMIT y OFFSET sin perder registros","Una página es un subconjunto ordenado. OFFSET desplaza el inicio; un último bloque puede ser menor que el límite. Un orden estable reduce inconsistencias, pero no congela una API que cambia mientras se consulta.","Cambia el límite y el offset en la instantánea real. Verifica primera y última identidad de la página.","Compara cobertura de la secuencia completa: todas las identidades exactamente una vez. Aquí no se está llamando a una API.","pages",null,["La paginación permite recuperar un conjunto grande a través de solicitudes pequeñas. LIMIT indica el máximo de filas de una página y OFFSET cuántas filas omitir antes de comenzar. Para un conjunto estático de 200 registros con límite 30, las páginas comienzan en 0, 30, 60, 90, 120, 150 y 180. La última contiene veinte filas. El orden debe ser estable y, cuando sea posible, utilizar una clave única; si dos filas empatan, un segundo criterio de ordenación evita ambigüedad. En una API viva, insertar o eliminar registros antes de nuestro offset puede desplazar páginas y provocar duplicados u omisiones. Un orden estable ayuda, pero no congela los datos. En una adquisición más exigente necesitamos una ventana temporal fija, una instantánea del proveedor o una estrategia de paginación por clave, según las garantías de la fuente.","Si descargamos con límite 50 y offsets 0, 50, 100 y 150, el corpus estático debe devolver cuatro páginas. Si por error usamos offsets 0, 40, 80 y 120, algunas páginas se solapan y faltan filas del final. Contar cuatro páginas de cincuenta no detectaría el problema; comparar IDs únicos sí lo revela. Por eso debemos comprobar cobertura e identidad, no solo suma de tamaños.","En el simulador fija límite 30 y observa la primera página. Salta al offset 180 para verificar el último bloque. Después prueba límite 50 y calcula el número de páginas antes de mirar el indicador. Explica por qué un offset 200 devuelve cero filas y por qué este ejercicio no garantiza cobertura de una API en vivo.","Para una lista de N elementos, con limit L y salto igual a L, el número de páginas es techo(N/L). La última puede ser parcial. Si N=12 y L=5, offsets 0,5,10 devuelven 5,5,2. Un bucle que se detiene antes de leer la última ventana pierde dos registros. Si no se conoce N, una respuesta menor que limit puede servir como criterio de parada solo bajo las garantías documentadas por la fuente; no generalices ese comportamiento a todos los servicios."],"A5"],[5,"12B · Control de cobertura","¿Cómo detectamos una adquisición incompleta?","La cantidad recibida puede ser correcta y aun así contener duplicados y omisiones. Compara IDs, no solamente filas.","Cambia el desplazamiento entre páginas. Observa el solapamiento y los registros ausentes.","Prueba sobre instantánea estática, no sobre API viva.","coverage",null,["La paginación es un procedimiento de adquisición, no una prueba de completitud. En una fuente estática conocemos un universo de identificadores y podemos verificar si todos fueron recuperados. En una fuente remota que cambia, ese universo debe fijarse mediante un contrato, por ejemplo una ventana de tiempo, y un mecanismo de consulta que permita reproducirla. Si la API no ofrece una instantánea coherente, debemos declarar la limitación. La primera comprobación es contar filas recibidas; la segunda es contar identificadores únicos; la tercera compara el conjunto recibido con el conjunto de referencia cuando este se conoce. Los tres resultados responden preguntas diferentes. Si un ID se repite, la cantidad de filas aumenta sin ampliar cobertura. Si una página se omite, una simple deduplicación no recupera los registros faltantes. La corrección debe actuar sobre la adquisición y no solamente limpiar el resultado.","En el ejemplo de 200 procesos, solicitamos cuatro páginas de 50. Con desplazamientos 0, 40, 80 y 120 recuperamos 200 filas, pero solo 170 identidades: faltan 30 y existen 30 repeticiones. Con desplazamientos 0, 50, 100 y 150 recuperamos 200 filas e identidades. El número de páginas y de filas es idéntico; la cobertura es distinta. Este es un ejemplo controlado con datos reales de la instantánea, no un fallo observado en SECOP.","Compara saltos de 40 y 50 con límite fijo de 50. Revisa las cuatro páginas y observa los indicadores antes de ver los identificadores ausentes. Cambia a 60 y explica por qué aparecen huecos. Escribe la regla de validación en términos de conjuntos: no basta afirmar que filas recibidas igualan filas esperadas.","La conciliación debe usar identidades. Si llegan 200 filas pero existen 170 IDs, hay 30 repeticiones adicionales. Si el universo congelado tiene 200 IDs y todas las filas pertenecen a ese universo, faltan 30. Es posible recibir un ID inesperado; por eso el control debe informar también extras. En A5 el conjunto esperado está disponible y permite verificar exactamente faltantes y extras. En un universo desconocido se necesita otra evidencia."],"A5"],[5,"12C · Orden y cambios","Una paginación por posiciones necesita un universo estable","Ordenar por una clave única hace reproducible una lista congelada. Insertar un registro entre solicitudes puede desplazar posiciones.","Activa la inserción entre páginas y verifica ausentes y repetidos.","Modelo de lista ordenada, no una ejecución Socrata.","order",null,["La paginación por offset obtiene posiciones, no identidades. Si una consulta pide los primeros cuatro registros y luego omite cuatro, está suponiendo que el orden anterior se conserva. Cuando una nueva fila aparece antes de la segunda ventana, algunos registros ya leídos pueden desplazarse hacia la ventana siguiente. Cuando una fila desaparece, otra puede desplazarse hacia la parte omitida. Un orden por fecha que admite empates tampoco define un orden total; agregar una clave única de desempate ayuda a obtener una secuencia estable dentro de la misma versión. Para garantizar una extracción completa hace falta un mecanismo de snapshot, cursor o estrategia de límites de tiempo compatible con la fuente; ordenar por sí solo no congela un sistema vivo.","Ejemplo: la lista original contiene P01 a P08. Leemos P01–P04. Antes de la segunda consulta se inserta P00 al inicio. La lista nueva es P00,P01,P02,P03,P04,P05,P06,P07,P08. La segunda ventana con offset cuatro devuelve P04–P07. Recibimos P04 dos veces y falta P08 respecto del universo inicial. El nuevo P00 tampoco está cubierto, aunque estaba presente durante la segunda consulta. Una lista de identidades únicas y la observación de cambios permiten detectar inconsistencias; no pueden reconstruir por sí solas el estado histórico de una API que no lo expone.","Práctica: alterna la inserción, predice las dos ventanas y compara los conjuntos. Después plantea una política para una fuente que publica actualizaciones periódicas: captura hora, filtros y orden; si existe un cursor estable, úsalo según la documentación; si no existe, reconcilia IDs y registra que la cobertura es una estimación del momento de extracción. A5 compara el corpus congelado. El reto no consiste en memorizar offset, sino en reconocer los supuestos que lo hacen correcto.","Una lista mutable exige explicitar qué significa completo: completo respecto de qué versión, fecha o filtro. Un orden estable evita empates arbitrarios, no inserciones. Un mecanismo incremental por cursor o marca temporal puede mejorar continuidad si el servicio lo soporta y se define un desempate para eventos con la misma marca. No inventes una garantía de snapshot. La práctica de aula conserva un universo fijo y por eso la igualdad de conjuntos es comprobable."],"A5"],[5,"13 · Fragmentar","Leer por fragmentos y reducir resultados","Si el archivo no cabe en memoria, podemos procesar lotes y conservar parciales. Para conteos basta sumar; para medias se combinan suma y cantidad. El promedio de promedios solo coincide si los tamaños son iguales, salvo coincidencias especiales.","Cambia el tamaño del bloque. Calcula conteos de entidad por fragmento y compara contra una pasada completa.","El motor local ejecuta ambas rutas y comprueba igualdad; no mide RAM de pandas.","chunks",null,["Procesar por fragmentos consiste en leer una cantidad limitada de filas, realizar una operación y descartar o persistir el resultado parcial antes de continuar. Esto permite reducir la cantidad de datos de entrada mantenidos simultáneamente en memoria. No todas las operaciones admiten la misma estrategia. Un conteo, una suma, un mínimo o un máximo pueden combinarse de forma sencilla; una mediana exacta global no se obtiene promediando medianas de bloques. Para agrupar por entidad, cada fragmento produce un mapa de entidad a cantidad. La reducción suma los parciales de cada clave. Al final, comparamos ese mapa con un conteo directo calculado sobre las mismas filas. Esta separación entre procesamiento parcial y combinación anticipa MapReduce, que veremos más adelante. Procesar secuencialmente bloques en una sola máquina no constituye ejecución distribuida; los datos se dividen lógicamente, pero el programa puede ejecutarlos uno tras otro.","Con dos bloques, el primero contiene A, A y B; el segundo contiene A y C. Los parciales son A:2, B:1 y A:1, C:1. La reducción obtiene A:3, B:1 y C:1, igual que una agrupación directa. Si un bloque contiene un ID que ya apareció en otro bloque, sumar conteos de filas todavía funciona, pero no equivale a contar identificadores únicos; se requiere otro estado.","Prueba bloques de 25, 40 y 100 filas. Revisa el número de bloques, la suma de sus tamaños y la igualdad de los conteos. Usa S01-A del cuaderno para repetir con un tamaño de bloque que no divida exactamente N. Explica por qué la última parte es menor y por qué el resultado final se conserva.","Procesar por fragmentos evita materializar toda la entrada a la vez. Un acumulador mantiene el estado necesario y puede crecer si hay muchísimas claves distintas. Para contar por entidad, la memoria de la tabla parcial depende del tamaño del bloque y la del acumulador del número de entidades. Si se requieren orden global o join entre todas las claves, el algoritmo puede necesitar más estado o almacenamiento temporal. El valor de chunksize controla entrada, no todos los costos."],"A6"],[6,"14 · Experimento manual","Por qué una media de medias puede ser incorrecta","Lote A: 2 observaciones de valor 10. Lote B: 8 observaciones de valor 100. Media simple de medias: 55. Media ponderada: (20+800)/10=82. El denominador importa al combinar resultados.","Cambia tamaños de los lotes y compara las dos medias. Predice cuándo serán iguales.","No confundir una media por grupo con una media de todas las filas.","mean",null,["Una media aritmética se define como la suma de los valores dividida entre la cantidad de observaciones válidas. Si procesamos bloques de tamaños diferentes, calcular la media de cada bloque y después promediar esas medias asigna el mismo peso a todos los bloques, independientemente de cuántas observaciones contengan. Para conservar la media global necesitamos mantener dos estados parciales: la suma de valores y el número de observaciones válidas. Al terminar sumamos todas las sumas, sumamos todos los conteos y dividimos. Si existen faltantes, debemos excluirlos del numerador y denominador según una regla consistente. El número de filas del fragmento no siempre es el número de observaciones válidas. Este ejemplo muestra que el diseño del estado parcial es una decisión matemática, no una característica automática de la herramienta de almacenamiento.","El lote A contiene dos valores de diez; su suma es veinte y su media diez. El lote B contiene ocho valores de cien; su suma es ochocientos y su media cien. Promediar las dos medias produce 55. La suma total es 820 y el conteo total es diez, así que la media correcta es 82. Con dos lotes de igual tamaño, la media simple de medias coincide con la media global, siempre que ambos tengan el mismo número de valores válidos.","Mueve la cantidad del lote A a ocho, dejando B en ocho; predice la media antes de mirar. Luego prueba A=20 y B=1. En cada caso calcula a mano la suma y el conteo. Indica qué dos variables llevarías de un bloque a otro en pandas para evitar el error.","Una media de medias solo coincide con la media global cuando los grupos tienen igual número de observaciones válidas, o por coincidencia particular de valores. Con tamaños diferentes, el peso de cada media debe ser su conteo. Si el objetivo es comparar departamentos como unidades, promediar sus medias puede ser una pregunta válida distinta; si se quiere el promedio de todos los contratos, el peso corresponde al contrato. Declara el grano de la métrica antes de elegir fórmula."],"A6"],[6,"14B · Estado combinable","Una reducción correcta conserva información suficiente","Para calcular la media necesitamos suma y conteo de valores válidos. Los nulos no son ceros. Para un máximo basta un máximo parcial.","Cambia la proporción de faltantes y compara media global con media de medias.","Datos sintéticos; la regla de tratamiento de faltantes es parte del contrato.","acc",null,["Fragmentar una fuente es una decisión de ejecución. La operación matemática debe conservar su significado al cambiar el tamaño de los bloques. Una reducción (reduce) combina estados parciales con una regla definida. Para un conteo se suman conteos; para una suma se suman sumas. Para media, la información suficiente es la pareja suma y número de valores válidos. La pareja se combina sumando cada componente y la división se hace una sola vez al terminar. Si no existe ningún valor válido, la media no está definida: informar cero sería inventar una observación. No todas las estadísticas se reducen con el mismo estado: una mediana exacta requiere suficiente información del orden de los valores; la mediana de medianas no es generalmente la mediana global.","Considera A=[10,10,null] y B=[100,100,100,100]. Si se ignoran nulos, A tiene suma 20 y conteo 2; B tiene suma 400 y conteo 4. La media global es 420/6=70. Promediar medias de bloques da (10+100)/2=55, que asigna el mismo peso a dos tamaños distintos. Tratar el nulo como cero produce 420/7=60, respuesta a otra pregunta. Por eso las reglas de calidad se declaran antes de agregar. Un fragmento vacío no debe provocar división por cero; conserva estado (0,0). El tamaño de un bloque no determina automáticamente el número de observaciones válidas.","Práctica: cambia la cantidad de nulos y valores de B. Compara media de medias, media combinada y conteo válido; busca un caso en que coincidan por casualidad. En A6 trabaja con CSV generado, verifica que los agregados no cambien con chunksize y mide memoria lógica. Si cambias el algoritmo, el filtro o los tipos, ya no estás haciendo una comparación justa. En una sesión posterior Dask y Spark generalizarán la idea de estados parciales, aunque no convierten automáticamente todas las funciones de pandas en reducciones combinables.","Cuando todos los valores son faltantes, una suma cero y conteo cero no implican media cero. El estado combinado permite distinguir ausencia de observaciones de observaciones cuyo valor suma cero. Para una varianza puede combinarse un estado apropiado, pero una implementación ingenua con diferencias de cuadrados puede sufrir cancelación numérica. Esta sesión se limita a conteos, sumas y medias, porque son suficientes para el producto de adquisición."],"A6"],[8,"15 · Capacidad real en Python","Medir, no adivinar","El cuaderno original lee 546.212 filas de ICFES según su referencia histórica. Verifica la salida de tu ejecución, no copies la cifra. Cambiar chunksize modifica el máximo de filas por bloque, pero no debería cambiar el resultado. El puente S01-B usa además CSV sintético acotado y mide tiempo y memoria de DataFrame. En una prueba local realizada durante esta revisión, 100.000 filas ocuparon 1.600.132 bytes de DataFrame; con bloques de 1.000, el mayor bloque ocupó 16.132 bytes. La suma fue 4.999.545 en ambos casos. Reproduce el cálculo con tus propios tiempos.","Ejecuta S01-B con 10.000 y 100.000 filas; cambia chunksize a 500 y 5.000. Conserva suma, conteo, bytes y tiempos.","No comparar tiempos de redes distintas como si fueran un benchmark controlado. memory_usage no es pico RSS.","code","for fragmento in pd.read_csv(ruta_csv, chunksize=1000):\n    n += len(fragmento)\n    s += int(fragmento[\"valor\"].sum())\nassert (n, s) == referencia\n# el bloque S01-B incluye generación y medición completas",["El experimento de capacidad utiliza dos rutas que resuelven exactamente el mismo problema sobre un archivo sintético: leer todas las filas y sumar una columna, o leer por fragmentos y sumar los parciales. La fuente sintética usa una regla conocida para generar valores, lo que permite repetir pruebas sin descargar archivos grandes. Los tiempos se miden con un reloj monotónico de alta resolución. La medición empieza justo antes de leer el archivo y termina después de calcular conteo y suma. La generación del CSV queda fuera de ambas mediciones. memory_usage de pandas estima bytes correspondientes a la estructura del DataFrame y sus columnas; no mide el pico de RAM de todo Python, ni incluye necesariamente buffers temporales de lectura. Un bloque de mil filas puede tener una estructura mucho menor que una tabla de cien mil, aunque existan otros consumos en el proceso. Un bloque pequeño aumenta el número de iteraciones y puede empeorar el tiempo.","Para cien mil filas con dos columnas enteras de ocho bytes, el tamaño lógico de los valores es 1.600.000 bytes; el índice y la estructura contabilizada pueden añadir bytes. Un bloque de mil contiene unos 16.000 bytes de valores. La proporción ayuda a explicar por qué fragmentar es útil, pero el tiempo debe medirse en cada entorno. La suma esperada se calcula con la misma regla de generación y debe coincidir exactamente entre las dos rutas.","Ejecuta S01-B primero con 10.000 filas y luego con 100.000. Fija 100.000 y compara bloques de 500, 1.000 y 5.000. Registra el tamaño completo, el máximo por bloque y los segundos. No repitas la generación dentro de cada medición. Si los tiempos cambian, explica posibles costos de lectura y coordinación sin declarar que una única medición prueba una ventaja universal.","Una medición de memoria lógica del DataFrame suma estimaciones de sus columnas e índice. No mide el máximo de memoria residente del proceso, que incluye intérprete, buffers y otras estructuras. Tiempo de lectura depende de caché, formato, máquina y estado del almacenamiento. A6 mantiene N y datos fijos y cambia únicamente chunksize. No uses una sola corrida para proclamar un ganador universal; reporta tiempos observados y equivalencia de resultados. Para una comparación más rigurosa repite, intercala orden y mide pico RSS con una herramienta apropiada."],"A6"],[7,"16 · Reutilizar el resultado","RAW, derivados y trazabilidad","RAW conserva el dato original recibido. Un derivado registra qué transformación lo generó. El manifiesto guarda fuente, cantidad, esquema y huella. Una huella de consistencia detecta cambios pero no certifica autoría.","Selecciona 40, 80 o 120 procesos y ejecuta el producto S01. Comprueba IDs y procedencia; descarga estado compatible con S02.","La selección es un prefijo del corpus. La API contractual sigue siendo una fuente diferente.","export",null,["Un sistema reproducible conserva los datos de entrada y los parámetros necesarios para repetir el cálculo. RAW significa dato recibido en su forma original dentro del alcance de la adquisición. En nuestro ejemplo el RAW portable contiene una selección sin cambios de los objetos del corpus docente, con sus identificadores y metadatos; no es una copia completa de SECOP. Los derivados son resultados como conteos, tablas y catálogos. Un manifiesto describe fuente, esquema, número de registros, selección y transformaciones. Una huella de contenido o de estado permite detectar cambios de coherencia, pero debe distinguirse de una firma digital de identidad. El observatorio utiliza una huella de coherencia para enlazar etapas; el cuaderno exporta evidencia con SHA-256 para comprobar integridad de la serialización. Ninguna prueba de hash certifica por sí sola quién ejecutó un programa ni si los datos proceden efectivamente de un servicio remoto.","Seleccionar ochenta procesos de la instantánea produce una cobertura de 80/200, es decir, cuarenta por ciento del corpus docente. No significa cuarenta por ciento del universo SECOP. El estado exportado contiene los registros seleccionados y su huella; al importarlo, la aplicación recalcula la etapa y rechaza modificaciones que no coinciden con la fuente versionada.","Selecciona la misma cantidad N que utilizaste en Python. Ejecuta la adquisición, revisa el conteo y descarga el JSON de estado y la prueba de fragmentación. En el observatorio importa el estado; verifica que S01 aparece confirmada. Conserva aparte evidencia_s01.json del cuaderno. El JSON de prueba no reemplaza el estado ni el archivo de evidencia.","Un producto de datos empieza con una identidad y una versión. El RAW conserva el contenido de las observaciones adquiridas; el manifiesto describe qué filtros y límite se utilizaron. Un conteo por entidad es un derivado y debe poder regenerarse desde RAW. El archivo de evidencia del observatorio no sustituye los datos originales. El cuaderno A7 genera un directorio exclusivo con los archivos, los abre de nuevo, calcula huellas y compara los conteos. Así otro usuario puede revisar sin confiar solo en una captura."],"A7"],[7,"16B · Auditoría del producto","Un hash no reemplaza el control de identidad","El manifiesto fija fuente, grano, esquema y SHA-256. Se debe comprobar que los bytes y las identidades coincidan tras reabrirlos.","Compara el mismo contenido, contenido modificado y orden distinto.","Una huella diferente prueba cambio de bytes, no error semántico ni fraude.","manifest",null,["RAW es una copia de la información adquirida antes de transformaciones que puedan modificar su significado. Derivado es una representación producida por una operación definida. Un manifiesto documenta qué archivos pertenecen a una extracción, sus tamaños, identidad de observación, origen, versión y controles. SHA-256 es una función que produce una huella de 256 bits sobre bytes; cambios pequeños producen generalmente una huella distinta. La huella no interpreta el JSON, no verifica el autor ni certifica la verdad del contenido. Dos JSON con las mismas filas en distinto orden pueden tener huellas distintas. Para comprobar igualdad semántica se requiere una comparación adicional según la intención, por ejemplo conjuntos de IDs y contenido por ID.","Ejemplo: guarda tres procesos en un archivo JSONL (un objeto JSON por línea). Un lector puede abrir el archivo línea a línea y procesar un registro sin leer todos los demás. Si cambias el nombre de una entidad, los IDs pueden permanecer iguales y el hash cambiar. Si cambias el orden de las líneas, el conjunto de identidades y los campos por identidad permanecen iguales, pero cambian los bytes. Un manifiesto útil conserva tanto la huella exacta como los controles sobre identidad y cobertura. No declares que RAW es idéntico solo porque el número de filas coincide. Un archivo de evidencia separado registra las operaciones sobre RAW, evitando mezclar datos originales y derivados.","Práctica: ejecuta las tres alternativas y explica cuál preserva bytes, cuál identidad y cuál contenido por identidad. En A7 crea un paquete real que contiene fuente congelada, RAW adquirido, conteo por entidad y manifiesto; relee cada uno y comprueba huellas. Conserva archivos en un directorio exclusivo, no sobrescribas el RAW de una ejecución anterior. En A8 modifica límite, tamaño de bloque y escala, produce un nuevo paquete y verifica que las diferencias sean atribuibles a decisiones explícitas. S02 recibirá los requisitos y la identidad del producto, pero no se modifica S02 hasta aprobar esta sesión.","Para probar integridad, una comparación debe indicar exactamente qué propiedad se conserva. SHA-256 comprueba bytes; conjuntos de IDs comprueban identidad; un mapa ID→contenido comprueba equivalencia de registros bajo esa representación. Cambiar orden puede preservar contenido y alterar bytes. Cambiar un campo preserva ID y altera contenido. Un manifiesto puede conservar todas estas perspectivas, siempre que se precise el método. La prueba no acredita autenticidad criptográfica sin una fuente confiable de la huella."],"A7"],[7,"17 · Construir tu propia adquisición","Reto: cambia la decisión, no copies el resultado","Vuelve al banco de datos y elige una escala diferente de la demostración. Predice número de páginas, ejecuta fragmentación, comprueba igualdad y genera estado. Tu trabajo debe contener resultados que puedas explicar.","Entrega dos pruebas con escala o bloque distintos, un conteo equivalente y el estado S01. El cuaderno exporta también una evidencia SHA-256.","No borres archivos anteriores; conserva los dos resultados para comparar. No hay nueva calificación oficial.","challenge",null,["Aprender una herramienta significa poder transferir lo aprendido a una situación que no es exactamente el ejemplo mostrado. En este reto debes cambiar una decisión y observar sus efectos, conservando las demás condiciones necesarias. Si cambias simultáneamente la cantidad de procesos, el tamaño de bloque y el filtro, será difícil atribuir las diferencias a una causa. Primero mantén la selección de ochenta y modifica el tamaño de bloque. La agrupación final debe permanecer idéntica; cambia el número de iteraciones. Después mantén el tamaño de bloque y selecciona cuarenta o ciento veinte procesos. Ahora cambian el universo y potencialmente los conteos por entidad. Estas dos comparaciones enseñan a separar una decisión de ejecución de una decisión sobre los datos. Documentar un resultado inesperado es mejor que ocultarlo: registra el parámetro, la salida y el control que falló.","Una entrega reproducible podría incluir una primera prueba con 80 procesos y bloques de 20, y otra con los mismos 80 y bloques de 10. La cantidad de bloques pasa de cuatro a ocho, pero el mapa de conteos permanece igual. Una tercera prueba con 120 cambia el universo, por lo que no debes exigir que los conteos por entidad coincidan con la primera. Debes exigir que el conteo directo y fragmentado coincidan dentro de cada universo.","Construye dos pruebas propias y descárgalas con nombres distintos. Ejecuta el puente Python con la misma selección. Comprueba el total, el número de IDs únicos y el resultado de paridad. Si hay un error, corrige el parámetro o la operación y vuelve a ejecutar. Guarda el estado que entregarás a S02.","En el reto autónomo debes cambiar una entrada y anticipar un invariante: por ejemplo, con el mismo universo y tamaño de página distinto, se conserva el conjunto de IDs y el conteo por entidad. Si cambias escala, el universo cambia y ya no esperas conteos iguales. La decisión profesional es distinguir cambios de ejecución de cambios de datos. No copies las cifras de una ejecución anterior: guarda una nueva evidencia, comprueba sus controles y compara su manifestación con la predicción."],"A8"],[6,"18 · Interpretar y defender","Qué sabemos y qué no sabemos","Sabemos cuántos procesos hay en nuestra selección, cómo están representados, qué campos faltan y que el conteo fragmentado coincide. No sabemos el gasto, la representatividad, ni la causalidad. Un sistema grande requiere decisiones basadas en restricciones medidas.","Resuelve los controles y explica una limitación basada en tu resultado. Si no ejecutaste la API, declara pendiente.","La evidencia de ejecución es distinta de una respuesta conceptual.","quiz",[["HTTP 200 garantiza todos los registros","No"],["Una muestra de 80 equivale al universo","No"],["Dos conteos iguales demuestran paridad para ese cálculo","Sí"],["El corpus contiene montos contractuales","No"],["Un RAW versionado facilita reproducibilidad","Sí"]],["La interpretación es parte del procesamiento. Un resultado debe indicar qué se midió, sobre qué universo, con qué método y qué decisión permite tomar. La diferencia entre un dato observado y una conclusión causal es especialmente importante en contratación pública. Que una entidad aparezca más veces en nuestra muestra no demuestra que contrate más dinero, que sea más eficiente ni que exista una irregularidad. Tampoco se debe interpretar un resultado de una fuente sintética como una medición del mundo real. En la práctica de Big Data conviven controles de corrección, estimaciones de capacidad y mediciones de desempeño; cada uno tiene un alcance diferente. Un control de igualdad prueba la operación sobre los casos ensayados. Una estimación anticipa recursos bajo supuestos. Una medición describe una ejecución en un entorno y condiciones concretos.","Si el conteo por bloques de 80 procesos coincide con el conteo directo, podemos afirmar que esta implementación preservó ese agregado para esa selección. No podemos concluir que cualquier operación sea fragmentable de igual manera. Si el mayor DataFrame de bloque ocupa menos memoria lógica que el DataFrame completo, podemos describir esa diferencia; no afirmamos haber medido el pico total de RAM.","Resuelve los cinco controles de la derecha. Luego elige uno de tus resultados y explica cómo se lee, qué nos dice, qué no permite concluir y qué error común podría llevar a una interpretación incorrecta. Si una consulta remota falló, declara el bloqueo. Una respuesta correcta en el cuestionario no sustituye la evidencia de ejecución.","Una defensa técnica debe incluir pregunta, fuente, unidad de observación, transformación, resultado y límite. Si se afirma que una extracción es reproducible, muestra los parámetros y la identidad de versión; si se afirma que el algoritmo funciona por bloques, muestra igualdad con el cálculo de referencia. Si los datos no representan todo SECOP, evita inferencias nacionales. Identifica un fallo que detectaría cada control y otro que no detectaría; por ejemplo, un hash no detecta una descripción incorrecta proveniente de la fuente."],"A8"],[8,"19 · Relevo","Compras Claras v0.1 queda preparado","La siguiente sesión recibe una muestra de procesos con identidad y procedencia; utilizará el contrato y la decisión de escala para diseñar almacenamiento y procesamiento. Si otra persona importa el estado, puede recalcular el resultado.","Abre Compras Claras, importa el JSON generado en S01 y comprueba el estado confirmado. Luego abre S02.","Solo el estado portable confirma esta etapa. La ejecución Python se adjunta como evidencia separada.","flow",["RAW S01","Importar estado","S02 arquitectura","S03 documentos"],["La sesión termina cuando el siguiente componente puede recuperar el resultado sin depender de instrucciones informales. El contrato de entrada de S02 incluye identificador, fuente, grano y selección de procesos. A partir de esos datos definiremos requisitos de almacenamiento, procesamiento y consulta. Por ejemplo, si Laura necesita actualizar expedientes una vez al día, puede considerar una adquisición por lotes; si requiere alertas con demoras muy pequeñas, deberá analizar una arquitectura diferente. Aún no seleccionamos MongoDB, Cassandra ni Spark automáticamente. Primero preguntaremos cómo se utilizará el dato y qué restricciones debe cumplir el sistema. El producto acumulativo conserva cada etapa y permite recalcularla; si la selección de S01 cambia, el diseño posterior debe revisarse porque cambia su entrada. La evidencia de Python acompaña el resultado portable, pero no sustituye una integración automática ni una prueba de servicios externos.","Una persona abre el estado S01 y observa ochenta registros, todos con ID único. Puede recalcular los conteos desde la instantánea. Si modifica una entidad dentro del JSON sin pasar por una transformación válida, la comprobación detecta que el estado ya no coincide. Esta trazabilidad constituye una base para la arquitectura, no una garantía de que las decisiones de negocio posteriores sean correctas.","Importa tu estado en Compras Claras y verifica la etapa S01. Abre S02 y revisa qué entrada recibirá. Conserva las dos pruebas de fragmentación y la evidencia Python. Antes de avanzar, asegúrate de poder explicar por qué la lectura por bloques conserva un conteo, cuándo la nube sería útil y por qué no puedes calcular gasto contractual desde el corpus actual.","El relevo de S01 no obliga a instalar un clúster. S02 necesita saber qué datos existen, cuántos, con qué esquema, frecuencia de actualización, identidad, operaciones previstas y restricciones. Un manifiesto con información incompleta debe declarar desconocidos en lugar de inventar requisitos. El producto de esta sesión es una extracción verificable y una capacidad demostrada de procesar por bloques. La arquitectura futura se diseña a partir de esas evidencias y de necesidades nuevas, no a partir de la popularidad de una tecnología."],"A8"]],source={"r idad","id_proceso","nombre_proceso"],"transfer":"Cambia el campo y comprueba cuántos valores distintos tiene.","labVariable":"bandeja_df","labKind":"dataframe","labDescription":"MongoDB: exportar resultado de consulta; explain es una evidencia distinta.","input":"02"}},{"id":"04","mission":{"title":"Crear bandeja","story":"Laura quiere volver a abrir los expedientes seleccionados.","output":"queue","action":"Guardar la lista de IDs y verificar que se recupera al importar el archivo.","parameter":"Tamaño de bandeja","options":["5","10","20"],"transfer":"Cambia de 5 a 20 y verifica el número de IDs, sin llamar riesgo al orden.","labVariable":"bandeja","labKind":"dataframe","labDescription":"Atlas: exportar la vista o bandeja realmente producida.","input":"03"}},{"id":"05","mission":{"title":"Resolver consultas","story":"La bandeja debe responder por una clave conocida.","output":"partitions","action":"Construir grupos por clave y recuperar un grupo sin recorrer todo.","parameter":"Clave de agrupación","options":["entidad","fuente","tipo_registro"],"transfer":"Compara entidad y fuente; observa concentración y consulta que deja de ser adecuada.","labVariable":"candidatos","labKind":"dataframe","labDescription":"Cassandra: guardar resultado de CQL y comparación independiente; candidatos es referencia pandas, no prueba CQL.","input":"04"}},{"id":"06","mission":{"title":"Explorar conexiones","story":"Laura necesita navegar entre la entidad y sus procesos.","output":"graph","action":"Construir aristas de hechos documentados; no inventar proveedores.","parameter":"Número de entidades","options":["3","5","10"],"transfer":"Cambia el número de entidades y verifica que cada arista apunta a un proceso real.","labVariable":"export","labKind":"dataframe","labDescription":"Neo4j: resultado relacional del cuaderno; validar NIT y procedencia, sin unir por nombre si no corresponde.","input":"05"}},{"id":"07","mission":{"title":"Encontrar por palabras","story":"Los expedientes ya se pue
