{c:'Despliegue',k:'CREDENCIALES',t:'Dos valores; cero secretos en el notebook',l:'La URL identifica el servicio. La API key autoriza la llamada.',b:`
<div class="grid two"><div class="card blue"><b>Project URL</b><code>https://...elastic.cloud</code><br><span class="small">No es una contraseña.</span></div><div class="card red"><b>API key</b>Secreto. Se captura con <code>getpass()</code> o Colab Secrets.</div></div>
<div class="call"><b>Regla:</b> nunca publiques la clave en GitHub, capturas ni entregas.</div>`},
{c:'Despliegue',k:'PYTHON CLIENT',t:'La prueba mínima de conexión',l:'Ya conocen este patrón por Atlas: conectar y verificar antes de construir.',b:`
<pre>from elasticsearch import Elasticsearch
from getpass import getpass

endpoint = input("Project URL: ").strip()
api_key = getpass("API key: ")

client = Elasticsearch(endpoint, api_key=api_key)
client.info()</pre>
<div class="call">Si <code>client.info()</code> responde, Python ya habla con Elasticsearch.</div>`},
{c:'Mapping',k:'MAPPING',t:'Antes de cargar: decide cómo se indexa cada campo',l:'Un mapping es una decisión de diseño, no decoración JSON.',b:`
<table class="table"><tr><th>Campo</th><th>Necesidad</th><th>Tipo</th></tr>
<tr><td>nombre_proceso</td><td>buscar palabras</td><td><code>text</code></td></tr>
<tr><td>descripcion</td><td>buscar palabras</td><td><code>text</code></td></tr>
<tr><td>entidad</td><td>filtrar exactamente</td><td><code>keyword</code></td></tr>
<tr><td>departamento_entidad</td><td>filtrar/agrupar</td><td><code>keyword</code></td></tr>
<tr><td>id_proceso</td><td>identidad exacta</td><td><code>keyword</code></td></tr></table>`},
{c:'Mapping',k:'TEXT VS KEYWORD',t:'Una decisión que cambia la consulta',l:'No elijas el tipo por “parece texto”; elige por cómo lo vas a usar.',b:`
<div class="grid two"><div class="card green"><b>text</b>Se analiza. Ideal para full-text search.</div><div class="card blue"><b>keyword</b>Conserva el valor como unidad exacta. Ideal para filtros, IDs y categorías.</div></div>
<div class="call"><code>term</code> sobre un <code>text</code> analizado suele ser una señal de que el diseño mental está mezclando conceptos.</div>`},
{c:'Mapping',k:'_ANALYZE',t:'Pregúntale al motor qué tokens produjo',l:'Esta es la unión entre la teoría y la infraestructura real.',b:`
<pre>client.indices.analyze(
    index=INDEX_NAME,
    analyzer="spanish",
    text="Servicios de mantenimiento de las aeronaves"
)</pre>
<div class="call">No imagines el analyzer: <b>obsérvalo</b>.</div>`},
{c:'Mapping',k:'CREATE INDEX',t:'Cada estudiante usa un índice propio',l:'El cuaderno deriva un nombre seguro desde tu alias para evitar colisiones.',b:`
<pre>INDEX_NAME = f"s07-compras-claras-{alias_seguro}"

client.indices.create(
    index=INDEX_NAME,
    mappings=mappings
)</pre>
<div class="call">Esto también permite trabajar en parejas o incluso compartir un proyecto sin pisar el índice de otro equipo.</div>`},
{c:'Ingesta',k:'BULK',t:'Cargar 1.994 procesos de una vez',l:'El helper bulk es el patrón recomendado para ingesta masiva desde Python.',b:`
<pre>from elasticsearch.helpers import bulk

acciones = (
  {"_index": INDEX_NAME,
   "_id": d["id_proceso"],
   "_source": d}
  for d in corpus.to_dict("records")
)

ok, errores = bulk(client, acciones, refresh=True)</pre>
<div class="call">El patrón importa más que el volumen de hoy: iterar documento por documento no escala igual.</div>`},
{c:'Ingesta',k:'VERIFICACIÓN',t:'No asumas que cargar = haber cargado',l:'Toda ingesta debe terminar con una comprobación.',b:`
<div class="grid two"><div class="card green"><b>Esperado</b><span class="bigmetric">1.994</span><span class="small">documentos únicos del corpus.</span></div><div class="card"><b>Comprobación</b><code>client.count(index=INDEX_NAME)</code><br><br>Debe coincidir con <code>len(corpus)</code>.</div></div>`},
{c:'Consulta',k:'MATCH',t:'Primera búsqueda de texto completo',l:'match analiza la consulta usando la lógica del campo.',b:`
<pre>client.search(
  index=INDEX_NAME,
  query={
    "match": {
      "descripcion": "mantenimiento aeronaves"
    }
  },
  size=5
)</pre>`},
{c:'Consulta',k:'MULTI_MATCH',t:'La información vive en más de un campo',l:'Busca a la vez en el nombre y la descripción.',b:`
<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso", "descripcion"]
  }
}</pre>
<div class="call">Ahora el ranking puede usar coincidencias en cualquiera de los dos campos.</div>`},
{c:'Consulta',k:'BOOST',t:'El nombre puede valer más que la descripción',l:'Un boost representa una decisión de relevancia que debes poder defender.',b:`
<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso^2", "descripcion"]
  }
}</pre>
<div class="call"><code>^2</code> no significa “doble de probabilidad”; significa <b>más peso relativo</b> para ese campo dentro de la consulta.</div>`},
{c:'Consulta',k:'FILTER',t:'Restringir sin convertir la condición en relevancia',l:'El contexto filter aplica condiciones exactas y no aporta score.',b:`
<pre>{
  "bool": {
    "must":  [ ... búsqueda textual ... ],
    "filter":[
      {"term":{"tipo_registro":"historico_adjudicado"}}
    ]
  }
}</pre>
<div class="call">Buscar “qué tan relevante” y filtrar “qué debe cumplir” son dos operaciones distintas.</div>`},
{c:'Consulta',k:'HIGHLIGHT',t:'Muéstrame dónde coincidió',l:'El score ordena; el highlight ayuda a inspeccionar por qué apareció.',b:`
<pre>"highlight": {
  "fields": {
    "nombre_proceso": {},
    "descripcion": {}
  }
}</pre>
<div class="card green" style="margin-top:1.1cqw">SERVICIOS DE <mark>MANTENIMIENTO</mark> ... DE LAS <mark>AERONAVES</mark> KFIR ...</div>`},
{c:'Consulta',k:'CHECKPOINT 2',t:'Diseña la consulta',l:'¿Cuál combinación expresa mejor “buscar texto y luego restringir por tipo de registro”?',b:`
<div class="checkpoint" data-check="c2"><div class="choices">
<button class="choice" data-ok="0">A · Dos term queries: una para descripción y otra para tipo.</button>
<button class="choice" data-ok="1">B · multi_match en must + term dentro de filter.</button>
<button class="choice" data-ok="0">C · filter para el texto y match para el ID exacto.</button>
<button class="choice" data-ok="0">D · ordenar por id_proceso y usar el orden como score.</button>
</div><div class="feedback" aria-live="polite">Elige una opción.</div></div>`},
{c:'Consulta',k:'AHORA TÚ',t:'Cuaderno · Bloques B–E',l:'Conecta, crea el índice, observa el analyzer, carga y construye la consulta paso a paso.',b:`
<div class="grid four">
<div class="step"><strong>1</strong><span><b>Conecta</b><br>client.info()</span></div>
<div class="step"><strong>2</strong><span><b>Indexa</b><br>mapping + _analyze</span></div>
<div class="step"><strong>3</strong><span><b>Ingiere</b><br>bulk + count</span></div>
<div class="step"><strong>4</strong><span><b>Busca</b><br>match → highlight</span></div>
</div>
<div class="call"><a class="cta" href="../assets/tutoriales/s07-despliegue-elasticsearch.html">Abrir guía de despliegue</a></div>`},
{c:'Experimento',k:'RELEVANCIA',t:'Tocar una sola perilla',l:'La mejora de búsqueda empieza con experimentos controlados, no con “poner más cosas”.',b:`
<div class="grid">
<div class="card green"><b>Experimento A</b><code>nombre_proceso^1</code></div>
<div class="card blue"><b>Experimento B</b><code>nombre_proceso^3</code></div>
<div class="card yellow"><b>Observa</b>qué IDs suben, bajan o permanecen.</div>
</div>
<div class="call">Mantén consulta, filtro y corpus constantes. Así sí puedes atribuir el cambio al boost.</div>`},
{c:'Experimento',k:'LECTURA PROFESIONAL',t:'El resultado propio importa más que el query bonito',l:'Cada equipo trabaja con una consulta asignada por alias y debe justificar el ranking que obtuvo.',b:`
<div class="grid two"><div class="card"><b>Evidencia</b>Top 5 A + Top 5 B + documentos que cambiaron posición.</div><div class="card green"><b>Decisión</b>Cuál leerías primero, cuál descartas y qué dato adicional necesitarías.</div></div>
<div class="call">No basta con decir “funcionó”: debes explicar <b>qué cambió y por qué tu decisión sigue siendo limitada</b>.</div>`},
{c:'Experimento',k:'CALIDAD',t:'Cambiar el ranking no significa mejorarlo',l:'Necesitas una definición de relevancia antes de decidir si el tuning ayudó.',b:`
<div class="grid two"><div class="card blue"><b>Información necesaria</b>¿Qué quiere encontrar Laura con esta consulta?</div><div class="card green"><b>Juicio</b>Para cada hit: ¿responde o no a esa necesidad?</div></div>
<div class="call">Primero defines el criterio; después etiquetas. No ajustes el criterio para favorecer el ranking que ya viste.</div>`},
{c:'Experimento',k:'PRECISION@5',t:'Una métrica mínima de calidad',l:'De los cinco primeros resultados, ¿cuántos juzgaste relevantes?',b:`
<div class="grid two"><div class="card green"><b>P@5 = relevantes / 5</b><span class="bigmetric">0.8</span><span class="small">significa 4 de 5 relevantes.</span></div><div class="card"><b>Camino profesional</b>Con muchas consultas y ratings, Elasticsearch ofrece <code>_rank_eval</code> con precision, MRR y DCG.</div></div>
<div class="call">Ahora sí puedes preguntar: <b>¿el boost movió documentos y además mejoró P@5?</b></div>`},
{c:'Errores',k:'CLÍNICA DE ERRORES',t:'Un fallo técnico también debe ser interpretable',l:'Reconoce el síntoma antes de cambiar código al azar.',b:`
<table class="table"><tr><th>Síntoma</th><th>Lectura probable</th><th>Primera acción</th></tr>
<tr><td>401 / 403</td><td>autorización</td><td>revisar/regenerar API key</td></tr>
<tr><td>timeout</td><td>URL/red</td><td>validar Project URL</td></tr>
<tr><td>index_not_found</td><td>índice no creado/nombre distinto</td><td>revisar INDEX_NAME</td></tr>
<tr><td>0 hits</td><td>consulta/campo/analyzer</td><td>probar términos simples + _analyze</td></tr>
<tr><td>count ≠ corpus</td><td>fallo de ingesta</td><td>inspeccionar bulk errors</td></tr></table>`},
{c:'Puente',k:'LÍMITE LÉXICO',t:'BM25 no entiende intención como un humano',l:'Si las palabras cambian demasiado, una búsqueda léxica puede perder documentos conceptualmente cercanos.',b:`
<div class="grid two"><div class="card green"><b>Consulta</b>“mantenimiento aeronaves”</div><div class="card red"><b>Documento</b>“reparación de aviones militares”</div></div>
<div class="call">Aquí nace la pregunta de S9: <b>¿podemos buscar por significado además de por palabras?</b> Hoy no la resolvemos todavía.</div>`},
{c:'Entrega',k:'EVIDENCIA',t:'Qué debe quedar al final',l:'Tres archivos pequeños; ninguno contiene credenciales.',b:`
<div class="grid">
<div class="card green"><b>s07_resultados_busqueda.csv</b>ranking A y B, score, URL, motor.</div>
<div class="card blue"><b>s07_config_busqueda.json</b>índice, consulta, mapping resumido, conteos.</div>
<div class="card yellow"><b>hito_s07_relevancia.md</b>decisión, alternativa, P@5, falso positivo y límite.</div>
</div>`},
{c:'Entrega',k:'RÚBRICA',t:'Qué hace que una entrega sea fuerte',l:'Se califica evidencia propia, despliegue verificable e interpretación.',b:`
<table class="table"><tr><th>Criterio</th><th>Peso</th></tr>
<tr><td>Conexión + índice + conteo verificado</td><td>25</td></tr>
<tr><td>Mapping + analyzer interpretados</td><td>15</td></tr>
<tr><td>Consulta escalonada y ranking</td><td>20</td></tr>
<tr><td>Experimento A/B + juicios de relevancia / P@5</td><td>20</td></tr>
<tr><td>Decisión + alternativa + límite</td><td>15</td></tr>
<tr><td>Trazabilidad sin secretos</td><td>5</td></tr></table>`},
{c:'Cierre',k:'PARA LLEVAR',t:'Ya no tienes “una búsqueda”; tienes una arquitectura',l:'Datos → análisis → índice → ingesta → consulta → ranking → decisión.',dark:true,b:`
<div class="flow"><div class="node">corpus</div><div class="arrow">→</div><div class="node">mapping + analyzer</div><div class="arrow">→</div><div class="node">BM25</div><div class="arrow">→</div><div class="node">decisión con límites</div></div>
<div class="call"><b>Siguiente frontera:</b> cuando las palabras no alcanzan, necesitaremos representación semántica.</div>`}
];

const demoDocs=[
 {id:'D1',t:'Mantenimiento KFIR',text:'mantenimiento programado mantenimiento aeronaves kfir'},
 {id:'D2',t:'Inspección C-130',text:'inspeccion mantenimiento estructural aeronave c130'},
 {id:'D3',t:'Centro aeronáutico',text:'construccion centro investigacion aeronautica'},
 {id:'D4',t:'Blindajes',text:'adquisicion blindajes aeronauticos'}
];
function toks(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[]}
function bm25(q){
 const docs=demoDocs.map(d=>toks(d.text)), qt=toks(q), N=docs.length, avg=docs.reduce((a,d)=>a+d.length,0)/N;
 const df={};docs.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));
 return demoDocs.map((d,i)=>{const tf={};docs[i].forEach(t=>tf[t]=(tf[t]||0)+1);let sc=0;
 qt.forEach(t=>{const f=tf[t]||0;if(!f)return;const n=df[t]||0,idf=Math.log(1+(N-n+.5)/(n+.5));sc+=idf*(f*2.2)/(f+1.2*(1-.75+.75*docs[i].length/avg));});
 return {...d,score:sc};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
}
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),n=document.getElementById('n'),tot=document.getElementById('tot'),chapter=document.getElementById('chapter'),prev=document.getElementById('prev'),next=document.getElementById('next'),toast=document.getElementById('toast');
stage.innerHTML=slides.map((s,i)=>`<section id="s${i+1}" class="slide ${i===0?'on':''} ${s.dark?'dark':''}" data-chapter="${s.c}"><div class="kicker">${s.k}</div><h1 class="title">${s.t}</h1><p class="lead">${s.l}</p>${s.b}</section>`).join('');
const all=[...document.querySelectorAll('.slide')];tot.textContent=all.length;let i=0;
function show(j,push=true){i=Math.max(0,Math.min(all.length-1,j));all.forEach((s,k)=>s.classList.toggle('on',k===i));n.textContent=i+1;bar.style.width=((i+1)/all.length*100)+'%';chapter.textContent=slides[i].c;prev.disabled=i===0;next.disabled=i===all.length-1;if(push)history.replaceState(null,'','#s'+(i+1));bindDynamic()}
function bindDynamic(){
 const q=document.getElementById('demoQuery'),o=document.getElementById('demoResults'),btn=document.getElementById('demoSearch');
 if(q&&o&&btn&&!btn.dataset.bound){btn.dataset.bound='1';const render=()=>{const rows=bm25(q.value);o.innerHTML=rows.length?rows.map((r,k)=>`<div class="result"><b>${k+1}. ${r.t}</b><br><span class="score">${r.score.toFixed(3)}</span> · ${r.id}</div>`).join(''):'<div class="result">Sin coincidencias.</div>'};btn.onclick=render;q.onkeydown=e=>{if(e.key==='Enter')render()};render();}
 document.querySelectorAll('.checkpoint').forEach(box=>{if(box.dataset.bound)return;box.dataset.bound='1';box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1',fb=box.querySelector('.feedback');fb.textContent=ok?'✓ Correcto. La operación textual analiza e indexa términos para recuperar candidatos.':'No todavía. Revisa qué parte corresponde a análisis/indexación y cuál a ranking.';fb.style.background=ok?'#e9f8ef':'#fff1f0';});});
}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});
let st=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,a,pre,.results')){st=null;return}const t=e.touches[0];st={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});stage.addEventListener('touchend',e=>{if(!st||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.time;st=null;if(dt<900&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){dx<0?show(i+1):show(i-1)}},{passive:true});
document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
const m=location.hash.match(/^#s(\d+)$/);if(m)i=Math.min(all.length-1,Math.max(0,Number(m[1])-1));show(i,false);setTimeout(()=>{toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)},500);
</script>
