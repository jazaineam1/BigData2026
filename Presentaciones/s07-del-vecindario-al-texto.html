items:start}.table{border-collapse:collapse;width:100%;font-size:1.15cqw;background:#fff;margin-top:.7cqw}.table th,.table td{border-bottom:1px solid var(--line);padding:.5cqw;text-align:left}.table th{background:var(--beige)}.flow{display:flex;align-items:center;gap:.8cqw;margin-top:1.2cqw}.node{flex:1;text-align:center;border:1px solid var(--line);border-radius:1cqw;background:#fff;color:var(--navy);padding:.9cqw;font-size:1.25cqw;font-weight:800}.arrow{font-weight:900;color:var(--orange);font-size:1.8cqw}.livebtn{display:inline-flex;align-items:center;justify-content:center;margin-top:.9cqw;background:var(--red);color:#fff!important;text-decoration:none;border-radius:.8cqw;padding:.72cqw 1cqw;font-size:1.15cqw;font-weight:900}.top{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 9px;box-shadow:0 8px 25px rgba(0,0,0,.18)}.top a,.top button{border:0;background:transparent;color:var(--navy);text-decoration:none;font-size:12px;font-weight:900;padding:6px 8px;border-radius:999px;cursor:pointer}.count{font:800 12px/1 Consolas}.bar{position:fixed;z-index:11;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.25)}.bar i{display:block;height:100%;background:var(--orange);width:0}.nav{position:fixed;z-index:10;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:rgba(18,34,83,.95);border-radius:999px;padding:7px 12px}.nav button{width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:var(--navy);font-size:22px;font-weight:900;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.chap{color:#fff;font-size:12px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:720px){.stage{position:fixed;inset:50px 0 70px;width:auto;height:auto;transform:none}.slide{padding:18px 16 <script>
const slides=[
{c:'Inicio',k:'UNIVERSIDAD CENTRAL · S07',t:'Elasticsearch Search Lab',l:'Hoy construyes un buscador de texto que puedas explicar y repetir: crear un índice, analizar texto, consultar en Console, automatizar desde Python, medir relevancia y transferirlo a noticias.',dark:1,b:`<div class="flow"><div class="node">Documento</div><div class="arrow">→</div><div class="node">Índice</div><div class="arrow">→</div><div class="node">Consulta</div><div class="arrow">→</div><div class="node">Ranking defendible</div></div><div class="note"><b>Regla de clase:</b> entra a S07 Live al inicio. Ranking usa primer intento; mastery muestra aprendizaje después de pistas.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#live">Entrar a S07 Live →</a>`},
{c:'Problema',k:'IDEA CENTRAL',t:'Identificar, filtrar y buscar no son lo mismo',l:'Un sistema de búsqueda combina operaciones distintas. Identificar recupera una entidad conocida; filtrar elimina lo que está fuera de alcance; buscar calcula qué documentos responden mejor a una necesidad textual.',b:`<div class="grid"><div class="card"><b>Contratación</b><code>id_proceso</code> identifica. <code>departamento=Bogotá</code> filtra. <code>mantenimiento aeronaves</code> necesita ranking.</div><div class="card"><b>E-commerce</b>“zapatos de senderismo impermeables” se rankea; <code>talla=42</code> y <code>stock=true</code> filtran.</div><div class="card"><b>Empleo</b>“data scientist NLP” se rankea; <code>remoto=true</code> y <code>pais=Colombia</code> restringen.</div><div class="card"><b>Idea profesional</b>Un buscador real combina recuperación, restricciones y reglas de producto.</div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d1">Resolver D1 · Ranking →</a>`},
{c:'Motor',k:'QUÉ ES',t:'Elasticsearch es un motor de búsqueda y análisis',l:'Elasticsearch recibe documentos, los indexa y responde búsquedas. Indexar significa preparar estructuras que permitan recuperar información sin recorrer todos los documentos uno por uno.',b:`<div class="grid three"><div class="card"><b>Definición</b>Motor distribuido que almacena documentos JSON y mantiene estructuras optimizadas para búsqueda, filtros y analítica.</div><div class="card"><b>Ejemplo mínimo</b>Guardas 10.000 noticias. Preguntas <code>“sobrecostos contratación”</code>. Devuelve candidatos ordenados.</div><div class="card"><b>No confundir</b>Python no es Elasticsearch: Python es un cliente que envía solicitudes al motor.</div></div><div class="note"><b>Qué puedes observar:</b> índices, mappings, documentos, consultas, <code>hits</code>, <code>_score</code> y tiempos.</div>`},
{c:'Motor',k:'TRES INTERFACES',t:'UI, Console y Python hablan con el mismo motor',l:'La interfaz visual sirve para inspeccionar. Console enseña la API directamente. Python automatiza lo que ya entendiste.',b:`<div class="grid three"><div class="card"><b>UI</b>Index Management y Discover: comprobar índice, mapping, documentos y conteos.</div><div class="card"><b>Console</b>Enviar solicitudes HTTP/JSON: <code>PUT</code>, <code>POST</code>, <code>GET</code>.</div><div class="card"><b>Python</b>Repetir lo mismo con código, cargar muchos documentos y evaluar rankings.</div></div>`},
{c:'Modelado',k:'DOCUMENTO · CAMPO · ÍNDICE',t:'La unidad de trabajo es un documento JSON',l:'Un documento es una entidad buscable; un campo es una propiedad dentro de ella; un índice es la colección donde documentos compatibles se almacenan y consultan.',b:`<div class="twocol"><pre>{
  "id": "N-001",
  "titulo": "Sobrecostos en obra pública",
  "categoria": "Investigación",
  "premium": false
}</pre><div><div class="card"><b>Documento</b>El JSON completo: una noticia.</div><div class="card"><b>Campo</b><code>titulo</code>, <code>categoria</code> o <code>premium</code>.</div><div class="card"><b>Índice</b><code>noticias-2026</code> podría contener 987 documentos.</div></div></div><div class="note"><b>Medición simple:</b> <code>count()</code> cuenta documentos, no campos.</div>`},
{c:'Modelado',k:'MAPPING',t:'Un mapping es una decisión de diseño',l:'El mapping describe el tipo de cada campo y condiciona qué operaciones serán posibles después: búsqueda textual, igualdad exacta, rangos, fechas o booleanos.',b:`<table class="table"><tr><th>Valor de ejemplo</th><th>Necesidad</th><th>Tipo</th></tr><tr><td>“Sobrecostos en contratación”</td><td>buscar palabras</td><td><code>text</code></td></tr><tr><td>“Investigación”</td><td>filtrar valor completo</td><td><code>keyword</code></td></tr><tr><td>false</td><td>sí / no</td><td><code>boolean</code></td></tr><tr><td>2026-09-24</td><td>rangos temporales</td><td><code>date</code></td></tr></table><div class="note warn"><b>Error:</b> elegir un tipo por “cómo se ve” el dato y no por lo que necesitas hacer con él.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d2">Resolver D2 · Mapping ↗</a>`},
{c:'Modelado',k:'TEXT · KEYWORD · MULTI-FIELDS',t:'Buscar palabras y comparar valores completos son operaciones distintas',l:'<code>text</code> analiza contenido para full-text search. <code>keyword</code> conserva el valor como una unidad exacta. Un multi-field permite disponer de las dos representaciones.',b:`<div class="grid three"><div class="card"><b>text</b><code>“Banco de Bogotá”</code> puede analizarse para encontrar palabras relacionadas.</div><div class="card"><b>keyword</b><code>“Banco de Bogotá”</code> se conserva completo para filtro, facet, orden o agregación.</div><div class="card"><b>multi-field</b><code>titulo</code> busca; <code>titulo.keyword</code> compara el valor completo.</div></div><pre>"titulo": {
  "type": "text",
  "fields": {"keyword": {"type": "keyword"}}
}</pre><div class="note"><b>Pregunta guía:</b> ¿quiero encontrar palabras dentro del valor o comparar el valor completo?</div>`},
{c:'Análisis',k:'ANALYZER',t:'El texto no entra crudo al índice',l:'Un analyzer es una tubería de análisis de texto. Tiene un tokenizer obligatorio y puede incluir filtros de caracteres y de tokens; el resultado es una secuencia de términos indexables.',b:`<div class="flow"><div class="node">Texto<br><b>“Mantenimiento de aeronaves”</b></div><div class="arrow">→</div><div class="node">Tokenizer<br><b>separa unidades</b></div><div class="arrow">→</div><div class="node">Filtros<br><b>lowercase / stop / stem</b></div><div class="arrow">→</div><div class="node">Tokens<br><b>términos indexables</b></div></div><div class="grid two"><div class="card"><b>Ejemplo simple</b>“Quick brown fox” puede producir tres tokens con tokenizer estándar.</div><div class="card"><b>Analyzer spanish</b>Combina tokenizer estándar, minúsculas, stopwords y stemming ligero.</div></div><div class="note warn"><b>No confundir:</b> analyzer ≠ IA.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d3">Resolver D3 · Analyzer ↗</a>`},
{c:'Mecanismo',k:'TOKEN',t:'Qué es exactamente un token',l:'Un token es una unidad producida por el tokenizer/analyzer para representar una parte del texto. No tiene un tamaño fijo y no siempre equivale a una palabra humana.',b:`<div class="twocol"><div><pre>Texto:
"Quick brown fox"

Tokens:
[quick] [brown] [fox]</pre><div class="note"><b>Conteo:</b> aquí hay 3 tokens. En <code>_analyze</code>, cuenta los objetos de <code>tokens[]</code>.</div></div><div><table class="table"><tr><th>Dato</th><th>Qué significa</th></tr><tr><td><code>token</code></td><td>contenido</td></tr><tr><td><code>position</code></td><td>orden lógico</td></tr><tr><td><code>start_offset</code></td><td>carácter inicial</td></tr><tr><td><code>end_offset</code></td><td>carácter final</td></tr></table></div></div><div class="note warn"><b>Tamaño:</b> depende del tokenizer. En <code>standard</code>, <code>max_token_length</code> es 255 por defecto; un tokenizer <code>keyword</code> puede tratar “New York” como un solo token.</div>`},
{c:'Análisis',k:'INDEX-TIME VS SEARCH-TIME',t:'El analyzer aparece dos veces',l:'El texto del documento se analiza al indexar y el texto de una consulta full-text se analiza al buscar. Para recuperar coincidencias útiles, ambos lados deben producir términos compatibles.',b:`<div class="grid two"><div class="card"><b>Index-time</b><code>“Servicios de mantenimiento de aeronaves”</code><br>↓ analyzer<br>términos indexados.</div><div class="card"><b>Search-time</b><code>“mantenimiento aeronave”</code><br>↓ analyzer<br>términos de consulta.</div></div><div class="note"><b>Ejemplo mental:</b> no se comparan dos párrafos carácter por carácter; se comparan representaciones analizadas.</div>`},
{c:'Console',k:'_ANALYZE',t:'Primero pregúntale al motor desde Console',l:'Usa <code>_analyze</code> para observar exactamente qué tokens produce Elasticsearch. Es mejor medir el analyzer que adivinarlo.',b:`<div class="twocol"><pre>ELASTIC CONSOLE · NO COLAB
POST s07-demo/_analyze
{
  "analyzer": "spanish",
  "text": "Servicios de mantenimiento de las aeronaves"
}</pre><div><div class="card"><b>Qué devuelve</b>Un arreglo <code>tokens[]</code>.</div><div class="card"><b>Qué inspeccionas</b><code>token</code>, <code>position</code>, <code>start_offset</code> y <code>end_offset</code>.</div><div class="card"><b>Cómo contar</b>3 objetos en <code>tokens[]</code> = 3 tokens producidos.</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d4">Resolver D4 · API ↗</a>`},
{c:'Indexación',k:'ÍNDICE INVERTIDO',t:'La tabla al revés que hace posible buscar rápido',l:'Un índice invertido pasa de “documento → palabras” a “término → documentos”. Así Elasticsearch localiza candidatos por términos sin leer todo el corpus cada vez.',b:`<div class="twocol"><div><pre>D1: "mantenimiento aeronaves"
D2: "combustible aeronaves"
D3: "mantenimiento motores"</pre></div><div><table class="table"><tr><th>Término</th><th>Documentos</th></tr><tr><td>mantenimiento</td><td>D1, D3</td></tr><tr><td>aeronaves</td><td>D1, D2</td></tr><tr><td>combustible</td><td>D2</td></tr></table></div></div><div class="note"><b>Ejemplo:</b> “mantenimiento aeronaves” encuentra a D1 en ambas listas.</div>`},
{c:'Consulta',k:'MATCH VS TERM',t:'No todas las consultas buscan igual',l:'<code>match</code> es full-text y analiza la consulta. <code>term</code> busca un término exacto y es apropiado para valores precisos como keyword, IDs o categorías.',b:`<div class="grid two"><div class="card"><b>match + text</b><code>descripcion = “Mantenimiento de aeronaves”</code><br>Consulta: <code>“mantenimiento aeronave”</code>.</div><div class="card"><b>term + keyword</b><code>estado = “ADJUDICADO”</code><br>Consulta exacta: <code>ADJUDICADO</code>.</div></div><div class="note warn"><b>Error:</b> usar <code>term</code> sobre <code>text</code> esperando comportamiento de buscador.</div>`},
{c:'Relevancia',k:'DE CONTAINS A BM25',t:'contains() encuentra; BM25 ordena',l:'<code>contains()</code> responde una condición literal. BM25 es una función de scoring lexical que usa frecuencia, rareza y longitud para ordenar candidatos.',b:`<div class="grid two"><div class="card"><b>contains()</b>¿Aparece literalmente “mantenimiento”?<br>Salida conceptual: <code>True / False</code>.</div><div class="card"><b>BM25</b>¿Qué documentos responden mejor a “mantenimiento aeronaves”?<br>Salida: ranking con scores.</div></div><div class="note"><b>Unidad:</b> BM25 trabaja sobre términos/tokens y estadísticas del corpus, no sobre un porcentaje de similitud.</div>`},
{c:'Relevancia',k:'BM25 TRABAJADO',t:'Tres documentos muestran la intuición',l:'Con una consulta fija se ven tres señales de BM25: coincidencia concentrada, normalización por longitud y saturación de la repetición.',b:`<div class="note"><b>Consulta:</b> <code>mantenimiento aeronaves</code></div><table class="table"><tr><th>Doc.</th><th>Texto</th><th>Qué observar</th></tr><tr><td>D1</td><td>Mantenimiento aeronaves KFIR</td><td>ambos términos, poco ruido</td></tr><tr><td>D2</td><td>Servicios, compras, combustible, mantenimiento, aeronaves, administración...</td><td>texto más largo</td></tr><tr><td>D3</td><td>Mantenimiento mantenimiento mantenimiento aeronaves</td><td>repetición con ganancia decreciente</td></tr></table><div class="note warn"><b>No memorices un orden universal:</b> el score exacto depende del corpus.</div>`},
{c:'Relevancia',k:'_SCORE',t:'Qué significa y qué no significa el score',l:'<code>_score</code> es una señal numérica usada para ordenar hits de una consulta concreta. Su escala depende de la consulta, el índice y la configuración.',b:`<div class="grid two"><div class="card"><b>Lectura válida</b>A obtuvo <code>8.2</code> y B <code>4.7</code>; para esta consulta Elasticsearch ordenó A antes.</div><div class="card"><b>Lectura inválida</b><code>8.2</code> no es 82 %, ni “8.2/10”, ni probabilidad.</div></div><div class="note"><b>Evaluación:</b> usa juicios de relevancia y métricas como P@5.</div>`},
{c:'Elastic',k:'PROYECTO',t:'Entrar a Elastic y ubicar lo esencial',l:'Reconoce las piezas de la plataforma antes de programar: la URL indica el servicio, la API key autoriza, Console llama APIs y la UI permite inspeccionar estado y documentos.',b:`<div class="grid two"><div class="card"><b>Project URL</b>Ejemplo ficticio: <code>https://mi-proyecto...elastic.cloud</code>.</div><div class="card"><b>API key</b>Credencial secreta: nunca se publica.</div><div class="card"><b>Console</b>Ejecuta una API contra el motor.</div><div class="card"><b>Discover / Index Management</b>Inspeccionan documentos y mapping.</div></div>`},
{c:'Console',k:'REQUEST / RESPONSE',t:'Anatomía de una API de Elasticsearch',l:'Una solicitud combina método HTTP, ruta y opcionalmente cuerpo JSON. La respuesta también es JSON y contiene datos de ejecución y resultados.',b:`<div class="twocol"><pre>GET mi_indice/_search
{
  "query": {
    "match": {
      "descripcion":
      "mantenimiento aeronaves"
    }
  }
}</pre><div><div class="card"><b>GET</b>Método.</div><div class="card"><b>mi_indice/_search</b>Recurso + operación.</div><div class="card"><b>query</b>Cuerpo de búsqueda.</div><div class="card"><b>Respuesta</b><code>hits</code>, <code>_score</code>, <code>_source</code>.</div></div></div>`},
{c:'Console',k:'CREAR ÍNDICE',t:'Crear un índice desde Console, línea por línea',l:'Crear un índice establece un espacio lógico de documentos y puede declarar mappings antes de cargar datos.',b:`<div class="twocol"><pre>PUT s07-demo
{
  "mappings": {
    "properties": {
      "titulo": {
        "type":"text",
        "analyzer":"spanish"
      },
      "categoria": {
        "type":"keyword"
      }
    }
  }
}</pre><div><div class="card"><b>PUT s07-demo</b>Crea el índice.</div><div class="card"><b>properties</b>Declara campos.</div><div class="card"><b>Esperado</b><code>"acknowledged": true</code>.</div></div></div>`},
{c:'Console',k:'INDEXAR DOCUMENTOS',t:'Insertar documentos manualmente antes de automatizar',l:'Indexar envía un documento para almacenarlo y construir las estructuras de búsqueda correspondientes a sus campos.',b:`<div class="twocol"><pre>PUT s07-demo/_doc/1
{
  "titulo": "Mantenimiento de aeronaves",
  "categoria": "servicio"
}</pre><div><div class="card"><b>_id = 1</b>Identifica el documento.</div><div class="card"><b>_source</b>Conserva el JSON original.</div><div class="card"><b>titulo</b>Al ser <code>text</code>, también se analiza para búsqueda.</div></div></div>`},
{c:'Console',k:'LEER RESPUESTA',t:'La búsqueda devuelve más que documentos',l:'Elasticsearch devuelve una estructura de resultados. Saber leerla permite distinguir cantidad, orden, evidencia y contenido.',b:`<table class="table"><tr><th>Campo</th><th>Ejemplo</th><th>Significado</th></tr><tr><td><code>hits.total.value</code></td><td>37</td><td>37 hicieron match</td></tr><tr><td><code>_id</code></td><td>N-001</td><td>identificador</td></tr><tr><td><code>_score</code></td><td>8.21</td><td>señal de ranking</td></tr><tr><td><code>_source</code></td><td>{...}</td><td>documento</td></tr><tr><td><code>highlight</code></td><td>“…sobrecostos…”</td><td>fragmento</td></tr></table>`},
{c:'Consulta',k:'MULTI_MATCH',t:'Buscar en varios campos',l:'<code>multi_match</code> aplica una consulta textual a varios campos. Es útil cuando una intención puede expresarse en título, descripción, skills u otros campos.',b:`<div class="twocol"><pre>{
  "multi_match": {
    "query": "data scientist NLP",
    "fields": ["cargo^3","skills^2","descripcion"]
  }
}</pre><div><div class="card"><b>Ejemplo</b>La vacante puede mencionar NLP en <code>skills</code> aunque no aparezca en el cargo.</div><div class="card"><b>No significa</b>que todos los campos deban coincidir.</div></div></div>`},
{c:'Consulta',k:'BOOL',t:'must y filter separan “qué tan bien coincide” de “puede entrar”',l:'<code>must</code> contribuye a relevancia. <code>filter</code> aplica condiciones binarias y no suma al <code>_score</code>.',b:`<div class="twocol"><pre>{
 "bool": {
  "must": [{
   "multi_match": {
    "query":"data scientist NLP",
    "fields":["cargo^3","skills^2","descripcion"]
   }
  }],
  "filter": [
   {"term":{"remoto":true}},
   {"term":{"pais":"Colombia"}}
  ]
 }
}</pre><div><div class="card"><b>must</b>¿Qué vacante responde mejor?</div><div class="card"><b>filter</b>¿Puede entrar?</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d6">Resolver D6 · Query DSL ↗</a>`},
{c:'Consulta',k:'BOOST',t:'Dar más peso a un campo es una hipótesis que debes medir',l:'Un boost modifica la influencia relativa de un campo o cláusula. El número no representa probabilidad.',b:`<div class="twocol"><pre>{
 "multi_match": {
  "query": "sobrecostos contratación",
  "fields": ["titulo^4","subtitulo^2","cuerpo"]
 }
}</pre><div><div class="card"><b>Hipótesis</b>Coincidencia en título puede indicar centralidad temática.</div><div class="card"><b>Cómo probarla</b>Compara A sin boost vs B con boost usando los mismos juicios.</div></div></div><div class="note warn"><b>^4 no significa “cuatro veces más relevante” como probabilidad.</b></div>`},
{c:'Consulta',k:'HIGHLIGHT',t:'Highlight ayuda a explicar el resultado',l:'<code>highlight</code> pide fragmentos donde ocurrió la coincidencia. Ayuda a inspeccionar y mostrar resultados, pero no prueba relevancia por sí solo.',b:`<div class="twocol"><pre>"highlight": {
 "fields": {
  "titulo": {},
  "cuerpo": {}
 }
}</pre><div><div class="card"><b>Ejemplo</b>“La Contraloría investiga <em>sobrecostos</em> en contratos…”</div><div class="card"><b>Uso</b>Entender por qué entró un resultado y detectar falsos positivos.</div></div></div>`},
{c:'Python',k:'CONSOLE ↔ PYTHON',t:'Python automatiza la misma API',l:'Console y el cliente Python expresan la misma intención contra el mismo motor. Cambia la interfaz, no el concepto.',b:`<div class="grid two"><div class="card"><b>Console</b><pre>GET indice/_search
{"query": {...}}</pre></div><div class="card"><b>Python</b><pre>client.search(
 index="indice",
 query={...}
)</pre></div></div><div class="note"><b>Ejemplo:</b> prueba con 3 documentos en Console; automatiza 1.994 desde Python.</div>`},
{c:'Python',k:'CLIENTE',t:'El cliente Python explicado',l:'El cliente conoce cómo conectarse y autenticarse contra Elasticsearch. No contiene el índice ni los documentos.',b:`<div class="twocol"><pre>client = Elasticsearch(
 endpoint,
 api_key=api_key
)

client.info()</pre><div><div class="card"><b>endpoint</b>Destino.</div><div class="card"><b>api_key</b>Autorización.</div><div class="card"><b>client.info()</b>Prueba de conexión.</div><div class="card"><b>Si falla</b>401 → credencial; timeout → URL/red.</div></div></div>`},
{c:'Python',k:'BULK',t:'De tres documentos a 1.994',l:'<code>bulk()</code> envía muchas acciones de indexación eficientemente. La evidencia incluye errores y conteo remoto.',b:`<div class="twocol"><pre>{
 "_index": INDEX_NAME,
 "_id": fila["id_proceso"],
 "_source": {...}
}</pre><div><div class="card"><b>Intentados</b>1.994 procesos únicos.</div><div class="card"><b>Comprueba</b><code>errors</code> y <code>client.count()</code>.</div><div class="card"><b>Criterio</b>conteo local = remoto.</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d5">Resolver D5 · Bulk ↗</a>`},
{c:'Diagnóstico',k:'CUANDO FALLA',t:'Saber diagnosticar es parte de saber usar la herramienta',l:'Autonomía significa distinguir si el fallo está en credenciales, índice, mapping, analyzer, ingesta o consulta antes de cambiar código al azar.',b:`<table class="table"><tr><th>Síntoma</th><th>Ejemplo</th><th>Primero mira</th></tr><tr><td>401</td><td>no autorizado</td><td>API key</td></tr><tr><td>404</td><td>index_not_found</td><td>nombre / creación</td></tr><tr><td>0 hits</td><td>esperabas resultados</td><td>mapping + <code>_analyze</code></td></tr><tr><td>count menor</td><td>1.970 vs 1.994</td><td>errores bulk</td></tr><tr><td>ranking raro</td><td>ruido arriba</td><td>highlight + juicios</td></tr></table>`},
{c:'Inspección',k:'INDEX MANAGEMENT / DISCOVER',t:'Verifica también desde la interfaz',l:'Index Management y Discover permiten contrastar lo que tu código afirma con el estado real del servicio.',b:`<div class="grid two"><div class="card"><b>Index Management</b>Índice, mappings, settings y estado.</div><div class="card"><b>Discover</b>Documentos concretos, campos y valores.</div></div><div class="note"><b>Ejemplo:</b> si Python reporta 1.994 documentos, la UI debe permitirte confirmar que el índice y su contenido existen.</div>`},
{c:'Evaluación',k:'CRITERIO + P@5',t:'Mover el ranking no significa mejorarlo',l:'Precision@5 es la proporción de resultados relevantes entre los cinco primeros. El criterio de “relevante” debe escribirse antes de comparar configuraciones.',b:`<table class="table"><tr><th>Pos.</th><th>Resultado</th><th>Juicio</th></tr><tr><td>1</td><td>tema central</td><td>1</td></tr><tr><td>2</td><td>mención tangencial</td><td>0</td></tr><tr><td>3</td><td>antecedente central</td><td>1</td></tr><tr><td>4</td><td>caso relacionado</td><td>1</td></tr><tr><td>5</td><td>ruido léxico</td><td>0</td></tr></table><pre>Precision@5 = 3 / 5 = 0.60</pre><div class="note"><b>Interpretación:</b> 60 % del top 5 fue relevante según este criterio; no es precisión global del buscador.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d7">Resolver D7 · P@5 ↗</a>`},
{c:'Evaluación',k:'FLUJO A/B',t:'Una comparación defendible tiene pasos',l:'Un experimento A/B conserva la necesidad y los juicios, cambia una hipótesis controlada y compara resultados.',b:`<div class="flow"><div class="node">Necesidad<br><b>sobrecostos contratación</b></div><div class="arrow">→</div><div class="node">A<br><b>sin boost</b></div><div class="arrow">→</div><div class="node">B<br><b>titulo^4</b></div><div class="arrow">→</div><div class="node">P@5 + errores</div></div><div class="note"><b>Ejemplo:</b> A = 0.80 y B = 0.60. B no mejoró esta necesidad bajo esos juicios.</div>`},
{c:'Reto',k:'SALA DE REDACCIÓN',t:'Transferencia: 987 noticias, otro problema',l:'La transferencia reconstruye la solución en otro dominio. Cambian documentos, campos y necesidad; se conserva el razonamiento mapping → consulta → filtro → evaluación.',b:`<div class="grid two"><div class="card"><b>Documento</b><code>titulo</code>, <code>subtitulo</code>, <code>cuerpo</code>, <code>categoria</code>, <code>premium</code>, <code>publicado</code>.</div><div class="card"><b>Necesidad</b>“sobrecostos en contratación”.</div><div class="card"><b>Hipótesis B</b><code>titulo^4 + subtitulo^2 + cuerpo</code>.</div><div class="card"><b>Filtro</b><code>premium=false</code>.</div></div><div class="note"><b>Prueba:</b> justifica mapping, pesos, filtro, P@5 y falso positivo.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-defs#d8">Resolver D8 · Transferencia ↗</a>`},
{c:'Industria',k:'DESPUÉS DEL LAB',t:'Así crece una solución de búsqueda en producción',l:'Después de dominar recuperación lexical, los equipos amplían evaluación, observabilidad, experiencia de producto y señales semánticas.',b:`<div class="grid"><div class="card"><b>_rank_eval</b>Ejemplo: 20 consultas con documentos juzgados y métricas comparables.</div><div class="card"><b>Search Profiler</b>Ejemplo: encontrar qué parte de una consulta consume más tiempo.</div><div class="card"><b>Search UI</b>Ejemplo: caja + filtros + facets + paginación.</div><div class="card"><b>Semantic / hybrid</b>Ejemplo: “reparación de aviones” recupera “mantenimiento de aeronaves”.</div></div>`},
{c:'Cierre',k:'PASAPORTE',t:'Después de S07 puedo hacerlo solo',l:'La evidencia final no es haber mirado una clase: es poder repetir el proceso con otra colección documental y justificar cada decisión.',b:`<div class="grid"><div class="card"><b>Sé modelar</b>documentos, campos, mapping y analyzer.</div><div class="card"><b>Sé consultar</b>match, term, multi_match, bool, filter y highlight.</div><div class="card"><b>Sé automatizar</b>cliente Python, bulk, count y lectura de hits.</div><div class="card"><b>Sé evaluar</b>criterio, P@5, A/B, falso positivo y límite.</div></div><div class="note"><b>Puente:</b> S9 podrá introducir búsqueda semántica porque ya entiendes la recuperación lexical.</div>`}
];
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),n=document.getElementById('n'),tot=document.getElementById('tot'),chap=document.getElementById('chap'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next'),fsBtn=document.getElementById('fs');
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${i===0?'on':''} ${s.dark?'dark':''}"><div class="k">${s.k}</div><h1>${s.t}</h1><p class="lead">${s.l}</p>${s.b}</section>`).join('');const els=[...document.querySelectorAll('.slide')];tot.textContent=els.length;let idx=0;function show(j){idx=Math.max(0,Math.min(els.length-1,j));els.forEach((e,k)=>e.classList.toggle('on',k===idx));n.textContent=idx+1;bar.style.width=((idx+1)/els.length*100)+'%';chap.textContent=slides[idx].c;prevBtn.disabled=idx===0;nextBtn.disabled=idx===els.length-1;history.replaceState(null,'','#s'+(idx+1));}prevBtn.addEventListener('click',()=>show(idx-1));nextBtn.addEventListener('click',()=>show(idx+1));window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}});let st=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('a,button,input,pre')){st=null;return}const t=e.touches[0];st={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});stage.addEventListener('touchend',e=>{if(!st||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.time;st=null;if(dt<900&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)show(idx+(dx<0?1:-1))},{passive:true});fsBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()}catch(e){console.warn(e)}});const m=location.hash.match(/^#s(\d+)$/);show(m?Number(m[1])-1:0);
</script></body></html>
