:root{--navy:#122253;--red:#B11F16;--orange:#E95D0F;--teal:#0B8689;--purple:#634998;--beige:#F3E7CE;--paper:#fffdfa;--ink:#16224f;--muted:#536078;--line:#dfe3ee;--ok:#eaf6f6;--warn:#fff3e8;--code:#0f1838}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,a{font:inherit}.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.777vh);height:min(100vh,56.25vw);transform:translate(-50%,-50%);background:var(--paper);overflow:hidden}.slide{position:absolute;inset:0;display:none;padding:4.8% 5.7% 7%;overflow:auto;background:var(--paper)}.slide.on{display:block}.dark{background:linear-gradient(135deg,var(--navy),#0b3f72);color:white}.k{font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-size:1.65cqw}.dark .k{color:#ffd9c6}h1{font-size:4.05cqw;line-height:1.03;margin:.2em 0 .28em;color:var(--navy);max-width:19ch}.dark h1{color:white}.lead{font-size:1.9cqw;line-height:1.3;color:#43506d;max-width:50ch}.dark .lead{color:#f0f5ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.05cqw;margin-top:1.1cqw}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:1.1cqw;padding:1cqw;font-size:1.28cqw;line-height:1.34;box-shadow:0 .35cqw 1.25cqw rgba(18,34,83,.08)}.card b{display:block;color:var(--teal);font-size:1.45cqw;margin-bottom:.35em}.note{background:var(--ok);border-left:.5cqw solid var(--teal);border-radius:1cqw;padding:.95cqw 1.15cqw;font-size:1.32cqw;line-height:1.34;margin-top:1.05cqw}.warn{background:var(--warn);border-left-color:var(--orange)}pre{margin:.8cqw 0 0;background:var(--code);color:#f7fbff;border-radius:1cqw;padding:.95cqw;white-space:pre-wrap;font:1.08cqw/1.32 Consolas,"Cascadia Mono",monospace}code{font-family:Consolas,"Cascadia Mono",monospace}.twocol{display:grid;grid-template-columns:1fr 1.15fr;gap:1.3cqw;align-items:start}.table{border-collapse:collapse;width:100%;font-size:1.15cqw;background:#fff;margin-top:.7cqw}.table th,.table td{border-bottom:1px solid var(--line);padding:.5cqw;text-align:left}.table th{background:var(--beige)}.flow{display:flex;align-items:center;gap:.8cqw;margin-top:1.2cqw}.node{flex:1;text-align:center;border:1px solid var(--line);border-radius:1cqw;background:#fff;color:var(--navy);padding:.9cqw;font-size:1.25cqw;font-weight:800}.arrow{font-weight:900;color:var(--orange);font-size:1.8cqw}.livebtn{display:inline-flex;align-items:center;justify-content:center;margin-top:.9cqw;background:var(--red);color:#fff!important;text-decoration:none;border-radius:.8cqw;padding:.72cqw 1cqw;font-size:1.15cqw;font-weight:900}.top{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 9px;box-shadow:0 8px 25px rgba(0,0,0,.18)}.top a,.top button{border:0;background:transparent;color:var(--navy);text-decoration:none;font-size:12px;font-weight:900;padding:6px 8px;border-radius:999px;cursor:pointer}.count{font:800 12px/1 Consolas}.bar{position:fixed;z-index:11;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.25)}.bar i{display:block;height:100%;background:var(--orange);width:0}.nav{position:fixed;z-index:10;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:rgba(18,34,83,.95);border-radius:999px;padding:7px 12px}.nav button{width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:var(--navy);font-size:22px;font-weight:900;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.chap{color:#fff;font-size:12px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:720px){.stage{position:fixed;inset:50px 0 70px;width:auto;height:auto;transform:none}.slide{padding:18px 16px 32px}.k{font-size:11px}h1{font-size:clamp(26px,8vw,34px);max-width:none}.lead{font-size:17px}.grid,.grid.three,.twocol{grid-template-columns:1fr}.card,.note{font-size:15.5px;border-radius:14px;padding:13px}.card b{font-size:17px}pre{font-size:12.5px}.table{font-size:12px}.flow{display:grid}.arrow{transform:rotate(90deg);text-align:center}.top a{display:none}.nav button{width:48px;height:48px}}</style></head><body>

<script>
const slides=[
{c:'Inicio',k:'UNIVERSIDAD CENTRAL · S07',t:'Elasticsearch Search Lab',l:'Hoy construyes un buscador de texto que puedas explicar y repetir: crear un índice, analizar texto, consultar en Console, automatizar desde Python, medir relevancia y transferirlo a noticias.',dark:1,b:`<div class="flow"><div class="node">Documento</div><div class="arrow">→</div><div class="node">Índice</div><div class="arrow">→</div><div class="node">Consulta</div><div class="arrow">→</div><div class="node">Ranking defendible</div></div><div class="note"><b>Regla de clase:</b> entra a S07 Live al inicio. Ranking usa primer intento; mastery muestra aprendizaje después de pistas.</div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#live">Entrar a S07 Live →</a>`},
{c:'Problema',k:'IDEA CENTRAL',t:'Identificar, filtrar y buscar no son lo mismo',l:'Un sistema de búsqueda combina operaciones distintas. Identificar recupera una entidad conocida; filtrar elimina lo que está fuera de alcance; buscar calcula qué documentos responden mejor a una necesidad textual.',b:`<div class="grid"><div class="card"><b>Contratación</b><code>id_proceso</code> identifica. <code>departamento=Bogotá</code> filtra. <code>mantenimiento aeronaves</code> necesita ranking.</div><div class="card"><b>E-commerce</b>“zapatos de senderismo impermeables” se rankea; <code>talla=42</code> y <code>stock=true</code> filtran.</div><div class="card"><b>Empleo</b>“data scientist NLP” se rankea; <code>remoto=true</code> y <code>pais=Colombia</code> restringen.</div><div class="card"><b>Idea profesional</b>Un buscador real combina recuperación, restricciones y reglas de producto.</div></div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d1">Resolver D1 · Ranking →</a>`},
{c:'Motor',k:'QUÉ ES',t:'Elasticsearch es un motor de búsqueda y análisis',l:'Guarda documentos JSON, transforma campos de texto, construye índices para recuperarlos rápido y responde consultas con documentos, puntajes y fragmentos coincidentes.',b:`<div class="twocol"><div><p class="lead">No es una librería de Python. Python es una de las formas de hablar con el motor.</p><div class="note">En esta clase verás la misma operación en Console y luego automatizada en Python.</div></div><pre>Elasticsearch
├─ índices
├─ mappings
├─ documentos
├─ analyzer
└─ Query DSL</pre></div>`},
{c:'Motor',k:'TRES INTERFACES',t:'UI, Console y Python hablan con el mismo motor',l:'La interfaz visual sirve para inspeccionar. Console enseña la API directamente. Python automatiza lo que ya entendiste.',b:`<div class="grid three"><div class="card"><b>UI</b>Index Management y Discover: comprobar índice, mapping, documentos y conteos.</div><div class="card"><b>Console</b>Enviar solicitudes HTTP/JSON: <code>PUT</code>, <code>POST</code>, <code>GET</code>.</div><div class="card"><b>Python</b>Repetir lo mismo con código, cargar muchos documentos y evaluar rankings.</div></div>`},
{c:'Modelado',k:'DOCUMENTO · CAMPO · ÍNDICE',t:'La unidad de trabajo es un documento JSON',l:'Un documento es una observación buscable. Un campo es una propiedad. Un índice es la colección consultable con reglas de análisis y tipos de datos.',b:`<pre>{
  "id_proceso": "CO1.REQ.001",
  "nombre_proceso": "Mantenimiento aeronaves",
  "descripcion": "Servicio preventivo...",
  "tipo_registro": "historico_adjudicado"
}</pre><div class="note">Antes de buscar debes decidir cómo tratar cada campo.</div>`},
{c:'Modelado',k:'MAPPING',t:'Un mapping es una decisión de diseño',l:'El mapping declara cómo Elasticsearch debe indexar cada campo. La pregunta no es “qué apariencia tiene el dato”, sino “qué operaciones debo poder hacer después”.',b:`<table class="table"><tr><th>Campo</th><th>Necesidad</th><th>Tipo</th></tr><tr><td>titulo / descripcion</td><td>buscar términos y calcular relevancia</td><td><code>text</code></td></tr><tr><td>categoria / entidad</td><td>igualdad, filtro, facet, agrupación</td><td><code>keyword</code></td></tr><tr><td>premium / stock</td><td>verdadero/falso</td><td><code>boolean</code></td></tr><tr><td>publicado</td><td>rango temporal</td><td><code>date</code></td></tr></table><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d2">Resolver D2 · Mapping →</a>`},
{c:'Modelado',k:'TEXT · KEYWORD · MULTI-FIELDS',t:'Buscar palabras y comparar valores completos son operaciones distintas',l:'Un campo text se analiza para búsqueda. Un campo keyword conserva el valor exacto para filtros, facets o agrupaciones. A veces necesitas ambas vistas del mismo contenido.',b:`<pre>"titulo": {
  "type": "text",
  "fields": {
    "keyword": {"type": "keyword"}
  }
}</pre><div class="grid"><div class="card"><b>text</b>“sobrecostos contratación” puede recuperar títulos similares.</div><div class="card"><b>keyword</b><code>titulo.keyword</code> permite igualdad, ordenamiento o agregación exacta.</div></div>`},
{c:'Modelado',k:'WORKED EXAMPLE',t:'Ejemplo resuelto antes del reto',l:'Para contratos: descripción y nombre son text porque contienen evidencia textual. Entidad, estado y tipo son keyword porque filtran o agrupan. Valor es numérico y fecha es temporal.',b:`<table class="table"><tr><th>Campo</th><th>Tipo</th><th>Razón</th></tr><tr><td>descripcion</td><td>text</td><td>buscar palabras</td></tr><tr><td>entidad</td><td>keyword</td><td>filtro exacto</td></tr><tr><td>valor</td><td>float</td><td>rango y orden</td></tr><tr><td>fecha</td><td>date</td><td>tiempo</td></tr></table><div class="note warn">El desafío usa otro dominio para evitar memorizar la tabla.</div>`},
{c:'Análisis',k:'ANALYZER',t:'El texto no entra crudo al índice',l:'Un analyzer convierte texto en términos buscables. Puede tokenizar, pasar a minúsculas, eliminar palabras frecuentes y aplicar transformaciones lingüísticas.',b:`<div class="flow"><div class="node">Texto</div><div class="arrow">→</div><div class="node">Tokenizer</div><div class="arrow">→</div><div class="node">Filtros</div><div class="arrow">→</div><div class="node">Tokens</div></div><div class="note">Analyzer no es IA: es una tubería lingüística controlable.</div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d3">Resolver D3 · Analyzer →</a>`},
{c:'Análisis',k:'INDEX-TIME VS SEARCH-TIME',t:'El analyzer aparece dos veces',l:'Cuando indexas, Elasticsearch transforma el documento. Cuando buscas con consultas textuales, transforma también la consulta. La recuperación compara términos compatibles, no frases crudas.',b:`<div class="grid"><div class="card"><b>Index-time</b>“Servicios de mantenimiento de aeronaves” → términos indexados.</div><div class="card"><b>Search-time</b>“mantenimiento aeronave” → términos de consulta.</div></div><div class="note">Esto explica por qué una búsqueda puede encontrar documentos aunque no escribas exactamente la misma frase.</div>`},
{c:'Console',k:'_ANALYZE',t:'Primero pregúntale al motor desde Console',l:'Console permite ejecutar la API directamente y ver la respuesta real del motor. No es Python, no es Colab: es Elasticsearch respondiendo.',b:`<pre>ELASTIC CONSOLE · NO COLAB
POST s07-demo/_analyze
{
  "analyzer": "spanish",
  "text": "Servicios de mantenimiento de las aeronaves"
}</pre><div class="note">La salida esperada es una lista de tokens. Interpreta al menos uno.</div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d4">Resolver D4 · API →</a>`},
{c:'Indexación',k:'ÍNDICE INVERTIDO',t:'La tabla al revés que hace posible buscar rápido',l:'En vez de revisar documento por documento, el índice invertido guarda qué términos aparecen en qué documentos. Buscar empieza consultando términos.',b:`<table class="table"><tr><th>Término</th><th>Documentos</th></tr><tr><td>mantenimiento</td><td>D1, D3</td></tr><tr><td>aeronaves</td><td>D1, D2</td></tr><tr><td>combustible</td><td>D2</td></tr></table><div class="note">Este mecanismo es la base de la recuperación lexical.</div>`},
{c:'Consulta',k:'MATCH VS TERM',t:'No todas las consultas buscan igual',l:'match analiza el texto y es la consulta estándar para full-text. term busca un valor exacto y debe usarse con campos keyword, IDs o categorías.',b:`<div class="grid"><div class="card"><b>match + text</b><code>descripcion: "mantenimiento aeronaves"</code><br>Busca evidencia textual analizada.</div><div class="card"><b>term + keyword</b><code>estado: "ADJUDICADO"</code><br>Filtra el valor exacto.</div></div><div class="note warn">Error común: usar <code>term</code> sobre un campo <code>text</code> y esperar comportamiento de búsqueda textual.</div>`},
{c:'Relevancia',k:'DE CONTAINS A BM25',t:'contains() encuentra; BM25 ordena',l:'Una coincidencia literal solo pregunta si aparece una cadena. BM25 estima qué documentos responden mejor a la consulta usando señales del corpus.',b:`<div class="grid"><div class="card"><b>contains</b>“mantenimiento” aparece o no aparece.</div><div class="card"><b>BM25</b>Evalúa frecuencia, rareza y longitud para ordenar candidatos.</div></div><div class="note">Ranking no es verdad jurídica ni riesgo: solo relevancia textual bajo una consulta.</div>`},
{c:'Relevancia',k:'BM25 TRABAJADO',t:'Tres documentos muestran la intuición',l:'BM25 no premia repetición infinita ni ignora la longitud del documento. Concentra evidencia útil y reduce ruido por documentos demasiado largos.',b:`<table class="table"><tr><th>Doc.</th><th>Texto</th><th>Lectura</th></tr><tr><td>D1</td><td>Mantenimiento aeronaves KFIR</td><td>ambos términos, texto concentrado</td></tr><tr><td>D2</td><td>Servicios, compras, combustible, mantenimiento...</td><td>documento largo: señal diluida</td></tr><tr><td>D3</td><td>Mantenimiento mantenimiento aeronaves</td><td>repetición se satura</td></tr></table>`},
{c:'Relevancia',k:'_SCORE',t:'Qué significa y qué no significa el score',l:'El score ordena resultados dentro de una consulta y configuración. No es probabilidad, no es porcentaje y no se compara libremente entre consultas distintas.',b:`<div class="grid"><div class="card"><b>Sí puedes decir</b>Para esta consulta, A quedó encima de B.</div><div class="card"><b>No puedes decir</b>A tiene 8.2, entonces es 82 % relevante.</div></div><div class="note">Siempre inspecciona texto, highlight y criterio de relevancia.</div>`},
{c:'Elastic',k:'PROYECTO',t:'Entrar a Elastic y ubicar lo esencial',l:'Antes de Python necesitas reconocer el servicio: proyecto, endpoint, API key, Console, Index Management y Discover.',b:`<div class="grid"><div class="card"><b>Project URL</b>Dirección del servicio.</div><div class="card"><b>API key</b>Autorización para cliente Python.</div><div class="card"><b>Console</b>Ejecutar APIs.</div><div class="card"><b>Discover</b>Inspeccionar documentos.</div></div>`},
{c:'Console',k:'REQUEST / RESPONSE',t:'Anatomía de una API de Elasticsearch',l:'Una solicitud tiene método, ruta y, a veces, cuerpo JSON. La respuesta trae metadatos, hits y documentos recuperados.',b:`<pre>GET mi_indice/_search
{
  "query": {
    "match": {"descripcion": "mantenimiento aeronaves"}
  }
}</pre><div class="note">En el cuaderno estos bloques están marcados como Console para que no intentes ejecutarlos en Colab.</div>`},
{c:'Console',k:'CREAR ÍNDICE',t:'Crear un índice desde Console, línea por línea',l:'Crear índice no es solo ponerle nombre: defines cómo tratar cada campo antes de cargar datos. Esa decisión afecta búsqueda, filtros y evaluación.',b:`<pre>PUT s07-demo
{
  "mappings": {
    "properties": {
      "titulo": {"type":"text","analyzer":"spanish"},
      "categoria": {"type":"keyword"}
    }
  }
}</pre><div class="note">Respuesta esperada: <code>acknowledged: true</code>.</div>`},
{c:'Console',k:'INDEXAR DOCUMENTOS',t:'Insertar documentos manualmente antes de automatizar',l:'Indexar un documento crea o reemplaza un JSON bajo un identificador. Eso permite ver con claridad qué es <code>_id</code> y qué es <code>_source</code>.',b:`<pre>PUT s07-demo/_doc/1
{
  "titulo": "Mantenimiento de aeronaves",
  "categoria": "servicio"
}</pre><div class="note"><code>_id</code> identifica. <code>_source</code> conserva el documento original.</div>`},
{c:'Console',k:'LEER RESPUESTA',t:'La búsqueda devuelve más que documentos',l:'Una respuesta de búsqueda incluye tiempo, conteo, lista ordenada, score y el documento original. Aprender a leerla es parte del dominio de la herramienta.',b:`<pre>hits.total        → cuántos hicieron match
hits.hits         → resultados ordenados
_id               → identificador
_score            → señal de ranking
_source           → documento original
highlight         → fragmentos coincidentes</pre>`},
{c:'Consulta',k:'MULTI_MATCH',t:'Buscar en varios campos',l:'La evidencia no siempre vive en un solo campo. Un proceso puede expresar el tema en el nombre, la descripción o ambos.',b:`<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso", "descripcion"]
  }
}</pre><div class="note">No significa que todos los campos deban coincidir.</div>`},
{c:'Consulta',k:'BOOL',t:'must y filter separan “qué tan bien coincide” de “puede entrar”',l:'Query context calcula relevancia; filter context responde sí/no y no aporta score. Separarlos evita que restricciones operacionales contaminen el ranking textual.',b:`<pre>{
  "bool": {
    "must": [{"multi_match": {...}}],
    "filter": [{"term": {"tipo_registro": "historico_adjudicado"}}]
  }
}</pre><div class="note">El filtro reduce universo; el must ordena relevancia.</div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d6">Resolver D6 · Query DSL →</a>`},
{c:'Consulta',k:'BOOST',t:'Dar más peso a un campo es una hipótesis que debes medir',l:'Un boost aumenta la influencia relativa de una coincidencia; no convierte el score en probabilidad ni garantiza mejor calidad.',b:`<div class="twocol"><pre>{
  "multi_match": {
    "query": "sobrecostos contratación",
    "fields": ["titulo^4","subtitulo^2","cuerpo"]
  }
}</pre><div><div class="card"><b>Hipótesis editorial</b>Coincidencia en título puede indicar centralidad temática.</div><div class="card"><b>Regla</b>Cambia un peso, conserva lo demás y mide con juicios.</div></div></div>`},
{c:'Consulta',k:'HIGHLIGHT',t:'Highlight ayuda a explicar el resultado',l:'El ranking te dice qué salió arriba; highlight ayuda a revisar dónde apareció la evidencia textual. No prueba relevancia por sí solo, pero acelera inspección humana.',b:`<pre>"highlight": {
  "fields": {
    "nombre_proceso": {},
    "descripcion": {}
  }
}</pre><div class="note">Úsalo para detectar falsos positivos y resultados dudosos.</div>`},
{c:'Python',k:'CONSOLE ↔ PYTHON',t:'Python automatiza la misma API',l:'La diferencia no es conceptual: Console y Python envían solicitudes al mismo motor. Primero entiendes la API; después la automatizas.',b:`<div class="twocol"><pre>GET indice/_search
{ "query": {...} }</pre><pre>client.search(
  index="indice",
  query={...}
)</pre></div><div class="note">Si no entiendes la solicitud en Console, Python solo oculta el problema.</div>`},
{c:'Python',k:'CLIENTE',t:'El cliente Python explicado',l:'El objeto <code>client</code> no contiene tus documentos. Contiene la configuración para enviar solicitudes autenticadas al servicio Elasticsearch.',b:`<pre>client = Elasticsearch(endpoint, api_key=api_key)
client.info()</pre><div class="grid"><div class="card"><b>endpoint</b>¿A qué servicio voy?</div><div class="card"><b>api_key</b>¿Con qué autorización?</div></div>`},
{c:'Python',k:'BULK',t:'De tres documentos a 1.994',l:'bulk envía muchas acciones de indexación. La pregunta profesional no es “corrió”, sino “cuántos intenté, cuántos llegaron y si el conteo remoto coincide”.',b:`<pre>{
  "_index": INDEX_NAME,
  "_id": fila["id_proceso"],
  "_source": {...}
}</pre><div class="note warn">Ejecutar ≠ verificar. Revisa <code>errors</code> y <code>count()</code>.</div><a class="livebtn" href="../assets/tutoriales/s07-laboratorio-guiado.html#d5">Resolver D5 · Bulk →</a>`},
{c:'Diagnóstico',k:'CUANDO FALLA',t:'Saber diagnosticar es parte de saber usar la herramienta',l:'El camino feliz no basta. Un estudiante autónomo sabe dónde mirar cuando algo no conecta, no indexa o no recupera.',b:`<table class="table"><tr><th>Síntoma</th><th>Probable causa</th><th>Qué mirar</th></tr><tr><td>401</td><td>credencial</td><td>API key</td></tr><tr><td>404 index_not_found</td><td>índice</td><td>nombre / creación</td></tr><tr><td>cero resultados</td><td>query/analyzer</td><td>mapping + _analyze</td></tr><tr><td>count no coincide</td><td>bulk parcial</td><td>errors + count</td></tr></table>`},
{c:'Inspección',k:'INDEX MANAGEMENT / DISCOVER',t:'Verifica también desde la interfaz',l:'Después de automatizar, vuelve a la UI para inspeccionar el estado real: índice creado, mapping disponible, documentos cargados y campos visibles.',b:`<div class="grid"><div class="card"><b>Index Management</b>mapping, settings, conteo, estado del índice.</div><div class="card"><b>Discover</b>documentos concretos, campos y contenido indexado.</div></div><div class="note">La interfaz confirma lo que tu código dice haber hecho.</div>`},

const stage=document.getElementById('stage'),bar=document.getElementById('bar'),n=document.getElementById('n'),tot=document.getElementById('tot'),chap=document.getElementById('chap'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next'),fsBtn=document.getElementById('fs');
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${i===0?'on':''} ${s.dark?'dark':''}"><div class="k">${s.k}</div><h1>${s.t}</h1><p class="lead">${s.l}</p>${s.b}</section>`).join('');const els=[...document.querySelectorAll('.slide')];tot.textContent=els.length;let idx=0;function show(j){idx=Math.max(0,Math.min(els.length-1,j));els.forEach((e,k)=>e.classList.toggle('on',k===idx));n.textContent=idx+1;bar.style.width=((idx+1)/els.length*100)+'%';chap.textContent=slides[idx].c;prevBtn.disabled=idx===0;nextBtn.disabled=idx===els.length-1;history.replaceState(null,'','#s'+(idx+1));}prevBtn.addEventListener('click',()=>show(idx-1));nextBtn.addEventListener('click',()=>show(idx+1));window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}});let st=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('a,button,input,pre')){st=null;return}const t=e.touches[0];st={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});stage.addEventListener('touchend',e=>{if(!st||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.time;st=null;if(dt<900&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)show(idx+(dx<0?1:-1))},{passive:true});fsBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()}catch(e){console.warn(e)}});const m=location.hash.match(/^#s(\d+)$/);show(m?Number(m[1])-1:0);
