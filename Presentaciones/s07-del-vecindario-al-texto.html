<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S07 · Elasticsearch y BM25</title><style>:root{--cream:#faf7ef;--paper:#fffefb;--ink:#172019;--muted:#59675f;--green:#123f2b;--gold:#c9a227;--line:#e4ddcd;--soft:#eef5f0;--code:#0b241c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1218;color:var(--ink);font-family:Inter,Segoe UI,Arial,system-ui,sans-serif}.stage{position:relative;width:min(100vw,177.77dvh);height:min(100dvh,56.25vw);margin:auto;top:50%;transform:translateY(-50%);background:var(--paper);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45);container-type:size}.slide{position:absolute;inset:0;display:none;overflow:auto;padding:5.2cqh 6cqw 8.5cqh;background:var(--paper);touch-action:pan-y pinch-zoom}.slide.on{display:block}.tag{display:inline-block;background:var(--soft);border:1px solid #cfe8d8;color:var(--green);border-radius:999px;padding:.55em .9em;font-size:2cqh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.title{font-family:Georgia,serif;font-size:6.7cqh;line-height:1;margin:.18em 0;color:#0b241c}.sub{font-size:3.1cqh;line-height:1.25;color:#3d4b43;max-width:36em}.lead{font-size:2.75cqh;line-height:1.35;max-width:48em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqh;margin-top:2.5cqh}.two{grid-template-columns:repeat(2,1fr)}.card{background:#fbfaf6;border:1px solid var(--line);border-radius:1.8cqh;padding:2.2cqh;font-size:2.3cqh;line-height:1.35;box-shadow:0 8px 24px rgba(16,24,32,.07)}.card b{display:block;color:var(--green);font-size:2.65cqh;margin-bottom:.35em}.call{background:#fff6c9;border-left:.75cqh solid var(--gold);border-radius:1.5cqh;padding:2.1cqh;margin-top:2.4cqh;font-size:2.45cqh;line-height:1.35}.diagram{display:flex;align-items:center;gap:1.2cqh;flex-wrap:wrap;margin-top:2.7cqh}.node{background:#fff;border:1px solid var(--line);border-radius:1.5cqh;padding:1.5cqh 2cqh;font-size:2.35cqh;font-weight:900;box-shadow:0 6px 18px rgba(16,24,32,.07)}.arrow{font-size:3cqh;color:var(--gold);font-weight:900}pre{background:var(--code);color:#eef9f1;border-radius:1.5cqh;padding:1.9cqh;font-size:2.05cqh;line-height:1.42;overflow:auto;max-height:47cqh}code{background:#e9f5ee;border-radius:.5em;padding:.12em .35em}.tasks{counter-reset:s;display:grid;gap:1.1cqh;margin-top:2cqh}.task{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:1.5cqh;padding:1.5cqh;font-size:2.2cqh}.task:before{content:counter(s);display:inline-grid;place-items:center;width:3cqh;height:3cqh;border-radius:50%;background:var(--green);color:#fff;font-weight:900;margin-right:.8cqh}.table{width:100%;border-collapse:collapse;font-size:2.1cqh;margin-top:2cqh}.table th,.table td{border-bottom:1px solid var(--line);padding:1.2cqh;text-align:left}.search{display:grid;grid-template-columns:1fr auto;gap:1cqh;margin-top:2cqh}.search input{font-size:2.15cqh;padding:1.3cqh;border:1px solid var(--line);border-radius:1.2cqh}.search button{font-size:2.15cqh;padding:1.3cqh 2cqh;border:0;border-radius:1.2cqh;background:var(--green);color:#fff;font-weight:900}.results{margin-top:1.2cqh;max-height:22cqh;overflow:auto}.result{font-size:1.85cqh;padding:1cqh;border-bottom:1px solid var(--line);background:#fbfaf6}.score{font-family:ui-monospace;color:#705600;font-weight:900}.links{position:absolute;right:1.3cqh;top:1.3cqh;z-index:20;display:flex;gap:.7cqh}.links a{background:#fff;color:var(--green);border:1px solid var(--line);border-radius:999px;padding:.75cqh 1.1cqh;font-size:1.7cqh;font-weight:900;text-decoration:none}.barwrap{position:absolute;left:0;right:0;bottom:6.4cqh;height:.6cqh;background:#263746}.bar{height:100%;background:var(--gold);width:0}.toolbar{position:absolute;left:0;right:0;bottom:0;height:6.4cqh;background:#0b1218;color:#fff;display:flex;align-items:center;justify-content:center;gap:1.2cqh}.ctl{min-width:5cqh;height:4.5cqh;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:#172634;color:#fff;font-size:2.1cqh;font-weight:900}.ctl:disabled{opacity:.35}.count{font-weight:900;min-width:9cqh;text-align:center}@media(max-width:820px){.stage{width:100vw;height:100dvh;border-radius:0}.slide{padding:7cqh 4cqw 12cqh}.title{font-size:5.4cqh}.sub{font-size:2.55cqh}.lead,.card,.call,.task,.node{font-size:2.25cqh}.grid,.two{grid-template-columns:1fr}pre{font-size:1.72cqh}.links{display:none}.toolbar{height:8cqh;padding-bottom:env(safe-area-inset-bottom)}.barwrap{bottom:8cqh}.search{grid-template-columns:1fr}.ctl{min-width:6cqh;height:5.4cqh}}</style></head><body><div class="stage" id="stage"><div class="links"><a href="../assets/tutoriales/s07-recursos.html">Recursos</a><a href="../assets/tutoriales/s07-despliegue-elasticsearch.html">Guía despliegue</a><a href="https://colab.research.google.com/github/jazaineam1/BigData2026/blob/main/Cuadernos/7_Elasticsearch_BM25_Compras_Claras.ipynb" target="_blank">Colab</a></div><main id="deck"></main><div class="barwrap"><div id="bar" class="bar"></div></div><nav class="toolbar"><span id="count" class="count">1 / 1</span><button id="prev" class="ctl">←</button><button id="next" class="ctl">→</button></nav></div><script>const slides=[['S07','Elasticsearch y BM25','Del vecindario contractual a un buscador desplegado por ustedes',`<p class="lead">Hoy el objetivo no es solo entender BM25: cada equipo debe poder <b>crear un índice de búsqueda</b>, cargar documentos, consultar y justificar una decisión.</p><div class="diagram"><span class="node">S6 · Neo4j</span><span class="arrow">→</span><span class="node">procesos</span><span class="arrow">→</span><span class="node">Elastic Cloud</span><span class="arrow">→</span><span class="node">ranking</span></div>`],['Diagnóstico del grupo','Python medio, nube baja','Diseño para tercer semestre',`<div class="grid"><div class="card"><b>Fortaleza</b>Python entre 3 y 8; ya pueden ejecutar cuadernos.</div><div class="card"><b>Riesgo</b>Bash casi 1; nube y bases cloud con poca experiencia.</div><div class="card"><b>Respuesta</b>Ruta guiada: crear servicio, conectar, cargar, consultar y evidenciar.</div></div>`],['Producto real','Qué debe quedar funcionando','No basta con mirar la presentación',`<div class="tasks"><div class="task">Endpoint y API key creados o limitación documentada.</div><div class="task">Índice <code>s07_compras_claras</code> con mapping.</div><div class="task">Carga por <code>bulk()</code>.</div><div class="task">Consulta <code>multi_match</code> con filtro y highlight.</div><div class="task">CSV + hito de relevancia.</div></div>`],['Arquitectura completa','Colab + Elastic Cloud','La solución mínima especializada',`<div class="diagram"><span class="node">Colab</span><span class="arrow">envía</span><span class="node">JSON</span><span class="arrow">a</span><span class="node">Elasticsearch</span><span class="arrow">devuelve</span><span class="node">score + highlight</span></div><div class="call">BM25 local es respaldo; Elastic Cloud es la ruta profesional.</div>`],['Buscar no es filtrar','Tres operaciones distintas','Evita confundir la herramienta',`<div class="grid"><div class="card"><b>Identificar</b><code>id_proceso</code> exacto.</div><div class="card"><b>Filtrar</b><code>entidad = FAC</code>.</div><div class="card"><b>Buscar texto</b><code>mantenimiento aeronaves</code> y ordenar.</div></div>`],['Documento','Un proceso SECOP como unidad','Esto es lo que indexamos',`<pre>{
  "id_proceso": "CO1.REQ.3755377",
  "entidad": "FUERZA AEROESPACIAL COLOMBIANA",
  "nombre_proceso": "Mantenimiento aeronaves KFIR",
  "descripcion": "SERVICIOS DE MANTENIMIENTO...",
  "url_secop": "https://..."
}</pre>`],['Campos','text frente a keyword','La pregunta define el tipo',`<table class="table"><tr><th>Campo</th><th>Uso</th><th>Tipo</th></tr><tr><td>descripcion</td><td>buscar palabras</td><td><code>text</code></td></tr><tr><td>nombre_proceso</td><td>buscar con más peso</td><td><code>text</code></td></tr><tr><td>id_proceso</td><td>valor exacto</td><td><code>keyword</code></td></tr><tr><td>entidad</td><td>filtro exacto</td><td><code>keyword</code></td></tr></table>`],['Analyzer','Texto → términos','El buscador prepara el lenguaje',`<div class="diagram"><span class="node">Servicios de MANTENIMIENTO de las Aeronaves</span><span class="arrow">→</span><span class="node">normalizar</span><span class="arrow">→</span><span class="node">mantenimiento · aeronaves</span></div><div class="call">Por eso <code>match</code> no es lo mismo que buscar caracteres exactos.</div>`],['Índice invertido','Término → documentos','La estructura base del buscador',`<table class="table"><tr><th>Término</th><th>Documentos</th></tr><tr><td>mantenimiento</td><td>D1, D2</td></tr><tr><td>aeronaves</td><td>D1</td></tr><tr><td>blindajes</td><td>D4</td></tr></table>`],['BM25','Tres fuerzas','Repetición, rareza y longitud',`<div class="grid"><div class="card"><b>TF</b>Más apariciones ayudan, pero se saturan.</div><div class="card"><b>IDF</b>Palabras raras discriminan más.</div><div class="card"><b>Longitud</b>Una coincidencia en 5 palabras no pesa igual que en 500.</div></div><div class="call">El score ordena; no prueba irregularidad.</div>`],['Demo BM25','Cambien la consulta','Vean ranking antes de ir a Elastic',`<div class="search"><input id="q" value="mantenimiento aeronaves"><button id="go">Buscar</button></div><div id="out" class="results"></div><div class="call">Prueben: <code>blindajes aeronáuticos</code>, <code>mantenimiento c130</code>.</div>`],['Despliegue','Ruta que deben poder repetir solos','No requiere Bash',`<div class="tasks"><div class="task">Crear proyecto en Elastic Cloud.</div><div class="task">Copiar endpoint HTTPS.</div><div class="task">Crear API key.</div><div class="task">Conectar desde Colab con <code>getpass()</code>.</div><div class="task">Crear índice y cargar con <code>bulk()</code>.</div></div>`],['Conexión segura','Nunca publicar claves','Patrón para el cuaderno',`<pre>from getpass import getpass
from elasticsearch import Elasticsearch

endpoint = input("Endpoint https://...")
api_key = getpass("API key: ")
client = Elasticsearch(endpoint, api_key=api_key)
client.info()</pre>`],['Mapping','Crear el índice conscientemente','No subir datos a ciegas',`<pre>mapping = {
  "mappings": {"properties": {
    "id_proceso": {"type":"keyword"},
    "entidad": {"type":"keyword"},
    "nombre_proceso": {"type":"text", "analyzer":"spanish"},
    "descripcion": {"type":"text", "analyzer":"spanish"}
}}}</pre>`],['Bulk','Cargar muchos documentos','Python envía JSON al índice',`<pre>from elasticsearch.helpers import bulk
acciones = []
for d in corpus.to_dict("records"):
    acciones.append({
      "_index": INDEX,
      "_id": d["id_proceso"],
      "_source": d
    })
bulk(client, acciones, refresh=True)</pre>`],['match','Primera consulta textual','Un campo, una necesidad',`<pre>{
  "query": {
    "match": {
      "descripcion": "mantenimiento aeronaves"
    }
  }
}</pre>`],['multi_match','Buscar en varios campos','Y ponderar el nombre',`<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso^2", "descripcion"]
  }
}</pre><div class="call"><code>^2</code> es una decisión: el nombre pesa más.</div>`],['filter','Restringir sin cambiar score','Relevancia ≠ condición',`<pre>"filter": [
  {"term": {"entidad": "FUERZA AEROESPACIAL COLOMBIANA"}}
]</pre>`],['highlight','Leer dónde coincidió','No aceptar números a ciegas',`<pre>"highlight": {
  "fields": {
    "nombre_proceso": {},
    "descripcion": {}
  }
}</pre>`],['Arquitectura distribuida','Shard y réplica','Lo mínimo para entender Elastic',`<div class="diagram"><span class="node">índice</span><span class="arrow">→</span><span class="node">primary shards</span><span class="arrow">+</span><span class="node">replicas</span><span class="arrow">→</span><span class="node">lectura y tolerancia</span></div>`],['Práctica A/B','Un solo cambio',`Consulta o ponderación`, `<div class="grid"><div class="card"><b>Consulta A</b><code>mantenimiento aeronaves</code></div><div class="card"><b>Consulta B</b><code>mantenimiento aeronautico</code></div><div class="card"><b>Regla</b>No cambiar consulta, filtro y boost al tiempo.</div></div>`],['Entrega','CSV + hito','Evidencia de aprendizaje',`<div class="grid two"><div class="card"><b>s07_resultados_busqueda.csv</b>rank, id, nombre, score, URL, consulta y motor.</div><div class="card"><b>hito_s07_relevancia.md</b>necesidad, decisión, cambio A/B, dudoso, alternativa y límite.</div></div>`],['Errores esperados','No son fracaso','Son parte del despliegue',`<table class="table"><tr><th>Error</th><th>Lectura</th><th>Acción</th></tr><tr><td>401/403</td><td>credencial</td><td>regenerar API key</td></tr><tr><td>timeout</td><td>endpoint/red</td><td>validar URL</td></tr><tr><td>0 resultados</td><td>consulta/analyzer</td><td>probar términos simples</td></tr></table>`],['Cierre','Herramienta especializada e integral','De datos a decisión defendible',`<p class="lead">Construyeron una mini solución: datos → índice → despliegue → consulta → ranking → decisión con límites.</p><div class="call">S8 evaluará la selección de herramienta: MongoDB, Cassandra, Neo4j y Elasticsearch según la pregunta.</div>`]];const docs=[['CO1.REQ.3755377','Mantenimiento aeronaves KFIR','mantenimiento programado aeronaves kfir fuerza aerea'],['CO1.REQ.3714823','Inspección PDM C-130','mantenimiento inspeccion aeronave c130'],['CO1.REQ.8018431','Blindajes aeronáuticos','adquisicion blindajes aeronauticos'],['CO1.REQ.3730074','Centro investigación aeronáutica','construccion investigacion aeronautica']];const deck=document.getElementById('deck');deck.innerHTML=slides.map((s,i)=>`<section class="slide ${i?'':'on'}"><div class="tag">${s[0]}</div><h1 class="title">${s[1]}</h1><p class="sub">${s[2]}</p>${s[3]}</section>`).join('');const all=[...document.querySelectorAll('.slide')],count=document.getElementById('count'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');let i=0;function show(n){i=Math.max(0,Math.min(all.length-1,n));all.forEach((s,k)=>s.classList.toggle('on',k===i));count.textContent=`${i+1} / ${all.length}`;bar.style.width=((i+1)/all.length*100)+'%';prev.disabled=i===0;next.disabled=i===all.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});let st=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,a,pre,.results')){st=null;return}const t=e.touches[0];st={x:t.clientX,y:t.clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;st=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)dx<0?show(i+1):show(i-1)},{passive:true});function toks(x){return (x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[]}function bm(q){const qq=toks(q);return docs.map(d=>{let sc=0;qq.forEach(t=>{if(toks(d[1]+' '+d[2]).includes(t))sc+=1});return{id:d[0],t:d[1],score:sc}}).filter(x=>x.score).sort((a,b)=>b.score-a.score)}function render(){const q=document.getElementById('q'),o=document.getElementById('out');if(!q||!o)return;const rows=bm(q.value);o.innerHTML=rows.length?rows.map((r,k)=>`<div class="result"><b>${k+1}. ${r.t}</b><br><span class="score">score ${r.score}</span> · <code>${r.id}</code></div>`).join(''):'<div class="result">Sin coincidencias</div>'}document.addEventListener('click',e=>{if(e.target?.id==='go')render()});document.addEventListener('keydown',e=>{if(e.target?.id==='q'&&e.key==='Enter')render()});show(0);render();</script></body></html>
