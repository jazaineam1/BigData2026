const stage=document.getElementById('stage');
function slideHTML(s,idx){return `<section class="slide ${s.c||''} ${idx===0?'active':''}" aria-hidden="${idx===0?'false':'true'}"><div class="ey">${s.ey||''}</div><h2>${s.t}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}${s.html||''}<div class="brand"><span>Big Data 2026-2S · S07</span><span>${idx+1}/${slides.length}</span></div></section>`}
stage.innerHTML=slides.map(slideHTML).join('');
const deck=[...document.querySelectorAll('.slide')],n=document.getElementById('n'),tot=document.getElementById('tot'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next'),toast=document.getElementById('toast');
let i=0;tot.textContent=deck.length;
function show(j){i=Math.max(0,Math.min(deck.length-1,j));deck.forEach((s,k)=>{s.classList.toggle('active',k===i);s.setAttribute('aria-hidden',k===i?'false':'true');if(k===i)s.scrollTop=0});n.textContent=i+1;bar.style.width=((i+1)/deck.length*100)+'%';prev.disabled=i===0;next.disabled=i===deck.length-1}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});
let touchStart=null;const interactive='input,button,a,textarea,select,pre,.demo-results,[contenteditable="true"]';
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest(interactive)){touchStart=null;return}const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length){touchStart=null;return}const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y,dt=Date.now()-touchStart.time;touchStart=null;if(dt>900||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.25)return;if(dx<0)show(i+1);else show(i-1)},{passive:true});
function hint(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}setTimeout(hint,900);
const demoDocs=[
{id:'CO1.REQ.3755377',titulo:'Mantenimiento programado y no programado de aeronaves KFIR',texto:'mantenimiento programado no programado aeronaves kfir fuerza aérea colombiana'},
{id:'CO1.REQ.3714823',titulo:'Inspección estructural PDM de aeronave C-130',texto:'servicio mantenimiento inspección mayor estructural aeronave C-130 trabajos especiales'},
{id:'CO1.REQ.3730074',titulo:'Construcción centro de instrucción aeronáutica',texto:'construcción centro instrucción investigación aeronáutica museo aeroespacial'},
{id:'CO1.REQ.8018431',titulo:'Adquisición de blindajes aeronáuticos',texto:'adquisición blindajes aeronáuticos sistemas de armas fuerza aeroespacial'}
];
function toks(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[]}
function searchBM25(q){const stop=new Set(['de','la','el','los','las','del','y','en','para','por','un','una','con','al','se','su','sus','como','que','es','no']);const docs=demoDocs.map(d=>toks(d.texto).filter(t=>t.length>2&&!stop.has(t)));const query=toks(q).filter(t=>t.length>2&&!stop.has(t));const N=docs.length,avg=docs.reduce((a,d)=>a+d.length,0)/(N||1),df={};docs.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));return demoDocs.map((d,ix)=>{const tf={};docs[ix].forEach(t=>tf[t]=(tf[t]||0)+1);let score=0;query.forEach(t=>{const f=tf[t]||0;if(!f)return;const nn=df[t]||0,idf=Math.log(1+(N-nn+.5)/(nn+.5)),den=f+1.2*(1-.75+.75*(docs[ix].length/avg));score+=idf*(f*2.2)/den});return{...d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}
function renderDemo(){const q=document.getElementById('demoQuery'),out=document.getElementById('demoResults');if(!q||!out)return;const rows=searchBM25(q.value);out.innerHTML=rows.length?rows.map((r,ix)=>`<div class="result"><b>${ix+1}. ${r.titulo}</b><br><span class="score">score ${r.score.toFixed(3)}</span> · <code>${r.id}</code></div>`).join(''):'<div class="result">Sin resultados. Prueba otra consulta.</div>'}
addEventListener('click',e=>{if(e.target&&e.target.id==='demoSearch')renderDemo()});addEventListener('keydown',e=>{if(e.target&&e.target.id==='demoQuery'&&e.key==='Enter')renderDemo()});show(0);renderDemo();
</script>
