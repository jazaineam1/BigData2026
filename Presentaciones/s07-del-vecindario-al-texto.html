function show(n){i=Math.max(0,Math.min(all.length-1,n));all.forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i)s.scrollTop=0});count.textContent=`${i+1} / ${all.length}`;bar.style.width=((i+1)/all.length*100)+'%';prev.disabled=i===0;next.disabled=i===all.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});let start=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,a,pre,.results')){start=null;return}const t=e.touches[0];start={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});stage.addEventListener('touchend',e=>{if(!start)return;const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;start=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){dx<0?show(i+1):show(i-1)}});function tok(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[]}function bm25(q){const stop=new Set(['de','la','el','los','las','del','y','en','para','por','un','una','con','al','se','su','sus','como','que','es','no']);const ds=docs.map(d=>tok(d.t+' '+d.x).filter(t=>t.length>2&&!stop.has(t))),qq=tok(q).filter(t=>t.length>2&&!stop.has(t));const N=ds.length,avg=ds.reduce((a,d)=>a+d.length,0)/N,df={};ds.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));return docs.map((d,j)=>{const tf={};ds[j].forEach(t=>tf[t]=(tf[t]||0)+1);let score=0;qq.forEach(t=>{const f=tf[t]||0;if(!f)return;const idf=Math.log(1+(N-(df[t]||0)+.5)/((df[t]||0)+.5));score+=idf*(f*2.2)/(f+1.2*(.25+.75*ds[j].length/avg))});return{...d,score}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score)}function render(){const q=document.getElementById('q'),out=document.getElementById('out');if(!q||!out)return;const rows=bm25(q.value);out.innerHTML=rows.length?rows.slice(0,5).map((r,k)=>`<div class="result"><b>${k+1}. ${r.t}</b><br><span class="score">score ${r.score.toFixed(3)}</span> · <code>${r.id}</code></div>`).join(''):'<div class="result">Sin coincidencias.</div>'}document.addEventListener('click',e=>{if(e.target?.id==='go')render()});document.addEventListener('keydown',e=>{if(e.target?.id==='q'&&e.key==='Enter')render()});show(0);render();
