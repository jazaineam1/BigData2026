<script>
const slides=[
{c:'Inicio',k:'UNIVERSIDAD CENTRAL · S07',t:'Elasticsearch Search Lab',l:'Hoy construyes un buscador de texto que puedas explicar y repetir: crear un índice, analizar texto, consultar en Console, automatizar desde Python, medir relevancia y transferirlo a noticias.',dark:1,b:`<div class="flow"><div class="node">Documento</div><div class="arrow">→</div><div class="node">Índice</div><div class="arrow">→</div><div class="node">Consulta</div><div class="arrow">→</div><div class="node">Ranking defendible</div></div><div class="note"><b>Producto final:</b> no es “ejecuté un notebook”; es “sé usar Elasticsearch directamente y automatizarlo”.</div>`},
{c:'Inicio',k:'PRODUCTO',t:'Qué sabrás hacer al salir',l:'La sesión está diseñada para que puedas decir “yo sé hacerlo”: sabes dónde se hace, qué comando lo hace, qué devuelve y cómo comprobarlo.',b:`<div class="grid three"><div class="card"><b>1 · Motor</b>Crear e inspeccionar un proyecto Elasticsearch.</div><div class="card"><b>2 · Consulta</b>Usar Console para ejecutar APIs y leer respuestas.</div><div class="card"><b>3 · Python</b>Automatizar ingesta, búsqueda y evaluación desde Colab.</div></div><div class="note warn">El laboratorio acompaña; la explicación principal vive aquí.</div>`},
{c:'Problema',k:'IDEA CENTRAL',t:'Identificar, filtrar y buscar no son lo mismo',l:'Una búsqueda textual no solo pregunta si algo cumple una condición. También ordena documentos según qué tan bien responden a una necesidad de información.',b:`<div class="grid"><div class="card"><b>Identificar</b><code>id_proceso = CO1.REQ...</code><br>Quiero un documento exacto.</div><div class="card"><b>Filtrar</b><code>departamento = Bogotá</code><br>Quiero una condición exacta.</div><div class="card"><b>Buscar</b><code>mantenimiento aeronaves</code><br>Quiero candidatos ordenados.</div><div class="card"><b>Error común</b>Llamar “ranking” a una lista que solo cumple un filtro.</div></div>`},
{c:'Motor',k:'QUÉ ES',t:'Elasticsearch es un motor de búsqueda y análisis',l:'Guarda documentos JSON, transforma campos de texto, construye índices para recuperarlos rápido y responde consultas con documentos, puntajes y fragmentos coincidentes.',b:`<div class="twocol"><div><p class="lead">No es una librería de Python. Python es una de las formas de hablar con el motor.</p><div class="note">En esta clase verás la misma operación en Console y luego automatizada en Python.</div></div><pre>Elasticsearch
├─ índices
├─ mappings
├─ documentos
├─ analizadores
└─ API de búsqueda</pre></div>`},
{c:'Motor',k:'TRES INTERFACES',t:'UI, Console y Python hablan con el mismo motor',l:'Aprender solo Colab no basta. La autonomía viene de reconocer qué haces en la interfaz visual, cómo lo escribes en Console y cómo lo repites desde Python.',b:`<div class="flow"><div class="node">UI visual<br>inspecciona</div><div class="arrow">↔</div><div class="node">Console<br>API JSON</div><div class="arrow">↔</div><div class="node">Python<br>automatiza</div></div><div class="note"><b>Modelo mental:</b> Console enseña la API; Python automatiza la API.</div>`},
{c:'Modelado',k:'DOCUMENTO · CAMPO · ÍNDICE',t:'La unidad de trabajo es un documento JSON',l:'Un documento es una fila recuperable; un campo es una propiedad; un índice es la colección preparada para buscar. La calidad del buscador empieza con cómo modelas estos campos.',b:`<pre>{
  "id_proceso": "CO1.REQ.3755377",
  "entidad": "FUERZA AEROESPACIAL COLOMBIANA",
  "nombre_proceso": "Mantenimiento de aeronaves KFIR",
  "descripcion": "Servicios de mantenimiento programado..."
}</pre><div class="note">Cada campo tendrá un tipo. Esa decisión cambia cómo se busca y cómo se filtra.</div>`},
{c:'Modelado',k:'MAPPING',t:'Un mapping es una decisión de diseño',l:'El mapping declara cómo Elasticsearch debe tratar cada campo. No es decoración JSON: decide si un valor se analiza palabra por palabra, se conserva exacto, se trata como fecha o como booleano.',b:`<table class="table"><tr><th>Campo</th><th>Uso</th><th>Tipo</th></tr><tr><td>descripcion</td><td>buscar palabras</td><td><code>text</code></td></tr><tr><td>entidad</td><td>filtrar/agrupar</td><td><code>keyword</code></td></tr><tr><td>premium</td><td>verdadero/falso</td><td><code>boolean</code></td></tr><tr><td>publicado</td><td>ordenar por fecha</td><td><code>date</code></td></tr></table><div class="note warn">Error frecuente: elegir <code>text</code> porque “parece texto”.</div>`},
{c:'Modelado',k:'TEXT VS KEYWORD',t:'La pregunta correcta: ¿buscar palabras o comparar el valor completo?',l:'Un campo text pasa por analyzer y sirve para búsqueda textual. Un keyword conserva el valor completo y sirve para igualdad, filtros, IDs, categorías y agregaciones.',b:`<div class="grid"><div class="card"><b>text</b><code>"Mantenimiento preventivo de aeronaves"</code><br>Quiero encontrar palabras dentro.</div><div class="card"><b>keyword</b><code>"FUERZA AEROESPACIAL"</code><br>Quiero comparar la entidad completa.</div></div><pre>"descripcion": {"type":"text", "analyzer":"spanish"}
"entidad": {"type":"keyword"}</pre>`},
{c:'Modelado',k:'ACTIVIDAD',t:'Diseña este mapping',l:'Antes de tocar código, decide los tipos. Si no puedes justificar el tipo de campo, no sabes todavía qué buscador estás construyendo.',b:`<table class="table"><tr><th>Campo</th><th>Decisión esperada</th><th>Razón</th></tr><tr><td>titulo</td><td><code>text</code></td><td>buscar palabras</td></tr><tr><td>categoria</td><td><code>keyword</code></td><td>filtrar/agrupar</td></tr><tr><td>premium</td><td><code>boolean</code></td><td>condición verdadero/falso</td></tr><tr><td>publicado</td><td><code>date</code></td><td>orden temporal</td></tr></table><div class="note">Pregunta tipo S07 Live: ¿qué harías con <code>etiquetas</code> y por qué?</div>`},
{c:'Análisis',k:'ANALYZER',t:'El texto no entra crudo al índice',l:'Un analyzer transforma el texto antes de indexarlo y también al procesar ciertas consultas. Puede tokenizar, normalizar, eliminar palabras funcionales y aplicar transformaciones lingüísticas.',b:`<div class="flow"><div class="node">Servicios de MANTENIMIENTO de aeronaves</div><div class="arrow">→</div><div class="node">analyzer spanish</div><div class="arrow">→</div><div class="node">tokens buscables</div></div><div class="note warn">Analyzer no es IA generativa ni búsqueda semántica. Es preparación lingüística para búsqueda léxica.</div>`},
{c:'Análisis',k:'ANALYZER ESPAÑOL',t:'Normalizar no es solo poner minúsculas',l:'El analyzer de idioma puede separar tokens, reducir mayúsculas, eliminar palabras frecuentes y acercar variantes morfológicas. Por eso el resultado no coincide exactamente con la frase original.',b:`<pre>Entrada:
"Servicios de mantenimiento de las aeronaves"

Salida esperada aproximada:
servici · manten · aeronav</pre><div class="note">No memorices el token exacto: aprende a pedirle al motor que te muestre qué produjo.</div>`},
{c:'Console',k:'_ANALYZE',t:'Primero pregúntale al motor desde Console',l:'Console permite ejecutar APIs de Elasticsearch directamente. Aquí verificas el analyzer sin Python, sin pandas y sin abstracciones.',b:`<pre>POST s07-demo/_analyze
{
  "analyzer": "spanish",
  "text": "Servicios de mantenimiento de las aeronaves"
}</pre><div class="note"><b>Cómo leerlo:</b> la respuesta trae una lista <code>tokens</code>. Esos tokens explican cómo el motor entiende el texto.</div>`},
{c:'Indexación',k:'ÍNDICE INVERTIDO',t:'La tabla al revés que hace posible buscar rápido',l:'En lugar de revisar todos los documentos cada vez, Elasticsearch guarda una estructura término → documentos. Esa estructura localiza candidatos; el ranking viene después.',b:`<table class="table"><tr><th>Término</th><th>Documentos</th></tr><tr><td>manten...</td><td>D1, D2</td></tr><tr><td>aeronav...</td><td>D1, D2, D3</td></tr><tr><td>kfir</td><td>D1</td></tr></table><div class="note">Indexar prepara la estructura. Buscar usa la estructura.</div>`},
{c:'Relevancia',k:'DE CONTAINS A BM25',t:'contains() encuentra; BM25 ordena',l:'Una coincidencia literal responde si aparecen términos. BM25 intenta ordenar documentos según frecuencia de términos, rareza en el corpus y longitud del documento.',b:`<div class="grid"><div class="card"><b>contains()</b>Resultado binario: coincide o no coincide.</div><div class="card"><b>BM25</b>Ranking relativo para una consulta específica.</div></div><div class="note warn">El score no es porcentaje, probabilidad ni evidencia de irregularidad.</div>`},
{c:'Relevancia',k:'BM25',t:'Tres intuiciones: frecuencia, rareza y longitud',l:'Que un término aparezca ayuda, pero se satura. Un término raro discrimina más. La misma coincidencia pesa distinto en un texto corto que en uno enorme.',b:`<div class="grid three"><div class="card"><b>Frecuencia</b>más evidencia, ganancia decreciente.</div><div class="card"><b>Rareza</b><code>KFIR</code> informa más que <code>servicio</code>.</div><div class="card"><b>Longitud</b>normaliza documentos extensos.</div></div><div class="note">Objetivo: entender el comportamiento, no memorizar la fórmula.</div>`},
{c:'Relevancia',k:'_SCORE',t:'Qué significa y qué no significa el score',l:'El score ordena documentos dentro de una consulta y configuración. No es una escala universal; no compares scores de consultas distintas como si fueran porcentajes.',b:`<div class="grid"><div class="card"><b>Lectura válida</b>“Para esta consulta, A quedó por encima de B”.</div><div class="card"><b>Lectura inválida</b>“Score 8.1 significa 81% relevante”.</div></div><div class="note">Para saber si mejoró, necesitas juicios de relevancia y una métrica como Precision@5.</div>`},
{c:'Live',k:'S07 LIVE 1',t:'Checkpoint: mapping, analyzer y score',l:'Responde antes de seguir. Si el grupo falla, no avanzamos a Python todavía.',b:`<div class="quiz"><ol><li>¿Cuál campo debería ser <code>keyword</code>: descripción o entidad?</li><li>¿Qué componente transforma “mantenimiento de aeronaves” en tokens?</li><li>¿Qué afirmación sobre <code>_score</code> sí es válida?</li></ol></div><div class="note">Uso docente: si <code>must vs filter</code> o <code>text vs keyword</code> no queda claro, se repite con otro ejemplo.</div>`},
{c:'Elastic',k:'PROYECTO',t:'Entrar a Elastic y ubicar lo esencial',l:'El primer dominio autónomo es saber abrir tu proyecto, localizar Console, encontrar Index Management y distinguir Project URL de API key.',b:`<div class="grid"><div class="card"><b>Project URL</b>Dirección del servicio.</div><div class="card"><b>API key</b>Secreto que autoriza llamadas.</div><div class="card"><b>Console</b>Lugar para ejecutar APIs JSON.</div><div class="card"><b>Index Management</b>Lugar para inspeccionar índices.</div></div>`},
{c:'Console',k:'REQUEST / RESPONSE',t:'Anatomía de una API de Elasticsearch',l:'Console enseña la estructura real: método HTTP, recurso, operación y cuerpo JSON. Esa misma operación luego se automatiza desde Python.',b:`<pre>GET /mi_indice/_search
│       │        │
│       │        └── operación
│       └────────── recurso
└────────────────── método

{
  "query": { ... }
}</pre><div class="note">Leer la respuesta es tan importante como escribir la consulta.</div>`},
{c:'Console',k:'CREAR ÍNDICE',t:'Crear un índice desde Console',l:'Antes de cargar cientos de documentos, crea un índice pequeño y explícito. Así ves el mapping y entiendes qué hará el motor.',b:`<pre>PUT s07-demo
{
  "mappings": {
    "properties": {
      "titulo": {"type":"text", "analyzer":"spanish"},
      "categoria": {"type":"keyword"}
    }
  }
}</pre><div class="note">Respuesta esperada: <code>acknowledged: true</code>.</div>`},
{c:'Console',k:'INDEXAR DOCUMENTOS',t:'Insertar tres documentos manualmente',l:'Esta práctica evita que bulk parezca magia. Primero creas documentos uno a uno para entender <code>_index</code>, <code>_id</code> y <code>_source</code>.',b:`<pre>PUT s07-demo/_doc/D1
{
  "titulo": "Mantenimiento de aeronaves KFIR",
  "categoria": "Defensa"
}</pre><div class="note"><code>_id</code> identifica el documento; <code>_source</code> es el JSON original recuperable.</div>`},
{c:'Console',k:'MATCH',t:'Primera búsqueda y lectura de respuesta',l:'match analiza la consulta con la lógica del campo. La respuesta incluye total de hits, lista de documentos, _score y _source.',b:`<pre>GET s07-demo/_search
{
  "query": {
    "match": {"titulo": "mantenimiento aeronaves"}
  }
}</pre><div class="note"><b>Debes leer:</b> <code>hits.total</code>, <code>hits.hits</code>, <code>_id</code>, <code>_score</code>, <code>_source</code>.</div>`},
{c:'Consulta',k:'MULTI_MATCH',t:'Buscar en varios campos',l:'multi_match sirve cuando la misma necesidad puede aparecer en título, subtítulo, descripción o cuerpo. No significa que todos los campos deban contener todos los términos.',b:`<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso", "descripcion"]
  }
}</pre><div class="note">Úsalo cuando no sabes en qué campo aparecerá la evidencia textual.</div>`},
{c:'Consulta',k:'BOOST',t:'Dar más peso a un campo es una decisión defendible',l:'Un boost no duplica probabilidad ni garantiza verdad. Solo dice que, dentro de esta consulta, coincidencias en cierto campo deben pesar más.',b:`<pre>{
  "multi_match": {
    "query": "mantenimiento aeronaves",
    "fields": ["nombre_proceso^3", "descripcion"]
  }
}</pre><div class="note warn">Regla: cambia una sola perilla y mide si ayudó.</div>`},
{c:'Consulta',k:'BOOL',t:'must y filter separan relevancia de condición',l:'En <code>must</code> va lo que debe aportar relevancia. En <code>filter</code> va una condición exacta que restringe sin sumar score.',b:`<pre>{
  "bool": {
    "must": [{"multi_match": {...}}],
    "filter": [{"term": {"tipo_registro": "historico_adjudicado"}}]
  }
}</pre><div class="note">Error frecuente: meter condiciones categóricas en la parte que puntúa.</div>`},
{c:'Consulta',k:'HIGHLIGHT',t:'Highlight ayuda a explicar el resultado',l:'El score ordena, pero highlight muestra fragmentos donde coincidieron los términos. Es la evidencia textual para revisar si un hit tiene sentido.',b:`<pre>"highlight": {
  "fields": {
    "nombre_proceso": {},
    "descripcion": {}
  }
}</pre><div class="note">Un highlight no prueba relevancia profesional; ayuda a inspeccionarla.</div>`},
{c:'Live',k:'S07 LIVE 2',t:'Checkpoint: Query DSL',l:'Ahora debes leer una consulta y decir qué parte busca, qué parte filtra y qué parte explica el resultado.',b:`<div class="quiz"><ol><li>¿Dónde pondrías <code>premium=false</code>: must o filter?</li><li>¿Qué cambia <code>titulo^4</code>?</li><li>¿Qué campo de la respuesta contiene el documento original?</li></ol></div><div class="note">Si el grupo no distingue <code>must</code> de <code>filter</code>, no es momento de pasar al reto.</div>`},
{c:'Python',k:'CONSOLE ↔ PYTHON',t:'Python automatiza la misma API',l:'La operación que ejecutaste en Console se puede enviar desde Python. La estructura cambia de sintaxis, pero la idea es la misma.',b:`<div class="twocol"><pre>GET indice/_search
{
  "query": {"match": {...}}
}</pre><pre>client.search(
  index="indice",
  query={"match": {...}}
)</pre></div><div class="note">El cliente Python no reemplaza Elasticsearch: lo invoca.</div>`},
{c:'Python',k:'CLIENTE',t:'El cliente Python explicado',l:'El objeto <code>client</code> no contiene los datos. Es una conexión capaz de enviar solicitudes al servicio usando endpoint y API key.',b:`<pre>client = Elasticsearch(endpoint, api_key=api_key)
client.info()</pre><div class="grid"><div class="card"><b>endpoint</b>¿a qué servicio llamo?</div><div class="card"><b>api_key</b>¿con qué autorización?</div><div class="card"><b>client.info()</b>prueba mínima de conexión.</div><div class="card"><b>Errores</b>401 credencial; timeout URL/red.</div></div>`},
{c:'Python',k:'BULK',t:'De tres documentos a 1.994',l:'bulk permite indexar muchos documentos con un iterable de acciones. Cada acción declara índice, identificador y fuente del documento.',b:`<pre>{
  "_index": INDEX_NAME,
  "_id": d["id_proceso"],
  "_source": d
}</pre><div class="note"><b>Verificación obligatoria:</b> <code>client.count(index=INDEX_NAME)</code> debe coincidir con el corpus.</div>`},
{c:'Inspección',k:'INDEX MANAGEMENT / DISCOVER',t:'Verifica también desde la interfaz',l:'La autonomía operacional incluye saber mirar el índice sin depender del notebook: mapping, conteo de documentos, documentos de muestra y errores de ingesta.',b:`<div class="grid"><div class="card"><b>Index Management</b>¿existe el índice?, ¿cuál es el mapping?</div><div class="card"><b>Discover</b>¿puedes ver documentos reales?</div></div><div class="note">Si el conteo no coincide, no avances a evaluar relevancia.</div>`},
{c:'Evaluación',k:'A/B + PRECISION@5',t:'Mover el ranking no significa mejorarlo',l:'Primero defines un criterio observable de relevancia. Luego etiquetas los cinco primeros resultados de A y B y calculas cuántos fueron relevantes.',b:`<pre>Precision@5 = resultados relevantes en top 5 / 5</pre><div class="grid"><div class="card"><b>A</b>sin boost.</div><div class="card"><b>B</b>con boost controlado.</div></div><div class="note">Si P@5 baja, el ranking “más sofisticado” no mejoró para esa necesidad.</div>`},
{c:'Reto',k:'SALA DE REDACCIÓN',t:'Transferencia: 987 noticias, otro problema',l:'Si solo puedes repetir contratos, no dominaste la herramienta. El reto editorial usa noticias ya conocidas para construir otro buscador con otra necesidad.',b:`<table class="table"><tr><th>Campo</th><th>Decisión</th></tr><tr><td>titulo/subtitulo/cuerpo</td><td><code>text</code></td></tr><tr><td>categoria</td><td><code>keyword</code></td></tr><tr><td>premium</td><td><code>boolean</code></td></tr><tr><td>publicado</td><td><code>date</code></td></tr><tr><td>etiquetas</td><td>debes justificarlo</td></tr></table>`},
{c:'Clase',k:'CÓMO SE DICTA',t:'Qué va en clase y qué puede quedar como cierre',l:'En clase se explican todas las definiciones y ejemplos con esta presentación. El laboratorio guía el ritmo; el cuaderno ejecuta. No hay que enseñar páginas sueltas.',b:`<div class="grid"><div class="card"><b>En clase</b>Console, mapping, analyzer, match, multi_match, filter, Python, bulk y P@5.</div><div class="card"><b>Cierre/tarea</b>Terminar el reto de noticias si el tiempo no alcanza.</div></div><div class="note">Máximo tres recursos visibles: presentación, cuaderno, laboratorio.</div>`},
{c:'Cierre',k:'PASAPORTE',t:'Después de S07 puedo hacerlo solo',l:'El cierre no es recordar definiciones. Es verificar capacidades: crear índice, diseñar mapping, usar Console, automatizar Python, medir relevancia y transferir a otro corpus.',b:`<div class="grid"><div class="card"><b>Herramienta</b>UI + Console + Python.</div><div class="card"><b>Búsqueda</b>Analyzer, BM25, Query DSL.</div><div class="card"><b>Evaluación</b>A/B + P@5 + límite.</div><div class="card"><b>Futuro</b>semantic/hybrid search y productos como Gemini Notebook abstraen parte de este control.</div></div><div class="note">Pregunta final: si un producto ya permite preguntar a documentos, ¿qué control ganaste aprendiendo Elasticsearch?</div>`}

const stage=document.getElementById('stage'),bar=document.getElementById('bar'),n=document.getElementById('n'),tot=document.getElementById('tot'),chap=document.getElementById('chap');stage.innerHTML=slides.map((s,i)=>`<section class="slide ${i===0?'on':''} ${s.dark?'dark':''}"><div class="k">${s.k}</div><h1>${s.t}</h1><p class="lead">${s.l}</p>${s.b}</section>`).join('');const els=[...document.querySelectorAll('.slide')];tot.textContent=els.length;let idx=0;function show(j){idx=Math.max(0,Math.min(els.length-1,j));els.forEach((e,k)=>e.classList.toggle('on',k===idx));n.textContent=idx+1;bar.style.width=((idx+1)/els.length*100)+'%';chap.textContent=slides[idx].c;history.replaceState(null,'','#s'+(idx+1));}prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}});let st=null;stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('a,button,input,pre'))return;let t=e.touches[0];st={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});stage.addEventListener('touchend',e=>{if(!st)return;let t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.time;st=null;if(dt<900&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)show(idx+(dx<0?1:-1));},{passive:true});fs.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};let m=location.hash.match(/^#s(\d+)$/);if(m)show(Number(m[1])-1);else show(0);
