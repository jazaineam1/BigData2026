<script>
const slides=[
{c:'Inicio',k:'UNIVERSIDAD CENTRAL · S07',t:'Elasticsearch Search Lab',l:'Hoy vamos a construir un buscador explicable: partir de datos, prepararlos para buscar, hacer una pregunta, ordenar resultados y comprobar si el orden es defendible.',dark:1,b:`<div class="flow"><div class="node">Datos</div><div class="arrow">→</div><div class="node">Preparar para buscar</div><div class="arrow">→</div><div class="node">Pregunta</div><div class="arrow">→</div><div class="node">Resultados ordenados</div><div class="arrow">→</div><div class="node">Evaluación</div></div><div class="note"><b>Regla de clase:</b> entra a S07 Live al inicio. La columna de primer intento no se maquilla con reintentos; la columna de dominio muestra aprendizaje después de pistas.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#live">Entrar a S07 Live →</a>`},
{c:'Problema',k:'IDEA CENTRAL',t:'Identificar, filtrar y buscar no son lo mismo',l:'Antes de aprender la herramienta, separa el problema. Identificar recupera algo conocido; filtrar aplica una condición; buscar ordena candidatos cuando la necesidad está expresada en texto.',b:`<div class="grid"><div class="card"><b>Identificar</b><code>id_proceso = CO1.REQ.1234</code><br>Quiero un documento conocido.</div><div class="card"><b>Filtrar</b><code>departamento = Bogotá</code><br>El documento cumple o no cumple.</div><div class="card"><b>Buscar</b><code>mantenimiento aeronaves</code><br>Puede haber muchos candidatos y necesito ranking.</div><div class="card"><b>Otros productos</b>E-commerce: “zapatos impermeables”. Empleo: “data scientist NLP”. Soporte: “error de token”.</div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d1">Resolver D1 · Ranking →</a>`},
{c:'Motor',k:'QUÉ ES',t:'Qué es Elasticsearch y qué significa indexar',l:'Elasticsearch es un motor de búsqueda y análisis. Recibe documentos, los almacena y prepara estructuras para recuperarlos sin leer todo el corpus cada vez.',b:`<div class="grid three"><div class="card"><b>Motor</b>Sistema especializado que responde búsquedas y análisis sobre colecciones de documentos.</div><div class="card"><b>Indexar</b>No es solo guardar: es preparar representaciones para buscar después.</div><div class="card"><b>No confundir</b>Python no es Elasticsearch. Python será un cliente para hablar con el motor.</div></div><div class="note"><b>Ejemplo:</b> guardas 10.000 noticias y preguntas “sobrecostos contratación”. El motor devuelve candidatos ordenados.</div>`},
{c:'Modelo',k:'DOCUMENTO · CAMPO · ÍNDICE',t:'La unidad de trabajo es un documento JSON',l:'Primero define tres palabras base. Documento: entidad completa. Campo: propiedad del documento. Índice: colección consultable de documentos similares.',b:`<div class="twocol"><pre>{
  "id": "N-001",
  "titulo": "Sobrecostos en obra pública",
  "categoria": "Investigación",
  "premium": false
}</pre><div><div class="card"><b>Documento</b>El JSON completo: una noticia, producto, vacante o proceso.</div><div class="card"><b>Campo</b><code>titulo</code>, <code>categoria</code>, <code>premium</code>.</div><div class="card"><b>Índice</b><code>noticias-2026</code> podría contener 987 documentos.</div></div></div><div class="note"><b>Medición:</b> <code>count()</code> cuenta documentos, no campos.</div>`},
{c:'Modelo',k:'MAPPING',t:'Mapping: el plano de interpretación de los campos',l:'Un mapping le dice a Elasticsearch qué tipo tiene cada campo y cómo debe tratarlo. No es decoración: condiciona qué operaciones podrás hacer bien.',b:`<div class="twocol"><div><pre>Documento
├── titulo
├── categoria
├── premium
└── publicado</pre><div class="note"><b>Idea simple:</b> Elasticsearch ve valores; el mapping le dice cómo interpretarlos.</div></div><table class="table"><tr><th>Campo</th><th>Uso buscado</th><th>Tipo</th></tr><tr><td>titulo</td><td>buscar palabras</td><td><code>text</code></td></tr><tr><td>categoria</td><td>filtrar valor completo</td><td><code>keyword</code></td></tr><tr><td>premium</td><td>sí / no</td><td><code>boolean</code></td></tr><tr><td>publicado</td><td>rangos temporales</td><td><code>date</code></td></tr></table></div><div class="note warn"><b>Error:</b> escoger el tipo por “cómo se ve” el dato y no por lo que necesitas hacer con él.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d2">Resolver D2 · Mapping ↗</a>`},
{c:'Modelo',k:'TEXT · KEYWORD',t:'Buscar palabras y comparar valores completos son operaciones distintas',l:'Búsqueda de texto completo significa buscar dentro de contenido textual sin exigir igualdad exacta de toda la cadena. Para eso usamos campos text. Para valores completos usamos keyword.',b:`<div class="grid three"><div class="card"><b>text</b><code>“Banco de Bogotá”</code> puede analizarse como texto para búsqueda.</div><div class="card"><b>keyword</b><code>“Banco de Bogotá”</code> se conserva completo para filtro, orden o agrupación.</div><div class="card"><b>full-text</b>Documento: “servicio de mantenimiento de aeronaves”. Consulta: “mantenimiento aeronaves”. No buscamos igualdad exacta.</div></div><pre>"titulo": {"type":"text", "fields":{"keyword":{"type":"keyword"}}}</pre><div class="note"><b>Multi-field:</b> el mismo valor puede indexarse de más de una forma: <code>titulo</code> para buscar y <code>titulo.keyword</code> para comparar completo.</div>`},
{c:'Interfaces',k:'API · UI · CONSOLE · PYTHON',t:'Cómo vamos a hablar con Elasticsearch',l:'Ahora sí introducimos las interfaces. Una API es un conjunto de operaciones para pedir acciones o datos a otro sistema. Console escribe esas solicitudes; Python las automatiza.',b:`<div class="grid four"><div class="card"><b>API</b>Solicitud + respuesta. Ejemplo: <code>GET indice/_search</code>.</div><div class="card"><b>UI</b>Interfaz visual para inspeccionar índices, documentos y conteos.</div><div class="card"><b>Console</b>Lugar donde escribes llamadas HTTP/JSON directamente.</div><div class="card"><b>Python</b>Cliente para repetir y automatizar lo que ya entendiste.</div></div><div class="note warn"><b>Orden de clase:</b> primero entendemos con ejemplos pequeños; después automatizamos.</div>`},
{c:'Texto',k:'TOKENIZER · TOKEN',t:'Tokenizer y token: partir un texto en unidades observables',l:'Un tokenizer decide cómo dividir una secuencia de caracteres. Cada unidad resultante se llama token. Token no siempre significa palabra humana.',b:`<div class="twocol"><div><pre>Texto:
"Quick brown fox"

Tokenizer standard
       ↓
[Quick] [brown] [fox]

Resultado: 3 tokens</pre></div><div class="grid"><div class="card"><b>Tokenizer</b>Regla o componente que separa caracteres en unidades.</div><div class="card"><b>Token</b>Unidad producida por el tokenizer/analyzer.</div><div class="card"><b>No fijo</b>“New York” puede ser dos tokens o uno, según el tokenizer.</div><div class="card"><b>Medición</b>Con <code>_analyze</code> cuentas objetos en <code>tokens[]</code>.</div></div></div><a class="livebtn" target="bigdata-tokenizer" rel="noopener" href="../assets/tutoriales/s07-tokenizer-lab.html?v=20260924-tokenizer">Abrir laboratorio de tokenización ↗</a>`},
{c:'Texto',k:'EJEMPLOS DE TOKENIZADORES',t:'Un mismo texto puede producir tokens diferentes',l:'No existe “el” conteo universal de tokens de un texto. El conteo depende del tokenizer y de los filtros aplicados después.',b:`<table class="table"><tr><th>Texto</th><th>Tokenizer</th><th>Tokens</th></tr><tr><td>Quick brown fox</td><td>standard</td><td>[quick] [brown] [fox]</td></tr><tr><td>New York</td><td>standard</td><td>[new] [york]</td></tr><tr><td>New York</td><td>keyword</td><td>[new york]</td></tr><tr><td>correo@test.com</td><td>whitespace</td><td>[correo@test.com]</td></tr><tr><td>data-science</td><td>standard</td><td>[data] [science]</td></tr></table><div class="note"><b>Offsets:</b> cada token puede mostrar dónde empieza y termina dentro del texto original: <code>start_offset</code> y <code>end_offset</code>.</div>`},
{c:'Texto',k:'ANALYZER',t:'Analyzer: tokenizer más filtros',l:'Un analyzer es una tubería completa. Primero tokeniza; después puede transformar tokens con filtros como minúsculas, stopwords o stemming.',b:`<div class="flow"><div class="node">Texto<br><b>“Mantenimiento de las aeronaves”</b></div><div class="arrow">→</div><div class="node">Tokenizer<br><b>divide</b></div><div class="arrow">→</div><div class="node">Filtros<br><b>lowercase / stop / stem</b></div><div class="arrow">→</div><div class="node">Tokens finales</div></div><div class="grid three"><div class="card"><b>lowercase</b><code>AERONAVES → aeronaves</code></div><div class="card"><b>stopwords</b>puede quitar palabras muy frecuentes como “de” o “las”.</div><div class="card"><b>stemming</b>aproxima variantes: aeronave/aeronaves.</div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d3">Resolver D3 · Analyzer ↗</a>`},
{c:'Texto',k:'INDEX-TIME · SEARCH-TIME',t:'El texto se analiza al guardar y al buscar',l:'Para recuperar coincidencias útiles, el texto del documento y el texto de la consulta deben transformarse en representaciones comparables.',b:`<div class="grid two"><div class="card"><b>Al indexar</b><code>“Servicios de mantenimiento de aeronaves”</code><br>↓ analyzer<br>términos indexados.</div><div class="card"><b>Al buscar</b><code>“mantenimiento aeronave”</code><br>↓ analyzer<br>términos de consulta.</div></div><div class="note"><b>Idea clave:</b> no se comparan dos párrafos completos carácter por carácter; se comparan representaciones analizadas.</div>`},
{c:'Texto',k:'_ANALYZE',t:'No adivines tokens: mídelos con _analyze',l:'La API _analyze permite ver exactamente qué tokens produce un analyzer para una frase. Es la herramienta para explicar, no para adivinar.',b:`<div class="twocol"><pre>ELASTIC CONSOLE · NO COLAB
POST s07-demo/_analyze
{
  "analyzer": "spanish",
  "text": "Servicios de mantenimiento de las aeronaves"
}</pre><div><div class="card"><b>Qué devuelve</b>Un arreglo <code>tokens[]</code>.</div><div class="card"><b>Qué miras</b><code>token</code>, <code>position</code>, <code>start_offset</code>, <code>end_offset</code>.</div><div class="card"><b>Cómo contar</b>3 objetos en <code>tokens[]</code> = 3 tokens.</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d4">Resolver D4 · API ↗</a>`},
{c:'Búsqueda',k:'ÍNDICE INVERTIDO',t:'La tabla al revés que hace posible buscar rápido',l:'Un índice invertido pasa de “documento → términos” a “término → documentos”. Así el motor localiza candidatos sin leer todo el corpus cada vez.',b:`<div class="twocol"><pre>D1: "mantenimiento aeronaves"
D2: "combustible aeronaves"
D3: "mantenimiento motores"</pre><table class="table"><tr><th>Término</th><th>Documentos</th></tr><tr><td>mantenimiento</td><td>D1, D3</td></tr><tr><td>aeronaves</td><td>D1, D2</td></tr><tr><td>combustible</td><td>D2</td></tr></table></div><div class="note"><b>Consulta:</b> “mantenimiento aeronaves” encuentra a D1 en ambas listas.</div>`},
{c:'Búsqueda',k:'MATCH · TERM',t:'No todas las consultas buscan igual',l:'match es para búsqueda full-text y analiza la consulta. term busca un término exacto y es apropiado para keyword, IDs o categorías.',b:`<div class="grid two"><div class="card"><b><code>match</code> + <code>text</code></b>Campo: <code>descripcion</code><br>Consulta: “mantenimiento aeronave”.</div><div class="card"><b><code>term</code> + <code>keyword</code></b>Campo: <code>estado</code><br>Consulta exacta: <code>ADJUDICADO</code>.</div></div><div class="note warn"><b>Error:</b> usar <code>term</code> sobre un campo <code>text</code> esperando comportamiento de buscador.</div>`},
{c:'Búsqueda',k:'LÍNEA BASE PYTHON',t:'De un filtro literal en Pandas a un buscador',l:'str.contains() no es Elasticsearch. Es una línea base de Python/Pandas para preguntar si una cadena aparece en un texto. Sirve para filtrar, no para ordenar relevancia.',b:`<div class="twocol"><pre>df["descripcion"].str.contains(
  "mantenimiento",
  case=False,
  na=False,
  regex=False
)</pre><div><div class="card"><b>Salida</b><code>True / False</code> por fila.</div><div class="card"><b>Límite</b>Si D1 y D3 son <code>True</code>, no dice cuál responde mejor.</div><div class="card"><b>Transición</b>Elasticsearch recupera candidatos y los ordena con scoring.</div></div></div>`},
{c:'Ranking',k:'BM25',t:'BM25: ordenar candidatos lexicales',l:'BM25 es una función de scoring lexical. Usa señales como frecuencia del término, rareza en la colección y longitud del documento.',b:`<div class="note"><b>Consulta:</b> <code>mantenimiento aeronaves</code></div><table class="table"><tr><th>Doc.</th><th>Texto</th><th>Qué observar</th></tr><tr><td>D1</td><td>Mantenimiento aeronaves KFIR</td><td>ambos términos, poco ruido</td></tr><tr><td>D2</td><td>Servicios, compras, combustible, mantenimiento, aeronaves...</td><td>texto largo</td></tr><tr><td>D3</td><td>Mantenimiento mantenimiento mantenimiento aeronaves</td><td>repetición con ganancia decreciente</td></tr></table><div class="note warn"><b>Lexical:</b> basado en términos presentes, no en significado profundo.</div>`},
{c:'Ranking',k:'_SCORE',t:'Qué significa y qué no significa el score',l:'_score es una señal numérica usada para ordenar hits en una consulta concreta. No es porcentaje, nota ni probabilidad.',b:`<div class="grid two"><div class="card"><b>Lectura válida</b>A obtuvo <code>8.2</code> y B <code>4.7</code>; para esta consulta A quedó antes.</div><div class="card"><b>Lectura inválida</b><code>8.2</code> no significa 82 %, ni 8.2/10, ni “verdadero”.</div></div><div class="note"><b>Evaluación real:</b> define relevancia y mide el ranking con juicios.</div>`},
{c:'Operación',k:'ELASTIC CLOUD',t:'Entrar a Elastic y ubicar lo esencial',l:'Ahora operamos la herramienta. URL del proyecto, API key, Console e interfaz visual son piezas distintas.',b:`<div class="grid four"><div class="card"><b>Project URL</b>Destino del servicio.</div><div class="card"><b>API key</b>Credencial secreta. No va a GitHub.</div><div class="card"><b>Console</b>Escribe solicitudes API.</div><div class="card"><b>UI</b>Inspecciona índices y documentos.</div></div><div class="note warn"><b>Seguridad:</b> si una credencial queda pública, se revoca.</div>`},
{c:'Operación',k:'REQUEST · RESPONSE',t:'Anatomía de una solicitud de búsqueda',l:'Una solicitud combina método, recurso, operación y cuerpo JSON. La respuesta también es JSON.',b:`<div class="twocol"><pre>GET mi_indice/_search
{
  "query": {
    "match": {"descripcion":"mantenimiento aeronaves"}
  }
}</pre><div><div class="card"><b>GET</b>Método.</div><div class="card"><b>mi_indice/_search</b>Recurso + operación.</div><div class="card"><b>query</b>Cuerpo de búsqueda.</div><div class="card"><b>Respuesta</b><code>hits</code>, <code>_score</code>, <code>_source</code>.</div></div></div>`},
{c:'Operación',k:'PUT ÍNDICE',t:'Crear un índice desde Console',l:'Crear un índice establece un espacio lógico de documentos y puede declarar mappings antes de cargar datos.',b:`<div class="twocol"><pre>PUT s07-demo
{
  "mappings": {
    "properties": {
      "titulo": {"type":"text","analyzer":"spanish"},
      "categoria": {"type":"keyword"}
    }
  }
}</pre><div><div class="card"><b>PUT</b>Crea o establece el recurso.</div><div class="card"><b>properties</b>Campos conocidos.</div><div class="card"><b>Esperado</b><code>"acknowledged": true</code>.</div></div></div>`},
{c:'Operación',k:'INDEXAR DOCUMENTO',t:'Insertar documentos manualmente antes de automatizar',l:'Indexar un documento significa enviarlo al índice para almacenarlo y construir las estructuras de búsqueda de sus campos.',b:`<div class="twocol"><pre>PUT s07-demo/_doc/1
{
  "titulo": "Mantenimiento de aeronaves",
  "categoria": "servicio"
}</pre><div><div class="card"><b><code>_id = 1</code></b>Identifica el documento.</div><div class="card"><b><code>_source</code></b>Conserva el JSON original.</div><div class="card"><b><code>titulo</code></b>Al ser <code>text</code>, se analiza para búsqueda.</div></div></div>`},
{c:'Operación',k:'HITS',t:'Leer una respuesta: hits, _id, _source y _score',l:'Un hit es un documento devuelto por Elasticsearch como resultado de una búsqueda. Cada hit trae identificación, documento y señales de ranking.',b:`<table class="table"><tr><th>Campo</th><th>Ejemplo</th><th>Significado</th></tr><tr><td><code>hits.total.value</code></td><td>37</td><td>cantidad de coincidencias</td></tr><tr><td><code>hits.hits[]</code></td><td>lista</td><td>resultados</td></tr><tr><td><code>_id</code></td><td>N-001</td><td>identificador</td></tr><tr><td><code>_source</code></td><td>{...}</td><td>documento original</td></tr><tr><td><code>_score</code></td><td>8.21</td><td>señal de orden</td></tr></table>`},
{c:'Consulta',k:'MULTI_MATCH',t:'Buscar una intención en varios campos',l:'multi_match aplica una misma necesidad textual sobre varios campos. Primero aprende la idea sin pesos; después añadimos boost.',b:`<div class="twocol"><pre>{
  "multi_match": {
    "query": "data scientist NLP",
    "fields": ["cargo", "skills", "descripcion"]
  }
}</pre><div><div class="card"><b>Ejemplo</b>NLP puede aparecer en skills aunque no aparezca en cargo.</div><div class="card"><b>No significa</b>que todos los campos deban coincidir.</div></div></div>`},
{c:'Consulta',k:'BOOL · MUST · FILTER',t:'Combinar relevancia y restricciones',l:'bool es una consulta compuesta. must contiene condiciones que participan en la coincidencia. filter restringe el conjunto sin sumar score.',b:`<div class="twocol"><pre>{
  "bool": {
    "must": [{"multi_match": {...}}],
    "filter": [
      {"term":{"remoto":true}},
      {"term":{"pais":"Colombia"}}
    ]
  }
}</pre><div><div class="card"><b>bool</b>Combina cláusulas.</div><div class="card"><b>must</b>¿Qué tan bien responde?</div><div class="card"><b>filter</b>¿Puede entrar?</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d6">Resolver D6 · Query DSL ↗</a>`},
{c:'Consulta',k:'BOOST',t:'Dar más peso a un campo es una hipótesis',l:'Un boost modifica la influencia relativa de un campo. No significa probabilidad ni verdad: debe evaluarse.',b:`<div class="twocol"><pre>{
  "multi_match": {
    "query": "sobrecostos contratación",
    "fields": ["titulo^4", "subtitulo^2", "cuerpo"]
  }
}</pre><div><div class="card"><b>Hipótesis</b>Coincidencia en título puede indicar centralidad temática.</div><div class="card"><b>Prueba</b>Compara A sin boost vs B con boost usando los mismos juicios.</div></div></div><div class="note warn"><b><code>^4</code></b> no significa “cuatro veces más relevante” como probabilidad.</div>`},
{c:'Consulta',k:'HIGHLIGHT',t:'Highlight ayuda a inspeccionar, no prueba relevancia',l:'highlight devuelve fragmentos donde ocurrió una coincidencia. Sirve para UX y análisis de falsos positivos.',b:`<div class="twocol"><pre>"highlight": {
  "fields": {
    "titulo": {},
    "cuerpo": {}
  }
}</pre><div><div class="card"><b>Ejemplo</b>“La Contraloría investiga <em>sobrecostos</em> en contratos…”</div><div class="card"><b>Límite</b>Una palabra resaltada no demuestra relevancia.</div></div></div>`},
{c:'Python',k:'CLIENTE PYTHON',t:'El cliente Python explicado',l:'El cliente sabe a qué servicio conectarse y con qué autorización. No contiene los documentos.',b:`<div class="twocol"><pre>client = Elasticsearch(
  endpoint,
  api_key=api_key
)

client.info()</pre><div><div class="card"><b>endpoint</b>Destino del servicio.</div><div class="card"><b>api_key</b>Autorización.</div><div class="card"><b>client.info()</b>Prueba mínima de conexión.</div><div class="card"><b>Si falla</b>401: credencial. Timeout: URL o red.</div></div></div>`},
{c:'Python',k:'CONSOLE ↔ PYTHON',t:'Python automatiza la misma API',l:'Console y Python expresan la misma intención contra el mismo motor. Cambia la interfaz, no el concepto.',b:`<div class="grid two"><div class="card"><b>Console</b><pre>GET indice/_search
{"query": {...}}</pre></div><div class="card"><b>Python</b><pre>client.search(
  index="indice",
  query={...}
)</pre></div></div><div class="note"><b>Ruta didáctica:</b> primero prueba con pocos documentos en Console; luego automatiza con Python.</div>`},
{c:'Python',k:'BULK',t:'De tres documentos a 1.994',l:'bulk() envía muchas acciones de indexación eficientemente. La evidencia no es “la celda terminó”: debes revisar errores y conteo remoto.',b:`<div class="twocol"><pre>{
  "_index": INDEX_NAME,
  "_id": fila["id_proceso"],
  "_source": {...}
}</pre><div><div class="card"><b>Intentados</b>1.994 procesos únicos.</div><div class="card"><b>Comprueba</b><code>errors</code> y <code>client.count()</code>.</div><div class="card"><b>Criterio</b>conteo local = conteo remoto.</div></div></div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d5">Resolver D5 · Bulk ↗</a>`},
{c:'Autonomía',k:'DIAGNÓSTICO',t:'Saber diagnosticar es parte de saber usar la herramienta',l:'Antes de cambiar código al azar, ubica la capa probable del fallo: credenciales, índice, mapping, analyzer, ingesta o consulta.',b:`<table class="table"><tr><th>Síntoma</th><th>Primera sospecha</th><th>Qué mirar</th></tr><tr><td>401</td><td>API key</td><td>credencial/permisos</td></tr><tr><td>404 index_not_found</td><td>índice</td><td>nombre o creación</td></tr><tr><td>0 hits</td><td>mapping/query</td><td><code>_mapping</code> + <code>_analyze</code></td></tr><tr><td>count menor</td><td>bulk</td><td>errores individuales</td></tr><tr><td>ranking raro</td><td>query/scoring</td><td>highlight + juicios</td></tr></table>`},
{c:'Autonomía',k:'UI DE INSPECCIÓN',t:'Verifica también desde la interfaz',l:'Index Management y Discover sirven para contrastar lo que tu código afirma con el estado real del servicio.',b:`<div class="grid two"><div class="card"><b>Index Management</b>Índices, mappings, settings y estado.</div><div class="card"><b>Discover</b>Documentos concretos, campos y valores.</div></div><div class="note"><b>Ejemplo:</b> si Python dice 1.994 documentos, la UI debe ayudarte a confirmar que el índice y su contenido existen.</div>`},
{c:'Evaluación',k:'P@5',t:'Mover el ranking no significa mejorarlo',l:'Precision@5 es la proporción de resultados relevantes entre los cinco primeros. El criterio de relevancia se define antes de comparar configuraciones.',b:`<table class="table"><tr><th>Pos.</th><th>Resultado</th><th>Juicio</th></tr><tr><td>1</td><td>tema central</td><td>1</td></tr><tr><td>2</td><td>mención tangencial</td><td>0</td></tr><tr><td>3</td><td>antecedente central</td><td>1</td></tr><tr><td>4</td><td>caso relacionado</td><td>1</td></tr><tr><td>5</td><td>ruido léxico</td><td>0</td></tr></table><pre>Precision@5 = 3 / 5 = 0.60</pre><div class="note">No es precisión global del buscador; es top 5 bajo este criterio.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d7">Resolver D7 · P@5 ↗</a>`},
{c:'Evaluación',k:'A/B',t:'Una comparación defendible tiene pasos',l:'Un experimento A/B conserva la necesidad y los juicios, cambia una hipótesis controlada y compara resultados.',b:`<div class="flow"><div class="node">Necesidad<br><b>sobrecostos contratación</b></div><div class="arrow">→</div><div class="node">A<br><b>sin boost</b></div><div class="arrow">→</div><div class="node">B<br><b>titulo^4</b></div><div class="arrow">→</div><div class="node">P@5 + errores</div></div><div class="note"><b>Ejemplo:</b> A = 0.80 y B = 0.60. B no mejoró esta necesidad bajo esos juicios.</div>`},
{c:'Transferencia',k:'NOTICIAS',t:'Transferencia: 987 noticias, otro problema',l:'La transferencia reconstruye la solución en otro dominio. Cambian documentos, campos y necesidad; se conserva el razonamiento mapping → consulta → filtro → evaluación.',b:`<div class="grid two"><div class="card"><b>Documento</b><code>titulo</code>, <code>subtitulo</code>, <code>cuerpo</code>, <code>categoria</code>, <code>premium</code>, <code>publicado</code>.</div><div class="card"><b>Necesidad</b>“sobrecostos en contratación”.</div><div class="card"><b>Hipótesis B</b><code>titulo^4 + subtitulo^2 + cuerpo</code>.</div><div class="card"><b>Filtro</b><code>premium=false</code>.</div></div><div class="note"><b>Prueba:</b> justifica mapping, pesos, filtro, P@5 y falso positivo.</div><a class="livebtn" target="bigdata-lab" rel="noopener" href="../assets/tutoriales/s07-laboratorio-guiado.html?v=20260924-tokenizer#d8">Resolver D8 · Transferencia ↗</a>`},
{c:'Industria',k:'SIGUIENTE NIVEL',t:'Qué viene después de S07',l:'No introducimos más jerga sin definirla: estas son extensiones naturales después de dominar recuperación lexical.',b:`<div class="grid"><div class="card"><b>Evaluar muchas consultas</b><code>_rank_eval</code>: compara rankings contra documentos juzgados.</div><div class="card"><b>Diagnosticar rendimiento</b>Search Profiler: encuentra qué parte de una consulta consume tiempo.</div><div class="card"><b>Construir producto</b>Search UI: caja de búsqueda, filtros y navegación.</div><div class="card"><b>Buscar por significado</b>Semantic search usa representaciones de significado; hybrid combina lexical + semántico.</div></div>`},
{c:'Cierre',k:'PASAPORTE',t:'Después de S07 puedo hacerlo solo',l:'La evidencia final no es haber mirado una clase: es poder repetir el proceso con otra colección documental y justificar cada decisión.',b:`<div class="grid"><div class="card"><b>Modelo</b>documento, campo, índice, mapping, tokenizer, token y analyzer.</div><div class="card"><b>Consulta</b>match, term, multi_match, bool, must, filter, boost y highlight.</div><div class="card"><b>Automatización</b>cliente Python, bulk, count y lectura de hits.</div><div class="card"><b>Evaluación</b>criterio, P@5, A/B, falso positivo y límite.</div></div><div class="note"><b>Puente:</b> S9 podrá introducir búsqueda semántica porque ya entiendes la recuperación lexical.</div>`}
];
let idx=0;const stage=document.getElementById('stage'),n=document.getElementById('n'),tot=document.getElementById('tot'),bar=document.getElementById('bar'),chap=document.getElementById('chap'),prev=document.getElementById('prev'),next=document.getElementById('next');tot.textContent=slides.length;stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.dark?'dark':''}" id="s${i+1}"><div class="k ${s.k==='MAPPING'?'warnk':''}">${s.k}</div><h1>${s.t}</h1><p class="lead">${s.l}</p>${s.b}</section>`).join('');function show(i){idx=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((el,j)=>el.classList.toggle('on',j===idx));n.textContent=idx+1;bar.style.width=((idx+1)/slides.length*100)+'%';chap.textContent=slides[idx].c;prev.disabled=idx===0;next.disabled=idx===slides.length-1;location.hash='s'+(idx+1)}prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')show(idx+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(idx-1)});document.getElementById('fs').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};const h=location.hash.match(/s(\d+)/);show(h?Number(h[1])-1:0);
</script>
