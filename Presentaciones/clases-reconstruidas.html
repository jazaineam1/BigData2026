imit":"Tabla medida; no inventar speedup.","case":null,"lab":{"index":29,"heading":"6B · Laboratorio central: trabajadores reales sobre ocho lotes SECOP","status":"sección temática identificada","gap":null}},{"id":"S13.20","title":"Cuaderno: entrenar modelo","start":109,"end":120,"minutes":11,"text":"Usa un estimador compatible con particiones o flujo incremental y registra si materializa datos.","action":"Entrenar escala viable y evaluar sobre conjunto separado.","limit":"Métricas, configuración y modo; no afirmar entrenamiento distribuido si hubo collect.","case":null,"lab":{"index":43,"heading":"11 · K-means local y distribuido: una comparación justa","status":"ampliación pendiente","gap":"No sustituye entrenamiento supervisado por particiones; añadirlo."}},{"id":"S13.21","title":"Cuaderno: exportar resultados","start":120,"end":130,"minutes":10,"text":"Guarda métricas, configuración y predicciones con IDs y versión.","action":"Releer y verificar IDs y equivalencia de controles.","limit":"Motor y manifiesto para Spark.","case":null,"lab":{"index":35,"heading":"7 · Guardar evidencia reutilizable con Parquet","status":"sección temática identificada","gap":null}},{"id":"S13.22","title":"Reto distribuido","start":130,"end":134,"minutes":4,"text":"Compara dos configuraciones bajo misma restricción; más workers pueden empeorar rendimiento.","action":"Ejecutar prueba segura y elegir configuración según tiempo y memoria observados.","limit":"Resultado propio y alternativa descartada.","case":null,"lab":null},{"id":"S13.23","title":"Lectura de dashboard","start":134,"end":137,"minutes":3,"text":"Dashboard muestra tareas y recursos; no demuestra clúster físico sin evidencia.","action":"Identificar cuello de botella con una salida real o captura etiquetada.","limit":"Evidencia de entorno; no afirmar clúster físico sin prueba.","case":null,"lab":null},{"id":"S13.24","title":"Relevo Spark","start":137,"end":140,"minutes":3,"text":"Spark recibe mismo esquema, operaciones y split para comparación.","action":"Verificar IDs y tipos de salida que Spark deberá leer.","limit":"Contrato de comparación.","case":null,"lab":null},{"id":"S13.25","title":"Cierre Dask","start":140,"end":150,"minutes":10,"text":"Demuestra equivalencia y explica límites y rendimiento medido, no un speedup prometido.","action":"Resolver controles de workers, partición, lazy y entrenamiento con resultados propios.","limit":"Motor Dask y límites; medición pendiente no es éxito.","case":null,"lab":null}],"control":{"at":6,"title":"Ley de Amdahl","label":"Trabajadores ideales","min":1,"max":32,"step":1,"initial":4},"blocks":[{"title":"Bloques y MapReduce","range":"10–16","concept":"HDFS divide y replica; Map emite parciales; Reduce combina. Media requiere suma y cantidad.","task":"Comprueba promedio ponderado y pérdida de nodo.","evidence":"Resultado equivalente.","excerpt":"suma_total = sum(suma for suma, cantidad in parciales)\ncantidad_total = sum(cantidad for suma, cantidad in parciales)\n\npromedio_correcto = suma_total / cantidad_total\npromedio_incorrecto = sum(s / n for s, n in parciales) / len(parciales)\n\nprint(\"REDUCE correcto:\", round(promedio_correcto, 3))\nprint(\"Promedio de promedios:\", round(promedio_incorrecto, 3))\nassert round(promedio_correcto, 6) == round(370/107, 6)\n","excerptTruncated":false},{"title":"Pandas como referencia","range":"17–28","concept":"Particionar no implica distribuir físicamente. Dask crea un grafo de tareas y ejecuta al solicitar compute.","task":"Compara conteos pandas/Dask.","evidence":"Paridad.","excerpt":"dask_tabla = dd.from_pandas(tabla, npartitions=4)\npendiente = dask_tabla.groupby(\"modalidad_de_contratacion\").size()\n\nprint(\"Particiones:\", dask_tabla.npartitions)\nprint(\"Antes de compute:\", type(pendiente).__name__)\nconteo_dask = pendiente.compute().sort_index()\nvalores_pandas = {str(k): int(v) for k, v in conteo_pandas.items()}\nvalores_dask = {str(k): int(v) for k, v in conteo_dask.items()}\nassert valores_pandas == valores_dask\nprint(\"Resultado Dask:\", conteo_dask.head(), \"\\nCoincide: SÍ\")\n","excerptTruncated":false},{"title":"Trabajadores reales","range":"29–37","concept":"Worker ejecuta tareas; hilo y núcleo no son equivalentes. Coordinación cuesta tiempo.","task":"Ejecuta ocho lotes y compara modos, preserva resultados.","evidence":"Tiempos reales y Parquet.","excerpt":"# Procesamiento REAL de 1000 títulos SECOP: conteo de vocabulario por lote.\n# Se usan los mismos trabajadores; no hay espera simulada, ni OCR, ni modelos.\nprueba_texto = subprocess.run(\n    [sys.executable, str(script_dask), \"--workers\", str(WORKERS_DEMO_S13),\n     \"--tareas\", \"8\", \"--modo\", \"texto\"], check=True, cwd=RAIZ,\n    capture_output=True, text=True, timeout=120,\n)\nlinea = next((l.split(\"RESULTADO_S13_DASK=\", 1)[1]\n              for l in prueba_texto.stdout.splitlines()\n              if l.startswith(\"RESULTADO_S13_DASK=\")), None)\nassert linea, prueba_texto.stdout[-1800:]\nresumen_texto = json.loads(linea)\nassert resumen_texto[\"resultados_identicos\"]\nassert sum(resumen_texto[\"terminos_distintos_por_lote\"]) > 0\nprint(\"Títulos SECOP:\", resumen_texto[\"filas_procesadas\"])\nprint(\"Workers reales:\", len(resumen_texto[\"workers_reales\"]))\nprint(\"Segundos secuencial:\", resumen_texto[\"segundos_secuencial\"])\nprint(\"Segundos Dask caliente:\", resumen_texto[\"segundos_dask_cluster_caliente\"])\nprint(\"Segundos Dask con arranque:\", resumen_texto[\"segundos_dask_total_incluido_arranque\"])\nprint(\"Ganador con arranque:\", resumen_texto[\"ganador_total\"])\n","excerptTruncated":false},{"title":"K-means distribuido","range":"38–49","concept":"Asignación y actualización iteran; un modelo distribuido no equivale a entrenar modelos independientes.","task":"Ejecuta local y Dask-ML con centros iguales; mide RSS y tiempos.","evidence":"Acuerdo y recursos.","excerpt":"# B. Entrenar un único K-means con Dask-ML, dentro de una sola VM.\n# Dask tiene un costo de arranque y transferencia que debe registrarse.\ninicio_cluster = time.perf_counter()\nwith LocalCluster(n_workers=WORKERS_MODELO, threads_per_worker=1,\n                  processes=True, dashboard_address=None) as cluster:\n    with Client(cluster) as client:\n        client.wait_for_workers(WORKERS_MODELO)\n        workers_info = client.scheduler_info()[\"workers\"]\n        direcciones_workers = sorted(workers_info)\n        limites_workers = {direccion: int(info[\"memory_limit\"])\n                           for direccion, info in workers_info.items()}\n        pids_workers = client.run(os.getpid)\n        tiempo_arranque = time.perf_counter() - inicio_cluster\n        X_distribuido = da.from_array(\n            X_modelo, chunks=(max(100, REGISTROS // 8), VARIABLES)\n        )\n        t0 = time.perf_counter()\n        X_distribuido = client.persist(X_distribuido)\n        wait(X_distribuido)\n        tiempo_transferencia = time.perf_counter() - t0\n        monitor_dask = MuestraRSS({\n            \"Notebook\": proceso_notebook,\n            **{f\"Worker {i+1}\": pids_workers[direccion]\n               for i, direccion in enumerate(direcciones_workers)}\n        })\n        monitor_dask.iniciar()\n        try:\n            modelo_distribuido = KMeansDask(","excerptTruncated":true},{"title":"Entregar motor","range":"50–54","concept":"Amdahl es límite ideal; tiempos de una máquina no generalizan.","task":"Cambia workers con cuota disponible y registra decisión.","evidence":"Evidencia de procesamiento S14.","excerpt":"# Reto de cierre · respuesta estructurada y verificable (sin texto libre)\n# Cambia SOLO ambos números según tu comparación de los modos texto / espera.\n# Esta decisión no requiere métricas de clasificación.\n# Los tiempos vienen de ESTE Codespace; su alcance está en el JSON.\nARQUITECTURA = None\nLIMITE = None\n\nOPCIONES_ARQUITECTURA = {\n    1: \"Secuencial cuando las tareas son demasiado pequeñas\",\n    2: \"Dask 2 workers para lotes independientes con espera\",\n    3: \"Comparar 4 workers y arranque antes de decidir\",\n}\nOPCIONES_LIMITE = {\n    1: \"La aceleración caliente excluye arranque y preparación\",\n    2: \"La espera OCR/ASR fue simulada, no un servicio real\",\n    3: \"Workers de una VM comparten CPU y memoria\",\n    4: \"Los tiempos dependen de los recursos del Codespace usado\",\n}\nprint(\"Elige UNA arquitectura y UN límite de los siguientes menús:\")\nprint(\"Arquitectura:\", OPCIONES_ARQUITECTURA)\nprint(\"Límite:\", OPCIONES_LIMITE)\nif ARQUITECTURA is None or LIMITE is None:\n    print(\"Práctica pendiente: cambia ambos None por los índices seleccionados y vuelve a ejecutar.\")\nelse:\n    if type(ARQUITECTURA) is not int or ARQUITECTURA not in OPCIONES_ARQUITECTURA:\n        raise ValueError(\"ARQUITECTURA debe ser exactamente 1, 2 o 3\")\n    if type(LIMITE) is not int or LIMITE not in OPCIONES_LIMITE:\n        raise ValueError(\"LIMITE debe ser exactamente 1, 2, 3 o 4\")","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":65},{"label":"Autonomía y transferencia","minutes":10},{"label":"Cierre","minutes":10}],"workbench":{"at":10,"title":"MapReduce: estados parciales y carga","concept":"Repartimos valores 1 a 20 en tamaños desiguales. Map calcula suma y conteo; reduce combina ambos. Media global = suma total/conteo total, no promedio de medias de grupos desiguales. Un worker ejecuta tareas; una partición es datos lógicos. El reparto ideal por turno no es el scheduler real.","pred":"Predice si la media de medias coincide cuando la primera partición tiene 12 valores.","fields":[{"label":"Particiones","min":2,"max":6,"step":1,"value":4},{"label":"Filas primera partición","min":4,"max":14,"step":1,"value":12},{"label":"Workers ideales","min":1,"max":6,"step":1,"value":2}],"interpret":"Tabla de estados parciales: tamaño, suma, media y worker conceptual. Compara media exacta, combinada e incorrecta. La carga máxima es un proxy, no tiempo medido.","challenge":"Busca tamaños iguales; luego prueba la misma reducción en Dask frente a pandas y mide configuraciones sin cambiar universo.","limit":"Cálculo real local, no clúster ni benchmark Dask."}},{"id":"14","title":"¿Cómo procesa Spark los datos?","problem":"Laura necesita transformar, consultar y persistir datos y modelos.","mission":"Motor analítico","original":"s14-de-dask-a-spark.html","notebook":{"path":"Cuadernos/14_PySpark_Compras_Claras.ipynb","ref":"mejora-pedagogica-integral","cells":71,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/14_PySpark_Compras_Claras.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/14_PySpark_Compras_Claras.ipynb"},"quiz":{"question":"¿Qué representa shuffle?","options":["Movimiento de datos entre particiones","Una tabla Delta","Un nuevo lenguaje"],"feedback":["Correcto: puede ser costoso.","Delta es formato de tabla.","No es sintaxis."]},"slides":[{"id":"S14.01","title":"Por qué Spark ahora","start":0,"end":3,"minutes":3,"text":"Spark ofrece DataFrames, SQL, optimización y ejecución distribuible; no garantiza acelerar toda tarea.","action":"Elegir operación que se comparará bajo igualdad de datos.","limit":"Hipótesis de capacidad; no declarar Spark más rápido siempre.","case":null,"lab":null},{"id":"S14.02","title":"Relevo Dask","start":3,"end":5,"minutes":2,"text":"Reutiliza datos y split de referencia para comparar sin cambiar universo.","action":"Verificar IDs, columnas y split antes de comparar.","limit":"Contrato de entrada; no cambiar universo.","case":null,"lab":null},{"id":"S14.03","title":"Arquitectura Spark","start":5,"end":9,"minutes":4,"text":"Driver coordina, executors ejecutan tareas; modo local no implica varias máquinas físicas.","action":"Ubicar componentes en diagrama conceptual y entorno real observado.","limit":"Mapa de ejecución; no inferir nodos físicos.","case":null,"lab":null},{"id":"S14.04","title":"DataFrame y Spark SQL","start":9,"end":13,"minutes":4,"text":"DataFrame Spark expresa operaciones declarativas sobre esquema y filas.","action":"Predecir salida de select, filter y groupBy en tabla pequeña.","limit":"Resultado manual; operación no necesariamente ejecutada.","case":null,"lab":null},{"id":"S14.05","title":"Lazy y acciones","start":13,"end":17,"minutes":4,"text":"Transformación construye plan; acción solicita ejecución. DAG expresa dependencias.","action":"Comparar construir una consulta y ejecutar count o show.","limit":"Grafo y acción; tiempo de definición no es tiempo de ejecución.","case":null,"lab":null},{"id":"S14.06","title":"Jobs, stages y tasks","start":17,"end":21,"minutes":4,"text":"Jobs se dividen en stages y tasks según plan y particiones; shuffle suele separar etapas.","action":"Variar particiones en diagrama y predecir tareas.","limit":"Conteo conceptual; observar UI para evidencia real.","case":{"at":6,"q":"Tareas por partición","input":"Una etapa, una tarea por partición, sin reintentos","variants":[{"label":"4 particiones","result":"4 tareas","why":"No necesariamente 4 CPU"},{"label":"12 particiones","result":"12 tareas","why":"No necesariamente 12 CPU"}]},"lab":null},{"id":"S14.07","title":"Planes lógico y físico","start":21,"end":24,"minutes":3,"text":"Plan lógico expresa qué calcular; físico indica operadores elegidos por motor.","action":"Comparar dos consultas equivalentes y localizar filtro/proyección.","limit":"Planes observados o ejemplo etiquetado.","case":null,"lab":null},{"id":"S14.08","title":"Particiones y shuffle","start":24,"end":27,"minutes":3,"text":"Shuffle redistribuye datos por clave; repartition y coalesce tienen costos distintos.","action":"Variar clave y particiones y observar distribución.","limit":"Perfil y operadores; no afirmar shuffle por dibujo solamente.","case":null,"lab":null},{"id":"S14.09","title":"Join y cardinalidad","start":27,"end":30,"minutes":3,"text":"Left join conserva filas izquierdas sin coincidencia; duplicados derechos pueden multiplicarlas.","action":"Predecir filas, claves y duplicación si dimensión no es única.","limit":"Resultado manual; conservar P4 cuando corresponde.","case":{"at":9,"q":"Join manual","input":"P1,P2 código 0; P3 código 1; P4 código 2; dimensión 0=A,1=B","variants":[{"label":"Left","result":"4 filas; P4=null","why":"Conserva izquierda"},{"label":"Inner","result":"3 filas","why":"P4 no coincide"}]},"lab":null},{"id":"S14.10","title":"Broadcast y sort-merge","start":30,"end":35,"minutes":5,"text":"Broadcast copia dimensión pequeña; sort-merge distribuye y ordena. Hints sugieren, no garantizan.","action":"Comparar planes con broadcast y MERGE bajo condiciones permitidas.","limit":"Operador real, igualdad con exceptAll; no prometer aceleración.","case":null,"lab":null},{"id":"S14.11","title":"Skew y claves calientes","start":35,"end":39,"minutes":4,"text":"Skew concentra claves y carga; mide distribución antes de optimizar.","action":"Variar concentración en datos controlados y comparar máximos.","limit":"Perfil de skew; no eliminar filas para mejorar tiempo.","case":{"at":11,"q":"Skew","input":"1000 registros en cuatro claves","variants":[{"label":"250 cada clave","result":"Máximo 250","why":"Uniforme"},{"label":"850,50,50,50","result":"Máximo 850","why":"Concentrado"}]},"lab":null},{"id":"S14.12","title":"Delta desde cero","start":39,"end":43,"minutes":4,"text":"Delta combina archivos de datos con registro transaccional y versiones.","action":"Representar dos commits y lectura de versión en ejemplo.","limit":"Historial conceptual; motor debe confirmarlo.","case":{"at":12,"q":"Historial conceptual","input":"v0 P2=20; v1 P2=25","variants":[{"label":"Leer v0","result":"20","why":"Estado anterior"},{"label":"Leer v1","result":"25","why":"Estado actualizado"}]},"lab":null},{"id":"S14.13","title":"Medallion y calidad","start":43,"end":47,"minutes":4,"text":"Bronze conserva, Silver limpia, Gold sirve; Medallion es un patrón de responsabilidades.","action":"Asignar transformaciones y rechazos a capas del caso.","limit":"Linaje; no confundir patrón con requisito técnico universal.","case":null,"lab":null},{"id":"S14.14","title":"MLlib y pipeline","start":47,"end":51,"minutes":4,"text":"Estimador fit aprende modelo; transformador aplica operaciones. Train y test se separan.","action":"Trazar datos de train a modelo y test sin fuga.","limit":"Contrato ML; compatibilidad del entorno a verificar.","case":null,"lab":null},{"id":"S14.15","title":"Databricks y límites","start":51,"end":55,"minutes":4,"text":"Databricks Free depende de cuotas, compute y API compatibles; verifica antes de escalar.","action":"Elegir ruta válida y distinguir UI real de esquema conceptual.","limit":"Preflight; no exigir pago ni configuración no disponible.","case":null,"lab":null},{"id":"S14.16","title":"Cuaderno: abrir y preparar","start":65,"end":76,"minutes":11,"text":"Comprueba versión Spark, permisos, catálogo y tipo de ejecución antes de cargar.","action":"Abrir notebook en entorno limpio y obtener esquema.","limit":"Estado y modo real; alternativa Colab no es Databricks.","case":null,"lab":{"index":3,"heading":"2 · Antes de ejecutar: preparar Databricks Free Edition","status":"sección temática identificada","gap":null}},{"id":"S14.17","title":"Cuaderno: ETL y SQL","start":76,"end":87,"minutes":11,"text":"Ejecuta ETL y SQL con esquema explícito y control independiente.","action":"Modificar expresión de filtro o grupo y comprobar conteos.","limit":"Tabla y equivalencia; sin collect de grandes datos.","case":null,"lab":{"index":12,"heading":"3 · Datos públicos, transformaciones trazables","status":"sección temática identificada","gap":null}},{"id":"S14.18","title":"Cuaderno: joins y planes","start":87,"end":98,"minutes":11,"text":"Compara planes y exceptAll en ambas direcciones; misma salida no significa mismo costo.","action":"Comparar exceptAll en ambas direcciones y registrar operadores.","limit":"Igualdad y planes; hint puede ser ignorado.","case":null,"lab":{"index":28,"heading":"8B · Cruzar datos con una dimensión pequeña","status":"sección temática identificada","gap":null}},{"id":"S14.19","title":"Cuaderno: Delta","start":98,"end":109,"minutes":11,"text":"Escribe y relee Delta e historial si se admite; Parquet por sí solo no acredita transacción.","action":"Comparar dos versiones y comprobar conservación de identidad.","limit":"Historial real o pendiente; no simular transacción como real.","case":null,"lab":{"index":45,"heading":"12 · Databricks en acción: de Bronze a Silver y Gold","status":"sección temática identificada","gap":null}},{"id":"S14.20","title":"Cuaderno: modelo Spark","start":109,"end":120,"minutes":11,"text":"Entrena estimador compatible sin recolectar toda la matriz; evalúa sobre test separado.","action":"Entrenar modelo viable con features y obtener métrica en test.","limit":"Modelo y métricas; no usar collect para entrenar.","case":null,"lab":{"index":60,"heading":"16 · Laboratorio de transferencia: clasificar bienes y servicios con Spark MLlib","status":"sección temática identificada","gap":null}},{"id":"S14.21","title":"Cuaderno: persistir y entregar","start":120,"end":130,"minutes":10,"text":"Persiste tabla, planes, métricas y predicciones con IDs y versión.","action":"Releer artefactos y validar contrato.","limit":"Motor analítico trazable.","case":null,"lab":{"index":48,"heading":"13 · Persistir el resultado: Parquet en Colab, Delta en Databricks","status":"sección temática identificada","gap":null}},{"id":"S14.22","title":"Reto de optimización","start":130,"end":134,"minutes":4,"text":"Modifica estrategia de join o distribución y compara plan y equivalencia.","action":"Modificar hint o partición y contrastar plan y resultado.","limit":"Plan propio y decisión; no valorar velocidad sin prueba.","case":null,"lab":null},{"id":"S14.23","title":"Interpretación de modelo","start":134,"end":137,"minutes":3,"text":"Una métrica refleja etiquetas y split; no demuestra utilidad causal o universal.","action":"Comparar resultados y escoger una limitación contextual.","limit":"Métricas y alternativa; no atribuir causalidad.","case":null,"lab":null},{"id":"S14.24","title":"Relevo pipeline confiable","start":137,"end":140,"minutes":3,"text":"S15 recibe estado versionado y predicciones con reglas de actualización.","action":"Comprobar qué campos necesitan actualización y trazabilidad.","limit":"Contrato Gold y modelo.","case":null,"lab":null},{"id":"S14.25","title":"Cierre Spark","start":140,"end":150,"minutes":10,"text":"Integra planes, calidad, persistencia y ML, separando ejecución local de remota.","action":"Resolver controles sobre lazy, shuffle, join, Delta y ML con evidencia propia.","limit":"Motor y límites de plataforma; no declarar escala no probada.","case":null,"lab":null}],"control":{"at":11,"title":"Distribución de claves","label":"Registros de clave dominante","min":250,"max":1000,"step":10,"initial":850},"blocks":[{"title":"Spark y ejecución","range":"1–11","concept":"Driver coordina, ejecutores procesan; evaluación diferida arma plan. Particiones no son CPU.","task":"Verifica SparkSession y distribución.","evidence":"Motor y particiones.","excerpt":"# 8 · Ver particiones sin usar API RDD (compatible con serverless)\nbase = spark.range(0, 40, 1, 4)\nprint(\"ANTES:\")\nbase.withColumn(\"p\", F.spark_partition_id()).groupBy(\"p\").count().orderBy(\"p\").show()\nredistribuido = base.repartition(2, (F.col(\"id\") % 3))\nprint(\"DESPUÉS:\")\nredistribuido.withColumn(\"p\", F.spark_partition_id()).groupBy(\"p\").count().orderBy(\"p\").show()\nassert redistribuido.count() == 40\nprint(\"Filas concretas por partición (solo 40 filas de práctica):\")\nredistribuido.select(\"id\",F.spark_partition_id().alias(\"particion\")).orderBy(\"particion\",\"id\").show(40)","excerptTruncated":false},{"title":"Datos y SQL","range":"12–25","concept":"Esquema fija tipos; acción materializa. SQL y DataFrame pueden representar la misma operación.","task":"Ejecuta agregado ponderado y comprueba equivalencia.","evidence":"Resultados SQL/PySpark.","excerpt":"# 6 · Equivalencia explícita PySpark ↔ Spark SQL\ndf.createOrReplaceTempView(\"s14_ventanas\")\nsql = spark.sql('''\nSELECT SUBSTRING(mes,1,4) anio, COUNT(*) ventanas,\nSUM(procesos_unicos) procesos_unicos, SUM(emparejados) emparejados,\nSUM(emparejados)/SUM(procesos_unicos) cobertura_ponderada\nFROM s14_ventanas GROUP BY SUBSTRING(mes,1,4) ORDER BY anio\n''')\na = [(r.anio,int(r.ventanas),round(float(r.cobertura_ponderada),9)) for r in resumen.collect()]\nb = [(r.anio,int(r.ventanas),round(float(r.cobertura_ponderada),9)) for r in sql.collect()]\nassert a == b, (a,b)\nprint(\"Paridad PySpark/SQL: OK\", a)","excerptTruncated":false},{"title":"Shuffle y joins","range":"26–39","concept":"Shuffle redistribuye; broadcast replica dimensión pequeña. Left join conserva hechos sin coincidencia.","task":"Compara planes y paridad; examina Spark UI si existe.","evidence":"Planes y resultado.","excerpt":"# 8B · Join de ejemplo con dimensión pequeña\nprocesos_ejemplo = spark.createDataFrame(\n    [(\"P1\", 0), (\"P2\", 1), (\"P3\", 0), (\"P4\", 2)],\n    \"id string, codigo int\")\ndimension_ejemplo = spark.createDataFrame(\n    [(0, \"Bien\"), (1, \"Servicio\")], \"codigo int, categoria string\")\ncruce = procesos_ejemplo.join(F.broadcast(dimension_ejemplo), \"codigo\", \"left\")\ncruce.orderBy(\"id\").show()\ncruce.explain(mode=\"formatted\")\nassert cruce.count() == 4\nassert cruce.filter(F.col(\"categoria\").isNull()).count() == 1\nprint(\"Plan con sugerencia MERGE (no garantía de elección):\")\ncruce_merge = procesos_ejemplo.hint(\"merge\").join(dimension_ejemplo.hint(\"merge\"),\"codigo\",\"left\")\ncruce_merge.explain(mode=\"formatted\")\nassert cruce.exceptAll(cruce_merge).count()==0 and cruce_merge.exceptAll(cruce).count()==0\nprint(\"Claves desbalanceadas: 100 filas sintéticas; no son tiempos ni particiones físicas.\")\nskew_demo=spark.range(100).withColumn(\"clave\",F.when(F.col(\"id\")\u003c70,\"A\").when(F.col(\"id\")\u003c80,\"B\").when(F.col(\"id\")\u003c90,\"C\").otherwise(\"D\"))\nskew_rows={r[\"clave\"]:r[\"count\"] for r in skew_demo.groupBy(\"clave\").count().collect()}\nassert skew_rows=={\"A\":70,\"B\":10,\"C\":10,\"D\":10}\nprint(skew_rows)","excerptTruncated":false},{"title":"Medallion y Delta","range":"40–59","concept":"Bronze conserva origen; Silver limpia; Gold agrega. Delta añade transacciones y log, no backup ilimitado.","task":"Persiste capas y relee conteos; distingue Parquet de Delta.","evidence":"Tablas y evidencia.","excerpt":"# 12B · Persistencia de Bronze, Silver y Gold de práctica\nimport tempfile, uuid\ncapas_med = {\"bronze\":med_bronze, \"silver\":med_silver, \"gold\":med_gold}\npersistidas_med = {}\ntablas_med = {}\nif \"dbutils\" in globals():\n    catalogo_med = spark.sql(\"SELECT current_catalog()\").first()[0]\n    esquema_med = spark.sql(\"SELECT current_schema()\").first()[0]\n    sufijo_med = globals().get(\"sufijo_med\",uuid.uuid4().hex[:10])\n    for capa, datos in capas_med.items():\n        nombre = \".\".join(\"`\"+x.replace(\"`\",\"``\")+\"`\" for x in (catalogo_med,esquema_med,\"s14_\"+capa+\"_\"+sufijo_med))\n        datos.write.format(\"delta\").mode(\"overwrite\").saveAsTable(nombre)\n        tablas_med[capa] = nombre\n        persistidas_med[capa] = spark.table(nombre).count()\n        print(capa,nombre,persistidas_med[capa])\n    print(\"DELTA MEDALLION REAL\")\n    print(\"Abre Catalog y consulta Gold con: SELECT * FROM\", tablas_med[\"gold\"])\n    spark.sql(\"SELECT * FROM \"+tablas_med[\"gold\"]+\" ORDER BY categoria\").show()\nelse:\n    carpeta_capas = tempfile.mkdtemp(prefix=\"s14_capas_parquet_\")\n    for capa, datos in capas_med.items():\n        ruta = carpeta_capas+\"/\"+capa\n        datos.write.mode(\"overwrite\").parquet(ruta)\n        persistidas_med[capa] = spark.read.parquet(ruta).count()\n        print(capa,ruta,persistidas_med[capa])\n    print(\"PARQUET MEDALLION LOCAL\")\nassert persistidas_med == {\"bronze\":6,\"silver\":4,\"gold\":2}","excerptTruncated":false},{"title":"MLlib y entrega","range":"60–70","concept":"Train aprende, validación elige, test evalúa. F1 macro promedia clases.","task":"Entrena ejemplo sintético y lee matriz; no llamarlo predicción SECOP.","evidence":"Métrica del ejemplo.","excerpt":"# 16 · Entrenamiento y evaluación reales, sin valores de F1 prefijados\nfrom pyspark.ml import Pipeline\nfrom pyspark.ml.feature import Tokenizer, HashingTF, IDF\nfrom pyspark.ml.classification import LogisticRegression\nfrom pyspark.ml.evaluation import MulticlassClassificationEvaluator\npipeline_demo = Pipeline(stages=[\n    Tokenizer(inputCol=\"texto\", outputCol=\"tokens\"),\n    HashingTF(inputCol=\"tokens\", outputCol=\"tf\", numFeatures=256),\n    IDF(inputCol=\"tf\", outputCol=\"features\"),\n    LogisticRegression(featuresCol=\"features\", labelCol=\"label\", maxIter=15, regParam=0.1)\n])\nmodelo_demo = pipeline_demo.fit(train_demo)\npred_demo = modelo_demo.transform(test_demo)\npred_demo.select(\"id_demo\", \"texto\", \"label\", \"prediction\", \"probability\").orderBy(\"id_demo\").show(truncate=False)\n# El PipelineModel aplica Tokenizer, HashingTF e IDF ya ajustado.\npred_demo.select(\"id_demo\", \"tokens\", \"tf\", \"features\").limit(2).show(truncate=70)\nassert pred_demo.count() == 8","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":65},{"label":"Autonomía y transferencia","minutes":10},{"label":"Cierre","minutes":10}],"workbench":{"at":9,"title":"Join y cardinalidad","concept":"P1/P2 código 0, P3 código 1, P4 código 2. Dimensión conoce 0/1. Left conserva fila izquierda sin coincidencia; inner la elimina. Duplicados a derecha multiplican filas. Broadcast y sort-merge pueden producir el mismo multiconjunto con costos distintos; los hints no garantizan operador.","pred":"¿Qué pasa con P4 y qué pasa con P1 si duplicamos código 0?","fields":[{"label":"Join (0=left,1=inner)","min":0,"max":1,"step":1,"value":0},{"label":"Copias código 0","min":1,"max":4,"step":1,"value":1},{"label":"Añadir código 2 (0=no,1=sí)","min":0,"max":1,"step":1,"value":0}],"interpret":"Lee todas las parejas y los faltantes; un resultado puede ser lógicamente correcto y no cumplir la intención de negocio. Distinct ocultaría multiplicación; en Spark usa exceptAll bidireccional.","challenge":"Obtén seis filas y cuatro procesos; verifica unicidad de dimensión y compara planes reales en el cuaderno.","limit":"Join local, no Spark ni medición shuffle."}},{"id":"14A","title":"¿Cómo entrenar fuera de un presupuesto local?","problem":"Una matriz densa puede superar la memoria disponible para entrenar.","mission":"Capacidad opcional","original":"s14a-databricks-escala.html","notebook":{"path":"Cuadernos/14A_Databricks_E2E_Escala.ipynb","ref":"mejora-pedagogica-integral","cells":28,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/14A_Databricks_E2E_Escala.ipynb","launch":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/14A_Databricks_E2E_Escala.ipynb"},"quiz":{"question":"¿Una matriz mínima de 19 GiB prueba que Spark entrenó?","options":["Sí","No, solo que supera un presupuesto de 16 GiB","Sí si tiene 128 variables"],"feedback":["Se necesita evidencia de ejecución.","Correcto: capacidad estimada no es benchmark.","Dimensión no prueba ejecución."]},"slides":[{"id":"S14A.01","title":"La prueba que falta","start":0,"end":3,"minutes":3,"text":"La escala se prueba con N efectivo, dimensión y fit completado, no con una matriz teórica.","action":"Elegir qué evidencia probaría capacidad sin ejecutar pandas hasta caer.","limit":"Criterio falsable; no usar tamaño de archivo como memoria.","case":null,"lab":null},{"id":"S14A.02","title":"Qué significa opcional","start":3,"end":5,"minutes":2,"text":"Es una ampliación opcional: comienza pequeño, no exige pago ni agotar cuotas.","action":"Seleccionar escala de práctica o ampliación según entorno.","limit":"Estado elegido; no obligar a comprar.","case":null,"lab":null},{"id":"S14A.03","title":"Datos sintéticos honestos","start":5,"end":8,"minutes":3,"text":"Datos sintéticos tienen semilla y reglas; prueban capacidad, no riesgo real de contratación.","action":"Variar semilla pequeña y observar reproducibilidad.","limit":"Contrato sintético; métricas no generalizan al SECOP real.","case":null,"lab":null},{"id":"S14A.04","title":"Presupuesto de memoria","start":8,"end":11,"minutes":3,"text":"Límite inferior de matriz N×D×bytes: no incluye objetos, copias ni entrenamiento.","action":"Variar N, 128 variables y dtype; comparar con presupuesto explícito.","limit":"Bytes mínimos; no presentarlos como pico de pandas.","case":{"at":4,"q":"Memoria mínima","input":"128 float64 por fila","variants":[{"label":"1 millón","result":"0,954 GiB","why":"N×128×8/2^30"},{"label":"10 millones","result":"9,537 GiB","why":"Límite inferior"},{"label":"20 millones","result":"19,073 GiB","why":"No prueba fit"}]},"lab":null},{"id":"S14A.05","title":"Generación distribuida","start":11,"end":14,"minutes":3,"text":"Genera IDs y variables mediante operaciones distribuidas; evita listas enormes en driver.","action":"Variar particiones en ejemplo seguro y verificar IDs.","limit":"Cobertura; no materializar datos completos.","case":null,"lab":null},{"id":"S14A.06","title":"Bronze, Silver, Gold","start":14,"end":17,"minutes":3,"text":"Bronze guarda datos generados, Silver valida y Gold prepara features.","action":"Asignar transformaciones a capas y predecir conteos.","limit":"Contrato por capa; sintético no elimina necesidad de calidad.","case":null,"lab":null},{"id":"S14A.07","title":"Split reproducible","start":17,"end":20,"minutes":3,"text":"El split separa IDs sin solapamiento; no ajustes usando test.","action":"Variar semilla y medir distribución sin solapamiento.","limit":"IDs disjuntos y proporciones; no usar test para ajustar.","case":{"at":7,"q":"Split","input":"Train {1,2,3}","variants":[{"label":"Test {4,5}","result":"0 intersecciones","why":"Disjunto"},{"label":"Test {3,4}","result":"1 intersección","why":"Fuga de ID 3"}]},"lab":null},{"id":"S14A.08","title":"Features y vector","start":20,"end":23,"minutes":3,"text":"El vector reúne características en orden y dimensión consistentes entre train y predicción.","action":"Calcular dimensión en pequeño conjunto y comprobar columnas.","limit":"Dimensión efectiva; no materializar matriz completa.","case":null,"lab":null},{"id":"S14A.09","title":"Baseline y fuga","start":23,"end":25,"minutes":2,"text":"Fuga ocurre al incluir información de etiqueta o futuro no disponible al predecir.","action":"Detectar feature que revela etiqueta y seleccionar exclusión.","limit":"Control de fuga; no confundir métricas perfectas con éxito.","case":{"at":9,"q":"Fuga","input":"Variables candidatas al predecir","variants":[{"label":"Antigüedad conocida","result":"Puede ser elegible","why":"Validar contrato"},{"label":"Resultado futuro","result":"Excluir","why":"Información no disponible"}]},"lab":null},{"id":"S14A.10","title":"Modelo lineal","start":25,"end":29,"minutes":4,"text":"Modelo lineal aprende pesos; costo depende de filas, dimensión e iteraciones.","action":"Variar parámetro en escala pequeña y comparar métricas.","limit":"Configuración; no asumir soporte hasta preflight.","case":null,"lab":null},{"id":"S14A.11","title":"Segundo modelo","start":29,"end":33,"minutes":4,"text":"Compara segundo modelo bajo mismo split solo si el estimador se ejecuta realmente.","action":"Comparar recursos y resultados en escala controlada.","limit":"Dos modelos realmente ejecutados si compatibles; no inventar.","case":null,"lab":null},{"id":"S14A.12","title":"Métricas de clasificación","start":33,"end":36,"minutes":3,"text":"Precision=TP/(TP+FP), recall=TP/(TP+FN), accuracy=(TP+TN)/total.","action":"Calcular métricas manualmente de tabla pequeña y variar umbral.","limit":"Métrica y denominador; no usar solo accuracy.","case":{"at":12,"q":"Métricas","input":"TP30,FP10,FN20,TN40","variants":[{"label":"Precision","result":"0,75","why":"30/40"},{"label":"Recall","result":"0,60","why":"30/50"},{"label":"Accuracy","result":"0,70","why":"70/100"}]},"lab":null},{"id":"S14A.13","title":"Escala escalonada","start":36,"end":39,"minutes":3,"text":"Escala en pasos; mide el estado real y detente antes de superar presupuesto.","action":"Seleccionar siguiente escala según resultado y estado del entorno.","limit":"Registro de decisión; no ejecutar tamaños gigantes automáticamente.","case":null,"lab":null},{"id":"S14A.14","title":"Compatibilidad y quota","start":39,"end":42,"minutes":3,"text":"Prueba soporte del compute y APIs ML antes de ampliar; no prometas compatibilidad.","action":"Clasificar soporte real de cada operación o elegir contingencia.","limit":"Matriz de compatibilidad; no afirmar MLlib remoto sin prueba.","case":null,"lab":null},{"id":"S14A.15","title":"Criterio de evidencia","start":42,"end":45,"minutes":3,"text":"Registra filas train, dimensión, modo, tiempo, métrica y estado del modelo.","action":"Evaluar expediente ficticio incompleto y detectar dato ausente.","limit":"Checklist falsable; estimación no es éxito experimental.","case":null,"lab":null},{"id":"S14A.16","title":"Cuaderno: preflight y escala","start":55,"end":68,"minutes":13,"text":"Preflight comprueba API, versión y permisos con muestra mínima.","action":"Ejecutar muestra mínima antes de autorizar escala.","limit":"Compatibilidad real; bloquear aumento si falla.","case":null,"lab":{"index":1,"heading":"A0 · Configuración y seguridad de escala","status":"sección temática identificada","gap":null}},{"id":"S14A.17","title":"Cuaderno: generar Bronze","start":68,"end":81,"minutes":13,"text":"Genera Bronze por particiones y verifica identidad sin collect masivo.","action":"Ejecutar escala inicial y comprobar conteos y duplicados.","limit":"N efectivo y versión; no inferir capacidad desde objetivo.","case":null,"lab":{"index":4,"heading":"A1 · Ingesta: generar telemetría de forma distribuida y conservar Bronze","status":"sección temática identificada","gap":null}},{"id":"S14A.18","title":"Cuaderno: transformar y split","start":81,"end":94,"minutes":13,"text":"Limpia y verifica intersecciones vacías entre train, validación y test.","action":"Verificar intersecciones vacías y distribución de etiquetas.","limit":"Silver y split; sin fuga.","case":null,"lab":{"index":7,"heading":"A2 · ETL: limpiar, separar rechazos y fijar train/validación/test","status":"sección temática identificada","gap":null}},{"id":"S14A.19","title":"Cuaderno: construir Gold","start":94,"end":106,"minutes":12,"text":"Calcula dimensión efectiva y límite inferior de bytes; no fuerces OOM.","action":"Comparar presupuesto local y dimensión efectiva.","limit":"Gold y bytes mínimos; no provocar OOM.","case":null,"lab":{"index":10,"heading":"A3 · Gold: crear una matriz de 128 variables, sin pasar a pandas","status":"sección temática identificada","gap":null}},{"id":"S14A.20","title":"Cuaderno: entrenar dos modelos","start":106,"end":118,"minutes":12,"text":"Ejecuta dos estimadores compatibles sobre train completo autorizado; registra fallos.","action":"Comparar modelo uno y dos o declarar limitación de plataforma.","limit":"Evidencia de fit real, N y métrica; no sustituir por cache.","case":null,"lab":{"index":16,"heading":"A5 · Entrenar modelos Spark MLlib sobre todo train","status":"sección temática identificada","gap":null}},{"id":"S14A.21","title":"Cuaderno: persistir expediente","start":118,"end":130,"minutes":12,"text":"Persiste resultados y modelo si se admite; comprueba relectura.","action":"Reutilizar predicciones o modelo según capacidad real.","limit":"Artefactos persistidos; ruta alternativa explícita.","case":null,"lab":{"index":22,"heading":"A7 · Producto persistente: métricas y expediente","status":"sección temática identificada","gap":null}},{"id":"S14A.22","title":"Reto de capacidad","start":130,"end":134,"minutes":4,"text":"Elige siguiente escala con evidencia de capacidad y cuota, no solo tamaño deseado.","action":"Cambiar configuración segura y comparar resultado efectivo.","limit":"Prueba propia; no exigir que exceda recursos reales de cada estudiante.","case":null,"lab":null},{"id":"S14A.23","title":"Lectura crítica de resultados","start":134,"end":137,"minutes":3,"text":"Tamaño teórico no prueba memoria observada; métrica sintética no generaliza.","action":"Seleccionar afirmaciones respaldadas por expediente propio.","limit":"Límite concreto; no confundir entrenamiento con utilidad.","case":null,"lab":null},{"id":"S14A.24","title":"Relevo predicciones","start":137,"end":140,"minutes":3,"text":"Etiqueta predicciones como sintéticas y no las mezcles con el producto SECOP real.","action":"Exportar identificadores y marcar origen sintético.","limit":"Producto de capacidad separado del observatorio real.","case":null,"lab":null},{"id":"S14A.25","title":"Cierre escala","start":140,"end":150,"minutes":10,"text":"Acepta hipótesis solo si fit termina con escala efectiva superior al presupuesto definido.","action":"Seleccionar estado logrado, parcial o bloqueado con evidencia.","limit":"Expediente; no declarar éxito por tamaño planeado.","case":null,"lab":null}],"control":{"at":4,"title":"Memoria mínima de matriz","label":"Millones de filas","min":1,"max":30,"step":1,"initial":20},"blocks":[{"title":"Presupuesto de capacidad","range":"0–3","concept":"El mínimo float64 es filas×columnas×8, no RSS total. Exceder presupuesto declarado no significa fallo observado.","task":"Compara 1/5/25 millones, empieza en ruta pequeña.","evidence":"Presupuesto y escala.","excerpt":"# A0 · Configura antes de ejecutar\nimport time, json, uuid, math\nfrom pyspark.sql import functions as F\nfrom pyspark.ml import Pipeline\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.classification import LogisticRegression, DecisionTreeClassifier\nfrom pyspark.ml.evaluation import BinaryClassificationEvaluator\nN = globals().get(\"LAB_N\", 50000)\nRAM_PANDAS_MIB = 512  # presupuesto comparativo; modifica a 8192 o 16384 si deseas\nCONFIRMAR_GRANDE = False\nSEGUNDO_MODELO = True  # árbol pequeño; pon False si la cuota no alcanza\nSEMILLA = 42\nPARTICIONES = 8\nTEST_LOCAL = bool(globals().get(\"LAB_TEST_LOCAL\", False))\nassert N in (50000,1000000,5000000,25000000) or (TEST_LOCAL and N==5000)\nassert N \u003c= 1000000 or CONFIRMAR_GRANDE, \"Confirma explícitamente una escala grande antes de continuar.\"\nassert RAM_PANDAS_MIB > 0\nassert \"dbutils\" in globals() or TEST_LOCAL, \"Abre el notebook en Databricks; la prueba local es solo docente.\"\nrun_id = uuid.uuid4().hex[:10]\ntiempos = {}\nnombres = {}\nif TEST_LOCAL:\n    import tempfile\n    carpeta_local = tempfile.mkdtemp(prefix=\"s14a_\")\n    formato = \"parquet_local\"\nelse:\n    contexto = spark.sql(\"SELECT current_catalog() AS cat,current_schema() AS sch\").first()\n    CATALOGO = contexto[\"cat\"]  # sustituye si no tienes CREATE TABLE","excerptTruncated":true},{"title":"Bronze y Silver","range":"4–9","concept":"Generación distribuida, duplicados y nulos requieren conciliación. Split estable evita cambios por particionado.","task":"Ejecuta ruta acotada y revisa conteos.","evidence":"Rechazos y split.","excerpt":"# A2 · Silver: conciliación exacta y split estable\nunicos=bronze.dropDuplicates()\nrechazos=unicos.filter(F.col(\"s00\").isNull())\nvalidos=unicos.filter(F.col(\"s00\").isNotNull())\nbucket=F.pmod(F.xxhash64(\"id\",F.lit(8801)),F.lit(10))\ncurados=validos.withColumn(\"split\",F.when(bucket\u003c8,\"train\").when(bucket==8,\"valid\").otherwise(\"test\"))\nsilver=guardar(curados,\"silver\")\nn_unicos=unicos.count()\nn_rechazos=rechazos.count()\nn_silver=silver.count()\nassert n_bronze-n_unicos==9\nassert n_rechazos==(N+999)//1000\nassert n_silver==N-n_rechazos\nassert n_silver+n_rechazos+9==n_bronze\nassert silver.select(\"id\").distinct().count()==n_silver\ndistribucion=silver.groupBy(\"split\",\"label\").count().orderBy(\"split\",\"label\")\ngrupos=[r.asDict() for r in distribucion.collect()]  # máximo seis filas\nassert len(grupos)==6\nprint(\"Bronze\",n_bronze,\"| duplicados\",9,\"| rechazos\",n_rechazos,\"| Silver\",n_silver)\nver(distribucion)\nn_train=sum(int(x[\"count\"]) for x in grupos if x[\"split\"]==\"train\")\nn_valid=sum(int(x[\"count\"]) for x in grupos if x[\"split\"]==\"valid\")\nn_test=sum(int(x[\"count\"]) for x in grupos if x[\"split\"]==\"test\")\nassert n_train+n_valid+n_test==n_silver","excerptTruncated":false},{"title":"Gold y memoria","range":"10–15","concept":"Matriz de 128 variables permanece en Spark; toPandas materializaría en cliente.","task":"Calcula mínimo y compara control local limitado.","evidence":"Capacidad estimada.","excerpt":"# A4 · Prueba de memoria sin OOM y modelo de control acotado\nimport pandas as pd\nfrom sklearn.linear_model import LogisticRegression as LRLocal\nfrom sklearn.metrics import f1_score\ntrain=matriz.filter(F.col(\"split\")==\"train\")\nvalid=matriz.filter(F.col(\"split\")==\"valid\")\ntest=matriz.filter(F.col(\"split\")==\"test\")\nmuestra=train.select(*FEATURES).limit(1000).toPandas()\nmuestra_bytes=int(muestra.memory_usage(index=False,deep=True).sum())\nbytes_minimos=int(n_train*len(FEATURES)*8)\npresupuesto=int(RAM_PANDAS_MIB*1024**2)\nexcede=bytes_minimos>presupuesto\ncomparacion={\"filas_train\":n_train,\"variables\":128,\"float64_bytes\":bytes_minimos,\n             \"float64_GiB\":round(bytes_minimos/1024**3,3),\n             \"muestra_filas\":len(muestra),\"muestra_bytes\":muestra_bytes,\n             \"presupuesto_MiB\":RAM_PANDAS_MIB,\"excede\":excede}\nassert muestra_bytes==len(muestra)*128*8\nprint(json.dumps(comparacion,ensure_ascii=False,indent=2))\nprint(\"TRASLADO COMPLETO BLOQUEADO por presupuesto\" if excede else \"La matriz mínima cabe en el presupuesto; no demuestra incapacidad de pandas.\")\n# No hay toPandas masivo en ninguna rama. Muestra local acotada:\nm_local=train.orderBy(\"id\").select(\"label\",*FEATURES).limit(5000).toPandas()\nv_local=valid.orderBy(\"id\").select(\"label\",*FEATURES).limit(2000).toPandas()\nlocal=LRLocal(max_iter=50)\nlocal.fit(m_local[FEATURES],m_local[\"label\"])\nf1_local=float(f1_score(v_local[\"label\"],local.predict(v_local[FEATURES]),average=\"macro\"))\nprint(\"Control local: train\",len(m_local),\"valid\",len(v_local),\"F1 macro\",round(f1_local,4))","excerptTruncated":false},{"title":"Entrenar y evaluar","range":"16–21","concept":"Selección por validación; test solo al final. Métricas y tiempos dependen de ejecución.","task":"Entrena candidatos si cuota lo permite; no activar 25M automáticamente.","evidence":"Métricas reales o bloqueo.","excerpt":"# A5 · Dos candidatos y selección por validación\ndef metrica(df):\n    c={(int(r[\"label\"]),int(r[\"prediction\"])):int(r[\"count\"]) for r in df.groupBy(\"label\",\"prediction\").count().collect()}\n    m=[[c.get((i,j),0) for j in (0,1)] for i in (0,1)]\n    total=sum(map(sum,m))\n    f=[]\n    for i in (0,1):\n        vp=m[i][i]; fp=m[1-i][i]; fn=m[i][1-i]\n        f.append(2*vp/(2*vp+fp+fn) if 2*vp+fp+fn else 0.0)\n    return {\"matriz\":m,\"filas\":total,\"accuracy\":(m[0][0]+m[1][1])/total,\"f1_macro\":sum(f)/2}\ndef ensamblador():\n    return VectorAssembler(inputCols=FEATURES,outputCol=\"features\",handleInvalid=\"error\")\ncandidatos={\"logistica\":LogisticRegression(featuresCol=\"features\",labelCol=\"label\",maxIter=12,regParam=0.02)}\nif SEGUNDO_MODELO:\n    candidatos[\"arbol\"]=DecisionTreeClassifier(featuresCol=\"features\",labelCol=\"label\",maxDepth=4,maxBins=16,seed=SEMILLA)\nmodelos={}; validacion={}\nfor nombre,estimador in candidatos.items():\n    print(\"Entrenando:\",nombre,\"| train:\",n_train,\"| 128 variables\")\n    inicio=time.perf_counter()\n    modelo=Pipeline(stages=[ensamblador(),estimador]).fit(train.repartition(PARTICIONES))\n    tiempos[\"fit_\"+nombre]=round(time.perf_counter()-inicio,3)\n    modelos[nombre]=modelo\n    p=modelo.transform(valid).select(\"label\",\"prediction\")\n    validacion[nombre]=metrica(p)\n    assert validacion[nombre][\"filas\"]==n_valid\n    print(nombre,\"fit segundos:\",tiempos[\"fit_\"+nombre],\"validación:\",validacion[nombre])\nmejor=max(validacion,key=lambda k:validacion[k][\"f1_macro\"])\nmayoria=max((x for x in grupos if x[\"split\"]==\"train\"),key=lambda x:x[\"count\"])[\"label\"]","excerptTruncated":true},{"title":"Persistir expediente","range":"22–27","concept":"Telemetría sintética no son contratos; guardar escala y motor.","task":"Audita tablas y exporta resultados.","evidence":"Evidencia opcional.","excerpt":"# A7 · Auditoría y evidencia consultable\nmetricas=spark.createDataFrame([(mejor,\"test\",float(resultado[\"f1_macro\"]),float(resultado[\"accuracy\"]),float(auc)),\n    (\"mayoria\",\"test\",float(baseline[\"f1_macro\"]),float(baseline[\"accuracy\"]),None)],\n    \"modelo string, conjunto string, f1_macro double, accuracy double, auc double\")\ntabla_metricas=guardar(metricas,\"metricas\")\nver(tabla_metricas)\nexpediente={\"sesion\":\"S14A\",\"fuente\":\"telemetria sintetica reproducible\",\"semilla\":SEMILLA,\n    \"spark\":spark.version,\"formato\":formato,\"run_id\":run_id,\"N\":N,\"bronze\":n_bronze,\"rechazos\":n_rechazos,\n    \"duplicados\":9,\"silver\":n_silver,\"train\":n_train,\"valid\":n_valid,\"test\":n_test,\n    \"memoria\":comparacion,\"control_local\":{\"train\":len(m_local),\"valid\":len(v_local),\"f1_macro_valid\":f1_local},\n    \"validacion\":validacion,\"seleccionado\":mejor,\"test_resultado\":resultado,\"baseline\":baseline,\n    \"tiempos_segundos\":tiempos,\"activos\":dict(nombres),\n    \"limite\":\"Fuente sintética; presupuesto de RAM declarado; no implica hardware real ni garantía de cuota.\"}\nprint(json.dumps(expediente,ensure_ascii=False,indent=2))\nprint(\"SQL:\",f\"SELECT * FROM {nombres['gold']} LIMIT 10\" if not TEST_LOCAL else \"Parquet local\")\nprint(\"SQL:\",f\"SELECT * FROM {nombres['predicciones']} ORDER BY prob_inspeccion DESC LIMIT 10\" if not TEST_LOCAL else \"Parquet local\")","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":20},{"label":"Ejemplos y experimentación","minutes":20},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":75},{"label":"Autonomía y transferencia","minutes":10},{"label":"Cierre","minutes":10}],"workbench":{"at":12,"title":"Matriz de confusión y umbral","concept":"Ocho puntuaciones sintéticas y etiquetas fijas. Umbral convierte puntuación en etiqueta. TP, FP, FN, TN definen precisión, recall y F1; no prueban capacidad de entrenamiento. El umbral se elige sobre validación, no test final. Capacidad requiere N efectivo, dimensión, fit y persistencia.","pred":"¿Al bajar el umbral cómo cambian FP y FN?","fields":[{"label":"Umbral ×100","min":10,"max":100,"step":5,"value":50}],"interpret":"La tabla muestra etiqueta, puntuación, decisión y tipo de error. Denominador cero se reporta con convención de cero. Precision no necesariamente es monótona.","challenge":"Compara dos umbrales y enumera las evidencias que probarían fit remoto a escala.","limit":"Puntuaciones ficticias fijas; no entrenamiento ni métricas Databricks."}},{"id":"15","title":"¿Cómo recuperar un pipeline tras un fallo?","problem":"Laura recibe nuevos registros SECOP y no puede empezar de cero cada día.","mission":"Actualizar sin duplicar","original":null,"notebook":{"path":"Cuadernos/15_Pipeline_Confiable.ipynb","ref":"mejora-pedagogica-integral","cells":19,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/15_Pipeline_Confiable.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/15_Pipeline_Confiable.ipynb"},"quiz":{"question":"¿Cuándo debe avanzar el checkpoint?","options":["Antes de escribir","Tras confirmar la escritura","Al iniciar el proceso"],"feedback":["Podría perder registros.","Correcto: el avance debe reflejar datos confirmados.","Un fallo dejaría estado incorrecto."]},"slides":[{"id":"S15.01","title":"Actualizar Compras Claras","start":0,"end":3,"minutes":3,"text":"Actualizar conserva identidad e historia sin duplicar efectos al reintentar.","action":"Elegir qué debe cambiar y qué debe conservarse.","limit":"Requisitos de actualización; no alterar nota.","case":null,"lab":null},{"id":"S15.02","title":"Relevo de estados","start":3,"end":5,"minutes":2,"text":"El estado inicial define versiones, fuentes, claves y contratos.","action":"Comprobar identidad, timestamp y versión antes de actualizar.","limit":"Entrada compatible; no mezclar orígenes.","case":null,"lab":null},{"id":"S15.03","title":"Batch, microbatch y streaming","start":5,"end":9,"minutes":4,"text":"Batch, microbatch y streaming difieren en frecuencia y unidad de trabajo.","action":"Variar intervalo y comparar demora y tamaño de lote.","limit":"Latencia conceptual; microbatch no equivale a evento individual.","case":null,"lab":null},{"id":"S15.04","title":"Tiempo de evento y llegada","start":9,"end":13,"minutes":4,"text":"Tiempo de evento, llegada y procesamiento pueden ser distintos y desordenados.","action":"Ordenar registros por ambos tiempos y observar diferencia.","limit":"Secuencia y tardanza; no usar llegada como fecha de negocio.","case":{"at":4,"q":"Tiempo","input":"Evento 10:00, llegada 10:07","variants":[{"label":"Procesar 10:08","result":"8 min desde evento","why":"1 min desde llegada"},{"label":"Procesar 10:15","result":"15 min desde evento","why":"8 min desde llegada"}]},"lab":null},{"id":"S15.05","title":"Identidad e idempotencia","start":13,"end":17,"minutes":4,"text":"Idempotencia significa que repetir la operación conserva estado bajo condiciones explícitas.","action":"Reprocesar lote de tres registros y comparar append con upsert.","limit":"Conteos; no asumir idempotencia por reintento.","case":{"at":5,"q":"Reprocesar","input":"P1,P2,P3 dos veces","variants":[{"label":"Append","result":"6 filas","why":"Duplica"},{"label":"Upsert estable","result":"3 filas","why":"Mismo estado"}]},"lab":null},{"id":"S15.06","title":"Transacción y atomicidad","start":17,"end":21,"minutes":4,"text":"Atomicidad aplica todo o nada dentro del alcance de una transacción.","action":"Interrumpir actualización conceptual entre dos pasos.","limit":"Estados posibles; atomicidad depende del sistema.","case":null,"lab":null},{"id":"S15.07","title":"Checkpoint y offset","start":21,"end":24,"minutes":3,"text":"Checkpoint guarda progreso; avanzar offset antes del commit puede perder datos.","action":"Variar offset tras fallo y detectar hueco o repetición.","limit":"Posiciones; checkpoint no es copia de seguridad.","case":{"at":7,"q":"Checkpoint","input":"IDs 1–5 confirmados","variants":[{"label":"Guardar próximo 6","result":"Reanuda desde 6","why":"Tras commit"},{"label":"Guardar 8 antes de commit","result":"Riesgo de pérdida","why":"6 y 7 omitidos"}]},"lab":null},{"id":"S15.08","title":"Reintentos y backoff","start":24,"end":27,"minutes":3,"text":"Backoff espera entre reintentos transitorios; errores permanentes requieren diagnóstico.","action":"Clasificar errores y simular tres intentos limitados.","limit":"Estados y tiempos conceptuales; no reintentar indefinidamente.","case":null,"lab":null},{"id":"S15.09","title":"Rechazos y cuarentena","start":27,"end":30,"minutes":3,"text":"Cuarentena conserva rechazo y causa; éxito, rechazo y pendiente reconcilian entradas.","action":"Inyectar cambio de tipo y localizar cuarentena.","limit":"Conteos conservados; no borrar registros inválidos.","case":{"at":9,"q":"Reconciliación","input":"20 entradas","variants":[{"label":"15 éxito,3 rechazo,2 pendiente","result":"20; cuadra","why":"Estados completos"},{"label":"15 éxito,3 rechazo,1 pendiente","result":"19; falta 1","why":"Revisar"}]},"lab":null},{"id":"S15.10","title":"Cambio de esquema","start":30,"end":35,"minutes":5,"text":"Cambio de tipo puede romper consumidores; evolución compatible depende del contrato.","action":"Probar dos cambios con contrato y decidir compatibilidad.","limit":"Resultado de validación; no autoaceptar todo.","case":null,"lab":null},{"id":"S15.11","title":"Duplicados tardíos","start":35,"end":39,"minutes":4,"text":"Una llegada tardía puede contener versión antigua; usa orden de negocio declarado.","action":"Variar orden de llegada de versiones y comparar estado.","limit":"Versión seleccionada; llegada más reciente no siempre válida.","case":null,"lab":null},{"id":"S15.12","title":"Watermark conceptual","start":39,"end":43,"minutes":4,"text":"Watermark ayuda a gestionar tardanza en motores de streaming; no garantiza todo evento anterior procesado.","action":"Variar tolerancia y observar qué eventos se admiten.","limit":"Conjunto esperado; no llamar streaming real a simulación.","case":null,"lab":null},{"id":"S15.13","title":"Delta y versiones","start":43,"end":47,"minutes":4,"text":"Snapshots permiten consultar versiones cuando retención y permisos lo admiten.","action":"Comparar dos estados y elegir restauración bajo permiso.","limit":"Versiones; no asumir rollback disponible en todos los motores.","case":null,"lab":null},{"id":"S15.14","title":"Observabilidad","start":47,"end":51,"minutes":4,"text":"Observabilidad registra tiempos, frescura, errores y filas; alertas no explican causa por sí solas.","action":"Variar fallo en lote y detectar alerta por reconciliación.","limit":"Indicadores y umbral; no inferir causa solo por alerta.","case":null,"lab":null},{"id":"S15.15","title":"Prueba de recuperación","start":51,"end":55,"minutes":4,"text":"Una prueba de recuperación compara estado tras fallo controlado con ejecución limpia.","action":"Comparar ejecución completa y ejecución interrumpida con reintento.","limit":"Resultado esperado; no manipular servicio de producción.","case":null,"lab":null},{"id":"S15.16","title":"Cuaderno: preparar estado","start":65,"end":75,"minutes":10,"text":"Prepara estado aislado y fija invariantes antes de procesar.","action":"Ejecutar preflight y verificar conteos.","limit":"Estado base reproducible.","case":null,"lab":{"index":1,"heading":"1 · Preparar el contrato y los lotes","status":"sección temática identificada","gap":null}},{"id":"S15.17","title":"Cuaderno: procesar lote","start":75,"end":85,"minutes":10,"text":"Procesa lote dos veces y verifica que no cambia indebidamente el estado.","action":"Ejecutar lote y repetirlo.","limit":"Igualdad de estado; no contar dos veces.","case":null,"lab":{"index":4,"heading":"2 · Procesar de forma incremental","status":"sección temática identificada","gap":null}},{"id":"S15.18","title":"Cuaderno: fallo y recuperación","start":85,"end":95,"minutes":10,"text":"Ejecuta el fallo controlado antes de estudiar la repetición.","action":"Compara el estado previo y posterior.","limit":"No simules éxito de una operación fallida.","case":null,"lab":{"index":7,"heading":"3 · Fallo controlado y recuperación","status":"sección temática identificada","gap":null}},{"id":"S15.19","title":"Cuaderno: repetición y esquema","start":95,"end":105,"minutes":10,"text":"Repite el lote y observa el cambio de esquema previsto.","action":"Comprueba identidades y errores.","limit":"Un cambio de tipo no siempre es compatible.","case":null,"lab":{"index":10,"heading":"4 · Repetición, cambio de esquema y evidencia","status":"sección temática identificada","gap":null}},{"id":"S15.20","title":"Cuaderno: actualización incremental","start":105,"end":115,"minutes":10,"text":"Aplica versión tardía según política y comprueba cuál prevalece.","action":"Variar orden de eventos y comparar estado final.","limit":"Identidad y versión; no sobrescribir RAW.","case":null,"lab":{"index":13,"heading":"5 · Reto de transferencia (formativo)","status":"sección temática identificada","gap":null}},{"id":"S15.21","title":"Cuaderno: exportar observabilidad","start":115,"end":125,"minutes":10,"text":"Exporta logs, versiones, rechazos y manifiesto para reconciliación.","action":"Releer y comprobar reconciliación y hash.","limit":"Pipeline verificable y trazable.","case":null,"lab":{"index":10,"heading":"4 · Repetición, cambio de esquema y evidencia","status":"ampliación pendiente","gap":"Falta una exportación explícita de observabilidad."}},{"id":"S15.22","title":"Reto de recuperación","start":125,"end":130,"minutes":5,"text":"Cambia orden de eventos o punto de fallo y comprueba invariantes.","action":"Ejecutar variante segura y comprobar invariantes.","limit":"Resultado propio y estado final.","case":null,"lab":null},{"id":"S15.23","title":"Lectura de confiabilidad","start":130,"end":135,"minutes":5,"text":"Disponibilidad, durabilidad, consistencia e idempotencia son propiedades distintas.","action":"Seleccionar garantía probada y garantía no probada con evidencia.","limit":"Decisión contextual; no afirmar exactly-once universal.","case":null,"lab":null},{"id":"S15.24","title":"Relevo integración","start":135,"end":140,"minutes":5,"text":"S16 recibe tablas y manifiestos actualizados con identidad y versión.","action":"Comprobar compatibilidad de identificadores y versiones.","limit":"Entrada confiable del producto.","case":null,"lab":null},{"id":"S15.25","title":"Cierre pipeline","start":140,"end":150,"minutes":10,"text":"La confiabilidad se demuestra con recuperación comprobada, no garantía universal de exactly-once.","action":"Resolver controles de checkpoint, versión y reintento.","limit":"Estado y trazas; S15 sigue formativa.","case":null,"lab":null}],"control":{"at":9,"title":"Reconciliación de lote","label":"Pendientes registrados","min":0,"max":5,"step":1,"initial":2},"blocks":[{"title":"Lotes, eventos y estado","range":"1–3","concept":"Batch procesa conjunto finito; microbatch agrupa llegadas; streaming gestiona estado continuo. Checkpoint registra progreso, no reemplaza transacción.","task":"Identifica los tres lotes y las tablas de control.","evidence":"Contrato y estado inicial.","excerpt":"import sqlite3, json, tempfile\nfrom pathlib import Path\nfrom hashlib import sha256\n\ncarpeta = Path(tempfile.mkdtemp(prefix=\"s15_\"))\nruta = carpeta / \"pipeline.db\"\nlotes = [\n    [{\"id\":\"P1\",\"valor\":100},{\"id\":\"P2\",\"valor\":200},{\"id\":\"P2\",\"valor\":200}],\n    [{\"id\":\"P3\",\"valor\":300},{\"id\":\"P4\",\"valor\":None},{\"id\":\"P5\",\"valor\":500}],\n    [{\"id\":\"P6\",\"valor\":600,\"campo_nuevo\":\"v2\"},{\"id\":\"P7\",\"valor\":700}]\n]\nwith sqlite3.connect(ruta) as db:\n    db.executescript(\"\"\"\n    CREATE TABLE validos(id TEXT PRIMARY KEY, valor INTEGER NOT NULL);\n    CREATE TABLE rechazos(id TEXT PRIMARY KEY, causa TEXT NOT NULL, raw TEXT NOT NULL);\n    CREATE TABLE lotes_confirmados(lote INTEGER PRIMARY KEY, hash TEXT NOT NULL);\n    \"\"\")\nprint(\"Lotes:\", len(lotes), \"| archivo:\", ruta.name)","excerptTruncated":false},{"title":"Idempotencia","range":"4–6","concept":"Clave estable evita duplicado; huella detecta lote cambiado. Transacción confirma todas las escrituras o ninguna.","task":"Procesa primer lote y verifica 2 válidos.","evidence":"Estado y checkpoint.","excerpt":"def huella(registros):\n    return sha256(json.dumps(registros, sort_keys=True, separators=(\",\",\":\")).encode()).hexdigest()\n\ndef estado():\n    with sqlite3.connect(ruta) as db:\n        return {t: db.execute(\"SELECT COUNT(*) FROM \"+t).fetchone()[0]\n                for t in (\"validos\",\"rechazos\",\"lotes_confirmados\")}\n\ndef procesar(numero, registros, fallar=False):\n    h = huella(registros)\n    with sqlite3.connect(ruta) as db:\n        db.execute(\"BEGIN IMMEDIATE\")\n        anterior = db.execute(\"SELECT hash FROM lotes_confirmados WHERE lote=?\", (numero,)).fetchone()\n        if anterior:\n            if anterior[0] != h:\n                raise ValueError(\"El lote confirmado cambió de contenido\")\n            return \"YA CONFIRMADO\"\n        for pos, r in enumerate(registros):\n            ident = r.get(\"id\")\n            valor = r.get(\"valor\")\n            raw = json.dumps(r, sort_keys=True, ensure_ascii=False)\n            clave_rechazo = f\"{numero}:{pos}\"\n            if not isinstance(ident, str) or not ident or type(valor) is not int or valor \u003c 0:\n                db.execute(\"INSERT INTO rechazos VALUES(?,?,?)\",\n                           (clave_rechazo,\"contrato invalido\",raw))\n            else:\n                previa = db.execute(\"SELECT valor FROM validos WHERE id=?\", (ident,)).fetchone()\n                if previa is None:","excerptTruncated":true},{"title":"Fallo y recuperación","range":"7–9","concept":"Rollback revierte escrituras no confirmadas; reintentar debe recuperar sin duplicar.","task":"Provoca fallo, compara estado y reintenta.","evidence":"4 válidos, 1 rechazo esperado.","excerpt":"antes = estado()\ntry:\n    procesar(1,lotes[1],fallar=True)\nexcept RuntimeError as exc:\n    assert str(exc) == \"FALLO CONTROLADO\"\nelse:\n    raise AssertionError(\"No se provocó el fallo\")\ndespues = estado()\nassert antes == despues\nprint(\"Rollback comprobado:\", despues)\nprint(procesar(1,lotes[1]), estado())\nassert estado() == {\"validos\":4,\"rechazos\":1,\"lotes_confirmados\":2}","excerptTruncated":false},{"title":"Cambios de esquema y replay","range":"10–15","concept":"Campo nuevo compatible no significa cambio de identidad aceptable. Repetir lote confirmado no modifica estado.","task":"Cambia valor de P1 y distingue conflicto de repetición.","evidence":"Rechazos y reejecución.","excerpt":"nuevo_valor = 999  # modifica: 100 repite P1; otro entero positivo entra en conflicto\nlote4 = [{\"id\":\"P1\",\"valor\":nuevo_valor},{\"id\":\"P8\",\"valor\":800}]\ninicio = estado()\nprint(procesar(3,lote4), estado())\nfin = estado()\nassert fin[\"validos\"] == inicio[\"validos\"] + 1\nassert fin[\"rechazos\"] == inicio[\"rechazos\"] + int(nuevo_valor != 100)\nassert fin[\"lotes_confirmados\"] == inicio[\"lotes_confirmados\"] + 1\nassert procesar(3,lote4) == \"YA CONFIRMADO\"\nassert estado() == fin\nprint(\"Transferencia verificada\")","excerptTruncated":false},{"title":"Operación y streaming","range":"16–18","concept":"Structured Streaming puede usar microbatches y checkpoint; no confundir SQLite con tolerancia distribuida.","task":"Ejecuta ampliación solo si Spark está disponible; confirma incremento SECOP portable.","evidence":"Estado y manifiesto S15.","excerpt":"EJECUTAR_SPARK = False  # ampliación voluntaria, sin instalación ni red\nif EJECUTAR_SPARK:\n    from pyspark.sql import SparkSession\n    from pyspark.sql.types import StructType, StructField, StringType, LongType\n    import shutil\n    spark_local = SparkSession.getActiveSession()\n    creado = spark_local is None\n    if creado:\n        spark_local = SparkSession.builder.master(\"local[2]\").appName(\"S15-microbatch\").getOrCreate()\n    if not spark_local.sparkContext.master.startswith(\"local\"):\n        raise RuntimeError(\"Utiliza Spark clásico en modo local, no un servidor remoto\")\n    base_stream = Path(tempfile.mkdtemp(prefix=\"s15_stream_\"))\n    origen = base_stream / \"origen\"\n    origen.mkdir()\n    destino = str(base_stream / \"parquet\")\n    checkpoint = str(base_stream / \"checkpoint\")\n    schema = StructType([StructField(\"id\",StringType(),False),\n                         StructField(\"valor\",LongType(),False)])\n\n    def publicar_archivo(nombre, eventos):\n        borrador = origen / (\".\"+nombre+\".part\")\n        borrador.write_text(\"\\n\".join(json.dumps(x) for x in eventos)+\"\\n\")\n        borrador.rename(origen / nombre)\n\n    def ejecutar_microbatch():\n        eventos = (spark_local.readStream.schema(schema)\n                   .option(\"maxFilesPerTrigger\",1).json(str(origen)))\n        q = (eventos.writeStream.format(\"parquet\").outputMode(\"append\")","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":60},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":7,"title":"Recuperación: checkpoint y escritura","concept":"Eventos A v1, B v1, A v2, C v1. Si se escribe antes de checkpoint y ocurre fallo, el evento se repite. Upsert por ID/versión puede hacer repetición inocua; append duplica. Si checkpoint se confirma antes de escritura y falla, se puede perder el evento. Compara estado final contra ejecución limpia.","pred":"Predice qué ocurre al fallar en segunda posición con checkpoint posterior.","fields":[{"label":"Fallo en posición (0=ninguno)","min":0,"max":4,"step":1,"value":2},{"label":"Escritura (0=append,1=upsert)","min":0,"max":1,"step":1,"value":1},{"label":"Checkpoint (0=después,1=antes)","min":0,"max":1,"step":1,"value":0}],"interpret":"Lee trazas y estados canónicos. El fallo posterior a escritura genera reintento; el previo pierde evento. El control compara multiconjunto o estado por versión según regla.","challenge":"Encuentra recuperación equivalente y pérdida irreversible; explica por qué idempotencia no corrige checkpoint adelantado.","limit":"Máquina de estados local; no prueba Kafka, Delta ni exactly-once."}},{"id":"16","title":"¿Cómo entregar un producto de datos?","problem":"El observatorio de Compras Claras debe funcionar fuera del entorno de desarrollo.","mission":"Entregar el observatorio","original":"proyecto-final-explorer.html","notebook":{"path":"Cuadernos/Proyecto_Final_Compras_Claras.ipynb","ref":"mejora-pedagogica-integral","cells":34,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Proyecto_Final_Compras_Claras.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Proyecto_Final_Compras_Claras.ipynb"},"quiz":{"question":"¿Cuándo se usa test para elegir hiperparámetros?","options":["Nunca durante la selección","En cada iteración","Antes de train"],"feedback":["Correcto: se reserva para evaluación final.","Contamina la evaluación.","La selección requiere train y validación."]},"slides":[{"id":"S16.01","title":"Qué debe defenderse","start":0,"end":3,"minutes":3,"text":"La defensa muestra un producto que responde una pregunta bajo la rúbrica vigente, no un listado de tecnologías.","action":"Seleccionar requisito y artefacto que lo respalda.","limit":"Matriz oficial; no cambiar condiciones.","case":null,"lab":null},{"id":"S16.02","title":"Estado de integración","start":3,"end":5,"minutes":2,"text":"Clasifica artefactos reales, sintéticos, simulados y pendientes.","action":"Clasificar artefactos por procedencia y disponibilidad.","limit":"Inventario verificable; no encubrir brechas.","case":null,"lab":null},{"id":"S16.03","title":"Arquitectura de extremo a extremo","start":5,"end":8,"minutes":3,"text":"Arquitectura E2E conecta fuentes y consumidores mediante contratos explícitos.","action":"Vincular módulos con entradas y salidas reales.","limit":"Diagrama de interfaces; no agregar obligación.","case":null,"lab":null},{"id":"S16.04","title":"Identidad y contrato","start":8,"end":10,"minutes":2,"text":"Proceso, contrato, activo y predicción tienen identidades distintas; controla cardinalidad.","action":"Comprobar compatibilidad con registros propios.","limit":"Reporte de identidad; no forzar joins por nombre.","case":{"at":4,"q":"Join de ejemplo no evaluativo","input":"P1 con dos activos y tres predicciones","variants":[{"label":"Unir solo por P1","result":"6 filas","why":"2×3"},{"label":"Filtrar versión única","result":"2 filas","why":"2×1"}]},"lab":nul function calculate(id,n){
 const fmt=x=>Number(x.toFixed(3)).toLocaleString("es-CO");
 switch(id){
 case"01":return {value:Math.max(0,120-n)*5,unit:"registros pendientes",formula:"max(0, 120 − capacidad) × 5; llegadas constantes"};
 case"02":return {value:100*n*2,unit:"MB brutos",formula:"100 MB/día × días × 2 copias"};
 case"03":return {value:n*100,unit:"bytes de activos",formula:"100 bytes × activos; sin overhead"};
 case"04":return {value:200*n,unit:"MB brutos",formula:"2 fragmentos × 100 MB × copias"};
 case"05":return {value:Math.min(120,n*10),unit:"filas en el bucket máximo",formula:"10 filas/mes × meses por bucket; 12 meses fijos. Número de buckets: "+Math.ceil(12/n)};
 case"06":return {value:2+n,unit:"aristas salientes de A",formula:"Dos aristas iniciales más las nuevas; cada extremo adicional es distinto"};
 case"07":return {value:2.2*n/(1.2+n),unit:"componente TF de BM25",formula:"2,2 × f / (1,2 + f), longitud fija e IDF excluido"};
 case"08":return {value:Math.ceil(12/n)*2,unit:"segundos ideales",formula:"ceil(12 tareas / simultáneas) × 2 s; sin overhead"};
 case"09":return {value:Math.cos(n*Math.PI/180),unit:"similitud coseno",formula:"cos(ángulo); dos vectores unitarios"};
 case"10":return {value:n*500*3,unit:"bytes de matriz RGB",formula:"ancho × 500 × 3 bytes; sin compresión"};
 case"11":return {value:n/20*100,unit:"% WER",formula:"ediciones / 20 palabras × 100; ejemplo manual"};
 case"12":return {value:20-n,unit:"segundos cubiertos",formula:"Audio ficticio de 20 s, 0–10 y (10 + hueco)–20"};
 case"13":return {value:1/(0.2+0.8/n),unit:"× speedup ideal",formula:"1 / (0,2 + 0,8 / p); no tiempo medido"};
 case"14":return {value:n,unit:"registros en la clave máxima",formula:"1.000 totales; otras tres claves reparten "+(1000-n)+" filas"};
 case"14A":return {value:n*1e6*128*8/2**30,unit:"GiB de matriz (mínimo)",formula:"N × 128 × 8 / 2³⁰; no pico RAM ni fit"};
 case"15":return {value:20-(15+3+n),unit:"diferencia entrada − estados",formula:"20 − (15 éxitos + 3 rechazos + pendientes); cero reconcilia"};
 case"16":return {value:2*n,unit:"filas de join",formula:"2 activos × predicciones históricas; ejemplo no evaluativo"};
 default:throw Error("Calculadora desconocida "+id);
 }
}
