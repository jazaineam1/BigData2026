ingencia docente","start":127,"end":134,"minutes":7,"text":"Registra error, etapa y estado; la contingencia académica corresponde al docente.","action":"Seleccionar motivo de bloqueo y anexar evidencia permitida.","limit":"Incidencia para docente; no declarar cumplimiento automático.","case":null,"lab":null},{"id":"S08.24","title":"Relevo V1","start":134,"end":140,"minutes":6,"text":"V1 integra artefactos permitidos y propios; los pendientes quedan visibles.","action":"Exportar contrato de integración, sin copiar trabajos ajenos.","limit":"V1 propia o estado parcial explícito.","case":null,"lab":null},{"id":"S08.25","title":"Cierre TC1","start":140,"end":150,"minutes":10,"text":"Verifica entrega según condiciones oficiales; los ejemplos formativos no son soluciones del taller.","action":"Verificar entrega y resolver autochequeo técnico no calificable.","limit":"Trazabilidad individual; no publicar respuestas ni notas.","case":null,"lab":null}],"control":{"at":7,"title":"Concurrencia ideal · ejemplo de biblioteca","label":"Tareas simultáneas","min":1,"max":12,"step":1,"initial":3},"blocks":[{"title":"Preflight TC1","range":"1–14","concept":"Un snapshot fija ventana y grano; procesos y contratos son fuentes diferentes.","task":"Comprueba cuentas y consulta de 50 filas.","evidence":"Preflight.","excerpt":null,"excerptTruncated":false},{"title":"Adquisición concurrente","range":"15–28","concept":"Mismos offsets y orden deben dar mismo contenido; hash detecta cambios.","task":"Ejecuta ruta del taller y compara descargas.","evidence":"RAW y manifiesto.","excerpt":null,"excerptTruncated":false},{"title":"MongoDB y producto analítico","range":"29–50","concept":"Documento por proceso y agregación mantienen identidad; índice se confirma en motor.","task":"Completa E2/E3 y capturas requeridas.","evidence":"Consultas y evidencia oficial.","excerpt":null,"excerptTruncated":false},{"title":"Cassandra y Neo4j","range":"51–70","concept":"Cada motor responde un patrón distinto; no sustituir ejecución con una tabla de ejemplo.","task":"Ejecuta E4/E5 y conserva avance si no termina en clase.","evidence":"CQL y Cypher.","excerpt":null,"excerptTruncated":false},{"title":"Validación y V1.0","range":"71–80","concept":"El corrector y rúbrica oficiales siguen vigentes.","task":"Valida entrega y registra pendientes, confirma versión portable.","evidence":"Manifiesto y entrega oficial.","excerpt":null,"excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":15},{"label":"Ejemplos y experimentación","minutes":15},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":75},{"label":"Autonomía y transferencia","minutes":20},{"label":"Cierre","minutes":10}],"workbench":{"at":7,"title":"Repaso de cobertura y concurrencia en biblioteca","concept":"Una biblioteca ficticia recupera 18 fichas con páginas que duran dos segundos. La concurrencia reduce rondas ideales, no corrige omisiones. Primero se comprueba identidad y cobertura; después se interpreta tiempo. No se emplean datos ni respuestas del taller.","pred":"Con seis páginas y tres tareas simultáneas, predice las rondas.","fields":[{"label":"Fichas/página","min":1,"max":9,"step":1,"value":3},{"label":"Tareas simultáneas","min":1,"max":6,"step":1,"value":3},{"label":"Omitir página (0=ninguna)","min":0,"max":6,"step":1,"value":0}],"interpret":"Las páginas omitidas permanecen visibles. El tiempo ideal usa rondas de peticiones efectivamente ejecutadas, sin red ni coordinación.","challenge":"Compara un escenario rápido incompleto y otro completo. Explica el riesgo sin resolver TC1.","limit":"Ejemplo de biblioteca no evaluativo."}},{"id":"09","title":"¿Cómo recuperar por significado?","problem":"La consulta y el documento pueden expresar la misma idea con palabras diferentes.","mission":"Mejorar recuperación","original":"s09-de-palabras-a-significado.html","notebook":{"path":"Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb","ref":"mejora-pedagogica-integral","cells":21,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb"},"quiz":{"question":"¿Coseno 0.9 significa 90% de verdad?","options":["Sí","No, mide orientación vectorial","Solo en Atlas"],"feedback":["No es probabilidad calibrada.","Correcto: es una medida geométrica.","El motor no convierte similitud en verdad."]},"slides":[{"id":"S09.01","title":"La consulta que BM25 no encuentra","start":0,"end":3,"minutes":3,"text":"La semántica recupera intención similar aunque no haya términos idénticos; no reemplaza toda búsqueda lexical.","action":"Juzgar relevancia antes de revelar resultados vectoriales.","limit":"Juicios congelados; no declarar semántica superior siempre.","case":null,"lab":null},{"id":"S09.02","title":"Recuperar baseline","start":3,"end":5,"minutes":2,"text":"Comparar requiere mismo corpus, consultas, filtros y juicios.","action":"Verificar que consultas y universo coincidan antes de comparar.","limit":"Contrato de benchmark; no comparar conjuntos distintos.","case":null,"lab":null},{"id":"S09.03","title":"Vector desde cero","start":5,"end":10,"minutes":5,"text":"Un vector es una lista de coordenadas; dimensión es su longitud, no cantidad de palabras.","action":"Ubicar tres vectores y comparar dirección y magnitud.","limit":"Representación gráfica; dos ejes son ejemplo didáctico.","case":null,"lab":null},{"id":"S09.04","title":"Producto punto y norma","start":10,"end":15,"minutes":5,"text":"Producto punto suma multiplicaciones; norma es raíz de suma de cuadrados.","action":"Calcular a mano producto y norma de dos vectores pequeños.","limit":"Cálculo verificable; no dividir por norma cero.","case":{"at":4,"q":"Producto punto","input":"a=(2,1)","variants":[{"label":"b=(1,3)","result":"5","why":"2×1+1×3"},{"label":"b=(0,4)","result":"4","why":"2×0+1×4"}]},"lab":null},{"id":"S09.05","title":"Coseno y distancia","start":15,"end":19,"minutes":4,"text":"Coseno normaliza por magnitudes: vectores paralelos positivos tienen coseno uno, no probabilidad uno.","action":"Variar magnitud y ángulo para observar coseno y distancia.","limit":"Valores numéricos; coseno no es porcentaje de verdad.","case":{"at":5,"q":"Coseno","input":"Consulta (1,0)","variants":[{"label":"(5,0)","result":"1","why":"Paralelo positivo"},{"label":"(0,5)","result":"0","why":"Ortogonal"},{"label":"(−2,0)","result":"−1","why":"Dirección opuesta"}]},"lab":null},{"id":"S09.06","title":"Embedding de texto","start":19,"end":23,"minutes":4,"text":"Un embedding es representación aprendida con pérdida, no texto reversible.","action":"Comparar dos textos y verificar dimensión de salida del modelo.","limit":"Vector y metadata; no reconstruir texto exacto.","case":null,"lab":null},{"id":"S09.07","title":"Modelo E5 y prefijos","start":23,"end":27,"minutes":4,"text":"Los prefijos de consulta y pasaje de E5 forman parte del contrato del modelo utilizado.","action":"Cambiar prefijo conforme a documentación y comparar resultados etiquetados.","limit":"Versión y norma; no mezclar modelos o prefijos sin registro.","case":null,"lab":null},{"id":"S09.08","title":"Normalización y top-k","start":27,"end":31,"minutes":4,"text":"Top-k ordena candidatos según similitud y regla de desempate.","action":"Variar k y ordenar similitudes manual y programáticamente.","limit":"IDs ordenados; establecer desempate estable.","case":null,"lab":null},{"id":"S09.09","title":"Índice vectorial","start":31,"end":35,"minutes":4,"text":"Un índice vectorial organiza recuperación de vecinos y requiere construcción y memoria.","action":"Comparar búsqueda lineal y esquema conceptual de vecinos.","limit":"Diagrama y operaciones; no atribuir algoritmo no documentado.","case":null,"lab":null},{"id":"S09.10","title":"ANN frente a ENN","start":35,"end":40,"minutes":5,"text":"ANN aproxima vecinos; ENN compara de forma exacta. Aumentar candidatos puede elevar costo y recall.","action":"Variar candidatos en simulación o motor verificado y comparar top-k exacto.","limit":"Recall de vecinos; aproximación no garantiza mismo ranking.","case":{"at":10,"q":"Recall ANN","input":"Exacto A,B,C","variants":[{"label":"A,B,D","result":"2/3","why":"Dos vecinos exactos"},{"label":"A,B,C","result":"3/3","why":"Todos coinciden"}]},"lab":null},{"id":"S09.11","title":"Filtros de metadata","start":40,"end":45,"minutes":5,"text":"Filtrar cambia universo de candidatos; compara contra referencia exacta con mismo filtro.","action":"Comparar búsqueda global y restringida con mismo texto.","limit":"IDs y universo; no comparar recall con universo distinto.","case":null,"lab":null},{"id":"S09.12","title":"Latencia y repetición","start":45,"end":50,"minutes":5,"text":"Latencia de consulta, generación de embedding e indexación son tiempos distintos.","action":"Medir consultas repetidas con configuración constante y calentamiento identificado.","limit":"Latencias y entorno; no afirmar SLA.","case":null,"lab":null},{"id":"S09.13","title":"Fusión RRF","start":50,"end":55,"minutes":5,"text":"RRF suma 1/(c+posición) en listas; fusiona posiciones sin mezclar escalas de score.","action":"Fusionar rankings de cuatro documentos y variar constante.","limit":"Ranking y contribuciones; no usar scores crudos juntos.","case":{"at":13,"q":"RRF","input":"Lista 1 A,B; lista 2 B,C; c=10","variants":[{"label":"A","result":"0,0909","why":"1/11"},{"label":"B","result":"0,1742","why":"1/12+1/11"},{"label":"C","result":"0,0833","why":"1/12"}]},"lab":null},{"id":"S09.14","title":"Relevancia y recall ANN","start":55,"end":60,"minutes":5,"text":"Recall de vecinos exactos y recall de relevancia humana tienen denominadores diferentes.","action":"Calcular ambas métricas sobre listas diferentes.","limit":"Dos denominadores; no confundir recuperación técnica y utilidad.","case":null,"lab":null},{"id":"S09.15","title":"Comparación lexical-semántica","start":60,"end":65,"minutes":5,"text":"Lexical ayuda con identificadores; embeddings con paráfrasis. La utilidad se evalúa por consulta.","action":"Evaluar los tres rankings sobre consultas congeladas.","limit":"Métricas por consulta; no seleccionar ganadores solo por ejemplos favorables.","case":null,"lab":null},{"id":"S09.16","title":"Cuaderno: preparar e incrustar","start":75,"end":84,"minutes":9,"text":"Verifica versión, prefijos y dimensión antes de vectorizar.","action":"Ejecutar muestra pequeña y comprobar dimensiones y normas.","limit":"Embeddings propios o caché identificada; no fingir inferencia.","case":null,"lab":{"index":2,"heading":"1 · Ingesta y contrato de datos","status":"sección temática identificada","gap":null}},{"id":"S09.17","title":"Cuaderno: ranking exacto","start":84,"end":93,"minutes":9,"text":"Calcula ranking exacto y comprueba coseno manual sobre un caso pequeño.","action":"Modificar consulta y comparar top-k con control manual.","limit":"Ranking exacto y IDs; no contar similitudes nulas como relevantes.","case":null,"lab":{"index":4,"heading":"2 · Vectorización y coste de almacenamiento","status":"ampliación pendiente","gap":"Verificar ranking exacto independiente con el mismo filtro."}},{"id":"S09.18","title":"Cuaderno: Atlas e índice","start":93,"end":101,"minutes":8,"text":"Atlas requiere índice compatible y listo; crearlo no prueba disponibilidad.","action":"Crear o reutilizar índice autorizado y comprobar estado disponible.","limit":"Estado real o pendiente; no prometer disponibilidad inmediata.","case":null,"lab":{"index":10,"heading":"5 · Crear y visualizar el índice de la base vectorial","status":"sección temática identificada","gap":null}},{"id":"S09.19","title":"Cuaderno: consultar ANN","start":101,"end":109,"minutes":8,"text":"Registra top-k ANN, candidatos y exacto sobre el mismo universo.","action":"Variar candidatos o k dentro de límite seguro.","limit":"IDs, recall de vecinos y modo real.","case":null,"lab":{"index":13,"heading":"6 · Vector Search tanto en Colab como en la consola de Atlas","status":"sección temática identificada","gap":null}},{"id":"S09.20","title":"Cuaderno: evaluar y fusionar","start":109,"end":117,"minutes":8,"text":"Calcula métricas con juicios congelados y prueba fusión en conjunto de desarrollo.","action":"Modificar constante en conjunto de práctica sin tocar test.","limit":"Tabla de métricas; separar selección y evaluación.","case":null,"lab":{"index":19,"heading":"Ampliación 2 · Benchmark responsable","status":"ampliación pendiente","gap":"No se certifica una fusión RRF completa ni juicios independientes."}},{"id":"S09.21","title":"Cuaderno: exportar recuperación","start":117,"end":125,"minutes":8,"text":"Exporta consulta, modelo, dimensiones, filtros, IDs y ranking.","action":"Releer y validar compatibilidad de vector y corpus.","limit":"Recuperación reproducible; no guardar secretos.","case":null,"lab":{"index":16,"heading":"Cierre de la práctica formativa","status":"ampliación pendiente","gap":"Verificar exportación y relectura."}},{"id":"S09.22","title":"Reto semántico","start":125,"end":130,"minutes":5,"text":"Prueba intención nueva y compara lexical, vectorial e híbrida bajo el mismo filtro.","action":"Ejecutar lexical, vectorial e híbrida y elegir según juicio disponible.","limit":"Tres resultados y decisión contextual.","case":null,"lab":null},{"id":"S09.23","title":"Interpretación de fallos","start":130,"end":135,"minutes":5,"text":"Un vecino cercano puede fallar por ambigüedad, negación o dominio del modelo.","action":"Seleccionar causa plausible y dato necesario para confirmar.","limit":"Límite concreto; no atribuir significado humano al vector.","case":null,"lab":null},{"id":"S09.24","title":"Relevo multimedia","start":135,"end":140,"minutes":5,"text":"OCR y ASR aportan textos trazables; texto de imagen no equivale a embedding visual nativo.","action":"Exportar contrato de textos e índices para S10/S11.","limit":"Esquema y consulta reutilizable.","case":null,"lab":null},{"id":"S09.25","title":"Cierre semántico","start":140,"end":150,"minutes":10,"text":"Demuestra similitud, recuperación, fusión y relevancia como conceptos distintos.","action":"Resolver controles sobre norma, ANN, filtro y fusión.","limit":"Benchmark y producto; conservar configuración.","case":null,"lab":null}],"control":{"at":5,"title":"Ángulo y coseno","label":"Ángulo en grados","min":0,"max":180,"step":5,"initial":60},"blocks":[{"title":"De palabras a significado","range":"0–3","concept":"BM25 y TF-IDF ponderan palabras; E5 aprende representaciones densas. Cercanía no implica pertinencia.","task":"Busca salud pública y abre fuentes reales; carga corpus del cuaderno.","evidence":"Corpus e intención.","excerpt":"#@title 1 · Cargar SECOP o CSV propio y validar el contrato de datos\nimport hashlib, json, os, re, time\nimport numpy as np\nimport pandas as pd\nfrom IPython.display import display\nMODO_DEMO = \"SECOP curso · 120\" #@param [\"SECOP curso · 120\",\"SECOP oficial · hasta 6000\",\"CSV propio · URL\",\"CSV propio · subir\",\"Respaldo sintético · 6\"]\nEQUIPO = \"mi-practica\" #@param {type:\"string\"}\nCSV_PROPIO_URL = \"\" #@param {type:\"string\"}\nCOLUMNA_ID = \"id_proceso\" #@param {type:\"string\"}\nCOLUMNA_TITULO = \"nombre_proceso\" #@param {type:\"string\"}\nCOLUMNA_TEXTO = \"descripcion\" #@param {type:\"string\"}\nCOLUMNA_ENTIDAD = \"entidad\" #@param {type:\"string\"}\nCOLUMNA_URL = \"url_secop\" #@param {type:\"string\"}\nMAX_FILAS = 6000 if \"6000\" in MODO_DEMO else 120\nEQUIPO = re.sub(r\"[^a-z0-9_-]\", \"-\", EQUIPO.strip().lower())[:40] or \"docente\"\nMODEL_NAME = \"intfloat/multilingual-e5-small\"\nMAX_TOKENS = 256\nURL_CURSO = \"https://raw.githubusercontent.com/jazaineam1/BigData2026/main/Datos/s06_contexto_relacional.csv\"\nif MODO_DEMO.startswith(\"SECOP curso\"):\n    raw = pd.read_csv(URL_CURSO,dtype=str,keep_default_na=False)\n    ORIGEN = URL_CURSO\nelif MODO_DEMO.startswith(\"SECOP oficial\"):\n    import requests\n    URL_API = \"https://www.datos.gov.co/resource/p6dx-8zbt.json\"\n    resp=requests.get(URL_API,params={\"$select\":\n        \"id_del_proceso,nombre_del_procedimiento,descripci_n_del_procedimiento,entidad\",\n        \"$where\":\"id_del_proceso IS NOT NULL\",\n        \"$order\":\"id_del_proceso ASC\",\"$limit\":9000},timeout=40)","excerptTruncated":true},{"title":"Geometría y E5","range":"4–5,17–18","concept":"Coseno compara orientación; con vectores unitarios es producto punto. E5 usa passage/query; matriz float32 ocupa N×384×4 bytes.","task":"Cambia ángulo y calcula capacidad; ejecuta E5 y verifica norma/dimensión.","evidence":"Matriz N×384 y costo.","excerpt":"#@title 2 · Ejecutar SentenceTransformers E5 y mostrar la matriz de embeddings\nfrom sentence_transformers import SentenceTransformer\nmodelo=SentenceTransformer(MODEL_NAME)\nmodelo.max_seq_length=MAX_TOKENS\ntextos=[\"passage: \"+str(t) for t in corpus[\"texto_busqueda\"]]\ncache=os.path.join(os.getcwd(),\"s09_atlas_\"+LOTE+\".npy\")\nstart=time.perf_counter()\nif os.path.isfile(cache):\n    embeddings=np.load(cache)\n    if embeddings.shape!=(len(corpus),384):\n        raise ValueError(\"Caché incompatible. Borra \"+cache+\" y vuelve a ejecutar.\")\n    print(\"Embeddings cargados desde caché del entorno.\")\nelse:\n    embeddings=modelo.encode(textos,normalize_embeddings=True,\n                            batch_size=32,show_progress_bar=True)\n    np.save(cache,embeddings)\nembeddings=np.asarray(embeddings,dtype=np.float32)\nassert embeddings.shape==(len(corpus),384)\nprint(\"Embeddings reales:\",embeddings.shape,\n      \"· tiempo:\",round(time.perf_counter()-start,1),\"segundos\")\nprint(\"Ejemplo de vector:\",np.round(embeddings[0,:7],3).tolist())\nbytes_float32 = len(corpus)*384*4\nprint(\"Matriz de embeddings float32:\",round(bytes_float32/1024**2,3),\"MiB;\",\n      \"proyección a 1 millón:\",round(1000000*384*4/1024**3,2),\"GiB sin índices\")\nassert np.isfinite(embeddings).all()\nassert np.max(np.abs(np.linalg.norm(embeddings,axis=1)-1))\u003c0.01","excerptTruncated":false},{"title":"Persistir e indexar","range":"6–12","concept":"Upsert por ID evita duplicación del mismo lote; solicitar índice no equivale a estar disponible.","task":"Conecta Atlas si disponible, carga y verifica queryable. No compartas credenciales.","evidence":"Ping, conteo y estado índice.","excerpt":"#@title 4 · Guardar los embeddings y metadatos en la colección Atlas\natlas_cargado=False\nif atlas_ok:\n    try:\n        registros=[]\n        for i,row in corpus.reset_index(drop=True).iterrows():\n            doc={\n                \"_id\": \"s09:\"+LOTE+\":\"+str(row[\"id_proceso\"]),\n                \"id_proceso\":str(row[\"id_proceso\"]),\n                \"nombre_proceso\":str(row[\"nombre_proceso\"]),\n                \"descripcion\":str(row[\"descripcion\"]),\n                \"entidad\":str(row[\"entidad\"]),\n                \"url_secop\":str(row[\"url_secop\"]),\n                \"lote\":LOTE,\n                \"equipo\":EQUIPO,\n                \"embedding\":embeddings[i].astype(float).tolist(),\n                \"modelo\":MODEL_NAME\n            }\n            registros.append(UpdateOne({\"_id\":doc[\"_id\"]},{\"$set\":doc},upsert=True))\n        for offset in range(0,len(registros),100):\n            col.bulk_write(registros[offset:offset+100],ordered=False)\n        guardados=col.count_documents({\"lote\":LOTE})\n        atlas_cargado=(guardados==len(corpus))\n        muestra_atlas=col.find_one({\"lote\":LOTE},{\"_id\":1,\"id_proceso\":1,\"embedding\":1})\n        if atlas_cargado and (not muestra_atlas or len(muestra_atlas.get(\"embedding\",[]))!=384):\n            atlas_cargado=False\n            print(\"ERROR: dimensión de embedding en documento Atlas inválida.\")\n        print(\"ATLAS REAL · documentos del lote:\",guardados,","excerptTruncated":true},{"title":"ANN, ENN y calidad","range":"13–15,19–20","concept":"ANN aproxima vecinos; ENN calcula exactos. Recall contra exacto mide acuerdo, no relevancia humana. RRF combina posiciones.","task":"Cambia consulta, filtro y k; compara Atlas y NumPy; benchmark opcional.","evidence":"Rankings y modalidad ejecutada.","excerpt":"#@title 7 · Consulta, cambia la intención o filtra una entidad observada\nfor requerido in (\"corpus\",\"modelo\",\"embeddings\",\"definition\",\"indice_queryable\"):\n    if requerido not in globals():\n        raise RuntimeError(\"Falta \" + requerido + \". Ejecuta en orden los pasos 1 a 6.\")\nCONSULTA = \"reparación de aviones militares\" #@param {type:\"string\"}\nTOP_K = 5 #@param [3,5,10] {type:\"raw\"}\nNUM_CANDIDATES = 100 #@param [50,100,200] {type:\"raw\"}\nSOLO_ENTIDAD_FRECUENTE = False #@param {type:\"boolean\"}\nCOMPARAR_ENN_ATLAS = False #@param {type:\"boolean\"}\nFILTRO_ENTIDAD = (str(corpus[\"entidad\"].value_counts().index[0])\n    if SOLO_ENTIDAD_FRECUENTE else \"\")\nUSAR_ENTIDAD_DEL_RESULTADO = False #@param {type:\"boolean\"}\nPOSICION_ENTIDAD = 0 #@param {type:\"integer\"}\nif USAR_ENTIDAD_DEL_RESULTADO:\n    anterior=globals().get(\"ultimo_ranking_s09\")\n    if anterior is None or anterior.empty:\n        raise ValueError(\"Ejecuta primero sin filtro para obtener un ranking propio.\")\n    if type(POSICION_ENTIDAD) is not int or not 1 \u003c= POSICION_ENTIDAD \u003c= len(anterior):\n        raise ValueError(\"Elige una posición real de tu ranking anterior (1 a N).\")\n    FILTRO_ENTIDAD=str(anterior.iloc[POSICION_ENTIDAD-1][\"entidad\"])\nTOP_K=int(TOP_K)\nNUM_CANDIDATES_SOLICITADO=int(NUM_CANDIDATES)\nNUM_CANDIDATES=max(NUM_CANDIDATES_SOLICITADO,20*TOP_K)\nprint(\"numCandidates solicitado:\",NUM_CANDIDATES_SOLICITADO,\"· efectivo:\",NUM_CANDIDATES,\n      \"· 20×k es un punto de partida, no garantía de calidad.\")\nif not CONSULTA.strip():raise ValueError(\"Escribe una consulta antes de buscar.\")\nq=modelo.encode([\"query: \"+CONSULTA.strip()],normalize_embeddings=True)[0]\nfiltro={\"lote\":LOTE}","excerptTruncated":true},{"title":"Entregar recuperación","range":"15–16","concept":"El resultado debe guardar modelo, lote, ID, fuente y consulta. TF-IDF portable no es E5.","task":"Exporta evidencia y compara una consulta alternativa. Revisa al menos cinco candidatos.","evidence":"Recuperación para multimedia.","excerpt":"#@title 8 · Comparar ANN/ENN Atlas y descargar evidencia sin credenciales\nfrom datetime import datetime, timezone\natlas_real=bool(atlas_query_ejecutada)\nids_local=set(resultados_numpy[\"id_proceso\"].astype(str))\nids_atlas=set(resultados_atlas[\"id_proceso\"].astype(str)) if atlas_real and \"id_proceso\" in resultados_atlas else set()\nids_enn=set(resultados_enn_atlas[\"id_proceso\"].astype(str)) if enn_query_ejecutada and \"id_proceso\" in resultados_enn_atlas else set()\ncoincidencia_local=round(len(ids_local & ids_atlas)/len(ids_local),3) if ids_local and atlas_real else None\ncoincidencia_enn=round(len(ids_atlas & ids_enn)/len(ids_enn),3) if ids_enn and atlas_real else None\nprint(\"MongoDB Atlas ANN ejecutado:\",atlas_real,\"· ENN ejecutado:\",bool(enn_query_ejecutada))\nprint(\"Solapamiento ANN vs ENN Atlas:\",coincidencia_enn,\n      \"· ANN vs NumPy:\",coincidencia_local)\nprint(\"Latencias son ida-vuelta de UNA solicitud, no prueba de rendimiento.\")\nevidencia={\n  \"sesion\":9,\"tipo\":\"s09_vector_db_lab\",\"timestamp_utc\":datetime.now(timezone.utc).isoformat(),\n  \"origen\":ORIGEN,\"equipo\":EQUIPO,\"lote\":LOTE,\n  \"recibidos\":recibidos,\"validos\":validos,\"indexados_en_muestra\":len(corpus),\n  \"modelo\":MODEL_NAME,\"dimensiones\":384,\"max_tokens\":MAX_TOKENS,\n  \"atlas_ping\":bool(atlas_ok),\"atlas_cargado\":bool(atlas_cargado),\n  \"index\":INDEX_NAME if atlas_ok else None,\"index_queryable\":bool(indice_queryable),\n  \"motor_ann_ejecutado\":\"MongoDB Atlas Vector Search\" if atlas_real else \"NO EJECUTADO\",\n  \"motor_enn_ejecutado\":\"MongoDB Atlas ENN\" if enn_query_ejecutada else \"NO EJECUTADO\",\n  \"respaldo\":\"NumPy exacto LOCAL (no Atlas)\",\n  \"consulta\":CONSULTA,\"top_k\":TOP_K,\n  \"numCandidates\":NUM_CANDIDATES if atlas_real else None,\n  \"filtro\":filtro,\"latencia_ann_cliente_ms\":latencia_atlas_ms,\n  \"latencia_enn_cliente_ms\":latencia_enn_ms,\n  \"solapamiento_ann_enn_atlas\":coincidencia_enn,\n  \"solapamiento_ann_numpy\":coincidencia_local,","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":30},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":50},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":13,"title":"Fusión RRF y relevancia","concept":"RRF suma 1/(c+r) por lista, con r desde uno. Un documento ausente aporta cero; no se mezclan escalas de BM25 y coseno. Dos listas cortas pueden excluir candidatos útiles. Precision divide aciertos por resultados devueltos y recall por relevantes conocidos; aquí se informa k efectivo.","pred":"¿Un segundo lugar en ambas listas puede superar al primero en una sola?","fields":[{"label":"Constante c","min":1,"max":60,"step":1,"value":10},{"label":"Profundidad por lista","min":1,"max":5,"step":1,"value":3},{"label":"Top-k","min":1,"max":5,"step":1,"value":3}],"interpret":"La tabla expone ambos rangos y contribuciones; juicios fijos B y C. Compara P/R de lexical, vectorial e híbrida. No confundir relevancia con recall de vecinos ANN.","challenge":"Encuentra un caso en el que la fusión no sea mejor que una lista individual y justifica mediante IDs.","limit":"Rankings ficticios; no genera embeddings ni ejecuta Atlas."}},{"id":"10","title":"¿Cómo representar imágenes y voz?","problem":"Compras Claras necesita un catálogo de medios sin perder la fuente original.","mission":"Catalogar multimedia","original":"s10-imagenes-audio.html","notebook":{"path":"Cuadernos/10_Imagenes_Audio.ipynb","ref":"mejora-pedagogica-integral","cells":48,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/10_Imagenes_Audio.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/10_Imagenes_Audio.ipynb"},"quiz":{"question":"¿Reducir resolución conserva siempre toda la información?","options":["Sí","No, puede eliminar detalles","Solo depende del nombre del archivo"],"feedback":["No: se pierden muestras.","Correcto: verifica el detalle necesario.","La extensión no define la señal."]},"slides":[{"id":"S10.01","title":"Los activos de un expediente","start":0,"end":3,"minutes":3,"text":"Un activo puede contener información ausente del título; el catálogo vincula original y derivados.","action":"Elegir qué derivados permitirían explorar sin sustituir original.","limit":"Necesidad y fuente; conservar créditos.","case":null,"lab":null},{"id":"S10.02","title":"RAW y procedencia","start":3,"end":5,"minutes":2,"text":"RAW conserva bytes y procedencia. SHA-256 compara archivos, no concede licencia.","action":"Comparar manifiestos y localizar dato de origen faltante.","limit":"Manifiesto; hash no autoriza uso.","case":null,"lab":null},{"id":"S10.03","title":"Píxeles y canales","start":5,"end":10,"minutes":5,"text":"Una imagen es matriz de píxeles; RGB tiene tres canales y gris normalmente uno.","action":"Modificar un píxel y comparar canales y representación.","limit":"Matriz y visualización; canal no es formato de archivo.","case":null,"lab":null},{"id":"S10.04","title":"Resolución y memoria","start":10,"end":15,"minutes":5,"text":"1000×500 píxeles RGB de ocho bits ocupan 1.500.000 bytes de matriz, sin overhead.","action":"Variar resolución y calcular tamaño de matriz.","limit":"Bytes estimados; compresión cambia archivo, no la fórmula.","case":{"at":4,"q":"Memoria de matriz RGB","input":"3 bytes por píxel","variants":[{"label":"1000×500","result":"1.500.000 bytes","why":"Multiplica dimensiones y canales"},{"label":"500×250","result":"375.000 bytes","why":"Un cuarto"}]},"lab":null},{"id":"S10.05","title":"Histogramas","start":15,"end":19,"minutes":4,"text":"El histograma cuenta intensidades sin ubicación: dos patrones diferentes pueden tener igual histograma.","action":"Comparar dos imágenes con histograma similar y disposición distinta.","limit":"Histograma y límite; no identifica objetos.","case":{"at":5,"q":"Histograma","input":"A=0,255/255,0; B=0,0/255,255","variants":[{"label":"A","result":"2 negros, 2 blancos","why":"Diagonal"},{"label":"B","result":"2 negros, 2 blancos","why":"Filas; mismo histograma"}]},"lab":null},{"id":"S10.06","title":"Redimensionamiento","start":19,"end":23,"minutes":4,"text":"Reducir resolución elimina muestras espaciales; puede perder legibilidad aunque reduzca memoria.","action":"Variar escala y observar legibilidad y tamaño.","limit":"Imagen antes/después; resolución menor puede perjudicar OCR.","case":null,"lab":null},{"id":"S10.07","title":"Formato y códec","start":23,"end":27,"minutes":4,"text":"Extensión, contenedor y códec son distintos; inspecciona flujo real antes de decodificar.","action":"Inspeccionar metadatos y comparar extensión con detección técnica.","limit":"Formato observado; no confiar en nombre.","case":null,"lab":null},{"id":"S10.08","title":"Audio como señal","start":27,"end":31,"minutes":4,"text":"Una señal digital contiene muestras de amplitud; frecuencia de muestreo no es frecuencia del tono.","action":"Cambiar sample rate en ejemplo y calcular cantidad de muestras.","limit":"Cálculo y forma de onda; no confundir frecuencia de tono y muestreo.","case":{"at":8,"q":"Cantidad de muestras","input":"5 segundos, mono","variants":[{"label":"8 kHz","result":"40.000","why":"5×8000"},{"label":"16 kHz","result":"80.000","why":"5×16000"}]},"lab":null},{"id":"S10.09","title":"RMS y amplitud","start":31,"end":35,"minutes":4,"text":"RMS mide raíz de media de cuadrados: una onda con media cero puede tener RMS alto.","action":"Calcular RMS de señales con distintos signos y escalas.","limit":"RMS calculado; no equivale a sonoridad percibida exacta.","case":{"at":9,"q":"RMS","input":"Cuatro muestras normalizadas","variants":[{"label":"−1,1,−1,1","result":"1","why":"Media de cuadrados 1"},{"label":"−0,5;0,5;−0,5;0,5","result":"0,5","why":"Media de cuadrados 0,25"}]},"lab":null},{"id":"S10.10","title":"FFT y espectro","start":35,"end":40,"minutes":5,"text":"FFT representa componentes de frecuencia de una ventana de señal.","action":"Variar frecuencia de un tono y observar pico espectral.","limit":"Picos en Hz; resolución depende de ventana.","case":null,"lab":null},{"id":"S10.11","title":"Espectrograma","start":40,"end":45,"minutes":5,"text":"Espectrograma calcula espectros por ventanas; hay compromiso entre resolución temporal y frecuencial.","action":"Variar tamaño de ventana y observar resolución tiempo-frecuencia.","limit":"Espectrograma; no identificar hablante.","case":null,"lab":null},{"id":"S10.12","title":"Centroide y MFCC","start":45,"end":50,"minutes":5,"text":"Centroide resume balance espectral; MFCC caracteriza envolvente; ninguno transcribe palabras.","action":"Comparar dos señales con características distintas y observar variación.","limit":"Features y dimensión; no son transcripciones.","case":null,"lab":null},{"id":"S10.13","title":"ETL de multimedia","start":50,"end":55,"minutes":5,"text":"ETL extrae, transforma y carga; cada derivado conserva vínculo y parámetros.","action":"Ordenar etapas y detectar qué se repite tras fallo.","limit":"Flujo y contratos; no sobrescribir RAW.","case":null,"lab":null},{"id":"S10.14","title":"Parquet y JSONL","start":55,"end":60,"minutes":5,"text":"JSONL guarda un objeto por línea; Parquet organiza columnas y tipos para lectura selectiva.","action":"Comparar esquema y forma de lectura de muestras pequeñas.","limit":"Tamaños y conteos; no declarar compresión universal.","case":null,"lab":null},{"id":"S10.15","title":"Threads y rendimiento","start":60,"end":65,"minutes":5,"text":"Threads pueden solapar I/O; velocidad depende de tarea, bibliotecas y recursos, no solo número.","action":"Variar workers en una muestra de descargas o transformaciones autorizadas.","limit":"Tiempo y throughput medidos; no extrapolar hash a ASR.","case":null,"lab":null},{"id":"S10.16","title":"Cuaderno: preparar activos","start":75,"end":84,"minutes":9,"text":"Carga manifiesto, verifica existencia, hash y créditos antes de transformar.","action":"Ejecutar sobre selección segura y registrar faltantes.","limit":"Conteo y procedencia; no usar archivos sin autorización.","case":null,"lab":{"index":1,"heading":"1 · Colab desde cero: instrucciones para un estudiante independiente","status":"sección temática identificada","gap":null}},{"id":"S10.17","title":"Cuaderno: transformar imagen","start":84,"end":93,"minutes":9,"text":"Inspecciona matriz, cambia tamaño en copia y compara legibilidad y bytes.","action":"Cambiar resolución en copia y medir bytes y legibilidad.","limit":"Derivado y métricas; conservar original.","case":null,"lab":{"index":5,"heading":"3 · Imagen: de una matriz a preguntas observables","status":"sección temática identificada","gap":null}},{"id":"S10.18","title":"Cuaderno: transformar audio","start":93,"end":101,"minutes":8,"text":"Decodifica audio y registra frecuencia, canales y duración; preserva cobertura al resamplear.","action":"Ejecutar audio corto y activo largo por segmentos cuando corresponda.","limit":"Duración y parámetros; no truncar silenciosamente.","case":null,"lab":{"index":14,"heading":"5 · Escuchar, dibujar y medir (y saber lo que significa)","status":"sección temática identificada","gap":null}},{"id":"S10.19","title":"Cuaderno: características","start":101,"end":109,"minutes":8,"text":"Calcula RMS, espectro y features con ventanas declaradas y unidades correctas.","action":"Cambiar ventana y comparar métricas.","limit":"Tabla de features; distinguir unidades y dimensiones.","case":null,"lab":{"index":24,"heading":"7B · ¿Qué dicen las señales de diez personas?","status":"sección temática identificada","gap":null}},{"id":"S10.20","title":"Cuaderno: medir transformación","start":109,"end":117,"minutes":8,"text":"Mide misma transformación con mismos activos; registra tiempo y fallos.","action":"Comparar tiempo, errores y cantidad procesada dentro de cuota.","limit":"Throughput real de tarea medida; no atribuir a otra.","case":null,"lab":{"index":37,"heading":"10 · ¿Dónde aparece Big Data?","status":"sección temática identificada","gap":null}},{"id":"S10.21","title":"Cuaderno: catálogo y relectura","start":117,"end":125,"minutes":8,"text":"Exporta catálogo y verifica vínculo entre cada derivado y su original.","action":"Reabrir y verificar vínculo RAW-derivado.","limit":"Catálogo válido y créditos.","case":null,"lab":{"index":44,"heading":"13 · Conserva tus evidencias antes de cerrar Colab","status":"sección temática identificada","gap":null}},{"id":"S10.22","title":"Reto de señal","start":125,"end":130,"minutes":5,"text":"Elige resolución o ventana según el objetivo y reconoce la pérdida de información.","action":"Modificar parámetro y comparar salida propia con original.","limit":"Derivado, métrica y decisión; no evaluar por estética.","case":null,"lab":null},{"id":"S10.23","title":"Interpretación del catálogo","start":130,"end":135,"minutes":5,"text":"La señal describe propiedades físicas; leer texto exige OCR y transcribir voz exige ASR.","action":"Elegir qué características ayudan a detectar un problema técnico.","limit":"Límite y criterio; no afirmar contenido semántico.","case":null,"lab":null},{"id":"S10.24","title":"Relevo OCR y ASR","start":135,"end":140,"minutes":5,"text":"S11 recibe activos identificados, pero su preparación base debe poder ejecutarse de forma autónoma.","action":"Exportar lista de trabajo y manifiesto de entrada S11.","limit":"Entrada trazable con cobertura.","case":null,"lab":null},{"id":"S10.25","title":"Cierre multimedia","start":140,"end":150,"minutes":10,"text":"El catálogo se acepta si derivados, métricas y fuentes son releíbles y trazables.","action":"Resolver controles de píxeles, muestreo, formato y ETL con resultados propios.","limit":"Catálogo y métricas; errores quedan identificados.","case":null,"lab":null}],"control":{"at":4,"title":"Memoria de imagen","label":"Ancho (píxeles), alto fijo 500","min":100,"max":2000,"step":100,"initial":1000},"blocks":[{"title":"Representación de imágenes","range":"3–11","concept":"RGB8 usa tres bytes por píxel sin compresión; reducir resolución pierde detalle espacial.","task":"Cambia perfil 160/320 y observa histograma.","evidence":"Dimensiones y bytes.","excerpt":"# T — un solo parámetro: 160 o 320. El RAW permanece intacto.\nLADO=320 #@param [160,320] {type:\"raw\"}\nif type(LADO) is not int or LADO not in (160,320): raise ValueError('Elige 160 o 320')\nhash_antes=sha256(imagen_original)\nderivada=DER/f'documento_{LADO}.png'\nwith Image.open(imagen_original) as im:\n    copia=im.copy();copia.thumbnail((LADO,LADO),Image.Resampling.LANCZOS);copia.save(derivada)\nassert sha256(imagen_original)==hash_antes\nwith Image.open(derivada) as im:\n    print('T · TAMAÑO:',im.size,'· bytes:',derivada.stat().st_size,'· RAW conservado:',True)\n    display(im)","excerptTruncated":false},{"title":"Representación de audio","range":"12–18","concept":"Muestreo mide muestras/s; RMS energía, FFT frecuencias, espectrograma evolución temporal.","task":"Escucha señal y cambia ventana.","evidence":"Características y límite.","excerpt":"# T — características acústicas por ventana; el audio WAV no se sobrescribe.\nVENTANA_SEG=0.2 #@param [0.2,1.3,2.2] {type:\"raw\"}\nif float(VENTANA_SEG) not in (.2,1.3,2.2):raise ValueError('Elige una ventana propuesta')\ndef audio_ventana(x,sample_rate,segundos,ancho=.25):\n    inicio=int(segundos*sample_rate);n=int(ancho*sample_rate)\n    ventana=np.asarray(x[inicio:inicio+n],dtype=np.float64)\n    if len(ventana)!=n:raise ValueError('Ventana fuera de la señal')\n    rms=float(np.sqrt(np.mean(ventana**2)))\n    magnitud=np.abs(np.fft.rfft(ventana*np.hanning(len(ventana))))\n    frecuencias=np.fft.rfftfreq(len(ventana),d=1/sample_rate)\n    pico=float(frecuencias[np.argmax(magnitud[1:])+1]) if len(magnitud)>1 else 0.\n    return {'start_seconds':segundos,'duration_seconds':ancho,'rms':round(rms,5),\n            'peak_frequency_hz':round(pico,1),'peak_amplitude':round(float(np.max(np.abs(ventana))),4),\n            'signal':ventana,'frequencies':frecuencias,'magnitudes':magnitud}\nactual=audio_ventana(senal,SR,float(VENTANA_SEG))\nprint('VENTANA:',{k:v for k,v in actual.items() if k not in ('signal','frequencies','magnitudes')})\nplt.figure(figsize=(9,2.5));plt.plot(np.arange(len(senal))/SR,senal,lw=.7);plt.xlabel('Segundos');plt.ylabel('Amplitud relativa');plt.title('Señal original: tonos y silencio');plt.show()\nplt.figure(figsize=(9,2.5));plt.plot(actual['frequencies'],actual['magnitudes']);plt.xlim(0,1000);plt.xlabel('Hz');plt.ylabel('Magnitud relativa');plt.title('Espectro de TU ventana');plt.show()","excerptTruncated":false},{"title":"Voces reales y fuentes","range":"20–29","concept":"ASR extrae texto; señales no son transcripciones. Fuente y crédito se conservan.","task":"Obtén diez voces según cuaderno y compara dos.","evidence":"Inventario y características.","excerpt":"#@title 7B · Extraer características y escuchar una voz del corpus\ndef leer_wav_pcm16(ruta):\n    with wave.open(str(ruta),'rb') as f:\n        tasa=f.getframerate();canales=f.getnchannels();n=f.getnframes()\n        if f.getcomptype()!='NONE' or f.getsampwidth()!=2 or not 1\u003c=canales\u003c=2:\n            raise ValueError('Se espera WAV PCM de 16 bits mono o estéreo')\n        muestras=np.frombuffer(f.readframes(n),dtype='\u003ci2').astype(np.float32)/32768\n    if canales>1:muestras=muestras.reshape(-1,canales).mean(axis=1)\n    return muestras,tasa\ndef caracteristicas_voz(ruta):\n    muestras,tasa=leer_wav_pcm16(ruta)\n    if muestras.size\u003c1024:raise ValueError('Archivo con muy pocas muestras')\n    rms=float(np.sqrt(np.mean(muestras.astype(np.float64)**2)))\n    cruces=float(np.mean(np.signbit(muestras[1:])!=np.signbit(muestras[:-1])))\n    # Primeros 0,5 segundos; Hanning + FFT para el mismo contrato en todas las voces.\n    ventana=muestras[:min(len(muestras),int(tasa*.5))]\n    amplitudes=np.abs(np.fft.rfft(ventana*np.hanning(len(ventana))))\n    hz=np.fft.rfftfreq(len(ventana),d=1/tasa)\n    centroide=float(np.sum(hz*amplitudes)/max(1e-12,float(amplitudes.sum())))\n    return {'duration_seconds':round(len(muestras)/tasa,3),'sample_rate_hz':int(tasa),\n            'rms':round(rms,5),'zero_crossing_rate':round(cruces,5),\n            'spectral_centroid_hz':round(centroide,1),'stored_bytes':int(Path(ruta).stat().st_size)}\nfor item in audios_reales:\n    item.update(caracteristicas_voz(RAIZ/item['path']))\ntabla_voz=pd.DataFrame(audios_reales)\nassert len(tabla_voz)==10 and tabla_voz.sha256.nunique()==10\nprint('ANÁLISIS ACÚSTICO REAL:',len(tabla_voz),'grabaciones · licencia:',LICENCIA_VOZ)\ndisplay(tabla_voz[['source_record_id','intent_class','duration_seconds','rms','zero_crossing_rate','spectral_centroid_hz']])","excerptTruncated":true},{"title":"ETL multimodal","range":"30–38","concept":"RAW permanece; derivados conservan identidad y SHA. JSONL permite registros sucesivos; Parquet almacena por columnas.","task":"Construye catálogo y vuelve a leerlo; compara modalidad.","evidence":"Catálogo verificable.","excerpt":"# L — esquema común; dos perfiles de imagen y un audio original del curso.\nARTICULO_DEMO=None # Un ejemplo generado NO tiene article_id editorial\nrows=[]\nfor lado in (160,320):\n    ruta=DER/f'documento_{lado}.png';features=imagen_caracteristicas(ruta)\n    rows.append({'article_id':ARTICULO_DEMO,'modality':'image','source_kind':'generated_for_course',\n       'asset_id':sha256(imagen_original),'original_path':str(imagen_original.relative_to(RAIZ)),\n       'derived_path':str(ruta.relative_to(RAIZ)),'sha256':sha256(ruta),\n       'profile':f'vista{lado}','feature_version':'s10-v1',\n       'metric_name':'mean_luminance','metric_value':features['mean_luminance'],\n       'width':features['width'],'height':features['height'],'duration_seconds':None,'sample_rate_hz':None})\nrows.append({'article_id':ARTICULO_DEMO,'modality':'audio','source_kind':'generated_for_course',\n   'asset_id':sha256(audio_original),'original_path':str(audio_original.relative_to(RAIZ)),\n   'derived_path':str(audio_original.relative_to(RAIZ)),'sha256':sha256(audio_original),\n   'profile':'original_pcm16','feature_version':'s10-v1',\n   'metric_name':'global_rms','metric_value':round(float(np.sqrt(np.mean(senal**2))),5),\n   'width':None,'height':None,'duration_seconds':len(senal)/SR,'sample_rate_hz':SR})\n# Integración de los DIEZ WAV reales de voz humana: sin falsa pertenencia a noticias.\nfor item in audios_reales:\n    rows.append({'article_id':None,'source_record_id':item['source_record_id'],\n       'collection_id':'PolyAI/minds14-es-ES','modality':'audio',\n       'source_kind':'recorded_human_speech_cc_by_4_0','license':item['license'],\n       'asset_id':item['source_original_sha256'],'original_path':item['source_original_path'],\n       'source_codec':item['source_codec'],'source_original_sha256':item['source_original_sha256'],\n       'derived_path':item['path'],'sha256':item['sha256'],\n       'profile':'voz_real_pcm16','feature_version':'s10-v1',\n       'metric_name':'rms','metric_value':item['rms'],\n       'width':None,'height':None,'duration_seconds':item['duration_seconds'],","excerptTruncated":true},{"title":"Entregar activos","range":"39–47","concept":"Repetibilidad exige fuente y parámetros; estimación de volumen no es benchmark.","task":"Exporta manifiesto y elige perfil.","evidence":"Catálogo S11.","excerpt":"#@title 12 · Comprobar el trabajo realizado y diagnosticar pendientes\nfrom collections import OrderedDict\ncontroles=OrderedDict()\ncontroles['01 · Biblioteca y carpeta listas']=RAIZ.is_dir() and RAW.is_dir() and OUT.is_dir()\ncontroles['02 · Imagen de origen y dos tamaños']=all((RAIZ/p).is_file() for p in [\n    'raw/documento_demo.png','derived/documento_160.png','derived/documento_320.png'])\ncontroles['03 · Señal de ejemplo']= (RAW/'senal_demo.wav').is_file()\ncontroles['04 · Diez grabaciones reales y diez PCM16']=len(audios_reales)==10 and len({\n    x['source_record_id'] for x in audios_reales})==10 and all(\n    (RAIZ/x['path']).is_file() and (RAIZ/x['source_original_path']).is_file()\n    and sha256(RAIZ/x['path'])==x['sha256']\n    and sha256(RAIZ/x['source_original_path'])==x['source_original_sha256']\n    for x in audios_reales)\ncontroles['05 · Metadatos y voces con procedencia']=all(\n    x.get('transcription_reference') and x.get('license')=='CC-BY-4.0'\n    and x.get('sample_rate_hz') and x.get('duration_seconds')>0 for x in audios_reales)\ncontroles['06 · Inventario anterior sin falsas uniones']=len(imagenes_existentes)==32 and len(\n    articulos_imagenes)==24 and registro_fuentes['cross_dataset_article_matches']==0\ncontroles['07 · Catálogo 2 imágenes + 11 audios']=len(reabierto)==13 and (\n    reabierto.groupby('modality').size().to_dict()=={'audio':11,'image':2})\ncontroles['08 · Manifiesto y huellas']=comprobar(RAIZ)['ok']\ncontroles['09 · Decisión propia completada']=decision.get('complete',False)\nfor titulo,ok in controles.items():\n    print(('✓ ' if ok else '✗ ')+titulo+(': OK' if ok else ': PENDIENTE'))\nautocomprobacion_lista=all(controles.values())\nprint('AUTOCOMPROBACIÓN:', 'LISTO' if autocomprobacion_lista else 'INCOMPLETO',\n      f'({sum(controles.values())}/{len(controles)})')\nif not autocomprobacion_lista:","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":30},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":50},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":9,"title":"Onda, RMS y frecuencia observada","concept":"Generamos un segundo de senoide. RMS es raíz de media de cuadrados; para ciclos completos y muestreo suficiente se aproxima a A/√2. El muestreo fija Nyquist en fs/2; por encima aparece aliasing. En Nyquist una senoide de fase cero puede muestrearse como cero. Un espectro describe señal, no palabras.","pred":"Predice el RMS de amplitud uno y qué frecuencia se observará si f=90 y fs=120.","fields":[{"label":"Amplitud ×100","min":10,"max":100,"step":10,"value":100},{"label":"Tono (Hz)","min":10,"max":100,"step":10,"value":40},{"label":"Muestreo (Hz)","min":80,"max":320,"step":40,"value":160}],"interpret":"Se generan muestras y se calcula RMS y el pico de la transformada discreta de Fourier mediante proyecciones. Compara frecuencia real y observada.","challenge":"Encuentra dos frecuencias que produzcan el mismo alias; comprueba después metadatos y espectro de audio real.","limit":"Senoide sintética; DFT directa, no FFT ni ASR."}},{"id":"11","title":"¿Cómo recuperar evidencia multimedia?","problem":"Contratos, fotos y voces deben ser consultables sin confundir extracción con verdad.","mission":"Leer y escuchar","original":"s11-videoclase-ocr-asr-embeddings.html","notebook":{"path":"01_laboratorio.ipynb","ref":"s11-estudiantes","cells":73,"url":"https://github.com/jazaineam1/BigData2026/blob/s11-estudiantes/01_laboratorio.ipynb","launch":"https://codespaces.new/jazaineam1/BigData2026/tree/s11-estudiantes"},"quiz":{"question":"¿Qué debes conservar para comprobar un OCR?","options":["Solo texto predicho","Original, texto y configuración","Solo confianza interna"],"feedback":["No permite cotejar el dato.","Correcto: preserva evidencia.","La confianza no sustituye comparación visual."]},"slides":[{"id":"S11.01","title":"Investigar contenido inaccesible","start":0,"end":3,"minutes":3,"text":"OCR y ASR generan texto estimado a partir de señales; una evidencia necesita página o intervalo original.","action":"Elegir qué evidencia debe aparecer con página o intervalo.","limit":"Objetivo de recuperación; sin video.","case":null,"lab":null},{"id":"S11.02","title":"Entrada autónoma","start":3,"end":5,"minutes":2,"text":"Un bundle autónomo reúne archivos y manifiestos para comenzar sin ejecutar S10.","action":"Verificar identificadores, créditos, hashes y disponibilidad en muestra.","limit":"Inventario; no depender del estado previo.","case":null,"lab":null},{"id":"S11.03","title":"OCR desde cero","start":5,"end":9,"minutes":4,"text":"OCR detecta regiones y reconoce caracteres; su confianza interna no equivale a exactitud observada.","action":"Comparar recorte de documento y texto esperado en caso manual.","limit":"Caracteres y región; OCR no entiende el contrato.","case":null,"lab":null},{"id":"S11.04","title":"Preprocesamiento OCR","start":9,"end":13,"minutes":4,"text":"Umbral, escala, rotación y ruido afectan segmentación; compara siempre con la imagen original.","action":"Variar umbral y comparar imagen y extracción.","limit":"Dos versiones; binarizar no siempre mejora.","case":null,"lab":null},{"id":"S11.05","title":"PSM y estructura","start":13,"end":17,"minutes":4,"text":"PSM define supuestos de disposición: columna, bloque, palabra o texto disperso.","action":"Elegir PSM en imagen de formato conocido y comparar salida.","limit":"Texto y modo; no aplicar un PSM universal.","case":null,"lab":null},{"id":"S11.06","title":"Errores OCR y CER","start":17,"end":21,"minutes":4,"text":"CER es distancia de edición dividida por caracteres de referencia.","action":"Calcular sustitución, inserción y borrado en ejemplo pequeño.","limit":"CER con denominador; confianza del motor no sustituye referencia.","case":{"at":6,"q":"CER","input":"Referencia de 10 caracteres","variants":[{"label":"1 sustitución","result":"10%","why":"1/10"},{"label":"2 sustituciones y 1 inserción","result":"30%","why":"3/10"}]},"lab":null},{"id":"S11.07","title":"PDF y páginas","start":21,"end":24,"minutes":3,"text":"PDF puede tener texto nativo o imagen escaneada; inspecciona y guarda el número de página.","action":"Inspeccionar archivo autorizado y decidir ruta OCR o texto nativo.","limit":"Página, método y origen; no mezclar páginas sin vínculo.","case":null,"lab":null},{"id":"S11.08","title":"ASR desde cero","start":24,"end":27,"minutes":3,"text":"ASR convierte voz en texto y, según modelo, segmentos temporales; no identifica hechos verdaderos automáticamente.","action":"Comparar referencia y transcripción breve identificada.","limit":"Texto y segmento; no inferir identidad del hablante.","case":null,"lab":null},{"id":"S11.09","title":"Nombre, contenedor y códec","start":27,"end":30,"minutes":3,"text":"El nombre WAV no garantiza PCM; inspecciona contenedor, códec, duración y señal.","action":"Comparar extensión WAV y códec detectado; calcular duración.","limit":"Metadata y prueba; no asumir extensión correcta.","case":null,"lab":null},{"id":"S11.10","title":"Segmentación de audio","start":30,"end":35,"minutes":5,"text":"Segmentar audio exige conservar offsets globales; 56+3 segundos equivale a inicio global 59 s.","action":"Variar tamaño de bloque y detectar cortes o duplicados.","limit":"Cobertura temporal; no perder últimos segundos.","case":{"at":10,"q":"Offset temporal","input":"Segmento local 3–7 s","variants":[{"label":"Ventana empieza 0","result":"3–7 s","why":"Sumar 0"},{"label":"Ventana empieza 56","result":"59–63 s","why":"Sumar 56"}]},"lab":null},{"id":"S11.11","title":"WER y referencia","start":35,"end":39,"minutes":4,"text":"WER divide sustituciones, inserciones y omisiones por palabras de referencia; puede superar uno.","action":"Calcular WER sobre dos transcripciones y referencia fija.","limit":"Métrica y convención; WER puede superar uno.","case":{"at":11,"q":"WER","input":"Referencia de 20 palabras","variants":[{"label":"2 sustituciones,1 omisión","result":"15%","why":"3/20"},{"label":"3 inserciones,2 omisiones,1 sustitución","result":"30%","why":"6/20"}]},"lab":null},{"id":"S11.12","title":"Modelo y costo","start":39,"end":43,"minutes":4,"text":"La inferencia tiene costos de carga, tiempo, memoria y descarga de modelos; no extrapoles sin medir.","action":"Comparar presupuesto de muestra corta y larga con medición disponible.","limit":"Plan seguro; no inventar velocidad.","case":null,"lab":null},{"id":"S11.13","title":"Embeddings de fuentes mixtas","start":43,"end":47,"minutes":4,"text":"OCR y ASR textuales pueden compartir modelo textual compatible; un vector visual requiere modelo apropiado.","action":"Seleccionar representación por modalidad y modelo compatible.","limit":"Contrato de vectores; texto de imagen no equivale a vector visual.","case":{"at":13,"q":"Contrato vectorial","input":"Modelo M,384 dimensiones","variants":[{"label":"M,384","result":"Candidato compatible","why":"Verifica configuración"},{"label":"N,384","result":"No asumir compatible","why":"Espacio diferente"},{"label":"M,768","result":"Incompatible","why":"Dimensión diferente"}]},"lab":null},{"id":"S11.14","title":"Indexación y consulta","start":47,"end":51,"minutes":4,"text":"Un hit debe incluir identidad, modalidad, página o intervalo, fuente y modelo.","action":"Filtrar por modalidad y comparar resultado global y restringido.","limit":"Hit trazable; no devolver solo un texto sin origen.","case":null,"lab":null},{"id":"S11.15","title":"Concurrencia y fallos","start":51,"end":55,"minutes":4,"text":"Registra éxito y error por activo; concurrencia no justifica omitir fallos.","action":"Variar workers en lote pequeño y comprobar cobertura y fallos.","limit":"Estado por activo; no ocultar errores.","case":null,"lab":null},{"id":"S11.16","title":"Cuaderno: Codespace limpio","start":65,"end":75,"minutes":10,"text":"Comprueba Tesseract, decodificador y modelo en Codespaces; referencia no es ejecución.","action":"Ejecutar preflight real sin comandos ambiguos ni regresar a S10.","limit":"Estado de herramientas; fallback claramente marcado.","case":null,"lab":{"index":1,"heading":"1 · Entorno y archivos (0–6 min)","status":"sección temática identificada","gap":null}},{"id":"S11.17","title":"Cuaderno: OCR de imagen/PDF","start":75,"end":85,"minutes":10,"text":"Cambia PSM o preprocesamiento y contrasta texto con evidencia visual.","action":"Cambiar PSM o preprocesamiento y medir CER donde hay referencia.","limit":"OCR propio y página; no sustituir por cache sin aviso.","case":null,"lab":{"index":6,"heading":"2 · OCR documental real: un acta de inicio SECOP (6–18 min)","status":"sección temática identificada","gap":null}},{"id":"S11.18","title":"Cuaderno: embeddings de texto","start":85,"end":95,"minutes":10,"text":"En la sección 4, genera el vector de texto y observa su dimensión; distingue el modelo textual de uno visual.","action":"Ejecuta la búsqueda con una consulta nueva.","limit":"No se acredita representación visual nativa por vectorizar OCR.","case":null,"lab":{"index":22,"heading":"4 · Búsqueda por significado con EmbeddingGemma 2 (25–35 min)","status":"sección temática identificada","gap":null}},{"id":"S11.19","title":"Cuaderno: ASR y cobertura","start":95,"end":105,"minutes":10,"text":"En la sección 5, inspecciona señal y transcripción; para audios largos verifica intervalos y cobertura.","action":"Compara transcripción y fuente.","limit":"Una salida corta no demuestra cobertura del audio completo.","case":null,"lab":{"index":28,"heading":"5 · Transcribir voz REAL con Faster-Whisper (35–44 min)","status":"ampliación pendiente","gap":"Verificar audio largo y cobertura global; el encabezado no lo garantiza."}},{"id":"S11.20","title":"Cuaderno: catálogo y auditoría","start":105,"end":115,"minutes":10,"text":"Audita identidades, estados y fuentes antes de indexar.","action":"Abre el catálogo y reconcilia conteos.","limit":"Un estado pendiente no es una extracción exitosa.","case":null,"lab":{"index":60,"heading":"8 · ":"1–12","concept":"OCR convierte píxeles en texto; PSM cambia segmentación. Salida debe contrastarse con imagen.","task":"Abre acta y compara PSM; encuentra campo y fragmento.","evidence":"Texto y fuente visual.","excerpt":"# Variamos solo el PSM; el documento y el idioma siguen siendo iguales.\nmodos = [3, 6, 11]\nfor psm in modos:\n    texto_psm = pytesseract.image_to_string(\n        pagina, lang=\"spa\", config=f\"--psm {psm}\")\n    lineas_utiles = [linea.strip()[:140] for linea in texto_psm.splitlines()\n                     if any(x in linea.upper() for x in\n                            (\"VALOR DEL CONTRATO\", \"FORMA DE PAGO\", \"DURACI\"))]\n    print(f\"PSM {psm}: {len(texto_psm)} caracteres · {len(lineas_utiles)} líneas candidatas\")\n    print(lineas_utiles[:3] or [\"No se recuperó ninguna etiqueta buscada\"])\n\n# Referencia OBSERVADA EN LA FUENTE, no predicción de OCR:\nvalor_visual = 14_760_000\ncuotas_visual = 6\npago_visual = 2_460_000\nprint(\"¿Coincide el producto?\", cuotas_visual * pago_visual == valor_visual)","excerptTruncated":false},{"title":"OCR fotográfico","range":"13–21","concept":"Ampliar no crea información ausente; contraste puede mejorar lectura. Confianza interna no es exactitud.","task":"Prueba VALLE con recorte y ampliación.","evidence":"Resultado y límite.","excerpt":"from PIL import ImageOps, ImageFilter\n\nFACTOR = 2             # EDITA AQUÍ: probar 1, 2 o 3\nUSAR_CONTRASTE = False # EDITA AQUÍ: probar después True\nPSM_RECORTADO = 7      # Una sola línea\n\nregion_procesada = region_valle.resize(\n    (region_valle.width*FACTOR, region_valle.height*FACTOR),\n    Image.Resampling.LANCZOS\n)\nif USAR_CONTRASTE:\n    region_procesada = ImageOps.autocontrast(\n        ImageOps.grayscale(region_procesada))\n    region_procesada = region_procesada.filter(\n        ImageFilter.UnsharpMask(radius=1, percent=130, threshold=2))\ndisplay(region_procesada)\n\nsalida_real = pytesseract.image_to_string(\n    region_procesada, lang=\"spa\", config=f\"--psm {PSM_RECORTADO}\"\n).strip()\nprint(\"OCR real:\", salida_real or \"(no detectó texto)\")\nprint(\"Referencia humana: VALLE (no es predicción OCR)\")","excerptTruncated":false},{"title":"Embeddings y voz real","range":"22–36","concept":"Embedding recupera similitud; ASR transcribe. WER=(S+D+I)/N; puede superar 100%.","task":"Ejecuta imagen y consulta, transcribe voz y calcula WER.","evidence":"Vectores, texto y error.","excerpt":"from faster_whisper import WhisperModel\n\nmodelo_voz = WhisperModel(\"tiny\", device=\"cpu\", compute_type=\"int8\",\n                          cpu_threads=2)\nsegmentos, info = modelo_voz.transcribe(str(wav), language=\"es\", beam_size=2)\nsegmentos = list(segmentos)\nhipotesis = \" \".join(s.text.strip() for s in segmentos)\nprint(\"Predicción Whisper:\", hipotesis)\nprint(\"Referencia humana:\", referencia)\nfor s in segmentos:\n    print(round(s.start, 1), \"→\", round(s.end, 1), s.text)","excerptTruncated":false},{"title":"ETL a escala","range":"37–62","concept":"RAW, JSONL y Parquet deben preservar fuente, modalidades y huellas; comenzar por muestra y ampliar según cuota.","task":"Ejecuta ETL guiado; amplía 8→62 fotos solo si recursos permiten.","evidence":"Catálogo y auditoría.","excerpt":"# Un esquema uniforme permite cotejar JSONL y Parquet campo por campo.\n# Las vistas PNG y PCM16 son DERIVADOS de una fuente, no nuevas fuentes.\ninfo = json.loads((BASE / \"datos/manifiestos/fotos_catalogadas_32.json\")\n                  .read_text(encoding=\"utf-8\"))\nfichas = {Path(x[\"input_path\"]).name: x for x in info[\"registros\"]}\ncolumnas = [\"ruta\", \"tipo\", \"sha256\", \"vista\", \"sha_vista\",\n            \"credito\", \"url_fuente\", \"observacion\"]\ncatalogo = []\n\nfor foto in TODAS_FOTOS:\n    meta = fichas.get(foto.name, {})\n    catalogo.append({\n        \"ruta\": str(foto.relative_to(BASE)), \"tipo\": \"foto\",\n        \"sha256\": sha256(foto), \"vista\": \"\", \"sha_vista\": \"\",\n        \"credito\": meta.get(\"credit\") or \"pendiente de verificar\",\n        \"url_fuente\": meta.get(\"source_url\") or \"\",\n        \"observacion\": \"sin atribuir licencias no verificadas\"\n    })\n\nfor pdf in ACTAS_PDF:\n    pagina_png = PAGINAS / (pdf.stem + \"_pagina1.png\")\n    if not pagina_png.is_file():\n        raise FileNotFoundError(f\"Falta el PNG derivado de {pdf.name}\")\n    catalogo.append({\n        \"ruta\": str(pdf.relative_to(BASE)), \"tipo\": \"acta\",\n        \"sha256\": sha256(pdf),\n        \"vista\": str(pagina_png.relative_to(BASE)),\n        \"sha_vista\": sha256(pagina_png),","excerptTruncated":true},{"title":"Recuperación unificada","range":"63–72","concept":"Una consulta devuelve evidencia, no una respuesta inventada. Referencia humana se distingue de ASR.","task":"Prepara, indexa opt-in y recupera modalidades; adjunta extracción.","evidence":"Buscador multimedia y procedencia.","excerpt":"# CUARTO PASO: una pregunta consulta las 3 modalidades y devuelve evidencia completa.\nfrom buscador_multimodal import buscar, presentar\nPREGUNTA_MULTIMODAL = \"valor del contrato y forma de pago\"  # EDITA: viviendas / voz / lotería\nCONSULTAR_MODELO = False  # EDITA AQUÍ: True después de crear el índice\nMOSTRAR_TEXTO_COMPLETO = True\n\nif CONSULTAR_MODELO and indice_mm is not None:\n    resultados_mm = buscar(PREGUNTA_MULTIMODAL, registros_mm, indice_mm, k=5)\n    presentar(resultados_mm, completo=MOSTRAR_TEXTO_COMPLETO)\nelse:\n    print(\"Primero crea el índice; luego activa CONSULTAR_MODELO=True.\")\n    print(\"Consultas para probar: «viviendas en una ladera», «valor del contrato»,\")\n    print(\"«lotería VALLE» y una frase de la referencia humana del audio.\")","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":60},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":10,"title":"Segmentación temporal sin pérdida","concept":"Procesar un audio por ventanas exige conservar inicio y fin global. Si una ventana comienza en t, un tiempo local u se convierte en t+u. Salto menor que ventana genera solape; mayor genera huecos. Cobertura es unión de intervalos, no suma de duraciones repetidas. No truncar a 60 s y afirmar audio completo.","pred":"Predice qué pasa con ventanas de 20 s y saltos de 15 y 25 s.","fields":[{"label":"Ventana (s)","min":5,"max":40,"step":5,"value":20},{"label":"Salto (s)","min":5,"max":40,"step":5,"value":15},{"label":"Audio (s)","min":30,"max":150,"step":1,"value":73}],"interpret":"Se calcula cobertura por segundo y duplicación adicional. El último intervalo se recorta al final real. Solapes requieren consolidar texto y tiempos, no eliminar arbitrariamente.","challenge":"Cubre todo el audio con ventanas de máximo 30 s; verifica el caso real largo conservando offsets y fuente.","limit":"Simulación temporal; no ejecución Whisper ni CER/WER."}},{"id":"12","title":"TC2 · Investigador multimodal","problem":"Integrar búsquedas y medios en un expediente verificable.","mission":"Segunda entrega","original":"../assets/tutoriales/tc2-paso-a-paso.html","notebook":{"path":"Cuadernos/Taller_Control_2.ipynb","ref":"mejora-pedagogica-integral","cells":111,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Taller_Control_2.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Taller_Control_2.ipynb"},"quiz":{"question":"¿Un OCR con error puede ser evidencia válida?","options":["No, siempre debe ser perfecto","Sí, si se ejecuta, conserva y mide el error","Sí, si copiamos la referencia"],"feedback":["Una métrica alta no es la única evidencia.","Correcto: verifica la salida auténtica.","La referencia no es la predicción."]},"slides":[{"id":"S12.01","title":"Alcance del segundo taller" ":13,"end":17,"minutes":4,"text":"Map produce parciales, shuffle reúne claves y reduce combina; suma y conteo son combinables.","action":"Calcular conteos por entidad a mano por particiones.","limit":"Intermedios y agregado global; no promediar medias sin pesos.","case":{"at":5,"q":"Reduce","input":"A=[10,20]; B=[30,40,50,60]","variants":[{"label":"Suma/conteo","result":"35","why":"210/6"},{"label":"Promedio de medias","result":"30 (incorrecto)","why":"(15+45)/2"}]},"lab":null},{"id":"S13.06","title":"Amdahl y speedup","start":17,"end":21,"minutes":4,"text":"Amdahl: speedup ideal 1/(s+(1−s)/p). Una fracción serial del 20% limita a cinco.","action":"Variar fracción serial y trabajadores; contrastar límite de aceleración.","limit":"Curva teórica; no prometer tiempo medido.","case":{"at":6,"q":"Amdahl","input":"20% serial","variants":[{"label":"2 workers","result":"1,667×","why":"1/(0,2+0,8/2)"},{"label":"4 workers","result":"2,5×","why":"1/(0,2+0,8/4)"},{"label":"16 workers","result":"4×","why":"1/(0,2+0,8/16)"}]},"lab":null},{"id":"S13.07","title":"Procesos, threads y workers","start":21,"end":24,"minutes":3,"text":"Procesos tienen espacios de memoria; threads comparten proceso; workers pueden tener varios hilos.","action":"Variar trabajadores e hilos manteniendo CPU disponible fija.","limit":"Configuración lógica; no crea hardware.","case":null,"lab":null},{"id":"S13.08","title":"Particiones Dask","start":24,"end":27,"minutes":3,"text":"Partición es porción lógica; scheduler asigna tareas a workers, no necesariamente máquinas diferentes.","action":"Variar particiones con número fijo de archivos.","limit":"Cantidad de tareas; particiones diminutas añaden sobrecosto.","case":null,"lab":null},{"id":"S13.09","title":"Evaluación perezosa","start":27,"end":30,"minutes":3,"text":"Lazy crea grafo de tareas; compute ejecuta y materializa, no solo declara.","action":"Construir operación simple y predecir cuándo se materializa.","limit":"Grafo y ejecución; tiempo de construir
