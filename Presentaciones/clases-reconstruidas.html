<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Data · clase interactiva</title><style>:root{--navy:#142153;--teal:#087c81;--paper:#fffdfa;--ink:#17283b;--line:#cddce4;--muted:#4b6071}*{box-sizing:border-box}body{margin:0;background:#07152d;color:var(--ink);font:clamp(15px,1.35vw,19px)/1.48 system-ui,sans-serif}header,footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--navy);color:white}header a,footer a{color:#d1f3ee}.grow{flex:1}main{max-width:1600px;margin:auto;min-height:calc(100vh - 125px);padding:clamp(16px,3vw,40px);background:var(--paper)}h1{color:var(--navy);font-size:clamp(27px,3vw,46px);line-height:1.15;margin:6px 0 15px}h2{color:var(--navy);font-size:1.05em;margin:0 0 8px}p{margin:0 0 12px}.kicker{font-size:.78em;font-weight:800;color:#075e64;letter-spacing:.07em}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.explain{font-size:1.2em;line-height:1.55}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;margin-bottom:12px}.task{background:#eaf5f2;border-left:4px solid var(--teal)}.limit{background:#fff1df;border-left:4px solid #b87929}.small{font-size:.82em;color:var(--muted)}.tag{font-size:.75em;font-weight:800;color:#075e64}button,select{font:inherit;padding:8px 12px;border:1px solid #7995a9;border-radius:7px}button{background:var(--navy);color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}select{max-width:100%;color:var(--navy);background:white}a{color:#075e64}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e3a23a;outline-offset:3px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.choices button{color:var(--navy);background:white;text-align:left}.choices button[aria-pressed=true]{background:var(--navy);color:white}.result{background:#eaf5f2;border-radius:8px;padding:14px;min-height:75px}.result strong{display:block;color:#075e64;font-size:1.2em}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow span{background:#eaf5f2;border:1px solid #a9c8ca;border-radius:7px;padding:8px;font-size:.85em;color:#075e64;font-weight:700}.reading{margin-top:15px;max-width:100ch}.reading[hidden]{display:none}.progress{height:6px;background:#dbe6eb;max-width:1600px;margin:auto}.progress span{height:100%;background:#168b83;display:block}footer{position:sticky;bottom:0;z-index:5}footer button{background:#31537a}footer select{max-width:min(45vw,500px)}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.overview button{background:white;color:var(--navy);text-align:left}.overview small{display:block;color:var(--muted)}.note{font-size:.82em;padding:8px 10px;background:#f1f4f6;border-radius:6px}.lab a{display:inline-block;margin:5px 10px 5px 0}.calculator input[type=range]{width:100%;accent-color:var(--teal);margin:10px 0}.calculator label{display:block;font-weight:650}.calculator output{font-size:1.3em;color:#075e64;font-weight:800;display:block;margin:6px 0}.meter{height:10px;border-radius:6px;background:#e0e8eb;overflow:hidden;margin:8px 0}.meter span{height:100%;display:block;background:#168b83}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#162a3e;color:#f0f6fa;border-radius:8px;padding:12px;font:clamp(11px,1vw,15px)/1.45 monospace}details{margin:8px 0;border:1px solid var(--line);padding:8px;border-radius:6px}summary{cursor:pointer;font-weight:700;color:var(--navy)}@media(max-width:760px){.cols{grid-template-columns:1fr}main{padding:16px}.explain{font-size:1.05em}footer select{width:100%;max-width:none}.reading[hidden]{display:block}}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.metric{background:#eaf5f2;border:1px solid #cddce4;border-radius:7px;padding:9px;overflow-wrap:anywhere}.metric small,.metric strong{display:block}.metric strong{color:#075e64}.table-wrap{overflow:auto;max-height:400px}table{width:100%;border-collapse:collapse;font-size:.85em}th,td{text-align:left;padding:7px;border-bottom:1px solid #cddce4;vertical-align:top}th{background:#eaf5f2;position:sticky;top:0}textarea{width:100%;font:inherit;padding:8px;margin:10px 0;border:1px solid #7995a9;border-radius:6px}.calculator button{margin-top:8px}
</style></head><body><header><a href="../index.html">← Curso</a><strong>Big Data · Compras Claras</strong><span class="grow"></span><label for="session">Sesión</label><select id="session"></select><a id="nb" target="_blank" rel="noopener">Cuaderno</a></header><div class="progress"><span id="progress"></span></div><main id="stage" aria-label="Contenido de la sesión"></main><footer><button id="prev">← Anterior</button><button id="next">Siguiente →</button><label for="slide">Diapositiva</label><select id="slide"></select><span class="grow"></span><button id="overview">Índice</button><button id="reading" aria-pressed="false">Lectura ampliada</button><a id="product">Producto</a><span id="position" aria-live="polite"></span></footer><script>const course={"version":1,"status":"primera implementación parcial; no certificada","sessions":[{"id":"01","title":"¿Cuándo necesitamos Big Data?","problem":"Laura necesita leer una fuente creciente sin agotar memoria.","mission":"Adquirir datos","original":"s01-fundamentos-adquisicion.html","notebook":{"path":"sesion1_introducci_n.ipynb","ref":"mejora-pedagogica-integral","cells":85,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/sesion1_introducci_n.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/sesion1_introducci_n.ipynb"},"quiz":{"question":"Si el CSV no cabe en memoria pero solo necesitamos una suma, ¿qué probamos primero?","options":["Lectura por fragmentos","Cargar todo dos veces","Un clúster obligatorio"],"feedback":["Correcto: el agregado se combina.","Duplicaría memoria sin resolver la restricción.","Un clúster puede ser útil, pero aún no está justificado."]},"slides":[{"id":"S01.01","title":"La misión de Compras Claras","start":0,"end":3,"minutes":3,"text":"Un proceso puede tener varios contratos. Contar contratos como procesos altera la unidad de análisis; fija la identidad antes de agrupar.","action":"Elegir entre preguntas que admiten los campos actuales y preguntas que requieren otra tabla.","limit":"Matriz pregunta-campo-grano; no inferir montos sin fuente contractual.","case":null,"lab":null},{"id":"S01.02","title":"Qué sabemos y qué no","start":3,"end":5,"minutes":2,"text":"Para contar procesos necesitas entidad e ID; para estimar gasto necesitas valores contractuales y controlar cardinalidad.","action":"Clasificar cuatro escenarios de datos y comparar una decisión inicial con el cierre.","limit":"Diagnóstico estructurado; no calificar conocimiento previo.","case":null,"lab":null},{"id":"S01.03","title":"Volumen no es un número mágico","start":5,"end":10,"minutes":5,"text":"Un millón de filas con ocho enteros de ocho bytes requiere al menos 64 MB sin copias ni índices; el archivo comprimido puede ocupar menos.","action":"Estimar bytes de 200 y de un millón de filas con un ancho explícito.","limit":"Estimación dimensional; distinguir tamaño de archivo y memoria.","case":null,"lab":null},{"id":"S01.04","title":"Las cinco V","start":10,"end":15,"minutes":5,"text":"Volumen es cantidad; velocidad, ritmo; variedad, estructura; veracidad, calidad; valor, utilidad. La cola crece si llegan más registros de los que procesas.","action":"Mover dos controles de tasa de llegada y capacidad; identificar crecimiento de cola.","limit":"Tasa y backlog calculados; una V no diagnostica todas.","case":{"at":4,"q":"Cola de entrada","input":"120 registros/min durante 5 min, cola inicial cero","variants":[{"label":"Capacidad 80/min","result":"200 pendientes","why":"(120−80)×5"},{"label":"Capacidad 120/min","result":"0 pendientes","why":"Iguala llegada"},{"label":"Capacidad 150/min","result":"0 pendientes","why":"No hay cola negativa"}]},"lab":null},{"id":"S01.05","title":"Infraestructura local y nube","start":15,"end":19,"minutes":4,"text":"CPU ejecuta, RAM contiene estado de trabajo, disco conserva bytes y red los mueve. Escalar horizontalmente requiere repartir trabajo.","action":"Comparar dos configuraciones bajo un presupuesto de memoria y latencia común.","limit":"Decisión de infraestructura; nube no implica distribución automática.","case":null,"lab":null},{"id":"S01.06","title":"Estructurado, JSON y multimedia","start":19,"end":23,"minutes":4,"text":"CSV representa tablas; JSON admite objetos anidados; audio e imagen requieren decodificación. El formato no determina el significado.","action":"Clasificar campos y elegir formato para lectura, intercambio y almacenamiento.","limit":"Tabla de formatos con restricciones; extensión no garantiza contenido.","case":null,"lab":null},{"id":"S01.07","title":"Grano y fuente real","start":23,"end":27,"minutes":4,"text":"El grano define qué representa cada fila. La muestra de procesos no equivale a contratos, pagos ni proveedores.","action":"Inspeccionar 5 filas y seleccionar claves candidatas en el visor.","limit":"Perfil de columnas y unicidad; una clave candidata no es garantía.","case":null,"lab":null},{"id":"S01.08","title":"Veracidad y duplicados","start":27,"end":31,"minutes":4,"text":"Cinco copias de 200 IDs producen 205 filas y 200 identidades. No se cambia RAW al ensayar limpieza.","action":"Inyectar duplicados y nulos en una copia, nunca en RAW; variar sus cantidades.","limit":"Conteos antes y después; ausencia de campo no equivale a cero.","case":{"at":8,"q":"Filas frente a identidad","input":"200 IDs distintos","variants":[{"label":"Añadir 5 copias","result":"205 filas; 200 IDs","why":"No hay procesos nuevos"},{"label":"Añadir 20 copias","result":"220 filas; 200 IDs","why":"20 duplicados"}]},"lab":null},{"id":"S01.09","title":"Filtrar y agregar","start":31,"end":35,"minutes":4,"text":"Filtrar conserva filas por condición; agrupar reúne filas por clave y reduce cada conjunto a un resultado.","action":"Predecir y calcular frecuencias por entidad; comparar con pandas.","limit":"Conteo y denominador; no extrapolar la muestra a toda Colombia.","case":null,"lab":null},{"id":"S01.10","title":"Pandas y memoria","start":35,"end":40,"minutes":5,"text":"Pandas usa tipos por columna. memory_usage(deep=True) estima memoria atribuida al DataFrame, no el pico de RAM del proceso.","action":"Comparar enteros, objetos y categorías en la misma muestra.","limit":"Bytes de DataFrame; no presentarlos como pico RSS.","case":null,"lab":null},{"id":"S01.11","title":"Texto no estructurado","start":40,"end":44,"minutes":4,"text":"Tokenizar divide texto en unidades. Normalizar mayúsculas ayuda a comparar, pero puede perder distinciones.","action":"Cambiar normalización en dos objetos contractuales y comparar tokens.","limit":"Tokens y frecuencias; una coincidencia no prueba relevancia.","case":null,"lab":null},{"id":"S01.12","title":"HTTP y API Socrata","start":44,"end":48,"minutes":4,"text":"HTTP 200 significa respuesta exitosa, no cobertura. Timeout limita espera; el parámetro limit controla tamaño de página.","action":"Construir una consulta de lectura con límite pequeño y comprobar estado y claves.","limit":"Respuesta o fixture etiquetado; no confundir fallo de red con cero registros.","case":null,"lab":null},{"id":"S01.13","title":"Paginación determinista","start":48,"end":52,"minutes":4,"text":"Con páginas de 50, avanzar offset 40 solapa diez posiciones; avanzar 50 evita ese solape en datos congelados.","action":"Simular páginas de 50 y salto de 40 frente a salto de 50.","limit":"Cobertura, duplicados y ausentes; el orden no congela cambios remotos.","case":{"at":13,"q":"Cobertura de páginas","input":"IDs 1–100, dos páginas de 50","variants":[{"label":"Offset 40","result":"90 únicos; 10 repetidos; 10 ausentes","why":"1–50 y 41–90"},{"label":"Offset 50","result":"100 únicos","why":"1–50 y 51–100"}]},"lab":null},{"id":"S01.14","title":"Fragmentos y agregaciones","start":52,"end":56,"minutes":4,"text":"La media global es suma total dividida por conteo válido total, no promedio de medias de bloques desiguales.","action":"Variar tamaño de fragmento y calcular media ponderada frente al resultado global.","limit":"Igualdad de suma y conteo; no mezclar promedios sin pesos.","case":{"at":14,"q":"Media global","input":"2 valores de 10; 8 valores de 20","variants":[{"label":"Promedio de medias","result":"15 (incorrecto)","why":"No pondera tamaños"},{"label":"Suma/conteo","result":"18","why":"(20+160)/10"}]},"lab":null},{"id":"S01.15","title":"Capacidad y experimento controlado","start":56,"end":60,"minutes":4,"text":"Un benchmark mantiene N, datos, algoritmo y exactitud constantes. Medir bytes de bloque no mide toda la memoria del proceso.","action":"Comparar lectura completa y por bloques bajo los mismos datos.","limit":"Medidas con ambiente y unidad; menor tamaño de bloque no garantiza menor tiempo.","case":null,"lab":null},{"id":"S01.16","title":"Cuaderno: entorno y entrada","start":70,"end":80,"minutes":10,"text":"Primero verifica fuente, bibliotecas y esquema; el primer resultado útil es reconocer grano y columnas.","action":"Ejecutar preparación sin carga manual; verificar fecha, filas y hash.","limit":"Manifiesto inicial; fixture no es una descarga nueva.","case":null,"lab":{"index":4,"heading":"Preparación del entorno","status":"sección temática identificada","gap":null}},{"id":"S01.17","title":"Cuaderno: inspección y calidad","start":80,"end":89,"minutes":9,"text":"Inspecciona tipos, nulos e IDs. Compara conteos antes y después sobre copia, no sobre RAW.","action":"Modificar una selección de entidad y ejecutar controles sobre copia.","limit":"Perfil de calidad propio; RAW no se modifica.","case":null,"lab":{"index":28,"heading":"Bloque 4 — Datos estructurados con pandas","status":"sección temática identificada","gap":null}},{"id":"S01.18","title":"Cuaderno: adquirir o recuperar","start":89,"end":98,"minutes":9,"text":"Una lectura remota y un snapshot son fuentes distintas; documenta cuál se ejecutó.","action":"Ejecutar una página o abrir snapshot identificado cuando la red falla.","limit":"Estado, fecha y hash; no declarar éxito remoto usando snapshot.","case":null,"lab":{"index":62,"heading":"Bloque 8 — Caso aplicado: consultar SECOP mediante la API Socrata","status":"sección temática identificada","gap":null}},{"id":"S01.19","title":"Cuaderno: recorrer páginas","start":98,"end":107,"minutes":9,"text":"Un bucle de páginas registra offset, tamaño, parada e IDs. El número de filas solo no detecta repetición.","action":"Completar un hueco en el avance de página y contrastar IDs con fixture.","limit":"Cobertura exacta en datos congelados; registrar orden y límite.","case":null,"lab":{"index":62,"heading":"Bloque 8 — Caso aplicado: consultar SECOP mediante la API Socrata","status":"ampliación pendiente","gap":"La sección contiene el acceso API; falta certificar una práctica separada de offset, orden y cobertura."}},{"id":"S01.20","title":"Cuaderno: procesar fragmentos","start":107,"end":116,"minutes":9,"text":"La lectura por fragmentos conserva acumuladores pequeños; verifica suma y conteo contra la referencia completa.","action":"Ejecutar escala segura de 10.000 o 100.000 filas sintéticas según presupuesto.","limit":"Igualdad frente a control pandas; ningún benchmark obligatorio gigante.","case":null,"lab":{"index":35,"heading":"Bloque 5 — Ingesta por fragmentos sin perder registros","status":"sección temática identificada","gap":null}},{"id":"S01.21","title":"Cuaderno: exportar RAW","start":116,"end":125,"minutes":9,"text":"RAW conserva originales; manifiesto documenta fuente, fecha, identidad y hash. El hash no certifica veracidad.","action":"Guardar archivo, manifiesto y reabrir para comprobar identidad y conteo.","limit":"Artefacto reproducible; hash de bytes no acredita veracidad.","case":null,"lab":{"index":84,"heading":"Relevo S02","status":"ampliación pendiente","gap":"El relevo describe el contrato; falta comprobar exportación y relectura."}},{"id":"S01.22","title":"Reto de adquisición","start":125,"end":130,"minutes":5,"text":"Cambia tamaño de página o fragmento, predice qué debería permanecer igual y verifica cobertura.","action":"Elegir parámetro y entregar cobertura, conteo y hash propios.","limit":"Configuración ejecutada y salida; no responder con ensayo libre.","case":null,"lab":null},{"id":"S01.23","title":"Interpretación profesional","start":130,"end":135,"minutes":5,"text":"La muestra describe sus registros, no toda Colombia; el universo y la selección condicionan inferencias.","action":"Elegir conclusión válida y limitación a partir del resultado propio.","limit":"Dos decisiones contextualizadas; no acusar irregularidad.","case":null,"lab":null},{"id":"S01.24","title":"Relevo hacia arquitectura","start":135,"end":140,"minutes":5,"text":"S02 recibe el manifiesto para derivar requisitos de volumen, frecuencia, identidad y calidad.","action":"Importar el manifiesto en una vista de contrato de entrada.","limit":"Compatibilidad verificada; ningún dato de ejemplo pasa por evidencia personal.","case":null,"lab":null},{"id":"S01.25","title":"Cierre y recuperación","start":140,"end":150,"minutes":10,"text":"El producto se acepta si se puede releer, reconstruir y explicar el grano y las limitaciones.","action":"Resolver preguntas de salida sobre los resultados propios y recuperar un fallo frecuente.","limit":"Autochequeo y artefacto de relevo; conservar resultados faltantes como pendientes.","case":null,"lab":null}],"control":{"at":4,"title":"Simula la cola","label":"Capacidad (registros/min)","min":0,"max":200,"step":10,"initial":80},"blocks":[{"title":"Diagnóstico de las cinco V","range":"8–23","concept":"Volumen es cantidad; velocidad es ritmo de llegada; variedad son estructuras; veracidad es calidad; valor es la decisión. La nube no elimina estas restricciones.","task":"Identifica cuál V limita una descarga diaria y una consulta urgente.","evidence":"Una V dominante y una decisión justificada.","excerpt":"# Pregunta 1 de 10 — Diagnóstico del problema\npregunta_interactiva(\n    numero=1,\n    tema='Diagnóstico del problema',\n    contexto='La empresa procesa 1 millón de eventos por minuto, pero recibe 3 millones.',\n    pregunta='¿Cuál es la primera dificultad que debe resolver?',\n    opciones=['La variedad, porque todos los eventos son diferentes', 'La velocidad, porque la llegada supera la capacidad de proceso', 'El valor, porque ningún evento sirve para decidir', 'La visualización, porque todavía no existe un tablero'],\n    correcta=1,\n    retro_correcta='Correcto. La cola aumenta en 2 millones de eventos por minuto: la capacidad no alcanza el ritmo de llegada. Un tablero no corrige ese cuello de botella.',\n    retro_incorrecta='La opción es tentadora porque Big Data tiene varias dimensiones, pero aquí la evidencia cuantitativa compara 3 millones recibidos con 1 millón procesado. Eso identifica un problema de velocidad y capacidad.',\n)","excerptTruncated":false},{"title":"Formatos y grano","range":"25–34,44–61","concept":"CSV organiza filas; JSON permite objetos anidados; XML usa etiquetas. Un agregado cambia el grano de fila individual a grupo.","task":"Filtra empleados y cambia el umbral; compara JSON y tabla.","evidence":"Conteos de entrada y salida.","excerpt":"mayores_de_30 = empleados[empleados[\"Edad\"] > 30]\nsalario_promedio = (\n    empleados.groupby(\"Departamento\", as_index=False)[\"Salario\"]\n    .mean()\n    .sort_values(\"Salario\", ascending=False)\n)\n\ndisplay(mayores_de_30)\ndisplay(salario_promedio.style.format({\"Salario\": \"{:,.2f}\"}))","excerptTruncated":false},{"title":"API SECOP","range":"62–70","concept":"HTTP 200 indica respuesta, no cobertura. Orden, límite e identidad determinan una muestra repetible; un contrato no es un proceso.","task":"Ejecuta la consulta oficial y compara límites pequeños.","evidence":"Filas, columnas, fuente y grano.","excerpt":"url_secop = \"https://www.datos.gov.co/resource/rpmr-utcd.json\"\nparametros = {\n    \"$limit\": 500,\n    \"$select\": \"nombre_de_la_entidad,nit_de_la_entidad,departamento_entidad,valor_contrato\",\n    \"$where\": \"departamento_entidad is not null AND valor_contrato is not null\",\n}\n\nrespuesta = requests.get(url_secop, params=parametros, timeout=30)\nrespuesta.raise_for_status()","excerptTruncated":false},{"title":"Memoria y fragmentación","range":"35–42","concept":"Leer por bloques acota la entrada en memoria. Suma y conteo se combinan; promediar medias sin pesos puede fallar.","task":"Cambia chunksize, conserva total y compara el cálculo de memoria del explorador.","evidence":"Conteos equivalentes y costo declarado.","excerpt":"for numero, fragmento in enumerate(pd.read_csv(url_icfes, encoding=\"latin-1\", chunksize=100_000), start=1):\n    puntaje = pd.to_numeric(fragmento[\"PUNT_GLOBAL\"], errors=\"coerce\")\n    filas_por_fragmento.append(len(fragmento))\n    suma_puntaje += puntaje.sum()\n    puntajes_validos += puntaje.notna().sum()\n    print(f\"Fragmento {numero}: {len(fragmento):,} filas\")\n\ntotal_filas = sum(filas_por_fragmento)\npromedio_global = suma_puntaje / puntajes_validos\nprint(f\"Total procesado: {total_filas:,} filas\")\nprint(f\"Promedio PUNT_GLOBAL: {promedio_global:.2f}\")","excerptTruncated":false},{"title":"Entregar RAW","range":"71–76","concept":"Un manifiesto conserva fuente, esquema, identidad y cobertura. La muestra no acredita representatividad.","task":"Completa reto y confirma una escala de 40/80/120 procesos en el producto.","evidence":"RAW portable y evidencia real separados.","excerpt":"# Espacio de trabajo del estudiante\n# 1. Define tu pregunta profesional.\npregunta_profesional = \"\"\n\n# 2. Identifica la unidad de observación.\nunidad_observacion = \"\"\n\n# 3. Selecciona variables y construye un resumen reproducible.\nvariables_seleccionadas = []\n\n# Escribe aquí tu código de ingesta, validación y resumen.","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":55},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":13,"title":"Paginación: cobertura por identidad","concept":"Una fuente congelada contiene P01 a P12. Offset indica cuántas posiciones se omiten, limit cuántas se devuelven como máximo. Si el salto es inferior al límite las ventanas se solapan; si es superior aparecen huecos. Contar filas sin revisar identidades puede ocultar ambas cosas. En una API cambiante el orden determinista ayuda, pero no congela la fuente.","pred":"Predice IDs repetidos y ausentes al pedir tres páginas de cuatro filas con salto tres.","fields":[{"label":"Limit","min":1,"max":8,"step":1,"value":4},{"label":"Salto de offset","min":1,"max":8,"step":1,"value":3},{"label":"Peticiones","min":1,"max":6,"step":1,"value":3}],"interpret":"Lee cada ventana y su posición inicial. Conciliamos filas, únicos, duplicados y ausentes: el conteo bruto no garantiza cobertura. Una respuesta vacía no es lo mismo que un error HTTP.","challenge":"Recupera exactamente 12 IDs con limit=5 y el menor número de peticiones. Traslada el control al cuaderno SECOP y registra fuente y orden.","limit":"Modelo local congelado, no descarga ni medición SECOP."}},{"id":"02","title":"¿Cómo diseñar una arquitectura?","problem":"Compras Claras debe convertir registros públicos en una decisión.","mission":"Diseñar la solución","original":null,"notebook":{"path":"Cuadernos/2_Sesion_Arquitectura_BPM_Ciclo_Analitico.ipynb","ref":"mejora-pedagogica-integral","cells":41,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/2_Sesion_Arquitectura_BPM_Ciclo_Analitico.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/2_Sesion_Arquitectura_BPM_Ciclo_Analitico.ipynb"},"quiz":{"question":"¿Qué se define primero?","options":["La marca del motor","La decisión y sus requisitos","La cantidad de servidores"],"feedback":["La herramienta viene después.","Correcto: determina la solución.","Depende de requisitos y carga."]},"slides":[{"id":"S02.01","title":"El problema de Laura","start":0,"end":3,"minutes":3,"text":"La arquitectura comienza por una necesidad y una decisión, no por elegir una marca.","action":"Seleccionar el objetivo prioritario entre casos con restricciones distintas.","limit":"Caso elegido y restricción; no iniciar nombrando motores.","case":null,"lab":null},{"id":"S02.02","title":"Relevo RAW","start":3,"end":5,"minutes":2,"text":"El manifiesto RAW describe campos, fuente, volumen y errores; es la entrada verificable al diseño.","action":"Comparar manifiesto propio con referencia y detectar campo ausente.","limit":"Contrato de entrada comprobado; no inventar datos faltantes.","case":null,"lab":null},{"id":"S02.03","title":"Proceso y BPM","start":5,"end":9,"minutes":4,"text":"BPM representa eventos, actividades y decisiones. Una aprobación humana no es una transformación automática.","action":"Ordenar eventos y distinguir decisión humana de procesamiento automático.","limit":"Diagrama con decisión y estado final; BPM no es pipeline de datos.","case":null,"lab":null},{"id":"S02.04","title":"BI y ciclo analítico","start":9,"end":13,"minutes":4,"text":"El ciclo analítico adquiere, transforma, almacena, analiza y comunica para retroalimentar decisiones.","action":"Ubicar un producto de datos en cada fase y detectar ciclo incompleto.","limit":"Mapa de ciclo; análisis no equivale a causalidad.","case":null,"lab":null},{"id":"S02.05","title":"Requisitos funcionales","start":13,"end":17,"minutes":4,"text":"Un requisito funcional expresa una consulta o acción con entrada y salida observables.","action":"Elegir tres consultas prioritarias con columnas y filtros necesarios.","limit":"Matriz consulta-dato; no confundir interfaz con requisito.","case":null,"lab":null},{"id":"S02.06","title":"Requisitos no funcionales","start":17,"end":21,"minutes":4,"text":"Latencia, frescura, costo y disponibilidad son requisitos no funcionales con unidades y umbrales.","action":"Modificar frecuencia de ingesta y objetivo de latencia; observar incompatibilidad.","limit":"Restricciones medibles; no prometer SLA sin infraestructura.","case":{"at":6,"q":"Restricción de latencia","input":"A tarda 8 s, B 120 s (hipotético)","variants":[{"label":"Máximo 5 s","result":"Ninguna cumple","why":"Ambas exceden máximo"},{"label":"Máximo 10 s","result":"Solo A","why":"8≤10"},{"label":"Máximo 180 s","result":"Ambas","why":"Comparar preferencias"}]},"lab":null},{"id":"S02.07","title":"Arquitectura por capas","start":21,"end":24,"minutes":3,"text":"Fuente, ingesta, RAW, transformación, servicio y consumidor son responsabilidades lógicas, no necesariamente máquinas distintas.","action":"Mover una transformación y examinar qué capas consumen datos crudos o depurados.","limit":"Diagrama de interfaces; capa no es necesariamente una máquina.","case":null,"lab":null},{"id":"S02.08","title":"Batch frente a eventos","start":24,"end":27,"minutes":3,"text":"Batch procesa conjuntos periódicos; eventos se procesan según llegada y política. El intervalo añade espera.","action":"Variar intervalo de lote y calcular demora de disponibilidad.","limit":"Latencia aproximada; llegada no equivale a tiempo de evento.","case":{"at":8,"q":"Intervalo de lote","input":"Evento inmediatamente después del cierre, sin cómputo","variants":[{"label":"Lote de 1 min","result":"Espera casi 1 min","why":"Próximo cierre"},{"label":"Lote de 10 min","result":"Espera casi 10 min","why":"Mayor intervalo"}]},"lab":null},{"id":"S02.09","title":"SQL y NoSQL","start":27,"end":30,"minutes":3,"text":"SQL, documentos, acceso por clave, grafos y búsqueda sirven patrones de consulta diferentes.","action":"Asociar patrones de consulta a estructuras y justificar alternativa descartada mediante opciones.","limit":"Tabla patrón-motor; NoSQL no significa ausencia de esquema.","case":null,"lab":null},{"id":"S02.10","title":"Costo y capacidad","start":30,"end":35,"minutes":5,"text":"Volumen bruto = tasa × retención × copias. 100 MB/día por 30 días y dos copias son 6.000 MB.","action":"Variar tamaño y retención bajo una tarifa ficticia explícita.","limit":"Estimación reproducible, no precio comercial vigente.","case":{"at":10,"q":"Retención bruta","input":"100 MB/día, dos copias","variants":[{"label":"7 días","result":"1.400 MB","why":"100×7×2"},{"label":"30 días","result":"6.000 MB","why":"100×30×2"}]},"lab":null},{"id":"S02.11","title":"Contratos de datos","start":35,"end":40,"minutes":5,"text":"Un contrato fija tipos, identidad, nulabilidad y versión. Un cambio de tipo puede romper el consumidor.","action":"Probar dos registros válidos y dos inválidos contra un contrato.","limit":"Errores específicos; esquema válido no garantiza semántica.","case":{"at":11,"q":"Contrato de campos","input":"id texto obligatorio, valor número obligatorio","variants":[{"label":"id=P1, valor=10 numérico","result":"Válido","why":"Tipos coinciden"},{"label":"id=P1, valor='10'","result":"Rechazo","why":"Texto no es número"},{"label":"Solo valor=10","result":"Rechazo","why":"Falta ID"}]},"lab":null},{"id":"S02.12","title":"Trazabilidad y linaje","start":40,"end":45,"minutes":5,"text":"Linaje vincula origen, transformación y salida. Un hash por sí solo no reconstruye la configuración.","action":"Seguir un registro a través de dos transformaciones y localizar su origen.","limit":"Linaje navegable; hash no revela autor ni fecha por sí solo.","case":null,"lab":null},{"id":"S02.13","title":"Git como historial","start":45,"end":50,"minutes":5,"text":"Git conserva versiones; commit es revisión, diff es diferencia y pull request propone integración.","action":"Comparar dos versiones de contrato y localizar un cambio de tipo.","limit":"Diff y decisión; no crear ramas innecesarias.","case":null,"lab":null},{"id":"S02.14","title":"Comparación de diseños","start":50,"end":55,"minutes":5,"text":"Especializar motores añade sincronización; un motor único reduce coordinación pero puede no cubrir patrones.","action":"Variar dos restricciones y observar cambio en matriz de decisión.","limit":"Alternativas con criterios; puntuación no es verdad universal.","case":null,"lab":null},{"id":"S02.15","title":"Seguridad y fallas","start":55,"end":60,"minutes":5,"text":"Concede permisos mínimos y define qué sigue funcionando si falla una fuente.","action":"Eliminar un componente en un simulador de flujo y localizar dependencias.","limit":"Plan de contingencia; no exponer credenciales.","case":null,"lab":null},{"id":"S02.16","title":"Cuaderno: importar requisitos","start":70,"end":80,"minutes":10,"text":"Recupera requisitos antes de construir diagramas; un dato ausente no debe inventarse.","action":"Ejecutar carga y validar campos requeridos.","limit":"Requisitos con origen; marcar fallback.","case":null,"lab":{"index":27,"heading":"Paso 2 — Leer la evidencia antes de responder","status":"sección temática identificada","gap":null}},{"id":"S02.17","title":"Cuaderno: contrato ejecutable","start":80,"end":89,"minutes":9,"text":"Validar tipos y campos requeridos detecta violaciones del contrato; no demuestra calidad semántica.","action":"Cambiar un campo y ejecutar registros de prueba.","limit":"Lista de violaciones; no modificar registros RAW.","case":null,"lab":{"index":30,"heading":"Paso 5 — Completar caso, arquitectura y ciclo","status":"ampliación pendiente","gap":"Falta una celda que valide el contrato de manera ejecutable."}},{"id":"S02.18","title":"Cuaderno: simular carga","start":89,"end":98,"minutes":9,"text":"1.000 filas/min son 60.000 por hora si la tasa es constante; añade ancho y retención para estimar almacenamiento.","action":"Ejecutar escenario con tasa distinta y unidad fija.","limit":"Tabla de capacidad; no inferir costos reales.","case":null,"lab":{"index":30,"heading":"Paso 5 — Completar caso, arquitectura y ciclo","status":"ampliación pendiente","gap":"Falta la simulación ejecutable de carga."}},{"id":"S02.19","title":"Cuaderno: matriz de decisión","start":98,"end":107,"minutes":9,"text":"Una restricción dura incumplida invalida la alternativa aunque obtenga buena puntuación ponderada.","action":"Modificar una ponderación y observar sensibilidad del ranking.","limit":"Matriz versionada; no elegir por ranking si falla restricción dura.","case":null,"lab":{"index":16,"heading":"4. Arquitectura empresarial: conectar el propósito con la solución","status":"ampliación pendiente","gap":"Falta matriz ejecutable de decisión."}},{"id":"S02.20","title":"Cuaderno: representar arquitectura","start":107,"end":116,"minutes":9,"text":"Cada flecha de arquitectura necesita contrato de interfaz, frecuencia y manejo de fallos.","action":"Agregar consumidor o eliminar un enlace y validar la coherencia.","limit":"Diagrama y contrato de interfaces.","case":null,"lab":{"index":30,"heading":"Paso 5 — Completar caso, arquitectura y ciclo","status":"sección temática identificada","gap":null}},{"id":"S02.21","title":"Cuaderno: versionar artefacto","start":116,"end":125,"minutes":9,"text":"Guardar versiones del contrato permite detectar cambios de esquema y reproducir decisiones.","action":"Guardar dos versiones y validar relectura.","limit":"Hash, versión y diff; sin datos de estudiantes.","case":null,"lab":{"index":29,"heading":"Paso 4 — Guardar la primera versión","status":"sección temática identificada","gap":null}},{"id":"S02.22","title":"Reto de diseño","start":125,"end":130,"minutes":5,"text":"Una exigencia nueva de latencia puede cambiar frecuencia de ingesta sin cambiar todos los componentes.","action":"Elegir arquitectura modificada y registrar alternativa descartada.","limit":"Resultado contextualizado; no entregar solo un dibujo.","case":null,"lab":null},{"id":"S02.23","title":"Revisión de consistencia","start":130,"end":135,"minutes":5,"text":"Cada requisito debe tener un componente responsable y cada componente una necesidad que justifique su existencia.","action":"Identificar dos componentes redundantes o faltantes mediante controles.","limit":"Matriz cobertura-requisito; no usar tecnología por moda.","case":null,"lab":null},{"id":"S02.24","title":"Relevo documental","start":135,"end":140,"minutes":5,"text":"S03 materializa el expediente con identidad, campos anidados y consultas acordadas.","action":"Exportar un documento candidato y consultas prioritarias.","limit":"Entrada de S03 con campos y restricciones.","case":null,"lab":null},{"id":"S02.25","title":"Cierre de arquitectura","start":140,"end":150,"minutes":10,"text":"Defiende el diseño con una alternativa descartada y sus restricciones, no con un inventario de herramientas.","action":"Resolver una decisión estructurada sobre batch y arquitectura usando su cálculo.","limit":"Diagrama, contrato y traza; no evaluar con definiciones aisladas.","case":null,"lab":null}],"control":{"at":10,"title":"Calcula retención","label":"Días de retención","min":1,"max":90,"step":1,"initial":30},"blocks":[{"title":"Decisión e indicador","range":"7–8","concept":"Un indicador cuantifica una situación; una decisión determina una acción. El requisito debe declarar quién, cuándo y para qué.","task":"Relaciona una decisión con un indicador y una fuente.","evidence":"Requisito verificable.","excerpt":"#@title Activar pregunta 1 — Decisión e indicador { display-mode: \"form\" }\n# Pregunta 1 de 7 — Decisión e indicador\npregunta_interactiva(\n    numero=1,\n    tema='Decisión e indicador',\n    contexto='El director propone medir el éxito por la cantidad de tecnologías instaladas.',\n    pregunta='¿Qué indicador responde mejor al problema de Laura?',\n    opciones=['Número de servicios tecnológicos activados.', 'Cantidad de columnas descargadas.', 'Tiempo entre la actualización del registro y su primera revisión.', 'Número de gráficos producidos.'],\n    correcta=2,\n    retro_opciones=['Cuenta infraestructura, pero no demuestra que Laura reciba evidencia a tiempo.', 'Más columnas pueden aumentar trabajo y confusión; no miden la mejora del proceso.', 'Este indicador corresponde a la demora observada y permite comparar la situación actual con la propuesta.', 'Un gráfico es un medio de comunicación; el valor aparece cuando apoya una revisión oportuna.'],\n)","excerptTruncated":false},{"title":"Proceso AS-IS y TO-BE","range":"9–15","concept":"AS-IS describe situación actual; TO-BE el proceso objetivo. Una compuerta condiciona caminos y el retrabajo tiene costo.","task":"Cambia una condición del flujo y comprueba qué actividad desaparece.","evidence":"Proceso antes/después.","excerpt":"#@title Activar pregunta 2 — Proceso, compuerta y retrabajo { display-mode: \"form\" }\n# Pregunta 2 de 7 — Proceso, compuerta y retrabajo\npregunta_interactiva(\n    numero=2,\n    tema='Proceso, compuerta y retrabajo',\n    contexto='La tarea valida fechas y produce dos resultados: información suficiente o información incompleta.',\n    pregunta='¿Cómo debe representarse la decisión posterior?',\n    opciones=['La tarea almacena los archivos y termina el proceso.', 'Una compuerta dirige: suficiente continúa; incompleta regresa para corrección.', 'Un gráfico reemplaza la decisión y elimina la revisión.', 'El SLA decide automáticamente si existe irregularidad.'],\n    correcta=1,\n    retro_opciones=['La tarea realiza la validación, pero no muestra las dos rutas ni el retrabajo.', 'La compuerta hace explícita la regla y permite ver que la ruta incompleta produce espera y corrección.', 'Una visualización comunica resultados; no representa ni ejecuta el flujo del proceso.', 'El SLA fija un tiempo esperado y no permite concluir irregularidad ni reemplazar el juicio humano.'],\n)","excerptTruncated":false},{"title":"Arquitectura y ciclo","range":"16–23","concept":"Ingesta, almacenamiento, cómputo y servicio son responsabilidades. Lotes favorecen periodicidad; eventos reducen demora con complejidad.","task":"Compara límite de 5 y 120 segundos en el simulador.","evidence":"Alternativa descartada; tiempos son supuestos.","excerpt":"#@title Activar pregunta 5 — Trazabilidad arquitectónica { display-mode: \"form\" }\n# Pregunta 5 de 7 — Trazabilidad arquitectónica\npregunta_interactiva(\n    numero=5,\n    tema='Trazabilidad arquitectónica',\n    contexto='El equipo propone una herramienta popular, pero no puede relacionarla con una decisión del proceso.',\n    pregunta='¿Qué debe hacer antes de incluirla en la arquitectura?',\n    opciones=['Instalarla y buscar después un problema.', 'Explicar qué necesidad, dato, función e indicador justifican su existencia.', 'Reemplazar el proceso por una lista de productos.', 'Ocultar el costo para no limitar el diseño.'],\n    correcta=1,\n    retro_opciones=['La tecnología quedaría sin un resultado verificable y añadiría complejidad innecesaria.', 'La cadena de trazabilidad permite comprobar que cada componente responde al objetivo empresarial.', 'Los productos no muestran quién trabaja, qué decide ni qué datos necesita.', 'El costo es una condición real de la arquitectura y puede cambiar una alternativa técnicamente posible.'],\n)","excerptTruncated":false},{"title":"Versionar con Git","range":"24–35","concept":"Commit registra cambios; PR permite revisión antes de integrar. Checks no sustituyen juicio humano.","task":"Abre rama propia y completa diseño según cuaderno; no fusiones.","evidence":"PR y revisión.","excerpt":null},{"title":"Entregar arquitectura","range":"36–40","concept":"Cada componente debe responder a un requisito y contrato de datos.","task":"Confirma S02 y compara alternativa sin cambiar la decisión elegida.","evidence":"Arquitectura trazable.","excerpt":null}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":30},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":55},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":10,"title":"Dimensionar requisitos de arquitectura","concept":"Una fuente de eventos llega a tasa constante. Volumen diario = tasa × 1440 × ancho. Retención y copias multiplican almacenamiento bruto. Un lote introduce espera casi igual a su intervalo, más el cálculo. Una restricción obligatoria incumplida no se compensa por una ventaja en otro criterio.","pred":"Predice si un lote cada 15 minutos cumple frescura de 10 minutos cuando tarda dos minutos en calcular.","fields":[{"label":"Eventos/min","min":100,"max":5000,"step":100,"value":1000},{"label":"Bytes/evento","min":100,"max":2000,"step":100,"value":500},{"label":"Intervalo (min)","min":1,"max":30,"step":1,"value":15},{"label":"Retención (días)","min":1,"max":30,"step":1,"value":7}],"interpret":"El presupuesto didáctico es 50 GB y frescura de 10 minutos, dos copias y dos minutos de cálculo. Evalúa restricciones primero, luego preferencias. El resultado no es precio.","challenge":"Encuentra dos diseños factibles y uno que falle solo en frescura. Explica qué componente cambiarías.","limit":"Estimación con supuestos, no costo de nube."}},{"id":"03","title":"¿Cuándo una fila no representa el dato?","problem":"Las noticias y procesos tienen estructuras heterogéneas.","mission":"Construir expedientes","original":null,"notebook":{"path":"Cuadernos/3_MongoDB_Documental.ipynb","ref":"mejora-pedagogica-integral","cells":130,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/3_MongoDB_Documental.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/3_MongoDB_Documental.ipynb"},"quiz":{"question":"¿Un índice siempre acelera una consulta?","options":["Sí","Depende del filtro, selectividad y plan","Solo si hay JSON"],"feedback":["No: tiene costo y el optimizador puede descartarlo.","Correcto: examina el plan real.","El formato JSON no determina por sí solo la ventaja."]},"slides":[{"id":"S03.01","title":"El expediente como unidad","start":0,"end":3,"minutes":3,"text":"Un documento agrupa información que se consulta junta; no necesita una fila repetida por activo anidado.","action":"Elegir la unidad documental y campos que necesitan identidad.","limit":"Modelo candidato; no replicar información sin necesidad.","case":null,"lab":null},{"id":"S03.02","title":"Preconcepciones de bases","start":3,"end":5,"minutes":2,"text":"Colección y tabla son modelos distintos pero ambos necesitan identidad y contratos.","action":"Asociar ejemplos y detectar una referencia faltante.","limit":"Diagnóstico contextual; no presuponer sintaxis MongoDB.","case":null,"lab":null},{"id":"S03.03","title":"JSON y BSON","start":5,"end":10,"minutes":5,"text":"JSON es texto serializado; BSON representa tipos binarios adicionales, como fechas.","action":"Comparar fechas, números y nulos de dos representaciones.","limit":"Tipo observado; BSON no es texto JSON.","case":null,"lab":null},{"id":"S03.04","title":"Grano e identidad","start":10,"end":15,"minutes":5,"text":"ObjectId es identidad interna; la clave del negocio evita duplicar un proceso al cargarlo nuevamente.","action":"Diseñar id determinista para dos versiones de un proceso.","limit":"Regla de identidad; ObjectId no sustituye clave contractual.","case":null,"lab":null},{"id":"S03.05","title":"Embebido o referencia","start":15,"end":19,"minutes":4,"text":"Embeber favorece lectura conjunta; referenciar controla crecimiento y actualización compartida.","action":"Variar número de activos por expediente y elegir representación.","limit":"Decisión por patrón de acceso; no hay diseño universal.","case":{"at":5,"q":"Crecimiento de documento","input":"Cada activo ocupa 100 bytes sin overhead","variants":[{"label":"2 activos","result":"200 bytes","why":"Tamaño pequeño"},{"label":"10.000 activos","result":"1.000.000 bytes","why":"Evalúa referencias y actualización"}]},"lab":null},{"id":"S03.06","title":"Esquema flexible y validación","start":19,"end":23,"minutes":4,"text":"Campo ausente, null y valor vacío no significan lo mismo; flexibilidad no elimina validación.","action":"Detectar un documento con monto textual y otro sin fecha.","limit":"Resultado de validación; ausencia no equivale a null.","case":null,"lab":null},{"id":"S03.07","title":"CRUD desde cero","start":23,"end":27,"minutes":4,"text":"CRUD crea, lee, actualiza y elimina. Un filtro amplio puede modificar más documentos de los previstos.","action":"Predecir estado tras cuatro operaciones sobre dos documentos.","limit":"Estado antes/después; no borrar colección ajena.","case":null,"lab":null},{"id":"S03.08","title":"Predicados y proyección","start":27,"end":31,"minutes":4,"text":"Predicado selecciona documentos; proyección selecciona campos; orden determina qué devuelve un límite.","action":"Variar filtro y proyección sobre una muestra y verificar resultado manual.","limit":"IDs esperados; filtrar no es proyectar.","case":null,"lab":null},{"id":"S03.09","title":"Arrays y documentos anidados","start":31,"end":35,"minutes":4,"text":"Dos condiciones sobre arrays pueden coincidir en elementos distintos; elemMatch exige el mismo elemento.","action":"Comparar dos predicados sobre activos con valores cruzados.","limit":"Coincidencias; distinguir semántica de elemMatch.","case":{"at":9,"q":"Condiciones en arrays","input":"Activo A inválido, B válido","variants":[{"label":"Predicados separados","result":"Puede coincidir","why":"Cada condición en elemento distinto"},{"label":"elemMatch","result":"No coincide","why":"Ningún A válido"}]},"lab":null},{"id":"S03.10","title":"Agregación por etapas","start":35,"end":40,"minutes":5,"text":"match filtra, project transforma, unwind expande, group agrega y sort ordena; sigue el cambio de grano.","action":"Calcular manualmente salida tras cada etapa y comparar motor.","limit":"Cardinalidad intermedia; unwind cambia grano.","case":{"at":10,"q":"Cardinalidad","input":"P1 con 2 activos; P2 con 3","variants":[{"label":"Antes de unwind","result":"2 expedientes","why":"Grano proceso"},{"label":"Después","result":"5 filas; 2 procesos","why":"Grano activo por proceso"}]},"lab":null},{"id":"S03.11","title":"Índice y acceso","start":40,"end":44,"minutes":4,"text":"Un índice ofrece acceso adicional a cambio de espacio y mantenimiento en escrituras.","action":"Simular búsqueda de una clave y comparar inspecciones en conjunto pequeño.","limit":"Pasos didácticos; no llamarlos métricas de MongoDB.","case":null,"lab":null},{"id":"S03.12","title":"Explain real","start":44,"end":48,"minutes":4,"text":"Explain permite observar plan, claves y documentos examinados; un tiempo aislado depende del entorno.","action":"Comparar consulta idéntica antes y después de índice en colección controlada.","limit":"Plan real o pendiente; no asegurar menor tiempo por un solo ensayo.","case":null,"lab":null},{"id":"S03.13","title":"Orden de índice compuesto","start":48,"end":52,"minutes":4,"text":"En un índice compuesto, entidad-fecha y fecha-entidad favorecen patrones diferentes.","action":"Variar orden de campos y comparar cobertura prevista y plan cuando se ejecute.","limit":"Planes y consulta; índice no siempre elegido.","case":null,"lab":null},{"id":"S03.14","title":"Actualización e idempotencia","start":52,"end":56,"minutes":4,"text":"Upsert actualiza si existe una clave y crea si no existe; idempotencia depende de identidad estable.","action":"Ejecutar misma carga dos veces con identidad estable.","limit":"Conteo constante; idempotencia depende de operación y clave.","case":{"at":14,"q":"Reintento","input":"Claves P1–P3","variants":[{"label":"ID nuevo cada intento","result":"6 documentos","why":"Dos cargas generan identidades nuevas"},{"label":"Upsert por misma clave","result":"3 documentos","why":"Conserva identidad"}]},"lab":null},{"id":"S03.15","title":"Consistencia y concurrencia","start":56,"end":60,"minutes":4,"text":"Atomicidad documental no garantiza actualización coordinada de múltiples documentos y motores.","action":"Predecir dos escrituras concurrentes en un ejemplo controlado.","limit":"Resultado posible; no extrapolar garantía a múltiples documentos.","case":null,"lab":null},{"id":"S03.16","title":"Cuaderno: conectar","start":70,"end":80,"minutes":10,"text":"Ping confirma conexión, no permisos sobre todas las colecciones.","action":"Ejecutar preflight con versión y permisos; usar fixture si conexión falla.","limit":"Ping real o modo conceptual explícito.","case":null,"lab":{"index":26,"heading":"Paso 1 · Confirma qué motor te tocó","status":"sección temática identificada","gap":null}},{"id":"S03.17","title":"Cuaderno: cargar documentos","start":80,"end":89,"minutes":9,"text":"Carga con claves estables y compara identidades; repetir no debería duplicar si el diseño es idempotente.","action":"Ejecutar carga y contar claves distintas; repetir sin duplicar.","limit":"Colección o fixture, conteos y modo.","case":null,"lab":{"index":28,"heading":"El _id y la idempotencia","status":"sección temática identificada","gap":null}},{"id":"S03.18","title":"Cuaderno: consultar","start":89,"end":98,"minutes":9,"text":"Comprueba manualmente el filtro antes de confiar en el resultado de la consulta.","action":"Completar condición de entidad o rango y comparar IDs.","limit":"Resultado propio; límite no representa totalidad.","case":null,"lab":{"index":31,"heading":"find — buscar","status":"sección temática identificada","gap":null}},{"id":"S03.19","title":"Cuaderno: agregar","start":98,"end":107,"minutes":9,"text":"Unwind puede aumentar filas sin aumentar procesos únicos; compara cardinalidad de cada etapa.","action":"Cambiar agrupación y contrastar conteo contra control independiente.","limit":"Agregación equivalente; explicitar tratamiento de nulos.","case":null,"lab":{"index":73,"heading":"aggregate — resumir","status":"sección temática identificada","gap":null}},{"id":"S03.20","title":"Cuaderno: medir índice","start":107,"end":116,"minutes":9,"text":"Compara explain de la misma consulta antes y después del índice, con idénticos datos.","action":"Crear índice autorizado y comparar examinados y devueltos.","limit":"JSON de explain; si falta motor no usar mock como evidencia.","case":null,"lab":{"index":81,"heading":"Paso 3 · Tres consultas tuyas","status":"ampliación pendiente","gap":"Falta un experimento controlado de explain antes/después del índice."}},{"id":"S03.21","title":"Cuaderno: exportar expediente","start":116,"end":125,"minutes":9,"text":"Exporta expediente y contrato; verifica relectura de tipos e identidad sin secretos.","action":"Releer y comprobar contrato del expediente.","limit":"Documentos compatibles y manifestación de procedencia.","case":null,"lab":{"index":124,"heading":"Paso 7 · Cerrar en GitHub lo que dejamos abierto","status":"ampliación pendiente","gap":"Verificar exportación física y relectura."}},{"id":"S03.22","title":"Reto documental","start":125,"end":130,"minutes":5,"text":"Cambia el predicado o campo anidado y verifica los IDs esperados.","action":"Modificar predicado o índice y validar IDs en muestra controlada.","limit":"Consulta, resultados y alternativa; no texto libre.","case":null,"lab":null},{"id":"S03.23","title":"Error clinic","start":130,"end":135,"minutes":5,"text":"Timeout, autenticación y resultado vacío requieren diagnósticos distintos.","action":"Elegir diagnóstico correcto usando salida de su ejecución.","limit":"Código de error y ruta de recuperación.","case":null,"lab":null},{"id":"S03.24","title":"Relevo Atlas","start":135,"end":140,"minutes":5,"text":"Atlas recibe el expediente y la consulta reproducible; cambiar de entorno no cambia el grano.","action":"Verificar campos y exportar configuración sin URI privada.","limit":"Contrato de expedientes; separar entorno de datos.","case":null,"lab":null},{"id":"S03.25","title":"Cierre MongoDB","start":140,"end":150,"minutes":10,"text":"Explica el modelo documental, un pipeline y la evidencia del plan, no solo sintaxis.","action":"Seleccionar modelo y límite con evidencia de su consulta.","limit":"Autochequeo y expediente; no confundir plan con tiempo real.","case":null,"lab":null}],"control":{"at":5,"title":"Crecimiento de activos","label":"Activos por documento","min":1,"max":10000,"step":1,"initial":100},"blocks":[{"title":"Cuándo una fila no basta","range":"7–13","concept":"Un artículo puede contener listas y campos variables; aplanar puede perder cardinalidad o contexto.","task":"Compara noticia y fila SECOP.","evidence":"Grano y estructura.","excerpt":"# Traemos las noticias ya recolectadas y las miramos SIN base de datos todavía.\nimport urllib.request, json\nfrom collections import Counter\n\nURL_NOTICIAS = \"https://raw.githubusercontent.com/jazaineam1/BigData2026/main/Datos/noticias_contratacion_2026.json\"\n\nwith urllib.request.urlopen(URL_NOTICIAS) as r:\n    noticias = json.loads(r.read().decode(\"utf-8\"))\n\nprint(\"Noticias:\", len(noticias))\nfechas = sorted(n[\"publicado\"][:10] for n in noticias)\nprint(\"Van desde\", fechas[0], \"hasta\", fechas[-1])\n\n# 1) ¿Todas las noticias tienen los mismos campos?\npresencia = Counter(k for n in noticias for k in n)\nprint()\nprint(\"Presencia de cada campo (cuántas noticias lo traen):\")\nfor campo, veces in presencia.most_common():\n    marca = \"\" if veces == len(noticias) else \"   \u003c-- NO está en todas\"\n    print(f\"  {campo:14s} {veces:4d}/{len(noticias)}{marca}\")\n\n# 2) ¿Cuántas etiquetas trae cada noticia?\nn_etiquetas = [len(n[\"etiquetas\"]) for n in noticias]\nn_imagenes = [len(n[\"imagenes\"]) for n in noticias]\nprint()\nprint(f\"Etiquetas por noticia: mínimo {min(n_etiquetas)}, máximo {max(n_etiquetas)}\")\nprint(f\"Imágenes por noticia:  mínimo {min(n_imagenes)}, máximo {max(n_imagenes)}\")\n","excerptTruncated":true},{"title":"JSON, BSON y consistencia","range":"14–23","concept":"JSON representa objetos; BSON añade tipos binarios. Replicar copia datos, fragmentar los reparte. CAP analiza restricciones durante particiones de red.","task":"Localiza campos anidados e identidad; distingue campo ausente de nulo.","evidence":"Documento inspeccionado.","excerpt":"# Miramos UNA noticia completa, con su estructura a la vista.\nfrom pprint import pprint\n\nn = noticias[0]\n\nprint(\"CAMPOS DE PRIMER NIVEL\")\nfor campo, valor in n.items():\n    if isinstance(valor, list):\n        print(f\"  {campo:12s} -> lista con {len(valor)} elementos\")\n    elif isinstance(valor, dict):\n        print(f\"  {campo:12s} -> objeto anidado\")\n    else:\n        print(f\"  {campo:12s} -> {str(valor)[:60]}\")\n\nprint()\nprint(\"DENTRO DEL ARREGLO 'etiquetas' (primeras 2):\")\npprint(n[\"etiquetas\"][:2])\n\nprint()\nprint(\"DENTRO DEL ARREGLO 'cuerpo' (un bloque de cada tipo que trae esta noticia):\")\nvistos = set()\nfor b in n[\"cuerpo\"]:\n    if b.get(\"tipo\") not in vistos:\n        vistos.add(b.get(\"tipo\"))\n        print(\"  \", str(b.get(\"tipo\")), \"-> claves:\", [k for k in b if k != \"tipo\"])","excerptTruncated":false},{"title":"Motor y consultas","range":"25–49","concept":"find filtra, proyección selecciona campos y limit acota resultados. Un cursor no es una lista; $gt compara.","task":"Carga noticias en motor declarado y cambia operador y umbral.","evidence":"Filtro y resultados propios.","excerpt":"# ── TEMA 1, sobre las noticias ─────────────────────────────────────────\n# count_documents cuenta sin traer nada: util cuando solo quieres el numero.\nprint(\"Noticias de mas de 800 palabras:\", coleccion.count_documents({\"n_palabras\": {\"$gt\": 800}}))\n\nfor n in coleccion.find({\"n_palabras\": {\"$gt\": 800}}, {\"titulo\": 1, \"n_palabras\": 1, \"_id\": 0}).limit(5):\n    print(n[\"n_palabras\"], \"|\", n[\"titulo\"][:64])","excerptTruncated":false},{"title":"Índice, agregación y cruces","range":"51–123 (esencial 74–76 y 101–114)","concept":"Un índice reduce candidatos a cambio de almacenamiento y escrituras; una agregación transforma por etapas. Coincidir por entidad no acredita el mismo contrato.","task":"Agrupa noticias; ejecuta explain controlado del bloque final si hay MongoDB real; contrasta la bandeja.","evidence":"Conteos y documentos examinados; motor declarado.","excerpt":"# ── 7. Lo mismo sobre las noticias: cuantas hay por seccion ────────────\nresultado = coleccion.aggregate([\n    {\"$group\": {\"_id\": \"$seccion\", \"cuantas\": {\"$sum\": 1}}},\n    {\"$sort\": {\"cuantas\": -1}},\n    {\"$limit\": 5},\n])\n\nfor fila in resultado:\n    print(f\"{fila['_id'][:34]:34s} {fila['cuantas']:4d}\")","excerptTruncated":false},{"title":"Expediente documental","range":"124–129","concept":"La ficha conserva identidad, fuente y campos de consulta. Los apéndices son profundización, no prerrequisito.","task":"Modifica tres consultas y confirma expediente del producto.","evidence":"Expedientes y evidencia de consultas.","excerpt":"# 3.1 — COMPLÉTALA TÚ. Solo cambia el valor de SECCION.\n\n# ── Primero, una pista: que secciones existen y cuantas noticias tiene cada una.\n#    (Esto es una agregacion; la explicamos a fondo en el Paso 5. Por ahora\n#     solo lee el resultado: nombre de la seccion y su conteo.)\nprint(\"Las 10 secciones con mas noticias:\")\nfor fila in coleccion.aggregate([\n    {\"$group\": {\"_id\": \"$seccion\", \"n\": {\"$sum\": 1}}},   # cuenta por seccion\n    {\"$sort\":  {\"n\": -1}},                                # de mayor a menor\n    {\"$limit\": 10},                                        # solo las 10 primeras\n]):\n    print(f\"   {fila['_id']:38s} {fila['n']:4d} noticias\")\n\n\n# ── Ahora TU consulta. Elige una seccion de la lista de arriba.\nSECCION = \"salud\"      # \u003c--- CAMBIA ESTO\n\nprint()\nprint(f\"Noticias de la seccion '{SECCION}':\")\n\nresultado = coleccion.find(\n    {\"seccion\": SECCION},        # FILTRO:     solo las de esa seccion\n    {\"titulo\": 1, \"_id\": 0},     # PROYECCION: solo el titulo, sin el _id\n).limit(10)                      # y como mucho 10 resultados\n\nfor n in resultado:\n    print(\"  -\", n[\"titulo\"][:78])","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":55},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":9,"title":"Predicados sobre arrays","concept":"P1 tiene activo A inválido y B válido; P2, A válido y B inválido; P3, B válido. Dos predicados independientes pueden cumplirse en elementos distintos. $elemMatch exige que un mismo elemento cumpla ambos. Una consulta veloz con semántica incorrecta sigue siendo incorrecta.","pred":"¿P1 satisface la intención de encontrar un A válido?","fields":[{"label":"Tipo (0=A,1=B)","min":0,"max":1,"step":1,"value":0},{"label":"Estado (0=no,1=sí)","min":0,"max":1,"step":1,"value":1}],"interpret":"Separa coincidencia independiente de coincidencia conjunta. La diferencia es un falso positivo respecto de la intención definida; no una medida de rendimiento.","challenge":"Cambia tipo y estado, anticipa los IDs y escribe la expresión equivalente de MongoDB en el cuaderno.","limit":"Evaluación local de documentos ficticios, no ejecución MongoDB."}},{"id":"04","title":"¿Qué cambia con almacenamiento administrado?","problem":"Laura necesita persistir los documentos sin depender de una sesión Colab.","mission":"Crear bandeja","original":null,"notebook":{"path":"Cuadernos/4_Atlas_Cassandra_Laura.ipynb","ref":"mejora-pedagogica-integral","cells":39,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/4_Atlas_Cassandra_Laura.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/4_Atlas_Cassandra_Laura.ipynb"},"quiz":{"question":"¿Qué significa replicar?","options":["Dividir filas en fragmentos","Mantener copias de datos","Aumentar columnas"],"feedback":["Eso describe fragmentación.","Correcto: se conservan copias.","No cambia el esquema por sí mismo."]},"slides":[{"id":"S04.01","title":"La bandeja persistente","start":0,"end":3,"minutes":3,"text":"Persistencia permite reabrir un expediente después de cerrar el cliente sin reconstruirlo.","action":"Elegir qué datos deben persistir y cuáles son temporales.","limit":"Requisitos de persistencia; memoria no sustituye almacenamiento.","case":null,"lab":null},{"id":"S04.02","title":"Revisión de expedientes","start":3,"end":5,"minutes":2,"text":"Comprueba identidad y versión de documentos antes de persistirlos.","action":"Seleccionar versión compatible y detectar inconsistencia de identidad.","limit":"Contrato de entrada; fixture identificado.","case":null,"lab":null},{"id":"S04.03","title":"Cliente y servidor","start":5,"end":9,"minutes":4,"text":"DNS resuelve nombres, TLS protege comunicación y autenticación verifica identidad; son etapas distintas.","action":"Asociar cuatro fallos a etapas de conexión.","limit":"Mapa de errores; no imprimir URI.","case":null,"lab":null},{"id":"S04.04","title":"Servicio gestionado","start":9,"end":13,"minutes":4,"text":"Servicio gestionado delega operación de infraestructura, no diseño de consultas ni control de datos.","action":"Seleccionar tareas del proveedor y tareas del usuario.","limit":"Responsabilidades; servicio gestionado no garantiza costo cero.","case":null,"lab":null},{"id":"S04.05","title":"Red y acceso","start":13,"end":17,"minutes":4,"text":"La lista de acceso y los permisos limitan quién puede conectar, leer y escribir.","action":"Interpretar dos errores simulados de autenticación y red.","limit":"Diagnóstico y remedio seguro; no divulgar secreto.","case":null,"lab":null},{"id":"S04.06","title":"Persistencia y reinicio","start":17,"end":21,"minutes":4,"text":"Variables del runtime desaparecen al reiniciar; el estado remoto persistido puede recuperarse.","action":"Predecir qué sobrevive al reinicio y comprobar una lectura.","limit":"Identidad recuperada; no confundir caché con persistencia.","case":{"at":6,"q":"Estado y reinicio","input":"Variable del runtime y documento guardado remotamente","variants":[{"label":"Cerrar runtime","result":"Variable se pierde","why":"Estado temporal"},{"label":"Reconectar cliente","result":"Leer documento persistido","why":"No recrea datos"}]},"lab":null},{"id":"S04.07","title":"Réplicas y disponibilidad","start":21,"end":24,"minutes":3,"text":"Replicar crea copias. Una secundaria puede mostrar una versión anterior durante una demora de aplicación.","action":"Variar demora de réplica y observar visibilidad de escritura.","limit":"Simulación etiquetada; no atribuir nodos físicos.","case":{"at":7,"q":"Demora de réplica","input":"Escritura t=0, copia aplica t=3","variants":[{"label":"Lectura t=1","result":"Versión anterior posible","why":"No aplicada aún"},{"label":"Lectura t=4","result":"Nueva versión bajo supuesto","why":"Ya aplicada"}]},"lab":null},{"id":"S04.08","title":"Consistencia de lectura","start":24,"end":27,"minutes":3,"text":"Consistencia de lectura y durabilidad de escritura son propiedades distintas.","action":"Comparar dos políticas conceptuales bajo retraso de réplica.","limit":"Versiones visibles; consistencia no equivale a durabilidad.","case":null,"lab":null},{"id":"S04.09","title":"Fragmentación frente a réplica","start":27,"end":30,"minutes":3,"text":"Fragmentación reparte datos distintos; réplica copia esos datos para disponibilidad bajo condiciones.","action":"Variar claves y réplicas en una ilustración y comparar almacenamiento.","limit":"Mapa conceptual; no afirmar sharding activo en Atlas gratuito.","case":{"at":9,"q":"Copias y particiones","input":"2 piezas de 100 MB","variants":[{"label":"1 copia por pieza","result":"200 MB","why":"2×100"},{"label":"2 copias","result":"400 MB","why":"2×100×2"}]},"lab":null},{"id":"S04.10","title":"Vista y consulta","start":30,"end":35,"minutes":5,"text":"Una vista lógica conserva una consulta; la salida puede cambiar con la colección base.","action":"Comparar consulta base y vista en un escenario con cambio de datos.","limit":"Resultado esperado; vista no siempre materializada.","case":null,"lab":null},{"id":"S04.11","title":"Datos faltantes","start":35,"end":39,"minutes":4,"text":"Null, ausencia y cero tienen significado distinto; rellenar todos con cero modifica información.","action":"Cambiar regla de completitud y comparar filas incluidas.","limit":"Conteos por estado; no imputar sin justificación.","case":{"at":11,"q":"Faltantes","input":"P1=0, P2=null, P3 ausente","variants":[{"label":"Valor cero","result":"P1","why":"Cero conocido"},{"label":"Faltante","result":"P2 y P3","why":"Estados distintos de cero"}]},"lab":null},{"id":"S04.12","title":"Bandeja por prioridades","start":39,"end":43,"minutes":4,"text":"Priorizar faltantes permite organizar revisión, no identificar fraude.","action":"Modificar umbral de faltantes y comprobar ranking o categorías.","limit":"Regla y conteo; prioridad no es acusación.","case":null,"lab":null},{"id":"S04.13","title":"Carga repetible","start":43,"end":47,"minutes":4,"text":"Una identidad nueva en cada intento puede duplicar documentos si falla y se repite la carga.","action":"Simular fallo entre dos lotes y reintentar uno.","limit":"Claves y versiones; no borrar originales.","case":null,"lab":null},{"id":"S04.14","title":"Prueba de recuperación","start":47,"end":51,"minutes":4,"text":"Cerrar y reabrir cliente prueba reconexión, no failover de nodos.","action":"Desconectar conceptualmente cliente y ensayar reconexión autorizada.","limit":"Registro de reconexión; no llamar failover a un ping.","case":null,"lab":null},{"id":"S04.15","title":"Comparación de alternativas","start":51,"end":55,"minutes":4,"text":"Un archivo basta para consulta individual; un servicio facilita acceso compartido pero depende de red.","action":"Variar latencia y necesidad de usuarios concurrentes.","limit":"Decisión condicionada; no prometer SLA.","case":null,"lab":null},{"id":"S04.16","title":"Cuaderno: preflight Atlas","start":65,"end":75,"minutes":10,"text":"Comprueba conexión y permiso sin imprimir credenciales; registra el modo real.","action":"Ejecutar conexión en entorno limpio sin imprimir secreto.","limit":"Estado real; contingencia si cuenta no disponible.","case":null,"lab":{"index":10,"heading":"ServerSelectionTimeoutError","status":"sección temática identificada","gap":null}},{"id":"S04.17","title":"Cuaderno: persistir muestra","start":75,"end":85,"minutes":10,"text":"Carga, cuenta IDs y vuelve a leer desde un cliente nuevo para probar persistencia.","action":"Repetir carga y leer desde cliente nuevo.","limit":"Persistencia observada; no declarar replicación medida.","case":null,"lab":{"index":13,"heading":"Crea la base en Atlas, y carga los dos archivos con Python","status":"sección temática identificada","gap":null}},{"id":"S04.18","title":"Cuaderno: consultas de bandeja","start":85,"end":95,"minutes":10,"text":"Una bandeja combina filtro, campos, orden y límite; especifica qué población representa.","action":"Cambiar criterio de completitud y observar IDs.","limit":"Bandeja propia; límites explícitos.","case":null,"lab":{"index":15,"heading":"En Atlas: consultas, agregación y dos vistas","status":"sección temática identificada","gap":null}},{"id":"S04.19","title":"Cuaderno: vista o alternativa","start":95,"end":105,"minutes":10,"text":"Una agregación equivalente no certifica que una vista se creó en el servicio.","action":"Comparar salida de vista y consulta base.","limit":"Equivalencia o limitación de permiso documentada.","case":null,"lab":{"index":15,"heading":"En Atlas: consultas, agregación y dos vistas","status":"sección temática identificada","gap":null}},{"id":"S04.20","title":"Cuaderno: reconectar","start":105,"end":115,"minutes":10,"text":"Reconecta sin destruir recursos y compara estado previo y posterior.","action":"Ejecutar consulta tras reconexión y comparar estado.","limit":"Evidencia de recuperación del cliente, no prueba de réplica.","case":null,"lab":{"index":13,"heading":"Crea la base en Atlas, y carga los dos archivos con Python","status":"ampliación pendiente","gap":"No se encontró una sección independiente de reconexión y relectura."}},{"id":"S04.21","title":"Cuaderno: exportar bandeja","start":115,"end":125,"minutes":10,"text":"Exporta criterio, versión e IDs; una lista sin contexto no reconstruye la bandeja.","action":"Releer y validar contrato.","limit":"Bandeja exportada; ninguna credencial persistida.","case":null,"lab":{"index":18,"heading":"Segunda mitad · De la vista de Atlas a la bandeja de Laura","status":"ampliación pendiente","gap":"Falta certificar exportación/relectura de bandeja."}},{"id":"S04.22","title":"Reto de persistencia","start":125,"end":130,"minutes":5,"text":"Cambia completitud y observa qué expedientes entran o salen.","action":"Modificar filtro y demostrar persistencia con traza.","limit":"Resultados propios y modo de conexión.","case":null,"lab":null},{"id":"S04.23","title":"Diagnóstico de fallos","start":130,"end":135,"minutes":5,"text":"Autenticación, timeout y resultado vacío no son sinónimos de ausencia de datos.","action":"Elegir recuperación contextual basada en salida real o fixture etiquetado.","limit":"Código de error y estado final.","case":null,"lab":null},{"id":"S04.24","title":"Relevo Cassandra","start":135,"end":140,"minutes":5,"text":"Cassandra necesita patrones explícitos de consulta por entidad, período o estado.","action":"Definir clave candidata y campos necesarios, sin diseñar Cassandra todavía.","limit":"Consultas con grano y cardinalidad.","case":null,"lab":null},{"id":"S04.25","title":"Cierre servicio gestionado","start":140,"end":150,"minutes":10,"text":"Una bandeja persistente exige lectura comprobada; alta disponibilidad requiere otra prueba.","action":"Responder controles sobre réplica, fragmentación y conexión con su bandeja.","limit":"Artefacto y autochequeo; no declarar alta disponibilidad probada.","case":null,"lab":null}],"control":{"at":9,"title":"Espacio de copias","label":"Copias por fragmento","min":1,"max":5,"step":1,"initial":2},"blocks":[{"title":"Motor, clúster y servicio","range":"3–7","concept":"MongoDB es el motor; Atlas administra infraestructura. Persistencia no equivale a disponibilidad; ping no demuestra recuperación.","task":"Predice qué sucede al cerrar Colab.","evidence":"Hipótesis comprobable.","excerpt":"# Reactivar en menos de 10 minutos: los mismos controles de la sesion 3.\nimport json, urllib.request\n\nwith urllib.request.urlopen(\"https://raw.githubusercontent.com/jazaineam1/BigData2026/main/Datos/noticias_contratacion_2026.json\") as r:\n    noticias = json.loads(r.read().decode(\"utf-8\"))\n\nlargas = sum(1 for n in noticias if (n.get(\"n_palabras\") or 0) > 800)\n\nprint(\"Noticias                    :\", len(noticias))\nprint(\"Con mas de 800 palabras      :\", largas)\nassert len(noticias) == 987 and largas == 189, \"estos dos numeros deben coincidir con la sesion 3\"\nprint(\"Coincide con la sesion 3. Seguimos.\")","excerptTruncated":false},{"title":"Conectar de forma segura","range":"8–14","concept":"Autenticación y red son distintas; no compartir URI ni tokens.","task":"Conecta Atlas propio o declara respaldo; diagnostica el error sin revelar secretos.","evidence":"Motor y conexión declarados.","excerpt":null},{"title":"Vistas y consultas","range":"15–19","concept":"Una vista guarda un pipeline lógico; no implica copia materializada.","task":"Crea vista en Atlas y recupera su resultado.","evidence":"Conteos y vista.","excerpt":"# Sacar de Atlas la vista que YA construiste en la interfaz -- no se vuelve a\n# calcular aqui, solo se trae para poder cruzarla con SECOP. Si estas en modo\n# de respaldo, la reconstruimos localmente con la MISMA regla que usaste en Atlas.\nimport json, urllib.request\n\nif \"menciones_clasificadas\" in db.list_collection_names():\n    menciones = list(db[\"menciones_clasificadas\"].find({}, {\"_id\": 0}))\nelse:\n    with urllib.request.urlopen(\"https://raw.githubusercontent.com/jazaineam1/BigData2026/main/Datos/entidades_en_noticias_2026.json\") as r:\n        entidades = json.loads(r.read().decode(\"utf-8\"))\n    for e in entidades:\n        n = e.get(\"noticias\", 0)\n        e[\"nivel_menciones\"] = \"alta\" if n >= 20 else \"media\" if n >= 5 else \"baja\"\n    menciones = entidades\n\nfrom collections import Counter\nniveles = Counter(m[\"nivel_menciones\"] for m in menciones)\nprint(\"Entidades por nivel de mencion:\", dict(niveles))\nassert dict(niveles) == {\"baja\": 111, \"media\": 25, \"alta\": 6}, \"deberia coincidir con Atlas\"","excerptTruncated":false},{"title":"Bandeja de Laura","range":"20–27","concept":"Nulo no es cero. Priorizar mediante regla transparente no significa detectar fraude.","task":"Ejecuta filtros y abre el primer enlace SECOP.","evidence":"Embudo y candidatos.","excerpt":"# La regla de priorizacion, en cuatro pasos explicitos. Nada de esto es un\n# modelo: es una regla que cualquiera puede leer y discutir.\nentidades_en_prensa = {m[\"entidad\"] for m in menciones}\n\n# 1) coincidencia EXACTA de entidad con la vista de noticias\npaso1 = secop[secop[\"entidad\"].isin(entidades_en_prensa)]\nprint(\"1) entidad coincide con prensa :\", len(paso1))\n\n# 2) modalidad que contiene 'directa'\npaso2 = paso1[paso1[\"modalidad_de_contratacion\"].str.contains(\"directa\", case=False, na=False)]\n\n# 3) respuestas NUMERICAS iguales a cero; los faltantes quedan EXCLUIDOS\n#    (fillna(0) los convertiria en \"cero\", que no es lo mismo que \"no se sabe\")\nrespuestas = pd.to_numeric(paso2[\"respuestas_al_procedimiento\"], errors=\"coerce\")\npaso3 = paso2[respuestas.eq(0)]\n\n# 4) orden: precio_base descendente, id_del_proceso ascendente como desempate\ncandidatos = paso3.sort_values(\n    [\"precio_base\", \"id_del_proceso\"], ascending=[False, True]\n).reset_index(drop=True)\n\nprint(\"2) + modalidad directa          :\", len(paso2))\nprint(\"3) + cero respuestas (sin NaN)  :\", len(paso3))\nprint()\nprint(\"Candidatos finales               :\", len(candidatos))\nassert len(paso1) == 163 and len(candidatos) == 77, \"la regla deberia dar 163 -> 77\"","excerptTruncated":false},{"title":"Persistencia y relevo","range":"28–38","concept":"La consulta operacional requiere un patrón estable; Cassandra aparecerá por esa necesidad.","task":"Guarda CSV y recupera bandeja; compara límite de filas.","evidence":"Bandeja y pregunta S05.","excerpt":"# CQL — la tabla se modela por como se va a preguntar, no por como se guarda la entidad.\ncql_crear_tabla = '''\nCREATE TABLE compras_claras.prioridades_por_corte_departamento (\n    corte date,\n    departamento text,\n    valor_base bigint,\n    id_proceso text,\n    entidad text,\n    objeto text,\n    modalidad text,\n    respuestas int,\n    noticias_entidad int,\n    nivel_menciones text,\n    estado_revision text,\n    url_secop text,\n    criterio text,\n    PRIMARY KEY ((corte, departamento), valor_base, id_proceso)\n) WITH CLUSTERING ORDER BY (\n    valor_base DESC,\n    id_proceso ASC\n);\n'''\nprint(cql_crear_tabla)","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":60},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":11,"title":"Faltantes y bandeja","concept":"Cero afirma una cantidad conocida. Null indica valor no asignado y ausencia indica que el atributo no existe. Una regla puede seleccionar faltantes de manera explícita sin convertirlos en cero. Persistir significa poder recuperar el estado después de reconectar, no simplemente conservar una variable.","pred":"¿Debe entrar un faltante por la regla cantidad menor o igual a cero?","fields":[{"label":"Umbral","min":0,"max":5,"step":1,"value":0},{"label":"Incluir faltantes (0=no,1=sí)","min":0,"max":1,"step":1,"value":1}],"interpret":"La tabla conserva el estado original y la regla aplicada. Compara identidades seleccionadas, no solo cantidad.","challenge":"Busca dos configuraciones con igual número de resultados pero IDs distintos. Luego comprueba una consulta equivalente en Atlas.","limit":"Selección local; no demuestra reconexión ni replicación."}},{"id":"05","title":"¿Cómo diseñar desde la consulta?","problem":"La bandeja operacional exige recuperar casos por claves conocidas.","mission":"Resolver consultas","original":null,"notebook":{"path":"Cuadernos/5_Atlas_Cassandra_Query_First.ipynb","ref":"mejora-pedagogica-integral","cells":82,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/5_Atlas_Cassandra_Query_First.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/5_Atlas_Cassandra_Query_First.ipynb"},"quiz":{"question":"¿Qué condiciona la clave de partición?","options":["La consulta que queremos atender","El orden alfabético de columnas","El nombre del servicio"],"feedback":["Correcto: localiza la partición.","No define el patrón de acceso.","El proveedor no reemplaza el diseño."]},"slides":[{"id":"S05.01","title":"Dos consultas reales","start":0,"end":3,"minutes":3,"text":"Cassandra se diseña desde consultas previsibles, no desde una tabla universal.","action":"Elegir patrones prioritarios y sus parámetros de igualdad y rango.","limit":"Dos contratos de consulta; no comenzar con normalización.","case":null,"lab":null},{"id":"S05.02","title":"Recuperar la bandeja","start":3,"end":5,"minutes":2,"text":"Cuenta claves y tamaños lógicos antes de elegir partición; no son nodos físicos.","action":"Contar entidades distintas y detectar una clave demasiado frecuente.","limit":"Perfil inicial; no representar carga física.","case":null,"lab":null},{"id":"S05.03","title":"Modelo wide-column","start":5,"end":10,"minutes":5,"text":"Una tabla wide-column tiene filas identificadas por clave primaria
