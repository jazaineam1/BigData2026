 y agrupadas por partición.","action":"Representar un mismo proceso en dos tablas de consulta.","limit":"Dos representaciones; duplicación deliberada no es error automático.","case":null,"lab":null},{"id":"S05.04","title":"Clave de partición","start":10,"end":15,"minutes":5,"text":"La clave de partición asigna grupo lógico; agregar período puede reducir grupos demasiado grandes.","action":"Variar clave entidad frente a entidad-mes y observar tamaños.","limit":"Distribución lógica; no inferir token o nodo real.","case":{"at":4,"q":"Distribución lógica","input":"120 filas de E, 10 por mes","variants":[{"label":"Clave E","result":"1 partición de 120","why":"Concentración"},{"label":"E y mes","result":"12 particiones de 10","why":"Año requiere más consultas"}]},"lab":null},{"id":"S05.05","title":"Clustering columns","start":15,"end":19,"minutes":4,"text":"Clustering ordena registros dentro de la partición, por ejemplo fecha e ID.","action":"Ordenar cinco procesos de una entidad por fecha e ID.","limit":"Orden previsto; clustering no significa clúster.","case":{"at":5,"q":"Clustering","input":"Fechas 1,3,5,7 dentro de E","variants":[{"label":"1–3 inclusive","result":"2 filas","why":"1 y 3"},{"label":"3–7 inclusive","result":"3 filas","why":"3,5,7"}]},"lab":null},{"id":"S05.06","title":"Desnormalización","start":19,"end":23,"minutes":4,"text":"Desnormalizar crea representaciones para consultas distintas y obliga a mantener sus escrituras coherentes.","action":"Cambiar un estado y localizar qué tablas requieren escritura.","limit":"Mapa de escrituras; no ocultar consistencia.","case":null,"lab":null},{"id":"S05.07","title":"CQL desde cero","start":23,"end":27,"minutes":4,"text":"CQL parece SQL pero la clave determina patrones de acceso admitidos.","action":"Predecir qué consulta usa clave completa o parcial válida.","limit":"Sintaxis y salida; SQL similar no implica mismas capacidades.","case":null,"lab":null},{"id":"S05.08","title":"Consulta por igualdad","start":27,"end":31,"minutes":4,"text":"La igualdad sobre clave completa localiza una partición; verifica IDs devueltos.","action":"Variar entidad y comparar IDs con referencia pandas.","limit":"Conjunto equivalente; no escanear toda tabla.","case":null,"lab":null},{"id":"S05.09","title":"Consulta por rango","start":31,"end":35,"minutes":4,"text":"Un rango de clustering opera dentro de la partición conocida.","action":"Variar rango de fechas y comprobar límites inclusivos.","limit":"IDs y límites; no permitir rango arbitrario sin diseño.","case":null,"lab":null},{"id":"S05.10","title":"Tamaño de particiones","start":35,"end":40,"minutes":5,"text":"Tamaño de partición depende de filas, ancho y overhead, no solo del conteo.","action":"Modificar estrategia de bucket temporal y comparar máximos.","limit":"Máximo y distribución; estimación no es medida del nodo.","case":null,"lab":null},{"id":"S05.11","title":"Concentración y skew","start":40,"end":44,"minutes":4,"text":"Skew es desigualdad de distribución; tráfico real requiere métricas de demanda.","action":"Inyectar una entidad frecuente en copia y comparar p50, p95 y máximo.","limit":"Histograma; frecuencia no mide tráfico real.","case":{"at":11,"q":"Skew","input":"100 filas, cuatro grupos","variants":[{"label":"25,25,25,25","result":"Máximo 25","why":"Uniforme"},{"label":"70,10,10,10","result":"Máximo 70","why":"Media sigue en 25"}]},"lab":null},{"id":"S05.12","title":"Replicación conceptual","start":44,"end":48,"minutes":4,"text":"RF representa copias; niveles de consistencia dependen del servicio y su configuración.","action":"Variar RF, R y W en ejemplos de quórum y observar límites.","limit":"Relación conceptual; no asumir configuración administrada.","case":null,"lab":null},{"id":"S05.13","title":"Escritura repetida","start":48,"end":52,"minutes":4,"text":"Escribir con la misma clave puede actualizar la fila; cambiar un componente crea otra identidad.","action":"Ejecutar dos escrituras a misma clave y comparar estado.","limit":"Conteo y versión; no confundir timestamp con fecha del negocio.","case":{"at":13,"q":"Identidad","input":"Clave (E,fecha,ID)","variants":[{"label":"Repetir clave","result":"1 fila","why":"Misma identidad"},{"label":"Cambiar ID","result":"2 filas","why":"Clave diferente"}]},"lab":null},{"id":"S05.14","title":"Patrones malos","start":52,"end":56,"minutes":4,"text":"ALLOW FILTERING no corrige un modelo que no responde al patrón de consulta.","action":"Cambiar filtro y elegir rediseño de tabla en lugar de escaneo indiscriminado.","limit":"Decisión con patrón de consulta; no usar ALLOW FILTERING por defecto.","case":null,"lab":null},{"id":"S05.15","title":"Comparación MongoDB/Cassandra","start":56,"end":60,"minutes":4,"text":"MongoDB y Cassandra pueden coexistir porque resuelven accesos diferentes.","action":"Elegir motor para dos preguntas distintas y registrar criterio.","limit":"Matriz de decisiones; no ranking universal.","case":null,"lab":null},{"id":"S05.16","title":"Cuaderno: preflight CQL","start":70,"end":80,"minutes":10,"text":"Verifica keyspace, versión y permisos; pandas no demuestra ejecución CQL.","action":"Ejecutar consulta de estado o contingencia local identificada.","limit":"Acceso real o pendiente; no simular Astra.","case":null,"lab":{"index":44,"heading":"Modelo mental — cuatro nombres antes de hacer clic","status":"sección temática identificada","gap":null}},{"id":"S05.17","title":"Cuaderno: tabla entidad","start":80,"end":89,"minutes":9,"text":"Diseña la primera tabla para la consulta por entidad y compara con control independiente.","action":"Cargar muestra y consultar entidad con rango.","limit":"CQL, IDs y control; no borrar recursos ajenos.","case":null,"lab":{"index":45,"heading":"8. PRODUCTO 3 · Tramo A — implementar la pregunta en Astra/CQL","status":"sección temática identificada","gap":null}},{"id":"S05.18","title":"Cuaderno: tabla estado-período","start":89,"end":98,"minutes":9,"text":"Una segunda consulta puede requerir otra tabla con 2026/main/Datos/entidades_en_noticias_2026.json\") as r:\n        menciones = json.loads(r.read().decode(\"utf-8\"))\n    for e in menciones:\n        n = e.get(\"noticias\", 0)\n        e[\"nivel_menciones\"] = \"alta\" if n >= 20 else \"media\" if n >= 5 else \"baja\"\n\nniveles = Counter(m[\"nivel_menciones\"] for m in menciones)\nprint(\"Fuente:\", \"vista real de Atlas\" if vista_real else \"respaldo reproducible\")\nprint(\"Entidades:\", len(menciones))\nprint(\"Niveles:\", dict(niveles))\n\nassert len(menciones) == 142\nassert dict(niveles) == {\"baja\": 111, \"media\": 25, \"alta\": 6}","excerptTruncated":false},{"title":"Hipótesis y faltantes","range":"17–28","concept":"Una hipótesis puede refutarse; desconocido no es cero.","task":"Reproduce filtros y observa excluidos.","evidence":"Embudo y límite.","excerpt":"import pandas as pd\n\nsecop = pd.read_csv(\n    \"https://raw.githubusercontent.com/jazaineam1/BigData2026/main/Cuadernos/datos/secop_chunks/prueba_chunk_0000000.csv\",\n    low_memory=False,\n)\nprint(\"Procesos SECOP:\", len(secop))\nassert len(secop) == 1000\n\ncontexto_menciones = pd.DataFrame(menciones)[[\"entidad\", \"noticias\", \"nivel_menciones\"]].copy()\nassert contexto_menciones[\"entidad\"].is_unique\ncontexto_menciones = contexto_menciones.rename(columns={\"noticias\": \"noticias_entidad\"})\n\nentidades_en_prensa = set(contexto_menciones[\"entidad\"])\npaso1 = secop[secop[\"entidad\"].isin(entidades_en_prensa)]\npaso2 = paso1[\n    paso1[\"modalidad_de_contratacion\"].str.contains(\"directa\", case=False, na=False)\n]\nrespuestas = pd.to_numeric(paso2[\"respuestas_al_procedimiento\"], errors=\"coerce\")\npaso3 = paso2[respuestas.eq(0)]\n\ncandidatos = (\n    paso3\n    .merge(contexto_menciones, on=\"entidad\", how=\"left\", validate=\"many_to_one\")\n    .sort_values([\"precio_base\", \"id_del_proceso\"], ascending=[False, True])\n    .reset_index(drop=True)\n)\n","excerptTruncated":true},{"title":"Query-first y particiones","range":"29–41","concept":"La clave de partición localiza grupos; clustering ordena filas dentro de ellos. Una clave dominante puede concentrar carga.","task":"Diseña corte/departamento y compara clave alternativa.","evidence":"Contrato de consulta.","excerpt":"# ✏️ MODIFICA · aquí tu elección sí cambia la evidencia individual.\nconteo_departamentos = candidatos[\"departamento_entidad\"].dropna().astype(str).value_counts()\nopciones_departamento = conteo_departamentos.index.tolist()\n\nprint(\"Elige un departamento para tu evidencia individual:\")\nfor i, d in enumerate(opciones_departamento, start=1):\n    print(f\"{i:>2}. {d} ({conteo_departamentos[d]} candidatos)\")\n\nseleccion = int(input(\"Número de departamento: \").strip())\nif not 1 \u003c= seleccion \u003c= len(opciones_departamento):\n    raise ValueError(\"El número no corresponde a la lista mostrada.\")\n\ndepartamento_elegido = opciones_departamento[seleccion - 1]\ntop5_esperado_pd = (\n    candidatos[candidatos[\"departamento_entidad\"].astype(str) == departamento_elegido]\n    .sort_values([\"precio_base\", \"id_del_proceso\"], ascending=[False, True])\n    .head(5)\n)\nids_esperados_pd = top5_esperado_pd[\"id_del_proceso\"].astype(str).tolist()\n\nprint(\"Departamento elegido:\", departamento_elegido)\nprint(\"IDs esperados por pandas:\", ids_esperados_pd)","excerptTruncated":false},{"title":"CQL y referencia independiente","range":"42–64","concept":"INSERT actualiza por clave completa; UPDATE y DELETE requieren acceso adecuado. Comparar IDs con pandas evita validación circular.","task":"Ejecuta dos consultas en Astra si hay acceso; contrasta IDs.","evidence":"Resultados CQL y referencia.","excerpt":"# 🧠 ENTIENDE · verifica que pandas y Cassandra respondan la misma pregunta.\nif \"departamento_elegido\" not in globals() or \"ids_esperados_pd\" not in globals():\n    raise RuntimeError(\"Ejecuta primero Contrato de resultado.\")\n\ntop5_propio = list(session.execute(consulta, (CORTE_CLASE, departamento_elegido)))\nids_cql = [str(f.id_proceso) for f in top5_propio]\ncoinciden_cql_pd = ids_cql == ids_esperados_pd\n\nprint(\"Departamento     :\", departamento_elegido)\nprint(\"Esperado pandas :\", ids_esperados_pd)\nprint(\"Devuelto CQL    :\", ids_cql)\nprint(\"¿Coinciden?     :\", \"SÍ\" if coinciden_cql_pd else \"NO\")\n\nif not coinciden_cql_pd:\n    raise AssertionError(\"Revisa corte, departamento, carga y orden: los dos resultados no coinciden.\")","excerptTruncated":false},{"title":"Ancla para grafos","range":"65–81","concept":"El diseño sirve una pregunta; otra pregunta puede exigir otra tabla.","task":"Exporta ancla y compara concentración de grupos.","evidence":"Ancla S06.","excerpt":"import json\n\nif \"top5_esperado_pd\" in globals() and len(top5_esperado_pd):\n    opciones_ancla = top5_esperado_pd.reset_index(drop=True)\n    print(\"Elige el proceso que quieres llevar a S6:\")\n    for i, fila in opciones_ancla.iterrows():\n        print(\n            f\"{i+1:>2}. {fila['id_del_proceso']} | {fila['entidad']} | \"\n            f\"$ {float(fila['precio_base']):,.0f}\"\n        )\n    seleccion_ancla = int(input(\"Número de proceso para S6: \").strip())\n    if not 1 \u003c= seleccion_ancla \u003c= len(opciones_ancla):\n        raise ValueError(\"El número debe corresponder a uno de los procesos mostrados.\")\n    fila_ancla = opciones_ancla.iloc[seleccion_ancla - 1]\n    origen_eleccion_s06 = \"selección propia dentro del top pandas S05\"\nelse:\n    fila_ancla = candidatos.iloc[0]\n    seleccion_ancla = 1\n    origen_eleccion_s06 = \"respaldo: primer candidato de la bandeja S05\"\n    print(\"No existe top individual en memoria; se usa el primer candidato como respaldo.\")\n\nancla_s06 = {\n    \"id_proceso\": str(fila_ancla[\"id_del_proceso\"]),\n    \"referencia\": str(fila_ancla.get(\"referencia_del_proceso\", \"\")),\n    \"entidad\": str(fila_ancla[\"entidad\"]),\n    \"nit_entidad\": str(fila_ancla.get(\"nit_entidad\", \"\")),\n    \"departamento\": str(fila_ancla.get(\"departamento_entidad\", \"\")),\n    \"valor_base\": int(float(fila_ancla[\"precio_base\"])),","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":25},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":55},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":4,"title":"Query-first: diseñar buckets","concept":"E1 tiene diez filas por mes; E2 dos. Clave de partición agrupa registros; clustering ordena dentro del grupo. Añadir período reduce tamaño de grupo y aumenta la cantidad de grupos que toca una consulta larga. El tamaño lógico no mide tráfico ni cantidad de nodos.","pred":"Predice cuántos grupos toca una consulta de seis meses con buckets de tres.","fields":[{"label":"Meses por bucket","min":1,"max":12,"step":1,"value":3},{"label":"Mes inicial","min":1,"max":12,"step":1,"value":1},{"label":"Meses consultados","min":1,"max":12,"step":1,"value":6}],"interpret":"La tabla muestra clave, intervalo, conteo y si toca el rango. Los buckets al final del año pueden ser más pequeños. Un rango se limita al año disponible.","challenge":"Escoge bucket para dos meses y máximo 40 filas por grupo. Escribe una clave primaria CQL apropiada.","limit":"Distribución lógica sintética, no hashing, nodos o latencia Cassandra."}},{"id":"06","title":"¿Qué revelan las relaciones?","problem":"Laura quiere identificar proveedores históricos compartidos sin inventar adjudicaciones.","mission":"Explorar conexiones","original":null,"notebook":{"path":"Cuadernos/6_Neo4j_Contexto_Relacional.ipynb","ref":"mejora-pedagogica-integral","cells":119,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/6_Neo4j_Contexto_Relacional.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/6_Neo4j_Contexto_Relacional.ipynb d.","limit":"Resultados equivalentes donde corresponde.","case":null,"lab":{"index":79,"heading":"8. Verificación — ¿Neo4j y pandas cuentan lo mismo?","status":"sección temática identificada","gap":null}},{"id":"S06.21","title":"Cuaderno: exportar contexto","start":116,"end":125,"minutes":9,"text":"Exporta subgrafo con extremos, relación, versión y origen; no solo una imagen.","action":"Releer y validar extremos de las aristas.","limit":"Contexto de expediente para búsqueda.","case":null,"lab":{"index":105,"heading":"Comprueba tu entrega","status":"ampliación pendiente","gap":"Verificar exportación de nodos y aristas con procedencia."}},{"id":"S06.22","title":"Reto relacional","start":125,"end":130,"minutes":5,"text":"Cambia nodo o profundidad y anticipa el alcance de la consulta.","action":"Modificar Cypher y verificar con datos propios.","limit":"Consulta y resultado; no responder con conclusión causal.","case":null,"lab":null},{"id":"S06.23","title":"Lectura del grafo","start":130,"end":135,"minutes":5,"text":"La posición de un nodo en pantalla es un diseño visual, no prueba de relación.","action":"Seleccionar nodo y comparar relación directa con recorrido.","limit":"Decisión contextualizada; evitar inferencia de fraude.","case":null,"lab":null},{"id":"S06.24","title":"Relevo búsqueda lexical","start":135,"end":140,"minutes":5,"text":"S07 recibe campos de texto con IDs que conservan contexto relacional.","action":"Exportar documentos y lista de preguntas de búsqueda.","limit":"Corpus con grano y procedencia para S07.","case":null,"lab":null},{"id":"S06.25","title":"Cierre grafos","start":140,"end":150,"minutes":10,"text":"El objetivo es consultar y validar relaciones sin inventarlas ni exagerar conclusiones.","action":"Resolver controles basados en un resultado de caminos propio.","limit":"Subgrafo, trazabilidad y diagnóstico.","case":null,"lab":null}],"control":{"at":6,"title":"Grado en un grafo estrella","label":"Aristas adicionales de A","min":0,"max":10,"step":1,"initial":2},"blocks":[{"title":"Identidad y procedencia","range":"1–12","concept":"Entidad, proceso y proveedor tienen identidades distintas. No unir por coincidencia de nombre.","task":"Recupera ancla S05 o muestra autorizada.","evidence":"Identidad y fuente.","excerpt":"#@title Elegir ejemplo del curso o mi JSON de S5 { display-mode: \"form\" }\nfrom pathlib import Path\nimport json\nUSAR_MI_ANCLA_S5 = False  #@param {type:\"boolean\"}\narchivo_s5 = Path(\"s05_ancla_s06.json\")\nif USAR_MI_ANCLA_S5 and not archivo_s5.is_file():\n    try:\n        from google.colab import files\n        print(\"Selecciona s05_ancla_s06.json\")\n        subidos = files.upload()\n        if \"s05_ancla_s06.json\" not in subidos:\n            raise ValueError(\"Debes seleccionar s05_ancla_s06.json o desactivar USAR_MI_ANCLA_S5.\")\n        archivo_s5.write_bytes(subidos[\"s05_ancla_s06.json\"])\n    except ImportError:\n        raise FileNotFoundError(\"Copia s05_ancla_s06.json junto al cuaderno o usa el ejemplo del curso.\")\nif USAR_MI_ANCLA_S5:\n    ancla_original = json.loads(archivo_s5.read_text(encoding=\"utf-8-sig\"))\n    faltantes = [k for k in [\"id_proceso\", \"entidad\", \"nit_entidad\"] if not str(ancla_original.get(k, \"\")).strip()]\n    if faltantes:\n        raise ValueError(f\"El JSON no contiene estos campos obligatorios: {faltantes}\")\n    origen_ancla = \"archivo propio S5\"\nelse:\n    ancla_original = dict(manifest[\"ancla_pedagogica\"])\n    origen_ancla = \"ejemplo versionado del curso\"\nprint(\"✅ Punto de partida listo\")\nprint(\"Proceso:\", ancla_original[\"id_proceso\"])\nprint(\"Entidad:\", ancla_original[\"entidad\"])\nprint(\"NIT:\", ancla_original[\"nit_entidad\"])","excerptTruncated":true},{"title":"Grafo pequeño y Cypher","range":"13–40","concept":"Nodo representa entidad; relación un hecho; MATCH busca patrones; DISTINCT evita caminos repetidos; MERGE protege identidad con restricciones adecuadas.","task":"Construye y consulta patrón mínimo.","evidence":"Patrón y conteos.","excerpt":"# Ejemplo guiado: la respuesta ya está escrita para que observes la sintaxis.\nRELACION_PROCESO_PROVEEDOR = \"ADJUDICADO_A\"\npatron_estudiante = f\"(p:Proceso)-[:{RELACION_PROCESO_PROVEEDOR}]->(v:Proveedor)\"\nprint(\"✅ Patrón:\", patron_estudiante)\nprint(\"Se lee: el Proceso p fue ADJUDICADO_A el Proveedor v.\")","excerptTruncated":false},{"title":"Cargar hechos reales","range":"41–55","concept":"UNWIND convierte lista a filas; constraints protegen claves. Repetir carga debe preservar nodos y relaciones.","task":"Carga extracto y comprueba repetición.","evidence":"Conteos antes/después.","excerpt":"if modo_neo4j:\n    consulta_tamano = '''\n    MATCH (n) WHERE n:Entidad OR n:Proceso OR n:Proveedor\n    WITH count(n) AS nodos\n    MATCH ()-[r:PUBLICA|ADJUDICADO_A]->()\n    RETURN nodos, count(r) AS relaciones\n    '''\n    antes_carga = driver.execute_query(consulta_tamano).records[0].data()\n    driver.execute_query(query_base, filas=rows)\n    driver.execute_query(query_proveedor, filas=rows_proveedor)\n    despues_carga = driver.execute_query(consulta_tamano).records[0].data()\n    carga_repetida = antes_carga == despues_carga\n    assert carga_repetida, \"La carga repetida alteró los conteos. Revisa IDs y restricciones.\"\n    print(\"Carga repetida sin crecimiento:\", carga_repetida, \"|\", despues_carga)\nelse:\n    carga_repetida = None\n    print(\"Idempotencia en Neo4j: PENDIENTE.\")","excerptTruncated":false},{"title":"Explorar conexiones","range":"56–99","concept":"Grado mide conexiones inmediatas; un puente conecta entidades. Conectividad no es irregularidad.","task":"Cambia proveedor y contrasta Neo4j con pandas.","evidence":"Vecindario e IDs.","excerpt":"#@title Verificar otras entidades { display-mode: \"form\" }\nOPERADOR_EXCLUSION = \"\u003c>\"  # significa \"diferente de\"  # sustituye por el operador distinto de de Cypher\nif OPERADOR_EXCLUSION != \"\u003c>\":\n    raise ValueError(\"Necesitamos excluir la entidad ancla, no seleccionarla.\")\nconsulta_otras = f'''\nMATCH (otra:Entidad)-[:PUBLICA]->(:Proceso)-[:ADJUDICADO_A]->(v:Proveedor {{nit:$proveedor}})\nWHERE otra.nit {OPERADOR_EXCLUSION} $ancla\nRETURN count(DISTINCT otra) AS otras_entidades\n'''\nif modo_neo4j:\n    otras_entidades = int(driver.execute_query(consulta_otras, proveedor=str(proveedor_elegido[\"nit_proveedor\"]), ancla=nit_deseado).records[0][\"otras_entidades\"])\nelse:\n    otras_entidades = int(vecindario_df.loc[vecindario_df[\"nit_entidad\"].ne(nit_deseado), \"nit_entidad\"].nunique())\nesperadas_otras = int(proveedor_elegido[\"entidades_conectadas\"]) - 1\nassert otras_entidades == esperadas_otras\nprint(\"Otras entidades:\", otras_entidades, \"| esperado:\", esperadas_otras)\nrazon_exploracion = f\"Exploro {proveedor_elegido['proveedor']} porque conecta {int(proveedor_elegido['entidades_conectadas'])} entidades en el extracto. Esta conectividad describe estructura; no demuestra irregularidad.\"\nprint(\"Ejemplo de interpretación:\", razon_exploracion)","excerptTruncated":false},{"title":"Entregar contexto","range":"100–108","concept":"Los caminos deben conservar hechos verificables y límites; apéndices A1–A10 son ampliaciones.","task":"Guarda ficha y selecciona un expediente para búsqueda.","evidence":"Contexto S07.","excerpt":"#@title Guardar ficha y archivo para S7 { display-mode: \"form\" }\nexport = vecindario_df.merge(\n    datos[[\"id_proceso\", \"descripcion\", \"modalidad\", \"url_secop\"]].drop_duplicates(\"id_proceso\"),\n    left_on=\"proceso\", right_on=\"id_proceso\", how=\"left\", validate=\"many_to_one\"\n)\nassert export[\"id_proceso\"].notna().all(), \"Hay procesos sin correspondencia en el extracto.\"\nexport[\"nit_proveedor_explorado\"] = str(proveedor_elegido[\"nit_proveedor\"])\nexport[\"motor_ejecucion\"] = \"Neo4j\" if modo_neo4j else \"pandas; Neo4j pendiente\"\nexport.to_json(\"s06_contexto_procesos.jsonl\", orient=\"records\", lines=True, force_ascii=False)\n\nhito = f'''# Hito S06 — Ficha relacional de revisión\n\n- Autor: {autor}\n- Fecha UTC: {fecha_ejecucion}\n- SHA256 del extracto: {huella_datos}\n- Carga repetida: {carga_repetida if carga_repetida is not None else \"PENDIENTE\"}\n- Consulta propia: {procesos_propios} procesos; motor {\"Neo4j\" if modo_neo4j else \"pandas; Cypher pendiente\"}\n- Motor: {\"Neo4j\" if modo_neo4j else \"pandas; Neo4j pendiente\"}\n- Origen del ancla: {origen_ancla}\n- Proceso elegido en S5: {ancla_original.get(\"id_proceso\", \"\")}\n- Proceso/entidad usados para el grafo: {ancla_trabajo.get(\"id_proceso\", \"\")} — {ancla_trabajo.get(\"entidad\", \"\")}\n- Noticias / nivel: {ancla_trabajo.get(\"noticias_entidad\", \"\")} / {ancla_trabajo.get(\"nivel_menciones\", \"\")}\n- Respaldo pedagógico: {uso_respaldo_s06}\n- H1 (S5): 0/77 → refutada literalmente\n- H2-R (S6), desenlace pandas: {desenlace_h2r_pd}\n- H2-R (S6), desenlace Neo4j: {desenlace_h2r_neo}\n- pandas == Neo4j: {coinciden if coinciden is not None else \"PENDIENTE\"}\n- Proveedor que determina H2-R: {proveedor_h2r[\"nit_proveedor\"]} — {proveedor_h2r[\"proveedor\"]}","excerptTruncated":true}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":25},{"label":"Ejemplos y experimentación","minutes":30},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":55},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":10,"title":"Caminos y nodos únicos","concept":"A publica P1/P2 y ambos se vinculan a X; P2 también a Y. B publica P3 vinculado a X. Un camino enumera aristas; un destino es la identidad final. Dos caminos pueden llegar al mismo destino. DISTINCT cambia la cardinalidad de la proyección, no la red.","pred":"Predice caminos de dos saltos y destinos distintos desde A.","fields":[{"label":"Origen (0=A,1=B)","min":0,"max":1,"step":1,"value":0},{"label":"Saltos exactos","min":1,"max":2,"step":1,"value":2},{"label":"Excluir X (0=no,1=sí)","min":0,"max":1,"step":1,"value":0}],"interpret":"Lee las trayectorias dirigidas; filtrar X no borra aristas. En Cypher compara proyección con y sin DISTINCT.","challenge":"Formula una consulta de dos saltos desde B. Contrasta sus resultados con una tabla de aristas.","limit":"Recorrido real de grafo sintético en JS, no Neo4j ni inferencia de fraude."}},{"id":"07","title":"¿Cómo encuentra información un buscador?","problem":"Una búsqueda literal no siempre devuelve los documentos pertinentes.","mission":"Encontrar por palabras","original":"s07-del-vecindario-al-texto.html","notebook":{"path":"Cuadernos/7_Elasticsearch_BM25_Compras_Claras.ipynb","ref":"mejora-pedagogica-integral","cells":31,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/7_Elasticsearch_BM25_Compras_Claras.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/7_Elasticsearch_BM25_Compras_Claras.ipynb"},"quiz":{"question":"¿Qué mide Precision@5?","options":["Documentos pertinentes entre los cinco primeros","Tiempo de consulta","Tamaño del índice"],"feedback":["Correcto: requiere juzgar pertinencia.","Es latencia.","No mide relevancia."]},"slides":[{"id":"S07.01","title":"Encontrar un expediente","start":0,"end":3,"minutes":3,"text":"Un buscador ordena documentos según consulta y corpus; contains solo detecta coincidencia literal.","action":"Elegir documentos candidatos y criterio de relevancia antes del ranking.","limit":"Juicio inicial; no usar resultados del motor como verdad.","case":null,"lab":null},{"id":"S07.02","title":"Texto y campo","start":3,"end":5,"minutes":2,"text":"text se analiza; keyword conserva valor exacto para filtros e identidad.","action":"Elegir campos para buscar y campos para filtrar.","limit":"Mapping candidato; no tokenizar IDs indiscriminadamente.","case":null,"lab":null},{"id":"S07.03","title":"Análisis textual","start":5,"end":10,"minutes":5,"text":"El analizador tokeniza y normaliza. Observa los términos efectivos antes de explicar ranking.","action":"Variar análisis de dos frases y comparar tokens.","limit":"Lista de términos; no asumir sinónimos automáticos.","case":null,"lab":null},{"id":"S07.04","title":"Índice invertido","start":10,"end":15,"minutes":5,"text":"Índice invertido guarda documentos asociados a cada término y estadísticas útiles de frecuencia.","action":"Construir postings de tres documentos y resolver intersección.","limit":"IDs candidatos; índice invertido no es vector semántico.","case":{"at":4,"q":"Postings","input":"D1=salud agua; D2=agua; D3=salud","variants":[{"label":"agua","result":"D1,D2","why":"Lista invertida"},{"label":"salud AND agua","result":"D1","why":"Intersección"},{"label":"salud OR agua","result":"D1,D2,D3","why":"Unión"}]},"lab":null},{"id":"S07.05","title":"TF, DF e IDF","start":15,"end":19,"minutes":4,"text":"TF cuenta frecuencia en documento; DF cuenta documentos; IDF pondera rareza según fórmula.","action":"Modificar frecuencia documental y observar peso relativo.","limit":"Cálculo con fórmula declarada; distinguir logaritmos y convenciones.","case":null,"lab":null},{"id":"S07.06","title":"Longitud documental","start":19,"end":23,"minutes":4,"text":"La longitud ofrece más oportunidades de repetir términos; BM25 normaliza esa ventaja.","action":"Comparar textos con igual término y distinta longitud.","limit":"Frecuencia normalizada; longitud no mide calidad.","case":null,"lab":null},{"id":"S07.07","title":"BM25 paso a paso","start":23,"end":27,"minutes":4,"text":"BM25 combina IDF, frecuencia saturada y longitud relativa; el score no es probabilidad.","action":"Calcular puntaje de dos documentos con valores pequeños.","limit":"Ranking manual; puntaje no es probabilidad.","case":null,"lab":null},{"id":"S07.08","title":"Control de k1","start":27,"end":31,"minutes":4,"text":"k1 controla saturación: repetir diez veces no multiplica necesariamente el score por diez.","action":"Variar k1 con TF fija en documentos de igual longitud.","limit":"Curva y cambio de ranking; mantener resto fijo.","case":{"at":8,"q":"Saturación","input":"k1=1,2, longitud fija; componente 2,2f/(1,2+f)","variants":[{"label":"f=1","result":"1,000","why":"2,2/2,2"},{"label":"f=2","result":"1,375","why":"4,4/3,2"},{"label":"f=10","result":"1,964","why":"22/11,2"}]},"lab":null},{"id":"S07.09","title":"Control de b","start":31,"end":35,"minutes":4,"text":"b controla normalización por longitud; b=0 elimina ese componente.","action":"Variar b y longitud documental con TF constante.","limit":"Puntajes comparados; no ajustar mirando test.","case":{"at":9,"q":"Longitud BM25","input":"f=2,k1=1,b=1,avgdl=100,IDF=1","variants":[{"label":"Longitud 50","result":"1,6","why":"4/(2+0,5)"},{"label":"Longitud 200","result":"1,0","why":"4/(2+2)"}]},"lab":null},{"id":"S07.10","title":"Consultas multitérmino","start":35,"end":40,"minutes":5,"text":"AND exige presencia conjunta; OR amplía candidatos. El ranking puede sumar contribuciones.","action":"Predecir top-k de consulta con dos palabras.","limit":"Contribución por término; AND y OR no son scoring.","case":null,"lab":null},{"id":"S07.11","title":"Mapping de Elasticsearch","start":40,"end":45,"minutes":5,"text":"Mapping define tipos y analizador; una fecha indexada como texto puede ordenar incorrectamente.","action":"Elegir mapping de objeto, entidad e ID y detectar tipo incorrecto.","limit":"Configuración; índice lógico no es shard.","case":null,"lab":null},{"id":"S07.12","title":"DSL de búsqueda","start":45,"end":50,"minutes":5,"text":"DSL usa JSON: match analiza, term busca exacto y filter restringe el universo.","action":"Cambiar filtro de entidad y consultar ranking textual.","limit":"Hits y score; filtro no debe confundirse con coincidencia semántica.","case":null,"lab":null},{"id":"S07.13","title":"Relevancia juzgada","start":50,"end":55,"minutes":5,"text":"Precision@k mide proporción de relevantes recuperados; recall@k mide cobertura de relevantes conocidos.","action":"Variar k y calcular métricas manualmente sobre resultados etiquetados.","limit":"Métricas con denominador; no juzgar documentos por score.","case":{"at":13,"q":"Métricas","input":"Relevantes D1,D3,D4; ranking D1,D2,D3,D5","variants":[{"label":"k=2","result":"P=0,50; R=0,33","why":"1 acierto de 2; 1 de 3"},{"label":"k=4","result":"P=0,50; R=0,67","why":"2 de 4; 2 de 3"}]},"lab":null},{"id":"S07.14","title":"Errores de búsqueda","start":55,"end":60,"minutes":5,"text":"Errores ortográficos, palabras comunes y polisemia pueden afectar recuperación.","action":"Probar pares de consultas y clasificar error de recuperación.","limit":"Casos y ranking; no prometer comprensión semántica.","case":null,"lab":null},{"id":"S07.15","title":"Comparar manual y motor","start":60,"end":65,"minutes":5,"text":"El cálculo manual usa estadísticas declaradas; Elasticsearch usa su índice y analizador reales.","action":"Comparar tokens y ranking manual con analyze/explain si están disponibles.","limit":"Respuesta del motor o pendiente; diferencias explicadas.","case":null,"lab":null},{"id":"S07.16","title":"Cuaderno: conectar e indexar","start":75,"end":84,"minutes":9,"text":"Crea índice aislado, carga documentos y verifica IDs y errores de bulk.","action":"Cargar documentos y comprobar conteo de IDs.","limit":"Estado del índice; credenciales no guardadas.","case":null,"lab":{"index":14,"heading":"E · De Elastic Cloud a Colab: consigue endpoint + API key","status":"sección temática identificada","gap":null}},{"id":"S07.17","title":"Cuaderno: analizar texto","start":84,"end":93,"minutes":9,"text":"Inspecciona tokens de consulta con analizador y compara contra el texto original.","action":"Cambiar una consulta y verificar términos.","limit":"Tokens observados; no llamar simulación servicio real.","case":null,"lab":{"index":13,"heading":"D · Console antes de Python","status":"ampliación pendiente","gap":"Falta una sección independiente de _analyze con verificación de términos."}},{"id":"S07.18","title":"Cuaderno: consultar y filtrar","start":93,"end":101,"minutes":8,"text":"Ejecuta match y filter y observa ID, score y posición. Scores de distintas consultas no son equivalentes.","action":"Modificar match y filter de entidad.","limit":"Ranking propio y criterios; no equiparar score entre consultas.","case":null,"lab":{"index":21,"heading":"G · Query DSL explicado","status":"sección temática identificada","gap":null}},{"id":"S07.19","title":"Cuaderno: explicar ranking","start":101,"end":109,"minutes":8,"text":"Explain permite observar contribuciones; una referencia manual no es plan ejecutado.","action":"Comparar dos hits de una misma consulta con datos controlados.","limit":"Explicación real o cálculo didáctico separado.","case":null,"lab":{"index":23,"heading":"G2. multi_match, filter y highlight","status":"ampliación pendiente","gap":"Falta una práctica explícita de _explain por término."}},{"id":"S07.20","title":"Cuaderno: medir relevancia","start":109,"end":117,"minutes":8,"text":"Congela corpus, juicios y consultas para comparar k sin ajustar sobre la prueba final.","action":"Variar k y contrastar resultados sin tocar juicios.","limit":"Tabla de métricas y versión de consulta.","case":null,"lab":{"index":25,"heading":"H · Evaluar relevancia con Precision@5","status":"sección temática identificada","gap":null}},{"id":"S07.21","title":"Cuaderno: guardar buscador","start":117,"end":125,"minutes":8,"text":"Exporta mapping, ranking y juicios para reproducir evaluación.","action":"Releer y verificar IDs de resultados.","limit":"Producto lexical reutilizable.","case":null,"lab":{"index":29,"heading":"J · Exportación final","status":"sección temática identificada","gap":null}},{"id":"S07.22","title":"Reto lexical","start":125,"end":130,"minutes":5,"text":"Cambia palabra o filtro y predice qué candidatos entran o salen.","action":"Modificar DSL y elegir causa de una recuperación inesperada.","limit":"Consulta, ranking y métrica propia.","case":null,"lab":null},{"id":"S07.23","title":"Interpretación del ranking","start":130,"end":135,"minutes":5,"text":"Un documento con score alto puede no responder la necesidad; revisa documentos omitidos.","action":"Seleccionar documento relevante omitido según juicio previo.","limit":"Error de recuperación; no inferir calidad por score alto.","case":null,"lab":null},{"id":"S07.24","title":"Relevo vectorial","start":135,"end":140,"minutes":5,"text":"S09 reutiliza corpus y juicios para comparar búsqueda vectorial e híbrida.","action":"Exportar IDs y juicios para comparación controlada S09.","limit":"Benchmark lexical fijo; evitar cambiar corpus sin registrar.","case":null,"lab":null},{"id":"S07.25","title":"Cierre BM25","start":140,"end":150,"minutes":10,"text":"Explica por qué cambia ranking y cómo medir relevancia sin usar score como verdad.","action":"Resolver controles de TF, IDF y filtros usando ranking propio.","limit":"Buscador y evaluación; no reemplazar lexical automáticamente.","case":null,"lab":null}],"control":{"at":8,"title":"Saturación BM25","label":"Frecuencia f","min":1,"max":40,"step":1,"initial":2},"blocks":[{"title":"Limitaciones de contains","range":"1–12","concept":"Un buscador tokeniza y puntúa; contains busca cadenas. Recuperar no es clasificar.","task":"Cambia la consulta literal.","evidence":"Candidatos base.","excerpt":"consulta = 'mantenimiento aeronaves'\nmask = corpus['texto_busqueda'].str.lower().str.contains('mantenimiento', na=False)\nprint('Coincidencias literales con mantenimiento:', int(mask.sum()))\ndisplay(corpus.loc[mask, ['id_proceso','nombre_proceso','entidad']].head(10))","excerptTruncated":false},{"title":"Índice invertido y BM25","range":"11–13,18","concept":"DF cuenta documentos que contienen término; IDF pondera rareza; BM25 satura frecuencia y normaliza longitud.","task":"Varía k1 y b en explorador y analiza tokens.","evidence":"Ranking calculado.","excerpt":"resp = client.indices.analyze(\n    index=INDEX_NAME,\n    analyzer='spanish',\n    text='Servicios de mantenimiento de las aeronaves'\n)\n\ntokens = pd.DataFrame([\n    {\n        'token': t['token'],\n        'position': t['position'],\n        'start_offset': t['start_offset'],\n        'end_offset': t['end_offset'],\n        'type': t.get('type')\n    }\n    for t in resp['tokens']\n])\n\nprint('Número de tokens devueltos por Elasticsearch:', len(tokens))\ndisplay(tokens)\n\nprint('Lectura:')\nprint('- token = término resultante')\nprint('- position = orden lógico')\nprint('- start_offset / end_offset = ubicación en el texto original')\nprint('- esta tabla viene del motor Elasticsearch, no de una simulación local')\n","excerptTruncated":false},{"title":"Indexar en Elasticsearch","range":"14–20","concept":"Mapping distingue text analizado y keyword exacto; bulk agrupa escrituras.","task":"Crea índice propio y verifica conteo.","evidence":"Índice y filas.","excerpt":"def acciones_bulk(df):\n    for _, r in df.iterrows():\n        yield {\n            '_index': INDEX_NAME,\n            '_id': str(r['id_proceso']),\n            '_source': {\n                'id_proceso': str(r['id_proceso']),\n                'nombre_proceso': str(r['nombre_proceso']),\n                'descripcion': str(r['descripcion']),\n                'entidad': str(r['entidad']),\n                'tipo_registro': str(r['tipo_registro']),\n                'url_secop': str(r['url_secop'])\n            }\n        }\n\nok, errors = helpers.bulk(client, acciones_bulk(corpus), raise_on_error=False)\nremote_count = client.count(index=INDEX_NAME)['count']\nprint('Acciones OK:', ok)\nprint('Errores bulk:', len(errors))\nprint('Conteo local:', len(corpus))\nprint('Conteo Elasticsearch:', remote_count)\nprint('¿Coinciden?:', len(corpus) == remote_count)","excerptTruncated":false},{"title":"Ranking y relevancia","range":"21–28","concept":"match analiza; term compara token; filter restringe universo. Precision@k necesita juicios humanos.","task":"Modifica pesos y compara dos rankings reales.","evidence":"Top-k y relevancia.","excerpt":"query_B = {\n    'bool': {\n        'must': [{\n            'multi_match': {\n                'query': consulta,\n                'fields': ['nombre_proceso^3','descripcion']\n            }\n        }],\n        'filter': [{'term': {'tipo_registro': 'historico_adjudicado'}}]\n    }\n}\n\nresp_B = client.search(\n    index=INDEX_NAME,\n    size=5,\n    query=query_B,\n    highlight={'fields': {'nombre_proceso': {}, 'descripcion': {}}}\n)\n\nrows=[]\nfor rank,h in enumerate(resp_B['hits']['hits'], start=1):\n    rows.append({\n        'rank': rank,\n        'id_proceso': h['_id'],\n        'score': h['_score'],\n        'nombre_proceso': h['_source']['nombre_proceso'],\n        'highlight': str(h.get('highlight',{}))[:250]\n    })","excerptTruncated":true},{"title":"Entregar buscador","range":"29–30","concept":"Puntuaciones de motores distintos no tienen escala comparable.","task":"Exporta ranking y conserva fuente.","evidence":"Buscador V1.","excerpt":"salida = {\n    'index': INDEX_NAME,\n    'consulta': consulta,\n    'criterio': criterio,\n    'precision_at_5': p5,\n    'top5': tabla_B.to_dict(orient='records')\n}\n\nPath('s07_config_busqueda.json').write_text(json.dumps(salida, ensure_ascii=False, indent=2), encoding='utf-8')\ntabla_B.to_csv('s07_resultados_busqueda.csv', index=False)\n\nmd = f'''# Hito S07 · Relevancia textual\n\n- Índice: {INDEX_NAME}\n- Consulta: {consulta}\n- Criterio: {criterio}\n- Precision@5: {p5}\n\n## Límite\nLa relevancia textual no demuestra irregularidad, calidad contractual ni riesgo. Solo ordena documentos según la consulta y configuración usadas.\n'''\nPath('hito_s07_relevancia.md').write_text(md, encoding='utf-8')\nprint('Archivos creados: s07_config_busqueda.json, s07_resultados_busqueda.csv, hito_s07_relevancia.md')","excerptTruncated":false}],"agenda":[{"label":"Diagnóstico","minutes":5},{"label":"Fundamentos","minutes":30},{"label":"Ejemplos y experimentación","minutes":30},{"label":"Pausa","minutes":10},{"label":"Laboratorio","minutes":50},{"label":"Autonomía y transferencia","minutes":15},{"label":"Cierre","minutes":10}],"workbench":{"at":7,"title":"BM25: frecuencia, rareza y longitud","concept":"Para un término, IDF=ln(1+(N−df+0,5)/(df+0,5)). BM25 multiplica IDF por f(k1+1)/(f+k1(1−b+b·L/avgL)). k1 controla saturación y b normaliza longitud. Si f=0 la contribución es cero; df cambia al cambiar presencia del término. El score no es probabilidad.","pred":"¿Puede un documento corto con dos apariciones ganar a uno largo con cuatro?","fields":[{"label":"k1","min":0.2,"max":3,"step":0.1,"value":1.2},{"label":"b","min":0,"max":1,"step":0.1,"value":0.75},{"label":"Frecuencia D2","min":0,"max":12,"step":1,"value":4}],"interpret":"Observa frecuencia, longitud, normalización, IDF y score por documento; las estadísticas pertenecen al corpus fijo. Un empate se resuelve por ID.","challenge":"Busca una configuración donde D1 gane con menor frecuencia; explica con factores intermedios. Compara luego con explain real.","limit":"Cálculo de BM25 de un término; no consulta Elasticsearch."}},{"id":"08","title":"TC1 · Una fuente, tres modelos","problem":"Construir un sistema verificable para Laura con tres modelos de datos.","mission":"Primera entrega","original":"../assets/tutoriales/s08-secoppipeline.html","notebook":{"path":"Cuadernos/Taller_Control_1.ipynb","ref":"mejora-pedagogica-integral","cells":81,"url":"https://github.com/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Taller_Control_1.ipynb","launch":"https://colab.research.google.com/github/jazaineam1/BigData2026/blob/mejora-pedagogica-integral/Cuadernos/Taller_Control_1.ipynb"},"quiz":{"question":"¿Qué demuestra una huella igual?","options":["Igualdad de bytes con altísima confianza","Representatividad estadística","Ausencia de sesgo"],"feedback":["Correcto: bajo la misma serialización.","No mide cobertura.","No detecta sesgo."]},"slides":[{"id":"S08.01","
