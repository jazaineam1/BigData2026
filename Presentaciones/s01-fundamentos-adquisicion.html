n id="fullscreen">Pantalla completa</button></header><main class="stage"><div class="kicker" id="kicker"></div><h1 id="heading"></h1><div class="cols"><div><p class="concept" id="concept"></p><div class="callout"><h3>Hazlo ahora</h3><p id="task"></p></div><div class="callout limit"><h3>Qué debes observar y qué no demuestra</h3><p id="limit"></p></div></div><section class="visual" id="experiment" aria-label="Experimento de la diapositiva"></section></div></main><footer><button id="prev">← Anterior</button><button id="next">Siguiente →</button><span id="progress" role="status"></span><span class="grow"></span><label for="jump">Ir a</label><select id="jump"></select></footer><script>/* Núcleo portable de Compras Claras. No pretende ejecutar motores externos. */
(function(root){

function rank(docs,q,mode){const query=[...new Set(tokens(q))],ds=docs.map(d=>({id:d.id_proceso,t:tokens(txt(d))})),avg=ds.reduce((a,d)=>a+d.t.length,0)/Math.max(1,ds.length)||1;const dfs=new Map();for(const d of ds)for(const t of new Set(d.t))dfs.set(t,(dfs.get(t)||0)+1);
const idf=t=>Math.log(1+(ds.length-(dfs.get(t)||0)+.5)/((dfs.get(t)||0)+.5));

const vector=ts=>new Map(counts(ts,x=>x).map(([t,f])=>[t,f*tfidf(t)]));const qv=vector(query);const norm=v=>Math.sqrt([...v.values()].reduce((s,x)=>s+x*x,0));
return ds.map(d=>{let score=0;if(mode==="bm25"){for(const t of query){const f=d.t.filter(x=>x===t).length;score+=idf(t)*f*2.2/(f+1.2*(.25+.75*d.t.length/avg));}}else{const v=vector(d.t);score=[...qv].reduce((s,[t,w])=>s+w*(v.get(t)||0),0)/(norm(qv)*norm(v)||1)}return {id:d.id,score:Number(score.toFixed(9))}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));}
function fuse(a,b){const m=new Map();[a,b].forEach(r=>r.forEach((x,i)=>m.set(x.id,(m.get(x.id)||0)+1/(60+i+1))));return [...m].map(([id,score])=>({id,score:Number(score.toFixed(9))})).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))}
function setup(corpus,media){const raw=corpus.documentos.map(d=>({id_proceso:String(d.id_proceso),nombre_proceso:String(d.nombre_proceso||""),descripcion:String(d.descripcion||""),entidad:String(d.entidad||""),url_secop:String(d.url_secop||""),fuente:String(d.fuente||""),tipo_registro:String(d.tipo_registro||"")}));
assert(raw.length>120&&new Set(raw.map(d=>d.id_proceso)).size===raw.length,"Corpus insuficiente o IDs duplicados");
const assets=media.map(m=>({id:String(m.job_id),article_id:String(m.article_id),source_url:String(m.source_url),credit:String(m.credit||"Sin crédito informado"),sha256:String(m.input_sha256),type:"imagen"}));
assert(new Set(assets.map(x=>x.id)).size===assets.length,"IDs multimedia duplicados");
const dataset=fingerprint({raw,assets});return {raw,assets,dataset}}
function fresh(source){return {schema:"compras-claras-v1",dataset:source.dataset,steps:[],lab:{}}}
function next(s){return required.find(x=>!s.steps.some(t=>t.id===x))||null}
function find(s,id){const r=s.steps.find(x=>x.id===id);assert(r,"Falta S"+id);return r.result}
function output(id,p,s,src){
const n=Number(p),list=(id)=>find(s,id),docs=()=>list("03").docs;
switch(id){
case "01":{const raw=src.raw.slice(0,n);assert([40,80,120].includes(n),"Escala no permitida");return {raw,rows:raw.length,source:"Datos/tc2_corpus_2026.json",coverage:raw.length/src.raw.length}}
case "02":{const raw=list("01");const options=[["local",300,1],["lotes",60,2],["eventos",2,4]];const choice=options.find(x=>x[1]<=n);assert(choice,"Requisito no viable");return {inputRows:raw.rows,architecture:choice[0],alternatives:options,latency:n,kind:"hipótesis, no SLA medido"}}
case "03":{list("02");const d=list("01").raw.map(x=>({...x,metadata:{source:x.fuente,recordType:x.tipo_registro}}));return {docs:d,rows:d.length,distinct:new Set(d.map(x=>x[p])).size,field:p}}
case "04":{const d=docs();return {ids:d.slice(0,n).map(x=>x.id_proceso),rows:Math.min(n,d.length),order:"orden de muestra, no riesgo",persistence:"exportar/importar JSON; Atlas se comprueba en el cuaderno"}}
case "05":{const q=list("04"),d=docs(),groups=Object.fromEntries(counts(d,x=>x[p]).map(([k])=>[k,d.filter(x=>x[p]===k).map(x=>x.id_proceso)]));const first=d.find(x=>x.id_proceso===q.ids[0]);return {key:p,groups,lookup:first[p],ids:groups[first[p]],max:Math.max(...Object.values(groups).map(x=>x.length))}}
case "06":{const g=list("05"),d=docs();const entities=counts(d,x=>x.entidad).slice(0,n).map(x=>x[0]);return {anchor:g.ids[0],edges:d.filter(x=>entities.includes(x.entidad)).map(x=>({entity:x.entidad,process:x.id_proceso})),entities,scope:"entidad-proceso; proveedor no disponible en este corpus"}}
case "07":{list("06");return {query:p,ranking:rank(docs(),p,"bm25"),engine:"BM25 local JavaScript"}}
case "08":{const d=docs(),q=list("04"),g=list("06"),r=list("07"),known=new Set(d.map(x=>x.id_proceso));assert(q.ids.every(x=>known.has(x))&&g.edges.every(x=>known.has(x.process))&&r.ranking.every(x=>known.has(x.id)),"Referencia inválida");return {version:"1.0",rows:d.length,checked:Math.min(n,d.length),referencesOK:true,top:r.ranking.slice(0,n)}}
case "09":{list("08");const a=rank(docs(),p,"bm25"),b=rank(docs(),p,"tfidf");return {query:p,lexical:a,cosine:b,hybrid:fuse(a,b),engine:"BM25 + coseno TF-IDF + RRF local; NO embeddings E5"}}
case "10":{list("09");return {assets:src.assets.slice(0,n),rows:Math.min(n,src.assets.length),source:"Datos/s10_imagenes_reales/inputs.json",scope:"inventario real de imágenes, sin unión con SECOP"}}
case "11":{const a=list("10").assets;return {assets:a.map(x=>({...x,extraction:"pendiente de resultado real"})),mode:p,available:p==="imagen"?a.length:0,extracted:0,scope:"sin ejecutar OCR/ASR en navegador; revisar archivo de laboratorio adjunto"}}
case "12":{const a=list("11"),r=list("09");return {version:"2.0",checked:Math.min(n,a.assets.length),inventory:a.assets.length,extracted:a.extracted,hybridTop:r.hybrid.slice(0,5),scope:"metadatos locales; evidencia externa separada"}}
case "13":{list("12");const d=docs(),parts=Array.from({length:n},()=>[]);d.forEach((x,i)=>parts[i%n].push(x));const sum=new Map();for(const part of parts)for(const [k,v] of counts(part,x=>x.entidad))sum.set(k,(sum.get(k)||0)+v);const grouped=[...sum].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));assert(stable(grouped)===stable(counts(d,x=>x.entidad)),"Reducción incorrecta");return {partitions:parts.map(x=>x.length),grouped,rows:d.length,engine:"particiones lógicas locales; Dask real en cuaderno"}}
case "14":{const a=list("13");return {gold:a.grouped.slice(0,n),rows:a.rows,total:a.grouped.reduce((s,x)=>s+x[1],0),scope:"agregación local; no inferencia MLlib"}}
case "14A":{list("14");return {rows:n*1e6,dimensions:128,trainGiB:n*1e6*.8*128*8/1073741824,budgetGiB:16,scope:"estimación float64; no entrenamiento"}}
case "15":{list("14");const old=docs(),incoming=src.raw.slice(old.length,old.length+n);const merge=(base,batch)=>{const m=new Map(base.map(x=>[x.id_proceso,x]));for(const x of batch){if(m.has(x.id_proceso)){const y=m.get(x.id_proceso);assert(y.nombre_proceso===x.nombre_proceso&&y.descripcion===x.descripcion&&y.entidad===x.entidad,"Conflicto de identidad")}else m.set(x.id_proceso,x)}return [...m.values()]};const first=merge(old,incoming),again=merge(first,incoming);assert(stable(first)===stable(again),"Repetición no idempotente");let conflict=false;try{merge(first,[{...first[0],nombre_proceso:"CAMBIO CONTROLADO"}])}catch{conflict=true}assert(conflict,"No se detectó conflicto");return {rowsBefore:old.length,rowsAfter:first.length,added:incoming.length,repeatRows:again.length,conflictRejected:conflict,updated:first,scope:"prueba de algoritmo local; atomicidad en S15 SQLite"}}
case "16":{const a=list("15"),b=list("12"),r=list("09");return {version:"3.0",rows:a.rowsAfter,inventory:b.inventory,extracted:b.extracted,top:rank(a.updated,r.query,"bm25").slice(0,n),grouped:counts(a.updated,x=>x.entidad).slice(0,n),scope:"observatorio local; evidencia de motores externos adjunta, no certificada"}}
default:throw Error("Sesión desconocida")}
}
function run(s,id,param,src,cfg){assert(s.dataset===src.dataset,"Otra versión de fuentes");const r=cfg.routes.find(x=>x.id===id);assert(r&&r.mission.options.includes(String(param)),"Parámetro fuera del contrato");assert(!s.steps.some(x=>x.id===id),"Etapa ya confirmada: reinicia desde ella para cambiar parámetros");

function validate(candidate,src,cfg){assert(candidate&&candidate.schema==="compras-claras-v1"&&candidate.dataset===src.dataset&&Array.isArray(candidate.steps),"Archivo no corresponde al contrato o fuentes");let s=fresh(src);for(const t of candidate.steps){s=run(s,t.id,t.param,src,cfg);assert(stable(s.steps.at(-1))===stable(t),"Resultado alterado en S"+t.id)}for(const [id,lab] of Object.entries(candidate.lab||{}))s=attach(s,id,lab);return s}

 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

 let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}H=H.map((x,i)=>(x+[a,b,c,d,e,f,g,h][i])|0)}

function attach(s,id,lab){assert(ids.includes(id)&&s.steps.some(t=>t.id===id),"Confirma etapa local primero");assert(lab&&lab.schema==="compras-claras-lab-v1"&&lab.session===id&&["dataframe","json","scalar","manual"].includes(lab.kind)&&typeof lab.source==="string"&&lab.source.length>0&&/^[a-f0-9]{64}$/.test(lab.sha256)&&lab.payload!==undefined,"Formato de evidencia inválido");assert(JSON.stringify(lab).length<300000,"Adjunto demasiado grande");assert(typeof lab.payload_json==="string"&&sha256(lab.payload_json)===lab.sha256,"SHA-256 no coincide con el adjunto");assert(stable(JSON.parse(lab.payload_json))===stable(lab.payload),"Contenido y serialización no coinciden");return {...s,lab:{...s.lab,[id]:copy(lab)}}}

</script><script>const slides=[[4,"01 · La misión","Laura tiene que revisar contratación pública sin leer cada expediente","El producto de hoy no es un tablero vacío: será una adquisición reproducible. Recibimos una fuente, comprobamos identidad, exploramos contenido, dividimos lotes y entregamos RAW. En la siguiente sesión diseñaremos la arquitectura que lo recibe.","Identifica qué pregunta podrías responder con objeto contractual y entidad, y cuál exige otras variables.","Un registro representa un proceso en este corpus; no contiene valor contractual. No confundir con la API de contratos.","flow",["Fuente SECOP","Validar y adquirir","RAW versionado","S02: arquitectura"]],[6,"02 · Escala y decisión","Big Data no es un número mágico","El problema comienza cuando volumen, tasa de llegada, estructuras o necesidades de respuesta exceden el método disponible. Una tabla pequeña puede exigir respuesta rápida; una grande puede procesarse por lotes. Escalar tiene costos de memoria, almacenamiento, red y coordinación.","Compara un proceso que recibe 3 millones de eventos/min con otro que recibe 1 millón. Decide qué métrica monitorear.","Distingue capacidad y demanda; el tamaño de archivo por sí solo no decide tecnología.","queue"],[7,"03 · Diagnóstico","Las cinco V se pueden medir","Volumen: bytes y filas. Velocidad: registros por segundo y latencia. Variedad: tipos y estructuras. Veracidad: duplicados, faltantes y procedencia. Valor: utilidad para una decisión. Las cinco V interactúan: más datos duplicados pueden añadir volumen sin valor.","Asocia cada caso con la V dominante, luego explica qué medirías. No memorices solo nombres.","Identifica la restricción concreta antes de elegir tecnología.","quiz",[["Llegan 3000 eventos/s, se procesan 1000","Velocidad"],["El 15% de identificadores son duplicados","Veracidad"],["Hay tablas, audio y fotos","Variedad"],["Una matriz requiere 40 GiB","Volumen"],["El indicador no cambia ninguna decisión","Valor"]]],[7,"04 · Infraestructura","Local, nube y distribución son decisiones diferentes","Local indica dónde se ejecuta; nube indica acceso a servicios administrados o recursos remotos. Distribución divide cómputo entre unidades coordinadas. Escalamiento vertical aumenta recursos de una máquina, horizontal agrega unidades. La nube no garantiza paralelismo ni menor costo.","Modifica presupuesto y capacidad para una matriz float64. Si no cabe, ¿fragmentación, otra representación o distribución?","El resultado es memoria mínima de la matriz, no RSS de Python.","memory"],[6,"05 · Estructuras","Una fila no representa siempre la misma cosa","Un CSV modela registros con columnas; JSON representa campos anidados y listas; XML usa etiquetas y jerarquías. El texto libre conserva significado pero requiere transformación para consultas. Un mismo proceso puede tener varios documentos, y una unión puede multiplicar filas.","Cambia representación de dos registros reales y examina la identidad, tipos y longitud de serialización.","Conserva el grano proceso al convertir. XML de ejemplo se escapa correctamente.","formats"],[6,"06 · Fuente real","Abre el corpus SECOP antes de escribir código","Tenemos una instantánea docente versionada de 200 procesos derivados de Datos/bandeja_revision_2026.json. Incluye ID, objeto, descripción, entidad y URL original. No es una muestra aleatoria; no contiene monto, fecha de adjudicación ni proveedor en este esquema.","Filtra por texto o entidad, abre un expediente original y cambia de página.","Distingue evidencia disponible de campos que tendrías que adquirir.","browse"],[7,"07 · Calidad","Veracidad: identidad y valores ausentes","Antes de sumar, comprueba que cada ID sea único y que los campos necesarios existan. La ausencia no equivale a cero. Un duplicado exacto no es un nuevo proceso. La calidad se mide en relación con la tarea.","Introduce duplicados y faltantes en COPIAS del corpus. Compara filas, identidades y registros incompletos.","El RAW de origen no cambia. Un registro incompleto puede requerir cuarentena o enriquecimiento.","quality"],[7,"08 · Primera transformación","Filtrar no es agrupar","Filtrar selecciona filas, proyectar selecciona campos y agrupar cambia el grano. Contar procesos por entidad responde cuántos registros de la muestra pertenecen a cada entidad; no cuánto gastó ni si existe irregularidad.","Elige una entidad y calcula su número de procesos. Cambia el universo 40/80/120/200 y observa los conteos.","Conserva denominador y muestra. No extrapoles concentración al universo SECOP.","groups"],[7,"09 · Pandas","De la tabla a una pregunta reproducible","El DataFrame organiza filas y columnas. head permite inspección; shape describe dimensiones; nunique controla identidad; groupby().size() agrega sin inventar montos. Usa el cuaderno para ejecutar el mismo ejercicio en Python.","Abre Colab, ejecuta la preparación y el bloque puente S01-A. Cambia el límite de muestra y compara grupos.","El resultado depende del mismo corpus y selección ordenada.","code","import pandas as pd\n# corpus es el JSON versionado cargado en el puente S01-A\ndf = pd.DataFrame(corpus[\"documentos\"])\nmuestra = df.iloc[:80].copy()\nassert muestra.id_proceso.is_unique\nprint(muestra.shape)\nprint(muestra.groupby(\"entidad\").size().sort_values(ascending=False).head())"],[8,"10 · Texto","Transformar descripción en una señal cuantificable","Tokenizar divide texto en unidades; contar palabras produce una representación simple. Frecuencia no implica relevancia, causalidad ni riesgo. Títulos y descripciones pueden repetir información, por eso aquí contamos solo descripción.","Escribe un término, observa cuántos documentos lo contienen y examina las palabras frecuentes.","Se distinguen ocurrencias totales de frecuencia documental; anticipa BM25 de S07.","words"],[10,"Pausa","10 minutos de descanso","Al volver, pasaremos de observar los datos a diseñar una adquisición por páginas, comparar procesamiento completo y fragmentado, y producir el archivo que utilizará S02.","Conserva tu cuaderno abierto.","No se requiere ejecutar nada durante la pausa.","flow",["Fuente validada","Pausa","Adquisición","Entrega"]],[9,"11 · API","Qué ocurre cuando llamamos una API","Una API define una interfaz; HTTP transporta la solicitud. En Socrata, $select escoge columnas, $where filtra, $limit acota filas y $order fija un orden. HTTP 200 no prueba cobertura; es necesario validar grano e identidad.","Ejecuta las celdas de API SECOP del cuaderno. Cambia 500 a 50, observa esquema y respuesta. Este servicio devuelve registros contractuales: no unir por ID de proceso sin contrato de datos.","Conserva fecha, parámetros y conteo real. Si falla la red, registra el bloqueo y usa la instantánea de procesos para el resto.","code","import requests\nurl = \"https://www.datos.gov.co/resource/rpmr-utcd.json\"\nparams = {\"$limit\":50,\"$select\":\"nombre_de_la_entidad,departamento_entidad,valor_contrato\"}\nr = requests.get(url, params=params, timeout=30)\nr.raise_for_status()\nprint(r.status_code, len(r.json()))"],[8,"12 · Paginación","LIMIT y OFFSET sin perder registros","Una página es un subconjunto ordenado. OFFSET desplaza el inicio; un último bloque puede ser menor que el límite. Un orden estable reduce inconsistencias, pero no congela una API que cambia mientras se consulta.","Cambia el límite y el offset en la instantánea real. Verifica primera y última identidad de la página.","Compara cobertura de la secuencia completa: todas las identidades exactamente una vez. Aquí no se está llamando a una API.","pages"],[8,"13 · Fragmentar","Leer por fragmentos y reducir resultados","Si el archivo no cabe en memoria, podemos procesar lotes y conservar parciales. Para conteos basta sumar; para medias se combinan suma y cantidad. El promedio de promedios solo coincide si los tamaños son iguales, salvo coincidencias especiales.","Cambia el tamaño del bloque. Calcula conteos de entidad por fragmento y compara contra una pasada completa.","El motor local ejecuta ambas rutas y comprueba igualdad; no mide RAM de pandas.","chunks"],[10,"14 · Experimento manual","Por qué una media de medias puede ser incorrecta","Lote A: 2 observaciones de valor 10. Lote B: 8 observaciones de valor 100. Media simple de medias: 55. Media ponderada: (20+800)/10=82. El denominador importa al combinar resultados.","Cambia tamaños de los lotes y compara las dos medias. Predice cuándo serán iguales.","No confundir una media por grupo con una media de todas las filas.","mean"],[9,"15 · Capacidad real en Python","Medir, no adivinar","El cuaderno original lee 546.212 filas de ICFES según su referencia histórica. Verifica la salida de tu ejecución, no copies la cifra. Cambiar chunksize modifica el máximo de filas por bloque, pero no debería cambiar el resultado. El puente S01-B usa además CSV sintético acotado y mide tiempo y memoria de DataFrame.","Ejecuta S01-B con 10.000 y 100.000 filas; cambia chunksize a 500 y 5.000. Conserva suma, conteo, bytes y tiempos.","No comparar tiempos de redes distintas como si fueran un benchmark controlado. memory_usage no es pico RSS.","code","for fragmento in pd.read_csv(ruta_csv, chunksize=1000):\n    n += len(fragmento)\n    s += int(fragmento[\"valor\"].sum())\nassert (n, s) == referencia\n# el bloque S01-B incluye generación y medición completas"],[8,"16 · Reutilizar el resultado","RAW, derivados y trazabilidad","RAW conserva el dato original recibido. Un derivado registra qué transformación lo generó. El manifiesto guarda fuente, cantidad, esquema y huella. Una huella de consistencia detecta cambios pero no certifica autoría.","Selecciona 40, 80 o 120 procesos y ejecuta el producto S01. Comprueba IDs y procedencia; descarga estado compatible con S02.","La selección es un prefijo del corpus. La API contractual sigue siendo una fuente diferente.","export"],[8,"17 · Construir tu propia adquisición","Reto: cambia la decisión, no copies el resultado","Vuelve al banco de datos y elige una escala diferente de la demostración. Predice número de páginas, ejecuta fragmentación, comprueba igualdad y genera estado. Tu trabajo debe contener resultados que puedas explicar.","Entrega dos pruebas con escala o bloque distintos, un conteo equivalente y el estado S01. El cuaderno exporta también una evidencia SHA-256.","No borres archivos anteriores; conserva los dos resultados para comparar. No hay nueva calificación oficial.","challenge"],[8,"18 · Interpretar y defender","Qué sabemos y qué no sabemos","Sabemos cuántos procesos hay en nuestra selección, cómo están representados, qué campos faltan y que el conteo fragmentado coincide. No sabemos el gasto, la representatividad, ni la causalidad. Un sistema grande requiere decisiones basadas en restricciones medidas.","Resuelve los controles y explica una limitación basada en tu resultado. Si no ejecutaste la API, declara pendiente.","La evidencia de ejecución es distinta de una respuesta conceptual.","quiz",[["HTTP 200 garantiza todos los registros","No"],["Una muestra de 80 equivale al universo","No"],["Dos conteos iguales demuestran paridad para ese cálculo","Sí"],["El corpus contiene montos contractuales","No"],["Un RAW versionado facilita reproducibilidad","Sí"]]],[7,"19 · Relevo","Compras Claras v0.1 queda preparado","La siguiente sesión recibe una muestra de procesos con identidad y procedencia; utilizará el contrato y la decisión de escala para diseñar almacenamiento y procesamiento. Si otra persona importa el estado, puede recalcular el resultado.","Abre Compras Claras, importa el JSON generado en S01 y comprueba el estado confirmado. Luego abre S02.","Solo el estado portable confirma esta etapa. La ejecución Python se adjunta como evidencia separada.","flow",["RAW S01","Importar estado","S02 arquitectura","S03 documentos"]]],source={"raw":[{"id_proceso":"CO1.REQ.10017413","nombre_proceso":"CONTRATO INTERADMINITRATIVO PARA EL FORTALECIMIENTO DEL NIVEL PRIMARIO; BASADO EN LA ATENCIÓN PRIMARIA EN SALUD A TRAVÉS DE LA CONFORMACIÓN ","de let pos=0;const initial=location.hash.match(/^#s(\d+)$/);if(initial)pos=Math.max(0,Math.min(slides.length-1,+initial[1]-1));

$("prev").onclick=()=>{if(pos>0){pos--;render()}};$("next").onclick=()=>{if(pos<slides.length-1){pos++;render()}};$("jump").onchange=()=>{pos=+$("jump").value;render()};$("fullscreen").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName))return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});slides.forEach((s,i)=>{const o=E("option",(i+1)+" · "+s[1]+" — "+s[2]);o.value=String(i);$("jump").append(o)});render();
