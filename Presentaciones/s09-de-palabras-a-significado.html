ass=\"card def\"><b>Corpus</b><p>Conjunto de documentos sobre el que se busca. Ej.: procesos SECOP.</p></div><div class=\"card def\"><b>Documento</b><p>Unidad recuperable: proceso, contrato, noticia o fila.</p></div><div class=\"card def\"><b>Consulta</b><p>Texto que expresa la necesidad del usuario.</p></div><div class=\"card def\"><b>Ranking</b><p>Lista ordenada de candidatos según una señal.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Recuperación", "k": "DEFINICIÓN", "h": "Recuperación no es “buscar en Google”.", "b": "<p class=\"lead\">Es el proceso que recibe una necesidad de información y devuelve documentos candidatos ordenados.</p><div class=\"flow\"><div class=\"node\">consulta</div><div class=\"arrow\">→</div><div class=\"node\">mecanismo</div><div class=\"arrow\">→</div><div class=\"node\">candidatos</div><div class=\"arrow\">→</div><div class=\"node\">ranking</div><div class=\"arrow\">→</div><div class=\"node\">lectura humana</div></div>", "dark": false, "kind": "concept"}, {"title": "S07 recap", "k": "PUENTE CON S07", "h": "Lo que ya sabemos: recuperación lexical.", "b": "<div class=\"flow\"><div class=\"node\">texto</div><div class=\"arrow\">→</div><div class=\"node\">analyzer</div><div class=\"arrow\">→</div><div class=\"node\">tokens</div><div class=\"arrow\">→</div><div class=\"node\">índice invertido</div><div class=\"arrow\">→</div><div class=\"node\">BM25</div><div class=\"arrow\">→</div><div class=\"node\">ranking</div></div><div class=\"note\"><b>S07 sigue vigente.</b> La búsqueda lexical es fuerte cuando las palabras exactas importan.</div>", "dark": false, "kind": "concept"}, {"title": "Lexical gana", "k": "CUANDO LAS PALABRAS IMPORTAN", "h": "Lexical es excelente para coincidencias precisas.", "b": "<div class=\"grid three\"><div class=\"card ex\"><b>ID exacto</b><p><code>CO1.REQ.3714823</code></p></div><div class=\"card ex\"><b>Nombre propio</b><p>Oracle, SAP, DIAN, Microsoft.</p></div><div class=\"card ex\"><b>Término legal</b><p>Una palabra exacta puede cambiar el alcance.</p></div></div><div class=\"rankMini\"><b>Top lexical</b><ol><li>ID exacto ✓</li><li>Nombre exacto ✓</li><li>Marca exacta ✓</li></ol></div>", "dark": false, "kind": "concept"}, {"title": "LAB tokens compartidos", "k": "LAB A · COINCIDENCIA LEXICAL", "h": "¿Cuánto texto comparten?", "b": "<div class=\"lab\" id=\"lexLab\"><div class=\"labrow\"><div><label>Consulta</label><select id=\"lexQuery\"><option>reparación de aviones militares</option><option>licencia Oracle Database</option><option>plataforma educativa virtual</option></select></div><div><label>Documento candidato</label><select id=\"lexDoc\"><option>mantenimiento programado de aeronaves KFIR</option><option>renovación de soporte Oracle Database</option><option>sistema de aprendizaje en línea</option></select></div></div><button class=\"action\" id=\"lexRun\" type=\"button\">Medir coincidencia</button><button class=\"ghost\" data-reset-tool=\"lex\" type=\"button\">Restablecer</button><div id=\"lexOut\" class=\"feedback\"></div></div><div class=\"note\">Este laboratorio muestra por qué compartir pocas palabras no significa necesariamente ser irrelevante.</div>", "dark": false, "kind": "lab"}, {"title": "Fallo lexical", "k": "CONFLICTO", "h": "Aquí BM25 puede perder señal.", "b": "<table class=\"table\"><tr><th>Consulta</th><th>Documento potencialmente útil</th><th>Riesgo</th></tr><tr><td>reparación de aviones militares</td><td>mantenimiento programado de aeronaves KFIR</td><td>Paráfrasis y vocabulario técnico.</td></tr><tr><td>clases virtuales</td><td>entorno de aprendizaje remoto</td><td>Intención similar con otras palabras.</td></tr></table><div class=\"note warn\">El problema no es BM25. El problema es que la necesidad cambia de vocabulario.</div>", "dark": false, "kind": "concept"}, {"title": "Necesidad semántica", "k": "IDEA CLAVE", "h": "Buscamos relación de significado.", "b": "<div class=\"grid three\"><div class=\"card ex\"><b>reparar ↔ mantener</b><p>Acciones cercanas en este contexto.</p></div><div class=\"card ex\"><b>avión ↔ aeronave</b><p>Vocabulario técnico equivalente.</p></div><div class=\"card ex\"><b>clase virtual ↔ aprendizaje remoto</b><p>Intención compartida.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Tres mecanismos", "k": "MAPA MENTAL", "h": "Lexical, semántica e híbrida.", "b": "<div class=\"grid three\"><div class=\"card def\"><b>Recuperación lexical</b><p>Ordena por coincidencia y peso de términos.</p></div><div class=\"card def\"><b>Recuperación semántica</b><p>Ordena por cercanía entre representaciones numéricas del significado.</p></div><div class=\"card def\"><b>Recuperación híbrida</b><p>Combina señales lexicales y semánticas.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Herramienta mecanismo", "k": "NO CONFUNDIR", "h": "Herramienta ≠ mecanismo.", "b": "<table class=\"table big\"><tr><th>Herramienta</th><th>Lexical</th><th>Vectorial / semántica</th><th>Híbrida</th></tr><tr><td><b>Elasticsearch</b></td><td>Analyzer + índice invertido + BM25</td><td>Vectores y kNN</td><td>RRF / combinación de señales</td></tr><tr><td><b>MongoDB Atlas</b></td><td>Atlas Search</td><td>Vector Search</td><td>Fusión de rankings / pipelines</td></tr></table><div class=\"note danger\"><b>Regla.</b> S07 no era “la clase de Elasticsearch”; S09 no es “la clase de MongoDB”. Estudiamos mecanismos.</div>", "dark": false, "kind": "concept"}, {"title": "Checkpoint C1", "k": "CHECKPOINT C1", "h": "¿Qué mecanismo usarías?", "b": "<div class=\"lab checkpoint\" data-cp=\"bd-s09-c1\"><table class=\"table\"><tr><th>Necesidad</th><th>Decisión</th></tr><tr><td><code>CO1.REQ.3714823</code></td><td><select><option>Selecciona</option><option>lexical</option><option>semántica</option><option>híbrida</option></select></td></tr><tr><td>reparación de aviones militares</td><td><select><option>Selecciona</option><option>lexical</option><option>semántica</option><option>híbrida</option></select></td></tr><tr><td>mantenimiento aeronaves FAC</td><td><select><option>Selecciona</option><option>lexical</option><option>semántica</option><option>híbrida</option></select></td></tr></table><textarea placeholder=\"Justifica en una frase: ¿por qué?\"></textarea><button class=\"action\" data-cp-btn=\"bd-s09-c1\">Registrar C1 en LMS</button><div class=\"feedback cpStatus\"></div></div>", "dark": false, "kind": "checkpoint"}, {"title": "Otra representación", "k": "TRANSICIÓN", "h": "Si las palabras cambian, necesitamos otra representación.", "b": "<div class=\"bigFormula\">texto → ? → números comparables</div><div class=\"note\">La pregunta ahora es cómo convertir texto en algo que pueda compararse matemáticamente.</div>", "dark": true, "kind": "concept"}, {"title": "Embedding", "k": "DEFINICIÓN", "h": "Embedding: texto convertido en vector.", "b": "<div class=\"twocol\"><div><p class=\"lead\">Un embedding es una representación numérica aprendida de un texto que permite comparar cercanía con operaciones matemáticas.</p><div class=\"note warn\">No puedes leer “el componente 17 significa aeronave”.</div></div><pre>texto: \"mantenimiento de aeronaves\"\nembedding: [0.08, -0.14, 0.22, ...]</pre></div>", "dark": false, "kind": "concept"}, {"title": "Vector", "k": "DEFINICIÓN", "h": "Vector: una lista ordenada de números.", "b": "<div class=\"twocol\"><div><p class=\"lead\">En dos dimensiones podemos dibujarlo como una flecha. En el modelo real tendrá muchas más componentes.</p><pre>[0.2, 0.8]</pre></div><svg class=\"svgBox\" viewBox=\"0 0 520 320\"><line x1=\"60\" y1=\"260\" x2=\"480\" y2=\"260\" stroke=\"#9aa4b6\" stroke-width=\"3\"/><line x1=\"60\" y1=\"260\" x2=\"60\" y2=\"40\" stroke=\"#9aa4b6\" stroke-width=\"3\"/><line x1=\"60\" y1=\"260\" x2=\"300\" y2=\"90\" stroke=\"#0B8689\" stroke-width=\"7\" marker-end=\"url(#arrowTeal)\"/><circle cx=\"300\" cy=\"90\" r=\"9\" fill=\"#E95D0F\"/><text x=\"310\" y=\"84\" font-size=\"22\" font-weight=\"900\" fill=\"#122253\">[0.2, 0.8]</text><defs><marker id=\"arrowTeal\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L10,3 L0,6 Z\" fill=\"#0B8689\"/></marker></defs></svg></div>", "dark": false, "kind": "concept"}, {"title": "Modelo embeddings", "k": "DEFINICIÓN", "h": "¿Quién crea esos números?", "b": "<div class=\"twocol\"><div><div class=\"card def\"><b>Modelo de embeddings</b><p>Función entrenada que transforma texto en vectores comparables.</p></div><div class=\"note\">En el cuaderno usamos <code>intfloat/multilingual-e5-small</code>.</div></div><div class=\"flow\"><div class=\"node\">texto</div><div class=\"arrow\">→</div><div class=\"node\">modelo</div><div class=\"arrow\">→</div><div class=\"node\">embedding</div></div></div>", "dark": false, "kind": "concept"}, {"title": "Dentro modelo", "k": "CAJA NEGRA CONTROLADA", "h": "Dentro de la caja hay etapas.", "b": "<div class=\"flow\"><div class=\"node\">texto</div><div class=\"arrow\">→</div><div class=\"node\">tokenización</div><div class=\"arrow\">→</div><div class=\"node\">encoder</div><div class=\"arrow\">→</div><div class=\"node\">pooling</div><div class=\"arrow\">→</div><div class=\"node\">vector</div><div class=\"arrow\">→</div><div class=\"node\">normalización</div></div><div class=\"grid three\"><div class=\"card def\"><b>Tokenización</b><p>Divide el texto como lo espera el modelo.</p></div><div class=\"card def\"><b>Pooling</b><p>Resume muchas representaciones en una sola.</p></div><div class=\"card def\"><b>Normalización</b><p>Ajusta la longitud del vector para comparar orientación.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Tokenización modelo", "k": "DEFINICIÓN", "h": "Tokenización del modelo ≠ analyzer de Elasticsearch.", "b": "<div class=\"grid\"><div class=\"card\"><b>S07 · analyzer</b><p>Prepara texto para un índice invertido.</p><pre>texto → tokens → BM25</pre></div><div class=\"card\"><b>S09 · tokenizer del modelo</b><p>Divide texto como entrada del encoder.</p><pre>texto → subtokens → embedding</pre></div></div><div class=\"note warn\">Mismo nombre general, distinta función dentro del sistema.</div>", "dark": false, "kind": "concept"}, {"title": "Encoder pooling", "k": "DEFINICIÓN", "h": "Encoder y pooling.", "b": "<div class=\"twocol\"><div><div class=\"card def\"><b>Encoder</b><p>Produce representaciones internas contextualizadas.</p></div><div class=\"card def\"><b>Pooling</b><p>Resume esas representaciones en un solo vector del texto.</p></div></div><svg class=\"svgBox\" viewBox=\"0 0 620 330\"><g font-size=\"18\" font-weight=\"900\" text-anchor=\"middle\"><rect x=\"25\" y=\"45\" width=\"80\" height=\"42\" rx=\"10\" fill=\"#eaf6f6\"/><text x=\"65\" y=\"72\">query</text><rect x=\"120\" y=\"45\" width=\"80\" height=\"42\" rx=\"10\" fill=\"#eaf6f6\"/><text x=\"160\" y=\"72\">mant</text><rect x=\"215\" y=\"45\" width=\"90\" height=\"42\" rx=\"10\" fill=\"#eaf6f6\"/><text x=\"260\" y=\"72\">aero</text><rect x=\"320\" y=\"45\" width=\"80\" height=\"42\" rx=\"10\" fill=\"#eaf6f6\"/><text x=\"360\" y=\"72\">KFIR</text></g><rect x=\"70\" y=\"130\" width=\"360\" height=\"70\" rx=\"18\" fill=\"#634998\"/><text x=\"250\" y=\"172\" text-anchor=\"middle\" font-size=\"28\" font-weight=\"900\" fill=\"#fff\">encoder</text><path d=\"M250 210 L250 250\" stroke=\"#E95D0F\" stroke-width=\"5\"/><rect x=\"140\" y=\"250\" width=\"220\" height=\"50\" rx=\"15\" fill=\"#fff3e8\"/><text x=\"250\" y=\"282\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"900\" fill=\"#8a4200\">pooling → vector</text></svg></div>", "dark": false, "kind": "concept"}, {"title": "Dimensión", "k": "DEFINICIÓN", "h": "Dimensión: cuántos números tiene el vector.", "b": "<div class=\"grid three\"><div class=\"card ex\"><b>2D</b><p><code>[0.2, 0.8]</code> tiene 2 componentes.</p></div><div class=\"card ex\"><b>384D</b><p><code>multilingual-e5-small</code> produce 384 componentes.</p></div><div class=\"card danger\"><b>No significa</b><p>384 conceptos humanos interpretables uno a uno.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Analogía 2D", "k": "ADVERTENCIA", "h": "Una visualización 2D es una analogía.", "b": "<svg class=\"wideSvg\" viewBox=\"0 0 1000 420\"><rect width=\"1000\" height=\"420\" rx=\"24\" fill=\"#fff\"/><line x1=\"80\" y1=\"350\" x2=\"930\" y2=\"350\" stroke=\"#d2d8e5\" stroke-width=\"3\"/><line x1=\"80\" y1=\"350\" x2=\"80\" y2=\"50\" stroke=\"#d2d8e5\" stroke-width=\"3\"/><g fill=\"#0B8689\"><circle cx=\"220\" cy=\"120\" r=\"12\"/><circle cx=\"260\" cy=\"150\" r=\"12\"/><circle cx=\"190\" cy=\"170\" r=\"12\"/></g><text x=\"220\" y=\"92\" font-size=\"24\" font-weight=\"900\" fill=\"#075f62\" text-anchor=\"middle\">aviación</text><g fill=\"#634998\"><circle cx=\"640\" cy=\"130\" r=\"12\"/><circle cx=\"690\" cy=\"160\" r=\"12\"/><circle cx=\"610\" cy=\"190\" r=\"12\"/></g><text x=\"650\" y=\"100\" font-size=\"24\" font-weight=\"900\" fill=\"#634998\" text-anchor=\"middle\">educación</text><g fill=\"#E95D0F\"><circle cx=\"460\" cy=\"280\" r=\"12\"/><circle cx=\"510\" cy=\"305\" r=\"12\"/><circle cx=\"430\" cy=\"320\" r=\"12\"/></g><text x=\"470\" y=\"255\" font-size=\"24\" font-weight=\"900\" fill=\"#8a4200\" text-anchor=\"middle\">infraestructura</text><circle cx=\"245\" cy=\"205\" r=\"18\" fill=\"#B11F16\"/><text x=\"292\" y=\"212\" font-size=\"24\" font-weight=\"900\" fill=\"#B11F16\">consulta</text></svg><div class=\"note warn\">El modelo real vive en muchas dimensiones; el dibujo solo ayuda a razonar.</div>", "dark": false, "kind": "concept"}, {"title": "Prefijos E5", "k": "REGLA DE USO", "h": "E5 usa prefijos: query y passage.", "b": "<div class=\"grid\"><div class=\"card def\"><b><code>query:</code></b><p>Prefijo para la consulta o necesidad del usuario.</p></div><div class=\"card def\"><b><code>passage:</code></b><p>Prefijo para el documento o fragmento recuperable.</p></div></div><pre>\"query: reparación de aviones militares\"\n\"passage: mantenimiento programado de aeronaves KFIR\"</pre>", "dark": false, "kind": "concept"}, {"title": "Normalización", "k": "DEFINICIÓN", "h": "Normalización: misma dirección, longitud controlada.", "b": "<div class=\"twocol\"><div><p class=\"lead\">Normalizar escala un vector para que su norma sea 1, sin cambiar su dirección.</p><pre>||v|| = 1</pre></div><svg class=\"svgBox\" viewBox=\"0 0 540 330\"><line x1=\"70\" y1=\"260\" x2=\"470\" y2=\"260\" stroke=\"#c7cfdd\" stroke-width=\"3\"/><line x1=\"70\" y1=\"260\" x2=\"70\" y2=\"50\" stroke=\"#c7cfdd\" stroke-width=\"3\"/><line x1=\"70\" y1=\"260\" x2=\"410\" y2=\"80\" stroke=\"#E95D0F\" stroke-width=\"8\" marker-end=\"url(#arrowOrg)\"/><line x1=\"70\" y1=\"260\" x2=\"250\" y2=\"165\" stroke=\"#0B8689\" stroke-width=\"8\" marker-end=\"url(#arrowT)\"/><text x=\"380\" y=\"70\" font-size=\"22\" font-weight=\"900\" fill=\"#8a4200\">vector original</text><text x=\"210\" y=\"155\" font-size=\"22\" font-weight=\"900\" fill=\"#075f62\">normalizado</text><defs><marker id=\"arrowOrg\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L10,3 L0,6 Z\" fill=\"#E95D0F\"/></marker><marker id=\"arrowT\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L10,3 L0,6 Z\" fill=\"#0B8689\"/></marker></defs></svg></div>", "dark": false, "kind": "concept"}, {"title": "Producto punto", "k": "CÓDIGO Y MATEMÁTICA", "h": "Por eso el cuaderno puede usar producto punto.", "b": "<div class=\"twocol\"><pre>embeddings = modelo.encode(\n    textos,\n    normalize_embeddings=True\n)\nq = embedding_consulta(consulta)\nscores = embeddings @ q</pre><div><p class=\"lead\">Si los vectores están normalizados, el producto punto coincide con la similitud coseno.</p><div class=\"formula\">cos(q,d) = q · d</div></div></div>", "dark": false, "kind": "concept"}, {"title": "Coseno", "k": "DEFINICIÓN", "h": "Similitud coseno: compara orientación.", "b": "<div class=\"grid three\"><div class=\"card\"><b>Alta</b><p>Flechas con dirección parecida.</p><svg class=\"tiny\" viewBox=\"0 0 180 110\"><line x1=\"20\" y1=\"90\" x2=\"140\" y2=\"30\" stroke=\"#0B8689\" stroke-width=\"7\"/><line x1=\"20\" y1=\"90\" x2=\"150\" y2=\"45\" stroke=\"#E95D0F\" stroke-width=\"7\"/></svg></div><div class=\"card\"><b>Cerca de 0</b><p>Flechas casi ortogonales.</p><svg class=\"tiny\" viewBox=\"0 0 180 110\"><line x1=\"40\" y1=\"90\" x2=\"40\" y2=\"20\" stroke=\"#0B8689\" stroke-width=\"7\"/><line x1=\"40\" y1=\"90\" x2=\"140\" y2=\"90\" stroke=\"#E95D0F\" stroke-width=\"7\"/></svg></div><div class=\"card danger\"><b>No es probabilidad</b><p><code>0.91</code> no significa 91 % relevante.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "LAB coseno", "k": "LAB B · COSENO VISUAL", "h": "Construye el coseno antes de confiar en él.", "b": "<div class=\"lab coslab\"><div class=\"labrow\"><div><label>Vector A</label><select id=\"vecA\"><option value=\"1,0\">[1,0] aeronaves</option><option value=\"0,1\">[0,1] edificios</option><option value=\"0.8,0.2\">[0.8,0.2] mantenimiento aeronaves</option></select><label>Vector B</label><select id=\"vecB\"><option value=\"0.8,0.2\">[0.8,0.2] mantenimiento aeronaves</option><option value=\"0,1\">[0,1] edificios</option><option value=\"0.2,0.9\">[0.2,0.9] mantenimiento infraestructura</option></select><label><input id=\"cosNorm\" type=\"checkbox\" checked> normalizar antes de calcular</label><button class=\"action\" id=\"cosRun\">Calcular</button><button class=\"ghost\" data-reset-tool=\"cos\">Restablecer</button></div><div><svg id=\"cosSvg\" class=\"svgBox\" viewBox=\"0 0 360 260\"></svg></div></div><div id=\"cosOut\" class=\"feedback\"></div></div>", "dark": false, "kind": "lab"}, {"title": "Pausa", "k": "PAUSA", "h": "Hasta aquí: texto → embedding → vector normalizado → coseno.", "b": "<div class=\"bigFormula\">10 minutos</div><p class=\"lead\">Después del descanso usamos esa cercanía para recuperar documentos.</p>", "dark": true, "kind": "concept"}, {"title": "Buscar", "k": "RECUPERACIÓN", "h": "Tener similitud todavía no es buscar.", "b": "<p class=\"lead\">Buscar implica comparar una consulta contra muchos documentos y ordenar los candidatos.</p><div class=\"flow\"><div class=\"node\">query embedding</div><div class=\"arrow\">→</div><div class=\"node\">comparar</div><div class=\"arrow\">→</div><div class=\"node\">ordenar</div><div class=\"arrow\">→</div><div class=\"node\">Top-k</div></div>", "dark": false, "kind": "concept"}, {"title": "TopK", "k": "DEFINICIÓN", "h": "Top-k: los k primeros del ranking.", "b": "<div class=\"lab\"><label>Selecciona k</label><input id=\"kSlider\" type=\"range\" min=\"1\" max=\"8\" value=\"5\"><b id=\"kVal\">5</b><div id=\"kOut\" class=\"rankList\"></div></div><div class=\"note warn\">k no mejora el modelo. Solo decide cuántos candidatos inspeccionas.</div>", "dark": false, "kind": "lab"}, {"title": "KNN", "k": "DEFINICIÓN", "h": "kNN: encontrar los k vecinos más cercanos.", "b": "<svg class=\"wideSvg\" viewBox=\"0 0 1000 420\"><rect width=\"1000\" height=\"420\" rx=\"22\" fill=\"#fff\"/><circle cx=\"500\" cy=\"210\" r=\"20\" fill=\"#B11F16\"/><text x=\"535\" y=\"218\" font-size=\"24\" font-weight=\"900\" fill=\"#B11F16\">consulta</text><g fill=\"#0B8689\"><circle cx=\"420\" cy=\"170\" r=\"13\"/><circle cx=\"570\" cy=\"190\" r=\"13\"/><circle cx=\"515\" cy=\"285\" r=\"13\"/></g><g fill=\"#aeb7c8\"><circle cx=\"190\" cy=\"95\" r=\"10\"/><circle cx=\"800\" cy=\"90\" r=\"10\"/><circle cx=\"260\" cy=\"310\" r=\"10\"/><circle cx=\"735\" cy=\"335\" r=\"10\"/></g><circle cx=\"500\" cy=\"210\" r=\"135\" fill=\"none\" stroke=\"#E95D0F\" stroke-width=\"4\" stroke-dasharray=\"12 8\"/><text x=\"500\" y=\"380\" text-anchor=\"middle\" font-size=\"28\" font-weight=\"900\" fill=\"#122253\">k=3 vecinos dentro del entorno cercano</text></svg>", "dark": false, "kind": "concept"}, {"title": "LAB rankings", "k": "LAB C · MISMA CONSULTA, DOS RANKINGS", "h": "Lexical vs semántico.", "b": "<div class=\"lab\"><label>Consulta</label><select id=\"rankQuery\"><option value=\"aviones\">reparación de aviones militares</option><option value=\"oracle\">licencia Oracle Database</option><option value=\"educacion\">plataforma educativa virtual</option></select><button class=\"action\" id=\"rankRun\">Comparar Top-5</button><button class=\"ghost\" data-reset-tool=\"rank\">Restablecer</button><div id=\"rankOut\" class=\"rankCompare\"></div><div id=\"precisionOut\" class=\"feedback\"></div></div><div class=\"note\">Marca cada resultado como relevante o no relevante para calcular Precision@5.</div>", "dark": false, "kind": "lab"}, {"title": "Falso positivo", "k": "DEFINICIÓN", "h": "Score alto ≠ documento correcto.", "b": "<div class=\"grid\"><div class=\"card def\"><b>Falso positivo</b><p>Resultado recuperado que parece cercano por la señal, pero no responde la necesidad real.</p></div><div class=\"card ex\"><b>Ejemplo</b><p>“mantenimiento de infraestructura militar” puede parecer cercano a “mantenimiento militar”, pero no habla de aeronaves.</p></div></div><div class=\"note danger\">Por eso leemos resultados y no solo números.</div>", "dark": false, "kind": "concept"}, {"title": "Checkpoint C2C3", "k": "CHECKPOINT C2 + C3", "h": "Explica y compara.", "b": "<div class=\"grid\"><div class=\"lab checkpoint\" data-cp=\"bd-s09-c2\"><h3>C2 · Embedding, vector, dimensión y coseno</h3><textarea placeholder=\"Explica por qué 0.91 no es 91 % de relevancia.\"></textarea><button class=\"action\" data-cp-btn=\"bd-s09-c2\">Registrar C2</button><div class=\"feedback cpStatus\"></div></div><div class=\"lab checkpoint\" data-cp=\"bd-s09-c3\"><h3>C3 · BM25 vs semántico</h3><textarea placeholder=\"Nombra una ganancia semántica y un falso positivo.\"></textarea><button class=\"action\" data-cp-btn=\"bd-s09-c3\">Registrar C3</button><div class=\"feedback cpStatus\"></div></div></div>", "dark": false, "kind": "checkpoint"}, {"title": "Escala", "k": "ESCALA", "h": "¿Qué cambia con miles o millones de vectores?", "b": "<div class=\"bigNumbers\"><span>10</span><span>1.000</span><span>1.000.000</span></div><div class=\"note warn\">Comparar contra todo puede ser viable en memoria pequeña, pero no siempre a escala.</div>", "dark": false, "kind": "concept"}, {"title": "Modelo base indice", "k": "ARQUITECTURA", "h": "Modelo ≠ base vectorial ≠ índice vectorial.", "b": "<div class=\"grid three\"><div class=\"card def\"><b>Modelo</b><p>Genera embeddings.</p></div><div class=\"card def\"><b>Base vectorial</b><p>Persiste documentos, vectores y metadata.</p></div><div class=\"card def\"><b>Índice vectorial</b><p>Acelera la recuperación de vecinos.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "Documento almacenado", "k": "DISEÑO DE DATOS", "h": "¿Qué almacenamos?", "b": "<div class=\"twocol\"><pre>{\n  \"_id\": \"SECOP-001\",\n  \"texto\": \"mantenimiento...\",\n  \"embedding\": [0.08, ...],\n  \"entidad\": \"FAC\",\n  \"modalidad\": \"contratación\",\n  \"url_secop\": \"https://...\"\n}</pre><div class=\"grid\"><div class=\"card\"><b>Contenido</b><p>Texto recuperable.</p></div><div class=\"card\"><b>Vector</b><p>Representación numérica.</p></div><div class=\"card\"><b>Metadata</b><p>Datos para filtrar y auditar.</p></div></div></div>", "dark": false, "kind": "concept"}, {"title": "Metadata filtro", "k": "DEFINICIÓN", "h": "Metadata y filtros.", "b": "<div class=\"grid\"><div class=\"card def\"><b>Metadata</b><p>Datos descriptivos que acompañan al vector: entidad, fecha, modalidad, URL.</p></div><div class=\"card def\"><b>Filtro</b><p>Condición que restringe dónde buscar.</p></div></div><div class=\"filterSvg\"><span>1000 documentos</span><b>filtro: entidad = FAC</b><span>130 documentos</span><b>vecinos</b><span>Top-5</span></div>", "dark": false, "kind": "concept"}, {"title": "ENN", "k": "DEFINICIÓN", "h": "ENN: vecinos exactos.", "b": "<p class=\"lead\">Exact Nearest Neighbors evalúa exhaustivamente el universo permitido según el motor para encontrar vecinos exactos.</p><svg class=\"wideSvg\" viewBox=\"0 0 900 300\"><rect width=\"900\" height=\"300\" rx=\"22\" fill=\"#fff\"/><circle cx=\"450\" cy=\"150\" r=\"16\" fill=\"#B11F16\"/><g stroke=\"#E95D0F\" stroke-width=\"2\" opacity=\".5\"><line x1=\"450\" y1=\"150\" x2=\"120\" y2=\"70\"/><line x1=\"450\" y1=\"150\" x2=\"220\" y2=\"230\"/><line x1=\"450\" y1=\"150\" x2=\"750\" y2=\"75\"/><line x1=\"450\" y1=\"150\" x2=\"790\" y2=\"240\"/><line x1=\"450\" y1=\"150\" x2=\"520\" y2=\"60\"/><line x1=\"450\" y1=\"150\" x2=\"370\" y2=\"250\"/></g><g fill=\"#0B8689\"><circle cx=\"120\" cy=\"70\" r=\"9\"/><circle cx=\"220\" cy=\"230\" r=\"9\"/><circle cx=\"750\" cy=\"75\" r=\"9\"/><circle cx=\"790\" cy=\"240\" r=\"9\"/><circle cx=\"520\" cy=\"60\" r=\"9\"/><circle cx=\"370\" cy=\"250\" r=\"9\"/></g><text x=\"450\" y=\"285\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"900\" fill=\"#122253\">revisa todos los candidatos permitidos</text></svg>", "dark": false, "kind": "concept"}, {"title": "ANN", "k": "DEFINICIÓN", "h": "ANN: vecinos aproximados.", "b": "<p class=\"lead\">Approximate Nearest Neighbors reduce la búsqueda para obtener buenos vecinos con menor coste.</p><div class=\"note danger\"><b>Precisión del lenguaje.</b> Lo aproximado es el proceso de encontrar vecinos; no significa que la relevancia humana quede resuelta.</div>", "dark": false, "kind": "concept"}, {"title": "HNSW", "k": "INTUICIÓN", "h": "HNSW: navegar en vez de revisar todo.", "b": "<div class=\"lab hnsw\"><svg id=\"hnswSvg\" class=\"wideSvg\" viewBox=\"0 0 900 360\"></svg><button class=\"action\" id=\"hnswStep\">Siguiente salto</button><button class=\"ghost\" data-reset-tool=\"hnsw\">Restablecer</button><div id=\"hnswOut\" class=\"feedback\"></div></div>", "dark": false, "kind": "lab"}, {"title": "numCandidates", "k": "PARÁMETRO", "h": "numCandidates: cuánto exploro antes del Top-k.", "b": "<div class=\"twocol\"><pre>{\n  \"$vectorSearch\": {\n    \"limit\": 5,\n    \"numCandidates\": 100\n  }\n}</pre><div><p class=\"lead\">Más candidatos suele explorar más vecinos posibles, pero también aumenta trabajo y latencia.</p><div class=\"note\">Para <code>limit=5</code>, <code>numCandidates=100</code> es un punto inicial razonable en clase.</div></div></div>", "dark": false, "kind": "concept"}, {"title": "Recall latencia", "k": "TRADE-OFF", "h": "Más exploración no es gratis.", "b": "<svg class=\"wideSvg\" viewBox=\"0 0 920 420\"><rect width=\"920\" height=\"420\" rx=\"24\" fill=\"#fff\"/><line x1=\"95\" y1=\"350\" x2=\"840\" y2=\"350\" stroke=\"#b9c2d1\" stroke-width=\"3\"/><line x1=\"95\" y1=\"350\" x2=\"95\" y2=\"60\" stroke=\"#b9c2d1\" stroke-width=\"3\"/><path d=\"M110 335 C250 230, 420 155, 790 105\" stroke=\"#0B8689\" stroke-width=\"7\" fill=\"none\"/><path d=\"M110 340 C260 330, 480 285, 800 95\" stroke=\"#E95D0F\" stroke-width=\"7\" fill=\"none\"/><text x=\"580\" y=\"120\" font-size=\"24\" font-weight=\"900\" fill=\"#075f62\">recall conceptual ↑</text><text x=\"610\" y=\"250\" font-size=\"24\" font-weight=\"900\" fill=\"#8a4200\">latencia conceptual ↑</text><text x=\"450\" y=\"395\" text-anchor=\"middle\" font-size=\"22\" fill=\"#122253\" font-weight=\"900\">numCandidates</text></svg>", "dark": false, "kind": "concept"}, {"title": "LAB candidatos", "k": "LAB D · EXPLORACIÓN ANN", "h": "¿Cuánto explorarías?", "b": "<div class=\"lab\"><label>numCandidates</label><input id=\"candSlider\" type=\"range\" min=\"10\" max=\"250\" step=\"10\" value=\"100\"><b id=\"candVal\">100</b><div id=\"candViz\" class=\"candidateViz\"></div><div id=\"candOut\" class=\"feedback\"></div><button class=\"ghost\" data-reset-tool=\"cand\">Restablecer</button></div>", "dark": false, "kind": "lab"}, {"title": "Tradeoff", "k": "DECISIÓN", "h": "Exactitud, latencia y coste forman un trade-off.", "b": "<div class=\"triangle\"><div>exactitud</div><div>latencia</div><div>coste</div></div><div class=\"note warn\">No existe una configuración universal. Se ajusta según datos, escala y objetivo.</div>", "dark": false, "kind": "concept"}, {"title": "Checkpoint C4", "k": "CHECKPOINT C4", "h": "Modelo, base e índice.", "b": "<div class=\"lab checkpoint\" data-cp=\"bd-s09-c4\"><p class=\"lead\">Antes de seguir, explica la diferencia entre modelo, base vectorial e índice vectorial.</p><textarea placeholder=\"Modelo genera... Base almacena... Índice acelera...\"></textarea><button class=\"action\" data-cp-btn=\"bd-s09-c4\">Registrar C4 en LMS</button><div class=\"feedback cpStatus\"></div></div>", "dark": false, "kind": "checkpoint"}, {"title": "Atlas", "k": "IMPLEMENTACIÓN", "h": "Ahora Atlas deja de ser una caja negra.", "b": "<div class=\"flow\"><div class=\"node\">documento MongoDB</div><div class=\"arrow\">→</div><div class=\"node\">embedding</div><div class=\"arrow\">→</div><div class=\"node\">índice vectorial</div><div class=\"arrow\">→</div><div class=\"node\">$vectorSearch</div><div class=\"arrow\">→</div><div class=\"node\">Top-k</div></div><div class=\"note\">Atlas es una implementación de los conceptos que ya construimos.</div>", "dark": false, "kind": "concept"}, {"title": "$vectorSearch", "k": "CÓDIGO EXPLICADO", "h": "Anatomía de $vectorSearch.", "b": "<div class=\"twocol\"><pre>{\n \"$vectorSearch\": {\n   \"index\": \"s09_vector_index\",\n   \"path\": \"embedding\",\n   \"queryVector\": q,\n   \"numCandidates\": 100,\n   \"limit\": 5,\n   \"filter\": {\"entidad\": \"FAC\"}\n }\n}</pre><div class=\"grid\"><div class=\"card\"><b>index</b><p>Índice vectorial usado.</p></div><div class=\"card\"><b>path</b><p>Campo donde vive el vector.</p></div><div class=\"card\"><b>queryVector</b><p>Vector de la consulta.</p></div><div class=\"card\"><b>filter</b><p>Restringe el universo.</p></div></div></div>", "dark": false, "kind": "concept"}, {"title": "Builder Atlas", "k": "LAB E · CONSTRUYE LA CONSULTA", "h": "Genera tu $vectorSearch.", "b": "<div class=\"lab\"><div class=\"labrow\"><div><label>Índice</label><input id=\"bIndex\" value=\"s09_vector_index\"><label>Campo vectorial</label><input id=\"bPath\" value=\"embedding\"><label>limit</label><input id=\"bLimit\" type=\"number\" value=\"5\"></div><div><label>numCandidates</label><input id=\"bCand\" type=\"number\" value=\"100\"><label>Filtro entidad</label><input id=\"bFilter\" value=\"FAC\"><button class=\"action\" id=\"buildQuery\">Construir JSON</button><button class=\"ghost\" data-reset-tool=\"builder\">Restablecer</button></div></div><pre id=\"builderOut\"></pre></div>", "dark": false, "kind": "lab"}, {"title": "Contingencia", "k": "RESILIENCIA", "h": "Si Atlas falla, el concepto no falla.", "b": "<div class=\"grid\"><div class=\"card\"><b>Ruta local</b><p>NumPy + embeddings normalizados. Buena para aprender y verificar.</p></div><div class=\"card\"><b>Ruta Atlas</b><p>Persistencia, metadata, índice y consultas reales.</p></div></div><div class=\"note warn\">La dependencia instrumental no puede bloquear la competencia central.</div>", "dark": false, "kind": "concept"}, {"title": "No elegir siempre", "k": "DECISIÓN", "h": "A veces lexical gana; a veces semántica gana.", "b": "<table class=\"table\"><tr><th>Necesidad</th><th>Señal fuerte</th></tr><tr><td>ID exacto, marca, norma</td><td>Lexical</td></tr><tr><td>Paráfrasis, intención amplia</td><td>Semántica</td></tr><tr><td>FAC + mantenimiento de aeronaves</td><td>Híbrida</td></tr></table>", "dark": false, "kind": "concept"}, {"title": "Hybrid", "k": "DEFINICIÓN", "h": "Búsqueda híbrida: combinar señales.", "b": "<div class=\"flow\"><div class=\"node\">BM25</div><div class=\"arrow\">→</div><div class=\"node\">ranking lexical</div><div class=\"arrow\">→</div><div class=\"node\">+</div><div class=\"arrow\">→</div><div class=\"node\">embedding</div><div class=\"arrow\">→</div><div class=\"node\">ranking semántico</div><div class=\"arrow\">→</div><div class=\"node\">fusión</div></div><div class=\"note\">La meta no es declarar un ganador universal, sino aprovechar señales complementarias.</div>", "dark": false, "kind": "concept"}, {"title": "Scores incompatibles", "k": "ERROR FRECUENTE", "h": "BM25 8.7 y coseno 0.82 no viven en la misma escala.", "b": "<div class=\"grid\"><div class=\"card\"><b>BM25</b><p>Score lexical dependiente de términos y corpus.</p><div class=\"meter\">8.7</div></div><div class=\"card\"><b>Coseno</b><p>Cercanía angular entre vectores.</p><div class=\"meter\">0.82</div></div></div><div class=\"note danger\">Sumarlos sin criterio puede producir una señal difícil de interpretar.</div>", "dark": false, "kind": "concept"}, {"title": "RRF", "k": "DEFINICIÓN", "h": "RRF fusiona posiciones, no scores incompatibles.", "b": "<div class=\"rankFusion\"><ol><b>Lexical</b><li>D3</li><li>D8</li><li>D1</li></ol><div class=\"arrow big\">→</div><ol><b>RRF</b><li>D8</li><li>D3</li><li>D5</li></ol><div class=\"arrow big\">←</div><ol><b>Semántico</b><li>D8</li><li>D3</li><li>D5</li></ol></div><div class=\"note\">RRF premia documentos que aparecen bien posicionados en varios rankings.</div>", "dark": false, "kind": "concept"}, {"title": "Mejor buscador", "k": "EVALUACIÓN", "h": "Mejor no significa score más alto.", "b": "<div class=\"grid\"><div class=\"card def\"><b>Juicio de relevancia</b><p>Etiqueta humana o de referencia que indica si un documento responde a la necesidad.</p></div><div class=\"card ex\"><b>Ejemplo</b><p>Top-5: ✓ ✓ ✗ ✓ ✗. Tres de cinco fueron útiles.</p></div></div>", "dark": false, "kind": "concept"}, {"title": "PrecisionK", "k": "MÉTRICA", "h": "Precision@k: ¿cuántos de los primeros eran relevantes?", "b": "<div class=\"formula\">Precision@k = relevantes en Top-k / k</div><div class=\"lab\"><div id=\"pButtons\" class=\"pButtons\"></div><div id=\"pOut\" class=\"feedback\"></div><button class=\"ghost\" data-reset-tool=\"precision\">Restablecer</button></div>", "dark": false, "kind": "lab"}, {"title": "Evidencia final", "k": "LAB FINAL · EVIDENCIA", "h": "Construye una decisión defendible.", "b": "<div class=\"lab checkpoint\" data-cp=\"bd-s09-c5\"><div class=\"labrow\"><div><label>Consulta propia</label><input id=\"evQuery\" value=\"mantenimiento de aeronaves militares\"><label>Resultado defendible</label><input id=\"evGood\" value=\"mantenimiento programado de aeronaves KFIR\"><label>Falso positivo</label><input id=\"evBad\" value=\"mantenimiento de infraestructura militar\"></div><div><label>Decisión</label><select id=\"evDecision\"><option>híbrida</option><option>lexical</option><option>semántica</option></select><label>Límite</label><input id=\"evLimit\" value=\"el score no prueba relevancia sin lectura humana\"><button class=\"action\" id=\"evRun\">Generar evidencia</button><button class=\"action soft\" data-cp-btn=\"bd-s09-c5\">Registrar C5</button></div></div><pre id=\"evOut\">{}</pre><div class=\"feedback cpStatus\"></div></div>", "dark": false, "kind": "checkpoint"}, {"title": "Exit ticket", "k": "EXIT TICKET", "h": "Un documento obtuvo score coseno 0.91.", "b": "<div class=\"grid\"><div class=\"card\"><b>Sí puedes decir</b><p>Está muy próximo a la consulta bajo ese modelo, representación y métrica.</p></div><div class=\"card\"><b>No puedes decir</b><p>Que tiene 91 % de probabilidad de ser relevante.</p></div></div><div class=\"note\">S10: ya sabemos representar y recuperar texto; ahora debemos construir tuberías que lo extraigan, transformen y muevan con trazabilidad.</div>", "dark": true, "kind": "concept"}, {"title": "Taller casa", "k": "DESPUÉS DE CLASE", "h": "Taller S09 · búsqueda híbrida defendible.", "b": "<p class=\"lead\">Trabajo autónomo estimado: mínimo 6 horas.</p><table class=\"table\"><tr><th>Producto</th><th>Evidencia</th></tr><tr><td>Baseline lexical</td><td>Top-5 + explicación</td></tr><tr><td>Búsqueda semántica</td><td>Embeddings + Top-5 + falso positivo</td></tr><tr><td>Híbrida</td><td>Fusión + decisión</td></tr><tr><td>Evaluación</td><td>Precision@5 + límites</td></tr></table>", "dark": false, "kind": "concept"}];
const stage=document.getElementById('stage');
stage.innerHTML = SLIDES.map((s,idx)=>`<section class="slide ${s.dark?'dark':''}" data-title="${escAttr(s.title)}" id="slide-${idx+1}"><div class="k">${s.k}</div><h1>${s.h}</h1>${s.b}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')],bar=document.getElementById('bar'),n=document.getElementById('n'),tot=document.getElementById('tot'),chap=document.getElementById('chap'),prev=document.getElementById('prev'),next=document.getElementById('next'),drawer=document.getElementById('mapDrawer');
let i=0,x0=null;tot.textContent=slides.length;
document.getElementById('mapLinks').innerHTML=SLIDES.map((s,j)=>`<a href="#s${j+1}">${String(j+1).padStart(2,'0')} · ${esc(s.title)}</a>`).join('');
function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escAttr(x){return esc(x).replace(/"/g,'&quot;')}
function go(v,replace=false){i=Math.max(0,Math.min(slides.length-1,v));slides.forEach((s,j)=>s.classList.toggle('on',j===i));n.textContent=i+1;bar.style.width=((i+1)/slides.length*100)+'%';chap.textContent=slides[i].dataset.title||'';prev.disabled=i===0;next.disabled=i===slides.length-1;const h='#s'+(i+1);if(location.hash!==h){replace?history.replaceState(null,'',h):history.pushState(null,'',h)}}
function fromHash(){const m=location.hash.match(/^#s(\d+)$/);go(m?Number(m[1])-1:0,true)}
prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);document.getElementById('mapBtn').onclick=()=>drawer.classList.toggle('on');document.getElementById('closeMap').onclick=()=>drawer.classList.remove('on');
document.getElementById('fs').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1)});
addEventListener('hashchange',fromHash);addEventListener('touchstart',e=>x0=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>55)go(i+(dx<0?1:-1));x0=null},{passive:true});

function toks(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9ñ]+/g)||[]}
function pctShared(a,b){const A=new Set(toks(a)),B=new Set(toks(b));const inter=[...A].filter(x=>B.has(x));return {p:A.size?inter.length/A.size:0,inter,A:[...A],B:[...B]}}
function paintTokens(t,shared){return toks(t).map(x=>shared.includes(x)?`<mark>${esc(x)}</mark>`:esc(x)).join(' ')}
function lex(){const q=document.getElementById('lexQuery'),d=document.getElementById('lexDoc'),out=document.getElementById('lexOut');if(!q||!d||!out)return;const r=pctShared(q.value,d.value);out.innerHTML=`<b>Coincidencia lexical aproximada:</b> ${(r.p*100).toFixed(0)}% de tokens de la consulta aparecen en el documento.\n\nConsulta: ${paintTokens(q.value,r.inter)}\nDocumento: ${paintTokens(d.value,r.inter)}\n\nInterpretación: baja coincidencia no implica baja relevancia semántica.`}
document.getElementById('lexRun')?.addEventListener('click',lex);lex();

function parseVec(v){return String(v).split(',').map(Number)}
function dot(a,b){return a.reduce((z,x,k)=>z+x*b[k],0)}function norm(a){return Math.sqrt(dot(a,a))}function normalize(a){const n=norm(a)||1;return a.map(x=>x/n)}
function drawCos(a,b){const svg=document.getElementById('cosSvg');if(!svg)return;const scale=110,ox=70,oy=210;const ax=ox+a[0]*scale,ay=oy-a[1]*scale,bx=ox+b[0]*scale,by=oy-b[1]*scale;svg.innerHTML=`<line x1="40" y1="${oy}" x2="330" y2="${oy}" stroke="#c7cfdd" stroke-width="3"/><line x1="${ox}" y1="30" x2="${ox}" y2="230" stroke="#c7cfdd" stroke-width="3"/><line x1="${ox}" y1="${oy}" x2="${ax}" y2="${ay}" stroke="#0B8689" stroke-width="8" stroke-linecap="round"/><line x1="${ox}" y1="${oy}" x2="${bx}" y2="${by}" stroke="#E95D0F" stroke-width="8" stroke-linecap="round"/><circle cx="${ax}" cy="${ay}" r="7" fill="#0B8689"/><circle cx="${bx}" cy="${by}" r="7" fill="#E95D0F"/><text x="230" y="40" font-size="18" font-weight="900" fill="#122253">A teal · B naranja</text>`}
function cosRun(){const A0=parseVec(document.getElementById('vecA')?.value||'1,0'),B0=parseVec(document.getElementById('vecB')?.value||'0.8,0.2');const useNorm=document.getElementById('cosNorm')?.checked;const A=useNorm?normalize(A0):A0,B=useNorm?normalize(B0):B0;const dp=dot(A,B),co=dp/((norm(A)||1)*(norm(B)||1));drawCos(A,B);const out=document.getElementById('cosOut');if(out)out.textContent=`A·B = ${dp.toFixed(3)}\n||A|| = ${norm(A).toFixed(3)} · ||B|| = ${norm(B).toFixed(3)}\ncoseno = ${co.toFixed(3)}\nInterpretación: cercanía geométrica, no probabilidad de relevancia.`}
document.getElementById('cosRun')?.addEventListener('click',cosRun);cosRun();

const docs=['aeronaves KFIR','flota aérea militar','sistemas aeronáuticos','helicópteros','infraestructura militar','transporte aéreo','pista aeroportuaria','servicio logístico'];
function topK(){const s=document.getElementById('kSlider'),v=document.getElementById('kVal'),out=document.getElementById('kOut');if(!s||!out)return;v.textContent=s.value;out.innerHTML=docs.slice(0,Number(s.value)).map((x,j)=>`<div class="item"><b>${j+1}</b> ${esc(x)}</div>`).join('')}
document.getElementById('kSlider')?.addEventListener('input',topK);topK();

const examples={aviones:{lex:['reparación de aviones militares','compra de repuestos para aviones','servicio de pista aeroportuaria','mantenimiento de motores','contrato de transporte aéreo'],sem:['mantenimiento programado de aeronaves KFIR','soporte técnico para flota aérea militar','inspección de sistemas aeronáuticos','repuestos para helicópteros','mantenimiento de infraestructura militar']},oracle:{lex:['licencia Oracle Database','renovación soporte Oracle','servicios nube Oracle','capacitación SQL','licencias ofimáticas'],sem:['licenciamiento Oracle Database','soporte de base de datos Oracle','renovación tecnológica Oracle','software de gestión documental','servicio de nube pública']},educacion:{lex:['plataforma educativa virtual','aula virtual para formación','software LMS educativo','licencias plataforma','conectividad escolar'],sem:['sistema de aprendizaje en línea','entorno virtual de formación','solución LMS para estudiantes','software de gestión académica','plataforma de videoconferencia']}};
function renderRank(){const key=document.getElementById('rankQuery')?.value||'aviones',e=examples[key],out=document.getElementById('rankOut');if(!out)return;function col(title,arr,type){return `<div><h3>${title}</h3>${arr.map((x,k)=>`<div class="item"><button class="relBtn" data-rel="${type}-${k}">?</button><b>${k+1}</b><span>${esc(x)}</span></div>`).join('')}</div>`}out.innerHTML=col('BM25 lexical',e.lex,'lex')+col('Semántico',e.sem,'sem');document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'?';precisionRank()});precisionRank()}
function precisionRank(){const out=document.getElementById('precisionOut');if(!out)return;const lex=[...document.querySelectorAll('[data-rel^="lex-"]')].filter(b=>b.classList.contains('on')).length;const sem=[...document.querySelectorAll('[data-rel^="sem-"]')].filter(b=>b.classList.contains('on')).length;out.textContent=`Precision@5 lexical marcada = ${(lex/5).toFixed(2)} (${lex}/5)\nPrecision@5 semántica marcada = ${(sem/5).toFixed(2)} (${sem}/5)\nLa métrica depende de tus juicios de relevancia.`}
document.getElementById('rankRun')?.addEventListener('click',renderRank);renderRank();

let hStep=0;const hNodes=[[90,90],[230,70],[365,120],[510,135],[650,180],[790,210],[500,280],[300,250]],path=[0,2,3,4,5];
function drawH(){const svg=document.getElementById('hnswSvg');if(!svg)return;let lines='';for(let j=0;j<hNodes.length-1;j++){for(let k=j+1;k<hNodes.length;k++){if((j+k)%3===0)lines+=`<line x1="${hNodes[j][0]}" y1="${hNodes[j][1]}" x2="${hNodes[k][0]}" y2="${hNodes[k][1]}" stroke="#d9dfeb" stroke-width="2"/>`}}let nodes=hNodes.map((p,idx)=>{let cls=path.slice(0,hStep+1).includes(idx)?'#E95D0F':(idx===5?'#B11F16':'#0B8689');return `<circle cx="${p[0]}" cy="${p[1]}" r="${idx===5?18:13}" fill="${cls}"/><text x="${p[0]}" y="${p[1]-22}" text-anchor="middle" font-size="16" font-weight="900" fill="#122253">D${idx+1}</text>`}).join('');svg.innerHTML=`<rect width="900" height="360" rx="22" fill="#fff"/>${lines}${nodes}<text x="450" y="335" text-anchor="middle" font-size="23" font-weight="900" fill="#122253">HNSW navega hacia vecinos prometedores sin revisar todo ingenuamente</text>`;const o=document.getElementById('hnswOut');if(o)o.textContent=`Salto ${hStep+1}/${path.length}: visitado ${path.slice(0,hStep+1).map(x=>'D'+(x+1)).join(' → ')}`}
document.getElementById('hnswStep')?.addEventListener('click',()=>{hStep=Math.min(path.length-1,hStep+1);drawH()});drawH();

function cand(){const s=document.getElementById('candSlider'),v=document.getElementById('candVal'),viz=document.getElementById('candViz'),out=document.getElementById('candOut');if(!s||!viz)return;const val=Number(s.value);v.textContent=val;const cells=Array.from({length:100},(_,i)=>`<i class="${i<val/2?'on':''} ${[8,22,49,73,88].includes(i)&&i<val/2?'hit':''}"></i>`).join('');viz.innerHTML=cells;const recall=Math.min(.98,.35+val/250*.7),cost=(val/250*100);out.textContent=`Recall didáctico estimado: ${recall.toFixed(2)}\nCoste relativo: ${cost.toFixed(0)}%\nMás candidatos exploran más, pero no son gratis.`}
document.getElementById('candSlider')?.addEventListener('input',cand);cand();

function buildQuery(){const q={ "$vectorSearch":{ index:val('bIndex'), path:val('bPath'), queryVector:"<vector_de_la_consulta>", numCandidates:Number(val('bCand')), limit:Number(val('bLimit')) }};if(val('bFilter'))q["$vectorSearch"].filter={entidad:{"$eq":val('bFilter')}};const out=document.getElementById('builderOut');if(out)out.textContent=JSON.stringify(q,null,2)}
function val(id){return document.getElementById(id)?.value||''}
document.getElementById('buildQuery')?.addEventListener('click',buildQuery);buildQuery();

function initP(){const root=document.getElementById('pButtons'),out=document.getElementById('pOut');if(!root||!out)return;root.innerHTML=Array.from({length:5},(_,i)=>`<button data-p="${i}">✗</button>`).join('');root.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'✗';calcP()});calcP()}
function calcP(){const out=document.getElementById('pOut');if(!out)return;const ok=[...document.querySelectorAll('[data-p]')].filter(b=>b.classList.contains('on')).length;out.textContent=`Precision@5 = ${ok}/5 = ${(ok/5).toFixed(2)}`}
initP();

function ev(){const o={consulta:val('evQuery'),decision:val('evDecision'),resultado_defendible:val('evGood'),falso_positivo:val('evBad'),limite:val('evLimit'),regla:"No aceptar una decisión basada solo en score."};const out=document.getElementById('evOut');if(out)out.textContent=JSON.stringify(o,null,2)}
document.getElementById('evRun')?.addEventListener('click',ev);ev();

document.querySelectorAll('[data-reset-tool]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.resetTool;if(t==='lex'){document.getElementById('lexQuery').selectedIndex=0;document.getElementById('lexDoc').selectedIndex=0;lex()}if(t==='cos'){document.getElementById('vecA').selectedIndex=0;document.getElementById('vecB').selectedIndex=0;document.getElementById('cosNorm').checked=true;cosRun()}if(t==='rank'){document.getElementById('rankQuery').selectedIndex=0;renderRank()}if(t==='hnsw'){hStep=0;drawH()}if(t==='cand'){document.getElementById('candSlider').value=100;cand()}if(t==='builder'){document.getElementById('bIndex').value='s09_vector_index';document.getElementById('bPath').value='embedding';document.getElementById('bLimit').value=5;document.getElementById('bCand').value=100;document.getElementById('bFilter').value='FAC';buildQuery()}if(t==='precision'){document.querySelectorAll('[data-p]').forEach(x=>{x.classList.remove('on');x.textContent='✗'});calcP()}}));

async function submitCheckpoint(code,btn){const box=btn.closest('.checkpoint')||btn.parentElement;const status=box?.querySelector('.cpStatus');function msg(t,ok=false){if(status){status.textContent=t;status.style.background=ok?'#e7f5ef':'#fff3e8';status.style.color=ok?'#145b43':'#8a4200'}}try{if(!window.BIGDATA_LMS?.s09){msg('Abre esta presentación desde el LMS para registrar el checkpoint real.');return}btn.disabled=true;await window.BIGDATA_LMS.s09('complete_checkpoint',{activity_code:code});msg('Checkpoint registrado en el LMS/WALL.',true)}catch(e){msg('No se pudo registrar: '+String(e.message||e))}finally{btn.disabled=false}}
document.querySelectorAll('[data-cp-btn]').forEach(b=>b.addEventListener('click',()=>submitCheckpoint(b.dataset.cpBtn,b)));

fromHash();
})();
</script>
</body>
</html>
