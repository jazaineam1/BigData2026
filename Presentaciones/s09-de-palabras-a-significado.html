const slides=[
{t:'Inicio',k:'S09 · caso conductor',h:'Cuando las palabras no coinciden.',dark:1,b:`<div class="layout cols bigleft"><div><p class="lead">Laura busca procesos de contratación pública. Su consulta dice una cosa; el documento relevante puede decir otra.</p><div class="flow"><div class="node">necesidad</div><div class="arrow">→</div><div class="node">buscar</div><div class="arrow">→</div><div class="node">ranking</div><div class="arrow">→</div><div class="node">decidir</div></div><div class="note warn"><b>Meta de clase.</b> Construir, comparar y defender recuperación lexical, semántica e híbrida.</div></div><svg class="svg" viewBox="0 0 760 430"><rect x="20" y="30" width="300" height="105" rx="22" fill="#fff"/><text x="45" y="68" font-size="20" font-weight="900" fill="#0B8689">Consulta</text><text x="45" y="102" font-size="24" font-weight="900" fill="#122253">mantener aeronaves</text><text x="45" y="132" font-size="24" font-weight="900" fill="#122253">militares disponibles</text><path d="M330 84 C420 84 430 160 520 160" stroke="#E95D0F" stroke-width="8" fill="none" marker-end="url(#a)"/><rect x="505" y="115" width="230" height="95" rx="20" fill="#fff"/><text x="530" y="150" font-size="18" font-weight="900" fill="#634998">Documento relevante</text><text x="530" y="184" font-size="20" font-weight="900" fill="#122253">mantenimiento KFIR</text><rect x="505" y="240" width="230" height="78" rx="18" fill="#ffffffaa"/><text x="530" y="285" font-size="19" fill="#122253">infraestructura militar</text><rect x="505" y="335" width="230" height="70" rx="18" fill="#ffffffaa"/><text x="530" y="376" font-size="19" fill="#122253">licencia Oracle</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Caso',k:'EL CASO',h:'Una consulta no es una palabra: es una necesidad.',b:`<div class="layout cols"><div class="panel"><b>Consulta de Laura</b><div class="bigphrase">servicios para mantener aeronaves militares disponibles</div><p>Ella no está buscando una palabra exacta. Busca documentos que resuelvan una necesidad profesional.</p><div class="note">Producto esperado: saber cuándo la coincidencia textual ayuda y cuándo se queda corta.</div></div><div class="lab"><label>Buscar literalmente</label><input id="caseQ" value="servicios para mantener aeronaves militares disponibles"><button class="btn" onclick="literalSearch()">Buscar</button><div id="caseOut" class="feedback">Haz clic para simular una búsqueda literal.</div></div></div>`},
{t:'Conflicto',k:'CONFLICTO',h:'El documento correcto puede decir otra cosa.',b:`<div class="layout cols"><div class="card"><b>Consulta</b><div class="bigphrase">reparación de aviones militares</div></div><div class="card"><b>Documento relevante</b><div class="bigphrase">mantenimiento programado de aeronaves KFIR</div></div><div class="note warn" style="grid-column:1/-1"><b>Problema:</b> el significado se parece, pero las palabras no coinciden lo suficiente.</div><svg class="svg" style="grid-column:1/-1;min-height:170px" viewBox="0 0 960 170"><text x="30" y="45" font-size="22" font-weight="900" fill="#122253">reparación</text><text x="220" y="45" font-size="22" font-weight="900" fill="#122253">aviones</text><text x="380" y="45" font-size="22" font-weight="900" fill="#122253">militares</text><path d="M70 70 C90 120 145 120 165 70" stroke="#E95D0F" stroke-width="5" fill="none"/><text x="115" y="142" font-size="18" font-weight="900" fill="#E95D0F">paráfrasis</text><text x="35" y="100" font-size="22" font-weight="900" fill="#122253">mantenimiento</text><text x="230" y="100" font-size="22" font-weight="900" fill="#122253">aeronaves</text><text x="420" y="100" font-size="22" font-weight="900" fill="#122253">KFIR</text><rect x="600" y="28" width="310" height="100" rx="20" fill="#fff3e8"/><text x="625" y="66" font-size="21" font-weight="900" fill="#8a4200">El buscador lexical ve tokens.</text><text x="625" y="100" font-size="21" font-weight="900" fill="#8a4200">Nosotros vemos significado.</text></svg></div>`},
{t:'Objetos base',k:'VOCABULARIO INTEGRADO',h:'Cuatro objetos antes de buscar.',b:`<div class="layout four"><div class="card def"><b>Corpus</b>Conjunto de documentos sobre el que se busca. Ejemplo: procesos SECOP.</div><div class="card def"><b>Documento</b>Unidad recuperable: proceso, noticia, contrato o fila.</div><div class="card def"><b>Consulta</b>Necesidad expresada por el usuario.</div><div class="card def"><b>Ranking</b>Lista ordenada de candidatos según una señal.</div><div class="diagram" style="grid-column:1/-1"><div class="flow"><div class="node">corpus</div><div class="arrow">→</div><div class="node">consulta</div><div class="arrow">→</div><div class="node">mecanismo</div><div class="arrow">→</div><div class="node">ranking</div><div class="arrow">→</div><div class="node">lectura humana</div></div></div></div>`},
{t:'Recuperación',k:'DEFINICIÓN CENTRAL',h:'Recuperar no es “buscar en Google”.',b:`<div class="layout cols"><div><p class="lead"><b>Recuperación de información</b>: proceso que recibe una necesidad y devuelve documentos candidatos ordenados.</p><div class="note bad"><b>Regla de S09.</b> Un score ordena candidatos; no reemplaza el juicio de relevancia.</div></div><svg class="svg" viewBox="0 0 720 420"><rect x="35" y="160" width="150" height="75" rx="18" fill="#fff" stroke="#dfe3ee"/><text x="70" y="205" font-size="22" font-weight="900" fill="#122253">consulta</text><path d="M195 198 L285 198" stroke="#E95D0F" stroke-width="7" marker-end="url(#arr)"/><rect x="295" y="130" width="175" height="135" rx="22" fill="#eaf6f6" stroke="#0B8689"/><text x="330" y="178" font-size="22" font-weight="900" fill="#075f62">mecanismo</text><text x="342" y="215" font-size="18" fill="#075f62">lexical / vectorial</text><path d="M480 198 L570 198" stroke="#E95D0F" stroke-width="7" marker-end="url(#arr)"/><rect x="580" y="80" width="110" height="55" rx="15" fill="#fff" stroke="#dfe3ee"/><rect x="580" y="155" width="110" height="55" rx="15" fill="#fff" stroke="#dfe3ee"/><rect x="580" y="230" width="110" height="55" rx="15" fill="#fff" stroke="#dfe3ee"/><text x="614" y="115" font-size="22" font-weight="900" fill="#122253">D1</text><text x="614" y="190" font-size="22" font-weight="900" fill="#122253">D2</text><text x="614" y="265" font-size="22" font-weight="900" fill="#122253">D3</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Lexical',k:'S07 EN UNA LÁMINA',h:'Lexical funciona cuando la palabra exacta importa.',b:`<div class="layout cols bigright"><div><div class="flow"><div class="node">texto</div><div class="arrow">→</div><div class="node">analyzer</div><div class="arrow">→</div><div class="node">tokens</div><div class="arrow">→</div><div class="node">BM25</div></div><div class="note"><b>Usos fuertes:</b> identificadores, marcas, nombres propios, términos legales y filtros exactos.</div></div><div class="lab"><label>Consulta</label><select id="lexQ"><option>reparación de aviones militares</option><option>licencia Oracle</option><option>CO1.REQ.3714823</option></select><button class="btn" onclick="lexicalDemo()">Comparar tokens</button><div id="lexOut" class="feedback">Selecciona una consulta.</div></div></div>`},
{t:'Mecanismos',k:'MAPA DE DECISIÓN',h:'Lexical, semántica e híbrida no son marcas.',b:`<div class="layout three"><div class="card def"><b>Lexical</b>Usa coincidencia y peso de términos. Excelente cuando el texto exacto importa.</div><div class="card def"><b>Semántica</b>Usa embeddings y cercanía geométrica para capturar paráfrasis e intención.</div><div class="card def"><b>Híbrida</b>Combina rankings o señales para aprovechar ambas fortalezas.</div><table class="table" style="grid-column:1/-1"><tr><th>Necesidad</th><th>Mecanismo razonable</th><th>Motivo</th></tr><tr><td>ID exacto</td><td>Lexical</td><td>No quieres paráfrasis.</td></tr><tr><td>“reparación de aviones”</td><td>Semántica</td><td>Puede aparecer como mantenimiento/aeronaves.</td></tr><tr><td>“mantenimiento aeronaves FAC”</td><td>Híbrida</td><td>FAC exacto + sinónimos técnicos.</td></tr></table></div>`},
{t:'Herramienta vs mecanismo',k:'NO CONFUNDIR',h:'Elasticsearch ≠ búsqueda lexical. Atlas ≠ búsqueda semántica.',b:`<div class="layout cols"><table class="table"><tr><th>Herramienta</th><th>Lexical</th><th>Vectorial</th><th>Híbrida</th></tr><tr><td><b>Elasticsearch</b></td><td>Sí</td><td>Sí</td><td>Sí</td></tr><tr><td><b>MongoDB Atlas</b></td><td>Search</td><td>Vector Search</td><td>Combinable</td></tr></table><div class="panel"><b>Mensaje docente</b><p>S07 estudió recuperación lexical usando Elasticsearch. S09 estudia recuperación semántica usando embeddings y Atlas como una implementación posible.</p><div class="note bad">La herramienta no define el mecanismo. La representación y el ranking sí.</div></div></div>`},
{t:'Checkpoint C1',k:'CHECKPOINT C1',h:'Elige el mecanismo y defiéndelo.',b:`<div class="layout cols"><div class="lab"><label>Consulta</label><select id="c1q"><option>ID CO1.REQ.3714823</option><option>reparación de aviones militares</option><option>mantenimiento aeronaves FAC</option></select><label>Mecanismo</label><select id="c1m"><option>lexical</option><option>semántica</option><option>híbrida</option></select><textarea id="c1why" placeholder="Explica por qué..."></textarea><button class="btn" onclick="c1Check()">Ver retroalimentación</button><a class="btn alt" target="_blank" href="../lms/session-09.html">Registrar en LMS</a><div id="c1out" class="feedback"></div></div><div class="panel"><b>Evidencia mínima</b><p>No basta seleccionar una palabra. Debes justificar el mecanismo según el tipo de necesidad: exactitud textual, paráfrasis o combinación.</p><div class="note">Este checkpoint corresponde al primer bloque de la sesión.</div></div></div>`},
{t:'Embedding',k:'NUEVA REPRESENTACIÓN',h:'Si las palabras cambian, representamos significado.',b:`<div class="layout cols"><div><p class="lead"><b>Embedding:</b> representación numérica aprendida de un texto que permite comparar cercanía mediante operaciones matemáticas.</p><div class="note warn"><b>No es una traducción literal.</b> No puedes leer “la dimensión 17 significa aeronave”.</div></div><svg class="svg" viewBox="0 0 730 430"><rect x="40" y="75" width="245" height="100" rx="20" fill="#fff" stroke="#dfe3ee"/><text x="65" y="115" font-size="21" font-weight="900" fill="#122253">mantenimiento de</text><text x="65" y="145" font-size="21" font-weight="900" fill="#122253">aeronaves KFIR</text><path d="M300 125 L410 125" stroke="#E95D0F" stroke-width="8" marker-end="url(#arr2)"/><rect x="430" y="45" width="250" height="165" rx="25" fill="#eaf6f6" stroke="#0B8689"/><text x="470" y="90" font-size="22" font-weight="900" fill="#075f62">modelo</text><text x="460" y="128" font-size="18" fill="#075f62">texto → vector</text><path d="M555 218 L555 285" stroke="#E95D0F" stroke-width="8" marker-end="url(#arr2)"/><rect x="300" y="300" width="390" height="78" rx="18" fill="#fff" stroke="#dfe3ee"/><text x="325" y="350" font-size="23" font-weight="900" fill="#122253">[0.08, −0.14, 0.22, …]</text><defs><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Vector',k:'GEOMETRÍA MÍNIMA',h:'Un vector es una lista ordenada de números.',b:`<div class="layout cols bigright"><div class="stack"><div class="card def"><b>Vector</b>Lista ordenada de números. Ejemplo: <code>[0.2, 0.8]</code>.</div><div class="card def"><b>Dimensión</b>Cantidad de componentes del vector. E5-small produce 384 dimensiones.</div><div class="note bad">Una visualización 2D es una analogía; el modelo real vive en muchas dimensiones.</div></div><svg class="svg" viewBox="0 0 600 420"><line x1="70" y1="340" x2="530" y2="340" stroke="#b8c1d1" stroke-width="3"/><line x1="90" y1="365" x2="90" y2="50" stroke="#b8c1d1" stroke-width="3"/><path d="M90 340 L390 115" stroke="#0B8689" stroke-width="8" marker-end="url(#arrv)"/><circle cx="390" cy="115" r="12" fill="#E95D0F"/><text x="330" y="90" font-size="24" font-weight="900" fill="#122253">[0.2, 0.8]</text><text x="375" y="365" font-size="18" fill="#4b5573">dimensión 1</text><text x="25" y="130" font-size="18" fill="#4b5573" transform="rotate(-90 25 130)">dimensión 2</text><defs><marker id="arrv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B8689"/></marker></defs></svg></div>`},
{t:'Modelo',k:'DENTRO DE LA CAJA',h:'El modelo convierte texto en un embedding comparable.',b:`<div class="layout"><div class="diagram"><div class="flow"><div class="node">texto</div><div class="arrow">→</div><div class="node">tokens del modelo</div><div class="arrow">→</div><div class="node">encoder</div><div class="arrow">→</div><div class="node">pooling</div><div class="arrow">→</div><div class="node">vector</div><div class="arrow">→</div><div class="node">normalización</div></div></div><div class="grid three"><div class="card def"><b>Token del modelo</b>Fragmento que usa el modelo; no necesariamente igual al analyzer de Elasticsearch.</div><div class="card def"><b>Encoder</b>Transforma tokens en representaciones internas contextualizadas.</div><div class="card def"><b>Pooling</b>Resume varias representaciones en un solo vector de texto.</div></div><pre>"query: reparación de aviones militares"
"passage: mantenimiento programado de aeronaves KFIR"</pre></div>`},
{t:'Prefijos E5',k:'REGLA DE USO',h:'E5 usa query para consultas y passage para documentos.',b:`<div class="layout cols"><div class="panel"><b>Consulta</b><pre>query: reparación de aviones militares</pre><p>Expresa la necesidad del usuario.</p></div><div class="panel"><b>Documento</b><pre>passage: mantenimiento programado de aeronaves KFIR</pre><p>Representa el contenido del corpus.</p></div><div class="note warn" style="grid-column:1/-1"><b>Regla:</b> si mezclas mal la convención, comparas textos de una forma que el modelo no fue instruido a usar.</div></div>`},
{t:'Normalización',k:'PUENTE ENTRE CÓDIGO Y MATEMÁTICA',h:'Con vectores normalizados, producto punto y coseno coinciden.',b:`<div class="layout cols"><div><p class="lead">Normalizar escala el vector para que su norma sea 1 sin cambiar su dirección.</p><div class="bigphrase">cos(q,d) = q · d</div><div class="note">Esto explica por qué el cuaderno puede usar <code>embeddings @ q</code> después de <code>normalize_embeddings=True</code>.</div></div><pre>embeddings = modelo.encode(
  textos,
  normalize_embeddings=True
)
q = modelo.encode(
  ["query: ..."],
  normalize_embeddings=True
)[0]
scores = embeddings @ q</pre></div>`},
{t:'Coseno',k:'LAB VISUAL',h:'Similitud coseno mide orientación, no probabilidad.',b:`<div class="layout cols"><div class="lab"><label>Vector A</label><select id="vecA"><option value="1,0">[1,0] aeronaves</option><option value="0.8,0.2">[0.8,0.2] mantenimiento aeronaves</option><option value="0,1">[0,1] edificios</option></select><label>Vector B</label><select id="vecB"><option value="0.8,0.2">[0.8,0.2] mantenimiento aeronaves</option><option value="0.2,0.9">[0.2,0.9] infraestructura</option><option value="0,1">[0,1] edificios</option></select><button class="btn" onclick="cosDemo()">Calcular</button><button class="btn ghost" onclick="resetCos()">Restablecer</button><div id="cosOut" class="feedback"></div></div><svg id="cosSvg" class="svg" viewBox="0 0 500 360"><line x1="70" y1="300" x2="450" y2="300" stroke="#b8c1d1"/><line x1="70" y1="300" x2="70" y2="40" stroke="#b8c1d1"/><path id="vA" d="M70 300 L420 300" stroke="#0B8689" stroke-width="8" marker-end="url(#m1)"/><path id="vB" d="M70 300 L350 230" stroke="#E95D0F" stroke-width="8" marker-end="url(#m2)"/><defs><marker id="m1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B8689"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Top-k y kNN',k:'DE SIMILITUD A RECUPERACIÓN',h:'Buscar es ordenar vecinos y devolver los k primeros.',b:`<div class="layout cols"><div class="stack"><div class="card def"><b>Top-k</b>Los k primeros resultados del ranking. Si k=5, miramos cinco candidatos, no cinco verdades.</div><div class="card def"><b>kNN</b>Encontrar los k vectores más cercanos a la consulta según una métrica.</div><div class="lab"><label>k</label><select id="topk" onchange="topKDemo()"><option>3</option><option selected>5</option><option>8</option></select><div id="topkOut" class="feedback"></div></div></div><svg class="svg" viewBox="0 0 520 380"><circle cx="250" cy="190" r="16" fill="#E95D0F"/><text x="275" y="198" font-size="20" font-weight="900" fill="#122253">query</text><circle cx="190" cy="140" r="12" fill="#0B8689"/><circle cx="285" cy="125" r="12" fill="#0B8689"/><circle cx="330" cy="205" r="12" fill="#0B8689"/><circle cx="210" cy="245" r="12" fill="#0B8689"/><circle cx="150" cy="280" r="10" fill="#cfd5e2"/><circle cx="390" cy="90" r="10" fill="#cfd5e2"/><circle cx="430" cy="275" r="10" fill="#cfd5e2"/><circle cx="100" cy="100" r="10" fill="#cfd5e2"/><circle cx="250" cy="190" r="110" fill="none" stroke="#E95D0F" stroke-width="3" stroke-dasharray="8 8"/><text x="55" y="45" font-size="20" font-weight="900" fill="#122253">vecinos más cercanos</text></svg></div>`},
{t:'Comparador',k:'LAB CENTRAL',h:'La misma consulta, dos rankings.',b:`<div class="layout"><div class="lab"><label>Consulta</label><select id="rankQ" onchange="rankDemo()"><option value="aviones">reparación de aviones militares</option><option value="oracle">licencia Oracle</option><option value="educacion">plataforma educativa virtual</option></select><div class="rankCompare"><div><h3>BM25 lexical</h3><div id="lexRank" class="rank"></div></div><div><h3>Semántica</h3><div id="semRank" class="rank"></div></div></div><div id="rankScore" class="feedback"></div></div></div>`},
{t:'Falso positivo',k:'JUICIO HUMANO',h:'Score alto no significa documento correcto.',b:`<div class="layout cols"><div class="card def"><b>Falso positivo</b>Resultado recuperado que parece cercano por la señal, pero no responde la necesidad real.</div><div class="card ex"><b>Ejemplo</b>“mantenimiento de infraestructura militar” puede acercarse a “mantenimiento militar”, pero no habla de aeronaves.</div><div class="note bad" style="grid-column:1/-1"><b>Regla:</b> siempre lee el documento. Un score es una señal de ranking, no una garantía de relevancia.</div><svg class="svg" style="grid-column:1/-1;min-height:210px" viewBox="0 0 900 210"><rect x="40" y="40" width="240" height="120" rx="20" fill="#eaf6f6"/><text x="70" y="90" font-size="22" font-weight="900" fill="#075f62">cercano</text><text x="70" y="122" font-size="18" fill="#075f62">por vocabulario/tema</text><path d="M300 100 L410 100" stroke="#E95D0F" stroke-width="8" marker-end="url(#fa)"/><rect x="430" y="40" width="240" height="120" rx="20" fill="#fff0eb"/><text x="462" y="90" font-size="22" font-weight="900" fill="#8e2418">no responde</text><text x="462" y="122" font-size="18" fill="#8e2418">a la necesidad</text><defs><marker id="fa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Checkpoint C2/C3',k:'CHECKPOINT C2 · C3',h:'Explica embedding, coseno y comparación de rankings.',b:`<div class="layout cols"><div class="panel"><b>C2</b><p>Explica embedding, vector, dimensión, normalización y coseno sin decir “probabilidad”.</p><b>C3</b><p>Compara la misma consulta en BM25 y semántica. Identifica una ganancia y un falso positivo.</p></div><div class="lab"><textarea placeholder="Escribe aquí tu explicación breve antes de registrarla en el LMS."></textarea><a class="btn alt" target="_blank" href="../lms/session-09.html">Registrar checkpoints en LMS</a><a class="btn" target="_blank" href="https://colab.research.google.com/github/jazaineam1/BigData2026/blob/main/Cuadernos/9_Bases_Vectoriales_Busqueda_Semantica.ipynb">Abrir cuaderno</a></div></div>`},
{t:'Arquitectura',k:'SEPARACIÓN CLAVE',h:'Modelo, base e índice no son lo mismo.',b:`<div class="layout three"><div class="card def"><b>Modelo</b>Genera embeddings a partir de texto.</div><div class="card def"><b>Base vectorial</b>Persiste documento + vector + metadata.</div><div class="card def"><b>Índice vectorial</b>Acelera la recuperación de vecinos.</div><div class="diagram" style="grid-column:1/-1"><div class="flow"><div class="node">documento</div><div class="arrow">+</div><div class="node">embedding</div><div class="arrow">+</div><div class="node">metadata</div><div class="arrow">→</div><div class="node">índice</div><div class="arrow">→</div><div class="node">Top-k</div></div></div></div>`},
{t:'Metadata',k:'FILTROS',h:'No todo vive dentro del vector.',b:`<div class="layout cols"><div><p class="lead"><b>Metadata:</b> datos descriptivos que acompañan al vector: entidad, fecha, modalidad, valor, URL.</p><div class="note"><b>Filtro:</b> condición que restringe el universo de búsqueda.</div><pre>buscar "software educativo"
solo entidad = "Ministerio de Educación"</pre></div><svg class="svg" viewBox="0 0 620 400"><rect x="60" y="70" width="140" height="70" rx="16" fill="#fff" stroke="#dfe3ee"/><text x="88" y="112" font-size="20" font-weight="900" fill="#122253">1000 docs</text><path d="M210 105 L300 105" stroke="#E95D0F" stroke-width="7" marker-end="url(#mf)"/><rect x="310" y="55" width="150" height="100" rx="18" fill="#fff3e8"/><text x="342" y="95" font-size="20" font-weight="900" fill="#8a4200">filtro</text><text x="332" y="125" font-size="17" fill="#8a4200">entidad</text><path d="M470 105 L550 105" stroke="#E95D0F" stroke-width="7" marker-end="url(#mf)"/><rect x="555" y="70" width="60" height="70" rx="14" fill="#eaf6f6"/><text x="565" y="112" font-size="20" font-weight="900" fill="#075f62">130</text><rect x="210" y="240" width="210" height="95" rx="18" fill="#fff" stroke="#dfe3ee"/><text x="235" y="278" font-size="20" font-weight="900" fill="#122253">vecinos sobre</text><text x="235" y="310" font-size="20" font-weight="900" fill="#122253">universo filtrado</text><defs><marker id="mf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'Exacto vs aproximado',k:'ESCALA',h:'ENN revisa más; ANN aproxima para ganar velocidad.',b:`<div class="layout cols"><table class="table"><tr><th>Término</th><th>Qué significa</th><th>Cuándo sirve</th></tr><tr><td><b>ENN</b></td><td>Exact Nearest Neighbors</td><td>Referencia o corpus pequeño.</td></tr><tr><td><b>ANN</b></td><td>Approximate Nearest Neighbors</td><td>Muchos vectores y menor latencia.</td></tr><tr><td><b>HNSW</b></td><td>Grafo navegable</td><td>Evita comparar ingenuamente contra todo.</td></tr></table><div class="panel"><b>Idea clave</b><p>Aproximado describe la recuperación de vecinos, no la relevancia humana.</p><div class="note bad">La relevancia se evalúa aparte con lectura, etiquetas o métricas.</div></div></div>`},
{t:'HNSW',k:'LAB · GRAFO NAVEGABLE',h:'HNSW navega hacia vecinos prometedores.',b:`<div class="layout cols"><div class="lab"><p>Haz avanzar la búsqueda. La query no revisa todos los nodos; salta por el grafo hacia regiones más prometedoras.</p><button class="btn" onclick="hnswStep()">Siguiente salto</button><button class="btn ghost" onclick="hnswReset()">Restablecer</button><div id="hnswOut" class="feedback">Paso 0: entrada lejana.</div></div><svg id="hnswSvg" class="svg" viewBox="0 0 520 360"></svg></div>`},
{t:'numCandidates',k:'PARÁMETRO OPERACIONAL',h:'numCandidates decide cuánto exploras antes del Top-k.',b:`<div class="layout cols"><div class="lab"><label>numCandidates</label><input id="cand" type="range" min="10" max="220" step="10" value="100" oninput="candDemo()"><div class="candidateGrid" id="candGrid"></div><div id="candOut" class="feedback"></div></div><div class="stack"><div class="card ex"><b>Bajo</b>Menor trabajo y latencia; mayor riesgo de perder vecinos buenos.</div><div class="card ex"><b>Alto</b>Más candidatos revisados; normalmente mejor recall con más coste.</div><div class="note">Para <code>limit=5</code>, 100 es un punto de partida didáctico porque equivale a 20×k.</div></div></div>`},
{t:'Trade-off',k:'DECISIÓN DE SISTEMA',h:'Exactitud, latencia y coste forman un triángulo.',b:`<div class="layout cols"><div class="panel"><div class="bigphrase">No existe configuración universal.</div><p>La configuración depende del tamaño del corpus, necesidad de respuesta, tolerancia a falsos negativos y presupuesto operacional.</p></div><svg class="svg" viewBox="0 0 560 420"><polygon points="280,45 70,360 490,360" fill="#eaf6f6" stroke="#0B8689" stroke-width="5"/><circle cx="280" cy="45" r="48" fill="#fff" stroke="#0B8689" stroke-width="4"/><text x="230" y="53" font-size="20" font-weight="900" fill="#122253">recall</text><circle cx="70" cy="360" r="55" fill="#fff" stroke="#E95D0F" stroke-width="4"/><text x="25" y="368" font-size="20" font-weight="900" fill="#122253">latencia</text><circle cx="490" cy="360" r="52" fill="#fff" stroke="#634998" stroke-width="4"/><text x="458" y="368" font-size="20" font-weight="900" fill="#122253">coste</text></svg></div>`},
{t:'Checkpoint C4',k:'CHECKPOINT C4',h:'Dibuja mentalmente modelo → base → índice.',b:`<div class="layout cols"><div class="panel"><b>Debes poder explicar</b><p>1. Qué genera el modelo. 2. Qué guarda la base. 3. Qué acelera el índice. 4. Por qué ANN no garantiza relevancia.</p></div><div class="lab"><textarea placeholder="Explica la separación en tus palabras."></textarea><a class="btn alt" target="_blank" href="../lms/session-09.html">Registrar C4 en LMS</a></div></div>`},
{t:'Atlas',k:'IMPLEMENTACIÓN',h:'Atlas implementa lo que ya entendimos.',b:`<div class="layout cols"><div class="stack"><div class="card def"><b>Atlas Vector Search</b>Permite indexar y consultar vectores almacenados en documentos MongoDB.</div><div class="card def"><b>$vectorSearch</b>Etapa de pipeline que recupera vecinos usando un índice vectorial.</div></div><svg class="svg" viewBox="0 0 620 390"><rect x="45" y="70" width="130" height="80" rx="16" fill="#fff" stroke="#dfe3ee"/><text x="70" y="118" font-size="20" font-weight="900" fill="#122253">documento</text><path d="M185 110 L260 110" stroke="#E95D0F" stroke-width="7" marker-end="url(#at)"/><rect x="270" y="55" width="145" height="110" rx="18" fill="#eaf6f6"/><text x="304" y="100" font-size="20" font-weight="900" fill="#075f62">embedding</text><text x="305" y="130" font-size="17" fill="#075f62">+ metadata</text><path d="M425 110 L500 110" stroke="#E95D0F" stroke-width="7" marker-end="url(#at)"/><rect x="510" y="70" width="95" height="80" rx="16" fill="#fff3e8"/><text x="532" y="118" font-size="20" font-weight="900" fill="#8a4200">índice</text><rect x="220" y="245" width="210" height="80" rx="18" fill="#fff" stroke="#dfe3ee"/><text x="245" y="293" font-size="22" font-weight="900" fill="#122253">$vectorSearch</text><defs><marker id="at" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E95D0F"/></marker></defs></svg></div>`},
{t:'$vectorSearch',k:'CÓDIGO EXPLICADO',h:'Cada parámetro responde a una decisión.',b:`<div class="layout cols"><pre>{
  "$vectorSearch": {
    "index": "s09_vector_index",
    "path": "embedding",
    "queryVector": q,
    "numCandidates": 100,
    "limit": 5,
    "filter": {"entidad": "..."}
  }
}</pre><div class="stack"><div class="card"><b>index/path</b>Dónde está el índice y en qué campo vive el vector.</div><div class="card"><b>queryVector</b>Vector de la consulta.</div><div class="card"><b>numCandidates/limit</b>Exploración y Top-k final.</div><div class="card"><b>filter</b>Reduce el universo por metadata.</div></div></div>`},
{t:'Builder Atlas',k:'LAB · CONSTRUCTOR',h:'Construye una consulta vectorial sin copiar a ciegas.',b:`<div class="layout cols"><div class="lab"><label>Índice</label><input id="idx" value="s09_vector_index"><label>Campo vectorial</label><input id="pathv" value="embedding"><label>limit</label><select id="lim" onchange="buildVS()"><option>3</option><option selected>5</option><option>10</option></select><label>numCandidates</label><select id="numc" onchange="buildVS()"><option>50</option><option selected>100</option><option>200</option></select><button class="btn" onclick="buildVS()">Generar JSON</button></div><pre id="vsOut"></pre></div>`},
{t:'Contingencia',k:'SI ATLAS FALLA',h:'La herramienta puede fallar; el concepto no.',b:`<div class="layout cols"><div class="panel"><b>Ruta local</b><p>NumPy permite aprender el mecanismo: embeddings normalizados, producto punto, ranking y evaluación.</p><pre>scores = embeddings @ q
idx = np.argsort(-scores)[:k]</pre></div><div class="panel"><b>Ruta Atlas</b><p>Permite persistencia, metadata, índice vectorial y operación más cercana a producción.</p><pre>$vectorSearch → Top-k</pre></div><div class="note warn" style="grid-column:1/-1">La evidencia de clase puede completarse con ruta local si la plataforma externa está lenta o no disponible.</div></div>`},
{t:'Híbrida',k:'NO SIEMPRE HAY QUE ELEGIR',h:'Lexical y semántica fallan de formas distintas.',b:`<div class="layout cols"><div class="stack"><div class="card ex"><b>Lexical gana</b>ID exacto, marca, entidad, término legal.</div><div class="card ex"><b>Semántica gana</b>Paráfrasis, vocabulario técnico, intención amplia.</div><div class="card def"><b>Búsqueda híbrida</b>Combina señales o rankings lexicales y vectoriales.</div></div><div class="diagram"><div class="flow"><div class="node">BM25</div><div class="arrow">+</div><div class="node">vectorial</div><div class="arrow">→</div><div class="node">fusión</div><div class="arrow">→</div><div class="node">ranking final</div></div><div class="note bad">No sumes scores sin pensar: BM25 y coseno no viven en la misma escala.</div></div></div>`},
{t:'RRF',k:'FUSIÓN POR POSICIÓN',h:'RRF fusiona rankings sin exigir scores comparables.',b:`<div class="layout"><div class="grid three"><div class="panel"><b>Ranking lexical</b><ol><li>D3</li><li>D8</li><li>D1</li><li>D5</li></ol></div><div class="panel"><b>Ranking semántico</b><ol><li>D8</li><li>D3</li><li>D5</li><li>D9</li></ol></div><div class="panel"><b>Ranking fusionado</b><ol><li>D8</li><li>D3</li><li>D5</li><li>D1</li></ol></div></div><div class="note"><b>Idea:</b> importa aparecer arriba en varios rankings. No necesitas interpretar BM25 y coseno como unidades comparables.</div></div>`},
{t:'Evaluación',k:'MÉTRICA SIMPLE',h:'Mejor buscador no significa score más alto.',b:`<div class="layout cols"><div><p class="lead"><b>Juicio de relevancia:</b> etiqueta humana o de referencia que indica si un documento responde a la necesidad.</p><div class="bigphrase">Precision@k = relevantes en Top-k / k</div></div><div class="lab"><p>Marca los resultados relevantes:</p><div class="precisionBtns" id="pBtns"></div><div id="pOut" class="meter">P@5 = 0.00</div><button class="btn ghost" onclick="resetP()">Restablecer</button></div></div>`},
{t:'Evidencia',k:'LAB FINAL',h:'Construye evidencia antes de defender.',b:`<div class="layout cols"><div class="lab"><label>Consulta propia</label><input id="evQ" value="mantenimiento de aeronaves militares"><label>Resultado defendible</label><input id="evGood" value="mantenimiento programado de aeronaves KFIR"><label>Falso positivo</label><input id="evBad" value="mantenimiento de infraestructura militar"><label>Límite</label><input id="evLim" value="el score no prueba relevancia sin lectura humana"><button class="btn" onclick="evidence()">Generar JSON</button><a class="btn alt" target="_blank" href="../lms/session-09.html">Registrar C5</a></div><pre id="evOut">{}</pre></div>`},
{t:'Taller autónomo',k:'DESPUÉS DE CLASE',h:'El taller de casa dura al menos 6 horas.',b:`<div class="layout"><table class="table"><tr><th>Tiempo</th><th>Trabajo</th><th>Evidencia</th></tr><tr><td>0:00–1:00</td><td>Preparar corpus y consulta propia</td><td>consultas.csv</td></tr><tr><td>1:00–2:10</td><td>Baseline BM25</td><td>Top-5 lexical</td></tr><tr><td>2:10–3:30</td><td>Embeddings y semántica</td><td>Top-5 semántico</td></tr><tr><td>3:30–4:30</td><td>Parámetros / Atlas o ruta local</td><td>experimento</td></tr><tr><td>4:30–5:20</td><td>Híbrida + evaluación</td><td>Precision@5</td></tr><tr><td>5:20–6:00</td><td>Informe y límites</td><td>evidencia.json</td></tr></table><div class="note warn"><b>Entrega:</b> evidencia reproducible, no pantallazo suelto.</div></div>`},

];
const stage=document.getElementById('stage'),bar=document.querySelector('.bar i'),n=document.getElementById('n'),tot=document.getElementById('tot'),chap=document.getElementById('chap');let idx=0,hstep=0;
function render(){stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.dark?'dark':''}" id="s${i+1}" data-title="${s.t}"><div class="k">${s.k}</div><h1>${s.h}</h1>${s.b}</section>`).join('');tot.textContent=slides.length;document.getElementById('mapLinks').innerHTML=slides.map((s,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')} · ${s.t}</a>`).join('');}
function go(v,replace=false){idx=Math.max(0,Math.min(slides.length-1,v));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===idx));n.textContent=idx+1;bar.style.width=((idx+1)/slides.length*100)+'%';chap.textContent=slides[idx].t;prev.disabled=idx===0;next.disabled=idx===slides.length-1;const h='#s'+(idx+1);if(location.hash!==h){replace?history.replaceState(null,'',h):history.pushState(null,'',h)}if(slides[idx].t==='Comparador')rankDemo();if(slides[idx].t==='Top-k y kNN')topKDemo();if(slides[idx].t==='HNSW')drawHnsw();if(slides[idx].t==='numCandidates')candDemo();if(slides[idx].t==='Builder Atlas')buildVS();if(slides[idx].t==='Evaluación')initP();}
function fromHash(){const m=location.hash.match(/^#s(\d+)$/);go(m?Number(m[1])-1:0,true)}
prev.onclick=()=>go(idx-1);next.onclick=()=>go(idx+1);addEventListener('hashchange',fromHash);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1)});
mapBtn.onclick=()=>drawer.classList.toggle('on');closeDrawer.onclick=()=>drawer.classList.remove('on');fs.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};resetBtn.onclick=()=>{localStorage.removeItem('s09p');document.querySelectorAll('input,textarea').forEach(x=>{if(x.defaultValue!==undefined)x.value=x.defaultValue});rankDemo();cosDemo();hnswReset();candDemo();initP();};
function literalSearch(){caseOut.textContent='Resultado literal: recupera documentos con palabras compartidas, pero puede perder “mantenimiento programado de aeronaves KFIR”. Esa pérdida abre la necesidad de recuperación semántica.'}
function toks(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(Boolean)}
function lexicalDemo(){const docs=['mantenimiento programado de aeronaves KFIR','licencia Oracle Database','CO1.REQ.3714823 compra directa'];const q=lexQ.value;const qt=new Set(toks(q));lexOut.textContent=docs.map(d=>{const m=toks(d).filter(x=>qt.has(x));return d+'\n  tokens compartidos: '+(m.join(', ')||'ninguno fuerte')}).join('\n\n')}
function c1Check(){const q=c1q.value,m=c1m.value;let ref=q.startsWith('ID')?'lexical':q.includes('FAC')?'híbrida':'semántica';c1out.textContent=(m===ref?'Bien orientado. ':'Revisa: la referencia esperada sería '+ref+'. ')+'Lo importante es justificar por tipo de necesidad, no por herramienta.'}
function cosDemo(){const a=vecA.value.split(',').map(Number),b=vecB.value.split(',').map(Number);const dot=a[0]*b[0]+a[1]*b[1],na=Math.hypot(...a),nb=Math.hypot(...b),c=dot/(na*nb);cosOut.textContent='producto punto = '+dot.toFixed(3)+'\ncoseno = '+c.toFixed(3)+'\nInterpretación: cercanía geométrica, no probabilidad.';function line(id,v,color){const x=70+v[0]*330,y=300-v[1]*230;document.getElementById(id).setAttribute('d',`M70 300 L${x} ${y}`)}line('vA',a);line('vB',b)}function resetCos(){vecA.value='1,0';vecB.value='0.8,0.2';cosDemo()}
function topKDemo(){const arr=['aeronaves KFIR','flota aérea militar','sistemas aeronáuticos','helicópteros','infraestructura militar','transporte aéreo','pista aeroportuaria','edificio militar'];topkOut.textContent=arr.slice(0,Number(topk.value)).map((x,i)=>(i+1)+'. '+x).join('\n')}
const examples={aviones:{lex:['reparación de aviones militares','repuestos para aviones','servicio de pista aeroportuaria','mantenimiento de motores','transporte aéreo'],sem:['mantenimiento programado de aeronaves KFIR','soporte técnico para flota aérea militar','inspección de sistemas aeronáuticos','repuestos para helicópteros','mantenimiento de infraestructura militar']},oracle:{lex:['licencia Oracle Database','renovación soporte Oracle','servicios nube Oracle','capacitación SQL','licencias ofimáticas'],sem:['licenciamiento Oracle Database','soporte base de datos Oracle','renovación tecnológica Oracle','software gestión documental','servicio de nube pública']},educacion:{lex:['plataforma educativa virtual','aula virtual para formación','software LMS educativo','licencias plataforma','conectividad escolar'],sem:['sistema de aprendizaje en línea','entorno virtual de formación','solución LMS para estudiantes','gestión académica','plataforma de videoconferencia']}};
function makeRank(el,arr,prefix){el.innerHTML=arr.map((x,i)=>`<div class="item"><span class="tag">${i+1}</span><span style="flex:1">${x}</span><button class="rel" onclick="this.classList.toggle('on');scoreRank()">✓</button></div>`).join('')}
function rankDemo(){const e=examples[rankQ?.value||'aviones'];makeRank(lexRank,e.lex,'l');makeRank(semRank,e.sem,'s');scoreRank()}function scoreRank(){const cols=[...document.querySelectorAll('.rank')];if(!cols.length)return;const vals=cols.map(c=>c.querySelectorAll('.rel.on').length);rankScore.textContent='Precision@5 lexical = '+(vals[0]/5).toFixed(2)+' | Precision@5 semántica = '+(vals[1]/5).toFixed(2)+'\nLa métrica depende de tus juicios de relevancia.'}
function drawHnsw(){const pts=[[90,280],[160,230],[220,190],[300,160],[385,125],[440,80],[105,95],[250,70],[420,250]];let s='<g stroke="#cfd5e2" stroke-width="3">';for(let i=0;i<pts.length-1;i++)s+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}"/>`;s+='</g>';pts.forEach((p,i)=>{const on=i<=hstep; s+=`<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="${on?'#E95D0F':'#0B8689'}"/><text x="${p[0]-5}" y="${p[1]+6}" font-size="15" font-weight="900" fill="#fff">${i+1}</text>`});s+=`<circle cx="470" cy="55" r="20" fill="#634998"/><text x="495" y="63" font-size="18" font-weight="900" fill="#122253">query</text>`;hnswSvg.innerHTML=s}function hnswStep(){hstep=Math.min(5,hstep+1);drawHnsw();hnswOut.textContent='Paso '+hstep+': el grafo navega hacia una región más prometedora.'}function hnswReset(){hstep=0;drawHnsw();if(window.hnswOut)hnswOut.textContent='Paso 0: entrada lejana.'}
function candDemo(){const v=Number(cand.value),cells=Math.round(v/10);candGrid.innerHTML=Array.from({length:40},(_,i)=>`<i class="${i<cells?'on':''} ${[7,12,18,31].includes(i)?'hit':''}"></i>`).join('');const recall=Math.min(.98,.42+v/260);candOut.textContent='Explorados: '+v+' candidatos\nRecall conceptual: '+recall.toFixed(2)+'\nCoste relativo: '+Math.round(v/10)+' unidades'}
function buildVS(){vsOut.textContent=JSON.stringify({$vectorSearch:{index:idx?.value||'s09_vector_index',path:pathv?.value||'embedding',queryVector:'q',numCandidates:Number(numc?.value||100),limit:Number(lim?.value||5),filter:{entidad:'opcional'}}},null,2)}
let pState=[0,0,0,0,0];function initP(){if(!document.getElementById('pBtns'))return;pBtns.innerHTML=pState.map((v,i)=>`<button class="${v?'on':''}" onclick="pState[${i}]=1-pState[${i}];initP()">${v?'✓':'✗'}</button>`).join('');pOut.textContent='P@5 = '+(pState.reduce((a,b)=>a+b,0)/5).toFixed(2)}function resetP(){pState=[0,0,0,0,0];initP()}
function evidence(){const o={consulta:evQ.value,resultado_defendible:evGood.value,falso_positivo:evBad.value,limite:evLim.value,nota:'Completar en Colab con Top-5 lexical, semántico e híbrido reales.'};evOut.textContent=JSON.stringify(o,null,2)}
render();fromHash();cosDemo();
</script>
