<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#142153">
<title>Mi progreso · Big Data LMS</title>
<link rel="stylesheet" href="assets/bigdata-lms.css?v=20260926-v3">
<style>
.progress-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px;align-items:start}
.course-route{display:grid;gap:11px}.session-progress-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:13px;align-items:center}
.session-progress-card.focus{border:2px solid var(--uc-cyan);box-shadow:0 8px 26px #0b86891b}.session-progress-card .snum{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#eef1f5;color:var(--uc-navy);font-weight:950}
.session-progress-card.done .snum{background:#dff4e8;color:#12633c}
.evidence-list{display:grid;gap:9px}.evidence-item{border:1px solid var(--line);border-left:4px solid var(--uc-cyan);border-radius:12px;padding:12px;background:#fff}.evidence-item .feedback-text{margin:7px 0 0}
@media(max-width:850px){.progress-hero{grid-template-columns:1fr}.session-progress-card{grid-template-columns:50px minmax(0,1fr)}.session-progress-card .stage-action{grid-column:2}}
@media(max-width:560px){.session-progress-card{padding:11px}.session-progress-card .stage-action{width:100%}}
</style>
</head>
<body>
<header class="appbar"><div class="inner">
<a class="brand" href="portal.html">Universidad Central<small>Big Data 2026-2S · Mi progreso</small></a>
<span class="spacer"></span>
<a class="navlink optional" href="portal.html">Inicio</a><a class="navlink optional" href="account.html">Mi cuenta</a>
<a id="teacherLink" class="navlink hidden" href="teacher-analytics.html">Analítica docente</a><button data-logout>Salir</button>
</div></header>

<main class="wrap">
<div id="status" class="status hidden"></div>
<div class="progress-hero">
<section><div class="ey">Mi progreso</div><h1>Qué terminaste y qué te falta.</h1><p class="lead">Aquí ves tus sesiones. Abre cualquiera para continuar.</p></section>
<section class="card"><div class="ey">Resumen</div><div id="metrics" class="detailgrid"></div></section>
</div>

<section class="card">
<div class="actions" style="justify-content:space-between;align-items:flex-start"><div><div class="ey">Sesiones</div><h2>Tu recorrido</h2></div><span id="routeCount" class="pill active"></span></div>
<div id="courseRoute" class="course-route"></div>
</section>

<section id="evidenceCard" class="card hidden">
<div class="actions" style="justify-content:space-between;align-items:flex-start"><div><div class="ey">Tus trabajos</div><h2 id="evidenceTitle">Evidencias registradas</h2></div><span id="evidenceCount" class="pill progress"></span></div>
<div id="evidenceList" class="evidence-list"></div>
</section>
</main>

<script src="assets/bigdata-lms.js?v=20260926-v3"></script>
<script>
(async()=>{'use strict';
const L=window.BIGDATA_LMS;L.wireLogout();const status=L.$('status'),focus=Math.trunc(Number(new URLSearchParams(location.search).get('s')||0));
let course=null,focusData=null;
function renderMetrics(){
  const sessions=course.sessions||[],completed=sessions.filter(s=>s.session_progress?.status==='completed').length,
    started=sessions.filter(s=>s.session_progress&&s.session_progress.status!=='completed').length;
  L.$('metrics').innerHTML='<div class="detailmetric"><span class="muted">Terminadas</span><b>'+completed+'/'+sessions.length+'</b></div><div class="detailmetric"><span class="muted">En curso</span><b>'+started+'</b></div>';
}
function renderRoute(){
  const rows=course.sessions||[];
  L.$('routeCount').textContent=rows.length+' publicadas';
  L.$('courseRoute').innerHTML=rows.map(s=>{
    const n=Number(s.session_number),p=s.session_progress,done=p?.status==='completed',
      state=done?'Lista':p?'En curso':'Sin empezar';
    return '<article class="session-progress-card '+(done?'done ':'')+(focus===n?'focus':'')+'"><span class="snum">S'+String(n).padStart(2,'0')+'</span><div><h3 style="margin:0 0 4px">'+L.esc(s.title)+'</h3><span class="pill '+(done?'done':p?'progress':'pending')+'">'+state+'</span></div><a class="btn '+(focus===n?'primary':'alt')+' stage-action" href="session.html?s='+n+'">'+(p?'Continuar':'Abrir')+'</a></article>'
  }).join('')||'<p class="muted">No hay sesiones publicadas.</p>';
}
function renderEvidence(){
  const card=L.$('evidenceCard');if(!focusData){card.classList.add('hidden');return}
  card.classList.remove('hidden');
  const evidence=focusData.evidence||[],activities=new Map((focusData.activities||[]).map(a=>[a.code,a]));
  L.$('evidenceTitle').textContent='S'+String(focus).padStart(2,'0')+' · Tus trabajos';
  L.$('evidenceCount').textContent=evidence.length+' registro'+(evidence.length===1?'':'s');
  L.$('evidenceList').innerHTML=evidence.length?evidence.map(e=>{
    const a=activities.get(e.activity_code),ok=['correct','accepted'].includes(e.verdict),
      label=ok?'Registrado':e.verdict==='pending_review'?'En revisión':'Revisar',
      wall=a?.kind==='lab'?'<a class="btn ghost" href="class-wall.html?s='+focus+'&a='+encodeURIComponent(e.activity_code)+'">Ver muro del LAB</a>':'';
    return '<article class="evidence-item"><div class="actions" style="justify-content:space-between"><b>'+L.esc(a?.title||e.activity_code)+'</b><span class="pill '+(ok?'done':'pending')+'">'+label+'</span></div>'+(e.feedback?'<p class="feedback-text">'+L.esc(e.feedback)+'</p>':'')+'<div class="actions">'+wall+'</div></article>'
  }).join(''):'<div class="note"><b>Aún no tienes trabajos registrados en esta sesión.</b></div>';
}
async function load(){
  try{
    const gate=await L.requireBigData();if(!gate)return;
    const results=await Promise.all([
      L.session('course_progress'),
      focus>0?L.session('me',{session_number:focus}).catch(()=>null):Promise.resolve(null)
    ]);
    course=results[0];focusData=results[1];
    if(['teacher','admin'].includes(course.viewer?.role))L.$('teacherLink').classList.remove('hidden');
    renderMetrics();renderRoute();renderEvidence();
  }catch(e){L.msg(status,e.message,'err')}
}
await load();
})();
</script>
</body></html>
