<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#142153"><title>Big Data · Competencias</title><link rel="stylesheet" href="assets/bigdata-lms.css?v=20260926-comp1">
<style>.comp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.comp-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.comp-card.mastered{border-color:#a8d9c2}.comp-card.developing{border-color:#ead49c}.comp-card.pending{background:#fafafa}.meter2{height:10px;background:#e9edf1;border-radius:999px;overflow:hidden;margin:10px 0}.meter2 i{display:block;height:100%;background:var(--uc-cyan)}.evidence{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.evidence-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid #eef0f2}.evidence-row:last-child{border-bottom:0}@media(max-width:850px){.comp-grid{grid-template-columns:1fr}}</style></head>
<body><header class="appbar"><div class="inner"><a class="brand" href="portal.html">Universidad Central<small>Big Data 2026-2S · Competencias</small></a><span class="spacer"></span><a class="navlink optional" href="assignments.html">Entregas</a><a id="teacherLink" class="navlink hidden" href="teacher-competencies.html">Matriz docente</a><button data-logout>Salir</button></div></header>
<main class="wrap"><div class="ey">Dominio</div><h1>Qué sabes hacer y qué evidencia lo demuestra.</h1><p class="lead">Una competencia no se marca por una sola nota global: el estado se calcula con las evidencias que el curso haya vinculado explícitamente a esa capacidad.</p><div id="status" class="status hidden"></div><div id="metrics" class="kpis"></div><div id="competencies" class="comp-grid" style="margin-top:15px"></div></main>
<script src="assets/bigdata-lms.js?v=20260926-comp1"></script><script>
(async()=>{'use strict';const L=window.BIGDATA_LMS;L.wireLogout();const status=L.$('status');let data=null;
function label(s){return s==='mastered'?'Dominada':s==='developing'?'En desarrollo':'Sin evidencia'}
function renderMetrics(){const c=data.competencies||[];L.$('metrics').innerHTML='<div class="kpi"><span class="muted">Competencias</span><b>'+c.length+'</b></div><div class="kpi"><span class="muted">Dominadas</span><b>'+c.filter(x=>x.status==='mastered').length+'</b></div><div class="kpi"><span class="muted">En desarrollo</span><b>'+c.filter(x=>x.status==='developing').length+'</b></div><div class="kpi"><span class="muted">Sin evidencia</span><b>'+c.filter(x=>x.status==='pending').length+'</b></div>'}
function render(){renderMetrics();L.$('competencies').innerHTML=(data.competencies||[]).map(c=>{const pct=c.mastery_pct==null?0:Number(c.mastery_pct);return '<article class="comp-card '+L.esc(c.status)+'"><div class="actions" style="justify-content:space-between"><span class="pill '+(c.status==='mastered'?'active':c.status==='developing'?'submitted':'pending')+'">'+label(c.status)+'</span><span class="muted">'+L.esc(c.domain)+'</span></div><h2>'+L.esc(c.title)+'</h2><p>'+L.esc(c.description||'')+'</p><div class="meter2"><i style="width:'+pct+'%"></i></div><div class="actions" style="justify-content:space-between"><b>'+(c.mastery_pct==null?'—':pct.toFixed(1)+'%')+'</b><span class="muted">Umbral '+Number(c.mastery_threshold)+'% · '+c.evidence_count+'/'+Number(c.min_evidence_count)+' evidencia mínima</span></div><div class="evidence"><b>Por qué aparece así</b>'+((c.evidence||[]).length?(c.evidence||[]).map(e=>'<div class="evidence-row"><div><b>'+L.esc(e.assignment_title)+'</b><div class="muted">'+L.esc(e.label)+' · intento '+e.attempt+'</div></div><div><b>'+Number(e.score)+'/'+Number(e.max)+'</b><div class="muted">'+Number(e.pct).toFixed(1)+'%</div></div></div>').join(''):'<p class="muted">Todavía no existe una evidencia calificada vinculada a esta competencia.</p>')+'</div></article>'}).join('')}
async function load(){try{const gate=await L.requireBigData();if(!gate)return;data=await L.core('competencies');L.core('track_learning_event',{event_type:'competencies_opened',client_at:new Date().toISOString()}).catch(()=>{});if(['teacher','admin'].includes(data.viewer?.role))L.$('teacherLink').classList.remove('hidden');render()}catch(ex){L.msg(status,ex.message,'err')}}await load();
})();
</script></body></html>
