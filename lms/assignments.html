<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#142153"><title>Big Data · Entregas</title><link rel="stylesheet" href="assets/bigdata-lms.css?v=20260926-assess1">
<style>.assignment{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin:12px 0}.assignment.overdue{border-color:#efb2b2}.assignment h2{margin:3px 0 6px}.rubric{display:grid;gap:6px;margin:10px 0}.rubric-row{display:flex;justify-content:space-between;gap:12px;background:#f7f8fa;border-radius:9px;padding:8px 10px}.attempt{border-left:3px solid var(--uc-cyan);padding:8px 10px;margin:7px 0;background:#f7fbfb}.feedback{background:#f2f7ff;border:1px solid #cbdaf5;border-radius:11px;padding:10px;margin-top:10px}.submitbox{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}</style></head>
<body><header class="appbar"><div class="inner"><a class="brand" href="portal.html">Universidad Central<small>Big Data 2026-2S · Entregas</small></a><span class="spacer"></span><a class="navlink optional" href="portal.html">Inicio</a><a class="navlink optional" href="competencies.html">Competencias</a><a id="gradebookLink" class="navlink hidden" href="gradebook.html">Gradebook</a><button data-logout>Salir</button></div></header>
<main class="wrap"><div class="ey">Evaluación</div><h1>Tareas, intentos y retroalimentación.</h1><p class="lead">Cada entrega conserva su intento. Las tareas automáticas, como S08, reciben evidencia directamente desde su validador.</p><div id="status" class="status hidden"></div><div id="metrics" class="kpis"></div><div id="assignments"></div></main>
<script src="assets/bigdata-lms.js?v=20260926-assess1"></script><script>
(async()=>{'use strict';const L=window.BIGDATA_LMS;L.wireLogout();const status=L.$('status');let data=null;
function rubric(a){const r=Array.isArray(a.rubric)?a.rubric:[];return r.length?'<div class="rubric">'+r.map(x=>'<div class="rubric-row"><span>'+L.esc(x.title)+'</span><b>'+Number(x.max||0)+' pts</b></div>').join('')+'</div>':''}
function renderMetrics(){const a=data.assignments||[];L.$('metrics').innerHTML='<div class="kpi"><span class="muted">Tareas</span><b>'+a.length+'</b></div><div class="kpi"><span class="muted">Entregadas</span><b>'+a.filter(x=>x.latest_submission).length+'</b></div><div class="kpi"><span class="muted">Pendientes</span><b>'+a.filter(x=>!x.latest_submission&&!x.overdue).length+'</b></div><div class="kpi"><span class="muted">Vencidas</span><b>'+a.filter(x=>x.overdue).length+'</b></div>'}
function render(){
 renderMetrics();const rows=data.assignments||[];
 L.$('assignments').innerHTML=rows.length?rows.map(a=>{const s=a.latest_submission,auto=a.code==='bd-s08-control',types=a.allowed_types||[];
 const history=(a.attempts||[]).map(x=>'<div class="attempt"><b>Intento '+x.attempt+'</b> · '+L.fmtWhen(x.submitted_at)+' · '+L.esc(x.status)+(x.score!=null?' · <b>'+Number(x.score)+'/'+Number(a.max_score)+'</b>':'')+(x.artifact_type==='file'?'<div class="actions" style="margin-top:6px"><button class="btn alt" type="button" data-file-submission="'+x.id+'">Descargar '+L.esc(x.artifact?.file_name||'archivo')+'</button></div>':'')+'</div>').join('');
 let form='';if(auto&&!s)form='<div class="submitbox"><a class="btn primary" href="session-08.html">Abrir S08 y validar manifest</a><p class="muted">La entrega se registra automáticamente al validar el manifest.</p></div>';
 else if(!auto&&a.can_submit){const opts=types.filter(x=>['text','url','file'].includes(x));form='<form class="submitbox" data-submit="'+a.id+'"><div class="field"><label>Tipo de entrega</label><select class="input" name="artifact_type">'+opts.map(x=>'<option value="'+x+'">'+(x==='text'?'Texto':x==='url'?'URL':'Archivo privado')+'</option>').join('')+'</select></div><div class="field" data-text><label>Texto</label><textarea class="input" name="text" rows="5"></textarea></div><div class="field hidden" data-url><label>URL</label><input class="input" name="url" type="url" placeholder="https://…"></div><div class="field hidden" data-file><label>Archivo · máximo 20 MB</label><input class="input" name="file" type="file"><span class="muted">PDF, texto/CSV/JSON/ZIP, Office o imagen. Se almacena en un bucket privado.</span></div><div data-upload-status class="muted"></div><button class="btn primary" type="submit">Enviar intento '+(a.attempts_used+1)+'</button></form>'}
 else if(!auto&&!a.can_submit)form='<div class="note">No hay un nuevo intento disponible con las condiciones actuales.</div>';
 return '<article class="assignment '+(a.overdue?'overdue':'')+'"><div class="actions" style="justify-content:space-between"><span class="pill '+(s?'active':'pending')+'">'+(s?'Con entrega':a.overdue?'Vencida':'Pendiente')+'</span><span class="muted">S'+String(a.session_number||'—').padStart(2,'0')+' · '+a.attempts_used+'/'+a.effective_max_attempts+' intentos</span></div><h2>'+L.esc(a.title)+'</h2><p>'+L.esc(a.instructions||'').replace(/\n/g,'<br>')+'</p><div class="muted">Máximo '+Number(a.max_score)+' puntos'+(a.effective_due?' · fecha '+L.fmtWhen(a.effective_due):' · sin fecha límite')+'</div>'+rubric(a)+history+(s&&s.feedback?'<div class="feedback"><b>Retroalimentación</b><p>'+L.esc(s.feedback).replace(/\n/g,'<br>')+'</p></div>':'')+form+'</article>'}).join(''):'<section class="card"><p class="muted">No hay tareas activas.</p></section>';
 document.querySelectorAll('[data-submit]').forEach(f=>{const sel=f.artifact_type,text=f.querySelector('[data-text]'),url=f.querySelector('[data-url]'),file=f.querySelector('[data-file]');sel.onchange=()=>{text.classList.toggle('hidden',sel.value!=='text');url.classList.toggle('hidden',sel.value!=='url');file.classList.toggle('hidden',sel.value!=='file')};sel.onchange();f.onsubmit=submit});document.querySelectorAll('[data-file-submission]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.fileSubmission,b));
}
async function uploadSigned(signedUrl,file){const fd=new FormData();fd.append('cacheControl','3600');fd.append('',file);const r=await fetch(signedUrl,{method:'PUT',headers:{'x-upsert':'false'},body:fd});if(!r.ok){let m='No se pudo cargar el archivo';try{const x=await r.json();m=x.message||x.error||m}catch{}throw new Error(m)}}
async function submit(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),type=f.artifact_type.value;if(!confirm('¿Enviar este intento? Quedará registrado con fecha y hora.'))return;b.disabled=true;try{if(type==='file'){const file=f.file?.files?.[0];if(!file)throw new Error('Selecciona un archivo');const st=f.querySelector('[data-upload-status]');st.textContent='Preparando carga privada…';const prep=await L.assess('prepare_file_upload',{assignment_id:f.dataset.submit,file_name:file.name,mime_type:file.type||'application/octet-stream',size_bytes:file.size});st.textContent='Subiendo archivo…';await uploadSigned(prep.signed_url,file);st.textContent='Registrando entrega…';await L.assess('submit_file_assignment',{upload_id:prep.upload_id})}else await L.core('submit_assignment',{assignment_id:f.dataset.submit,artifact_type:type,text:f.text?.value||'',url:f.url?.value||''});L.msg(status,'Entrega registrada.','ok');await load()}catch(ex){L.msg(status,ex.message,'err')}finally{b.disabled=false}}
async function downloadFile(id,b){const old=b.textContent;b.disabled=true;b.textContent='Generando enlace…';try{const x=await L.assess('file_download_url',{submission_id:id});location.href=x.signed_url}catch(ex){L.msg(status,ex.message,'err')}finally{b.disabled=false;b.textContent=old}}
async function load(){try{const gate=await L.requireBigData();if(!gate)return;data=await L.core('assignments');if(['teacher','admin'].includes(data.viewer?.role))L.$('gradebookLink').classList.remove('hidden');render()}catch(ex){L.msg(status,ex.message,'err')}}await load();
})();
</script></body></html>
